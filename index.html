DEEP.push({tid:"network", title:"AWS network security architecture: hub-and-spoke, inspection and egress", body:`
<h3>1. The reference design</h3>
<pre>                         Internet
                            │
           CloudFront + WAF + Shield Advanced (edge)
                            │
   ┌──────────── Ingress VPC or per-app public ALB ────────────┐
   │                                                            │
 Spoke VPC: payments-prod        Spoke VPC: orders-prod     Spoke VPC: dev
   private app subnets             private app subnets        …
   isolated data subnets           isolated data subnets
   │                                    │                        │
   └────────────── Transit Gateway (route tables per domain) ────┘
                     │                        │
           Inspection VPC                Egress VPC
       (Network Firewall /             (NAT GW → Network Firewall
        GWLB + 3rd-party NGFW)          domain allow-list → Internet)
                     │
           Direct Connect / Site-to-Site VPN → on-prem</pre>

<h3>2. Segmentation with Transit Gateway route tables</h3>
<ul>
<li>Separate route tables for <b>prod</b>, <b>non-prod</b>, <b>shared services</b>, <b>on-prem</b>. Prod spokes propagate only to the prod table and shared services; non-prod cannot route to prod at all.</li>
<li>Traffic between domains (or all east-west) is forced through the inspection VPC with appliance mode enabled so return traffic is symmetric.</li>
<li>PCI/regulated workloads: separate accounts and either no TGW attachment or a dedicated route domain with inspection.</li>
</ul>

<h3>3. Inside the VPC: three-tier layout</h3>
<table><tr><th>Subnet tier</th><th>Contains</th><th>Routes</th></tr>
<tr><td>Public</td><td>ALB/NLB, NAT (if not centralised)</td><td>IGW</td></tr>
<tr><td>Private (app)</td><td>EC2/ECS/EKS/Lambda ENIs</td><td>TGW for egress/other VPCs</td></tr>
<tr><td>Isolated (data)</td><td>RDS, ElastiCache</td><td>No internet route at all</td></tr></table>
<p>Security groups chain by reference: <code>alb-sg → app-sg → db-sg</code>. NACLs only as coarse guardrails.</p>

<h3>4. Egress control (the most overlooked control)</h3>
<ul>
<li>Workloads rarely need the whole internet. Allow-list domains (package repos, payment processors, SaaS APIs) in Network Firewall with SNI/HTTP host inspection, or use an explicit proxy.</li>
<li>Route 53 Resolver DNS Firewall blocks known-bad and newly observed domains and DNS tunnelling patterns.</li>
<li>AWS API traffic goes through VPC endpoints with endpoint policies limiting to our org's resources.</li>
<li>Benefits: stops C2 callbacks (SolarWinds, Log4Shell LDAP callback), stops exfiltration to random hosts, gives visibility.</li>
</ul>

<h3>5. Private connectivity patterns</h3>
<table><tr><th>Pattern</th><th>Use</th><th>Security note</th></tr>
<tr><td>VPC peering</td><td>Few VPCs, simple</td><td>Non-transitive; full network reachability between the two, so SGs matter</td></tr>
<tr><td>Transit Gateway</td><td>Many VPCs, hub-and-spoke</td><td>Central routing and inspection</td></tr>
<tr><td>PrivateLink (endpoint services)</td><td>Expose one service to other VPCs/accounts/customers</td><td>Only that service is reachable, not the network; best for least privilege and overlapping CIDRs</td></tr>
<tr><td>VPC Lattice</td><td>Service-to-service networking with IAM auth policies</td><td>Identity-aware service networking</td></tr></table>

<h3>6. Hybrid connectivity</h3>
<ul>
<li>Direct Connect for bandwidth/latency (add MACsec or IPsec over DX if encryption is required, DX itself is not encrypted); Site-to-Site VPN as backup.</li>
<li>Treat on-prem as a separate trust zone: only specific ports/prefixes, inspected, logged.</li>
<li>Hybrid DNS via Route 53 Resolver endpoints; identity via AD Connector or federation rather than extending the domain everywhere.</li>
</ul>`,
answer:"Hub-and-spoke with Transit Gateway: one VPC per account, TGW route tables separating prod, non-prod, shared and on-prem, with inter-domain traffic forced through an inspection VPC. Inside each VPC: public, private and isolated tiers with chained security groups. Centralised egress through Network Firewall domain allow-lists plus DNS Firewall, VPC endpoints with org-scoped policies, PrivateLink for exposing single services, and edge ingress via CloudFront, WAF and Shield. Hybrid via Direct Connect with encryption and a separate trust zone."});

DEEP.push({tid:"network", title:"Implementing zero trust: from buzzword to a real programme", body:`
<h3>What zero trust is, precisely</h3>
<p>NIST SP 800-207: access decisions are made <b>per request/session</b>, based on <b>identity, device state and context</b>, enforced as close to the resource as possible, and <b>no implicit trust is granted from network location</b>. Being on the office Wi-Fi or VPN gives nothing by itself.</p>
<pre>Subject (user + device) ──▶ Policy Enforcement Point ──▶ Resource
                                  │   ▲
                         asks     │   │ decision
                                  ▼   │
                  Policy Engine / Policy Administrator
                  inputs: IdP, MDM/EDR posture, threat intel,
                          SIEM/UEBA risk score, data classification</pre>

<h3>The programme, pillar by pillar</h3>
<table>
<tr><th>Pillar</th><th>Traditional</th><th>Target</th><th>Concrete actions</th></tr>
<tr><td>Identity</td><td>Passwords, some MFA</td><td>Phishing-resistant MFA, risk-based policies</td><td>Single IdP, passkeys, conditional access, ITDR</td></tr>
<tr><td>Devices</td><td>Unknown devices on VPN</td><td>Only healthy managed devices for sensitive apps</td><td>MDM + EDR signals in access policy; BYOD via browser isolation</td></tr>
<tr><td>Network</td><td>Flat, VPN = full access</td><td>Per-app access, microsegmentation</td><td>ZTNA, SG-based microsegmentation, encrypted east-west</td></tr>
<tr><td>Apps & workloads</td><td>Trusted internal apps</td><td>Every app authenticates every request</td><td>SSO everywhere, mTLS between services, workload identity</td></tr>
<tr><td>Data</td><td>Perimeter protects data</td><td>Data-centric controls</td><td>Classification, DLP, encryption, data perimeter</td></tr>
<tr><td>Visibility / automation</td><td>Siloed logs</td><td>Signals feed decisions</td><td>SIEM/UEBA risk scores to IdP, automated response</td></tr></table>

<h3>Sequencing that works in real companies</h3>
<ol>
<li><b>Quarter 1-2:</b> all apps behind SSO; MFA for everyone, passkeys for admins; device inventory and posture signals.</li>
<li><b>Quarter 2-4:</b> ZTNA for third parties and admin tools first (highest risk, smallest user base); conditional access requiring managed devices for sensitive apps.</li>
<li><b>Year 2:</b> migrate remaining VPN users app by app; microsegmentation of data centre and cloud workloads; mTLS mesh.</li>
<li><b>Year 3:</b> continuous, risk-adaptive decisions; automated session revocation from SIEM signals.</li>
</ol>

<h3>On AWS specifically</h3>
<ul><li><b>AWS Verified Access</b> for corporate web apps (and now TCP resources) using IdP identity and device posture, no VPN.</li>
<li>Identity Center with conditional access at the IdP.</li>
<li>Service-to-service: IAM auth (SigV4), VPC Lattice auth policies, or mesh mTLS.</li>
<li>Data perimeter controls for "expected networks".</li></ul>

<h3>Pitfalls</h3>
<ul><li>Buying one "zero trust product" and declaring victory.</li><li>Ignoring legacy apps and service accounts.</li><li>Making users MFA every 10 minutes (use risk-based step-up).</li><li>Forgetting that the IdP becomes the crown jewel: protect and monitor it heavily.</li></ul>`,
answer:"Zero trust means per-request decisions based on identity, device health and context, with no trust from network location (NIST 800-207). I run it as a multi-year programme across the CISA pillars: first SSO and phishing-resistant MFA everywhere plus device posture; then ZTNA starting with third parties and admin access; then VPN retirement, microsegmentation and mTLS; finally continuous risk-adaptive access. On AWS: Verified Access, Identity Center with conditional access, IAM-authenticated service calls and data perimeter policies. The IdP becomes the crown jewel and gets the strongest protection."});

DEEP.push({tid:"network", title:"WAF, NGFW, IPS, DDoS: what each does and where it goes", body:`
<table>
<tr><th>Control</th><th>Layer</th><th>Stops</th><th>Doesn't stop</th><th>AWS option</th></tr>
<tr><td>Security group / firewall</td><td>L3-4</td><td>Unwanted ports and sources</td><td>Attacks over allowed ports (SQLi on 443)</td><td>SGs, NACLs</td></tr>
<tr><td>NGFW</td><td>L3-7</td><td>App-aware rules, known exploits (IPS), C2 domains, some TLS inspection</td><td>Business-logic abuse</td><td>Network Firewall (Suricata) or GWLB + vendor NGFW</td></tr>
<tr><td>IPS/IDS</td><td>L3-7</td><td>Signature/anomaly-based exploit traffic</td><td>Encrypted traffic without inspection, zero-days</td><td>Network Firewall rules, GuardDuty (detect)</td></tr>
<tr><td>WAF</td><td>L7 HTTP</td><td>OWASP-style injection/XSS patterns, bad bots, rate abuse, geo rules</td><td>BOLA/authorisation bugs, business logic</td><td>AWS WAF (managed rules, Bot Control, ATP, rate-based)</td></tr>
<tr><td>DDoS protection</td><td>L3-7</td><td>Volumetric and protocol floods, L7 floods (with WAF)</td><td>Application inefficiencies attackers target</td><td>Shield Standard (free), Shield Advanced (SRT, cost protection, L7 auto-mitigation)</td></tr>
<tr><td>API gateway</td><td>L7</td><td>Unauthenticated calls, schema violations, quota abuse</td><td>Object-level authZ in services</td><td>API Gateway, AppSync</td></tr></table>

<h3>DDoS-resilient architecture</h3>
<ol>
<li>Minimise attack surface: only CloudFront/Global Accelerator are public; origins accept traffic only from CloudFront (managed prefix list + secret header or origin access control).</li>
<li>Absorb: CloudFront and Route 53 are anycast and massively scaled.</li>
<li>Filter: WAF rate-based rules, Bot Control, geo/ASN rules, challenge actions (CAPTCHA/silent challenge).</li>
<li>Scale: autoscaling origins, caching, static content offload.</li>
<li>Respond: Shield Advanced with health-based detection and the Shield Response Team; runbooks.</li>
</ol>`,
answer:"Firewalls and SGs control ports and sources; an NGFW adds app awareness and IPS; a WAF understands HTTP and blocks injection, bots and rate abuse; none of them fix authorisation bugs. For DDoS: expose only CloudFront/Global Accelerator, lock origins to CloudFront, filter with WAF rate rules and Bot Control, autoscale and cache, and use Shield Advanced for L7 auto-mitigation and the response team."});

DEEP.push({tid:"crypto", title:"What really happens in TLS and HTTPS (and how it breaks)", body:`
<h3>"What happens when you type https://bank.com?" (security version)</h3>
<ol>
<li><b>DNS:</b> resolver looks up bank.com (can be spoofed without DNSSEC or DoH/DoT; TLS still protects because the attacker cannot present a valid certificate).</li>
<li><b>HSTS:</b> if the browser has seen HSTS (or the domain is preloaded) it refuses plain HTTP, preventing SSL-stripping.</li>
<li><b>TCP connection</b> then the <b>TLS 1.3 handshake</b>:
<pre>ClientHello: TLS versions, cipher suites, key_share (X25519 [+ ML-KEM hybrid]),
             SNI = bank.com, ALPN = h2
ServerHello: chosen suite + its key_share
  → both derive handshake keys (ECDHE): forward secrecy
{EncryptedExtensions, Certificate, CertificateVerify, Finished}  (encrypted)
Client: validates chain → trusted root, name matches SAN, not expired,
        not revoked (OCSP stapling), Certificate Transparency SCTs
Client Finished → application data with AES-GCM / ChaCha20-Poly1305</pre></li>
<li><b>HTTP request</b> with cookies (Secure, HttpOnly, SameSite) and security headers in the response (CSP, HSTS, X-Content-Type-Options).</li>
</ol>

<h3>Certificate validation, what the client checks</h3>
<ul><li>Chain up to a trusted root CA in the trust store.</li><li>Hostname matches a SAN entry.</li><li>Validity dates; key usage.</li><li>Revocation (OCSP stapling / CRLs, browsers use their own mechanisms like CRLite).</li><li>CT logs: publicly logged, so mis-issued certificates for your domain can be detected by monitoring CT.</li></ul>

<h3>Ways TLS gets broken in practice</h3>
<table><tr><th>Problem</th><th>Fix</th></tr>
<tr><td>Apps disabling certificate verification (verify=False)</td><td>Code review rules, SAST checks</td></tr>
<tr><td>Old protocols (TLS 1.0/1.1), weak ciphers</td><td>Security policies on ALB/CloudFront (TLS 1.2 minimum, 1.3 preferred)</td></tr>
<tr><td>Expired certificates → outages</td><td>ACM auto-renewal, ACME, inventory and expiry alerts</td></tr>
<tr><td>Private keys on disk everywhere</td><td>Terminate TLS on ALB/CloudFront with ACM (keys never exposed), HSM for CAs</td></tr>
<tr><td>Mis-issued certificates</td><td>CAA DNS records restricting which CAs may issue, CT monitoring</td></tr>
<tr><td>TLS terminated at load balancer, plain HTTP inside</td><td>Re-encrypt to targets or mTLS mesh when data sensitivity requires</td></tr></table>

<h3>mTLS</h3>
<p>The server also requests a client certificate and verifies it against a trusted CA. Used for service-to-service (mesh), B2B APIs (API Gateway and ALB support mTLS with a trust store), and IoT. The hard part is certificate lifecycle: issuance, rotation, revocation; that is why meshes use short-lived automatically rotated certs.</p>`,
answer:"The browser resolves DNS, enforces HSTS, then runs a TLS 1.3 handshake: ECDHE key share for forward secrecy (now often hybrid with ML-KEM), server certificate and signature, chain validation to a trusted root with hostname, validity, revocation and CT checks, then AEAD-encrypted traffic. Real-world breakage comes from disabled verification, weak protocols, expired or mis-issued certs and plaintext behind the load balancer, fixed with managed certificates, policies, CAA and CT monitoring, and re-encryption or mTLS internally."});

DEEP.push({tid:"crypto", title:"AWS KMS in depth: key policies, grants, encryption context, cross-account", body:`
<h3>1. Key types</h3>
<table><tr><th>Type</th><th>Who manages</th><th>Use</th></tr>
<tr><td>AWS owned keys</td><td>AWS, invisible to you</td><td>Default encryption for some services; no audit/control</td></tr>
<tr><td>AWS managed keys (aws/s3 …)</td><td>AWS, visible</td><td>Easy, but you cannot change the key policy or share cross-account</td></tr>
<tr><td>Customer managed keys (CMK)</td><td>You</td><td>Full control: key policy, grants, rotation, cross-account, deletion</td></tr>
<tr><td>Imported key material (BYOK)</td><td>You generate outside</td><td>Compliance needs to generate keys yourself; you handle durability</td></tr>
<tr><td>Custom key store (CloudHSM) / External key store (XKS)</td><td>You hold the HSM</td><td>Dedicated hardware or keys outside AWS (sovereignty)</td></tr></table>

<h3>2. The key policy is the root of trust</h3>
<p>Unlike most resources, <b>a KMS key cannot be used by anyone unless its key policy allows it</b> (directly or by delegating to IAM with the account root principal statement). Separate administrators from users:</p>
<pre>{
  "Statement": [
    {"Sid":"EnableIAMDelegation","Effect":"Allow",
     "Principal":{"AWS":"arn:aws:iam::111111111111:root"},"Action":"kms:*","Resource":"*"},
    {"Sid":"KeyAdmins","Effect":"Allow",
     "Principal":{"AWS":"arn:aws:iam::111111111111:role/KeyAdmin"},
     "Action":["kms:Create*","kms:Describe*","kms:Enable*","kms:List*","kms:Put*",
               "kms:Update*","kms:Revoke*","kms:Disable*","kms:Get*","kms:TagResource",
               "kms:ScheduleKeyDeletion","kms:CancelKeyDeletion"],
     "Resource":"*"},
    {"Sid":"KeyUsersViaS3Only","Effect":"Allow",
     "Principal":{"AWS":"arn:aws:iam::111111111111:role/orders-service"},
     "Action":["kms:Decrypt","kms:GenerateDataKey"],"Resource":"*",
     "Condition":{"StringEquals":{"kms:ViaService":"s3.ap-south-1.amazonaws.com"}}}
  ]
}</pre>
<p>Notice: admins can manage but not decrypt; the service can decrypt but only through S3. Many teams remove the broad root delegation statement for the most sensitive keys, so IAM admins cannot grant themselves decrypt.</p>

<h3>3. Encryption context: binding ciphertext to its purpose</h3>
<p>Encryption context is non-secret key-value data (e.g. <code>{"tenant":"acme","record":"123"}</code>) supplied at encrypt time; the same context must be supplied to decrypt. It is logged in CloudTrail and can be required in policy conditions (<code>kms:EncryptionContext:tenant</code>). This prevents moving ciphertext from one tenant's record to another's and gives per-tenant audit trails.</p>

<h3>4. Grants</h3>
<p>Temporary, programmatic permissions on a key (used by EBS, RDS etc. when attaching encrypted volumes). Can be retired/revoked. Useful for short-lived delegation without editing key policies.</p>

<h3>5. Cross-account encryption</h3>
<p>Account B wants to decrypt data encrypted with Account A's key: A's key policy allows B's role (or account) <code>kms:Decrypt</code>; B's role identity policy allows <code>kms:Decrypt</code> on A's key ARN. Both are required. AWS managed keys cannot be shared, a common reason cross-account copies of snapshots or S3 objects fail.</p>

<h3>6. Rotation</h3>
<ul><li>Automatic rotation for symmetric CMKs (configurable 90 days to 7 years, default yearly); old key material is kept so old data still decrypts; no re-encryption needed.</li>
<li>On-demand rotation is available for immediate needs.</li>
<li>Rotation does not help if the key policy is too broad; it protects against cryptanalytic wear-out, not access abuse.</li></ul>

<h3>7. Multi-region keys and DR</h3>
<p>Multi-region keys share key material across regions so data encrypted in one region can be decrypted in another (useful for DynamoDB global tables, cross-region DR). Trade-off: a key compromise now spans regions.</p>

<h3>8. Ransomware-in-the-cloud via KMS</h3>
<p>Attack pattern: attacker with enough IAM permissions re-encrypts S3 objects using a key in <i>their</i> account (or schedules deletion of your key). Defences: RCP/SCP allowing only org-owned keys (<code>kms:*</code> with aws:ResourceOrgID), deny <code>kms:ScheduleKeyDeletion</code> except break-glass, alert on key deletion scheduling (7-30 day waiting period gives time), versioning and Object Lock.</p>

<h3>9. Key hierarchy design (principal-level answer)</h3>
<ul><li>Keys per <b>data domain and environment</b> (payments-prod-data, payments-prod-logs), not one key for everything and not one per object.</li>
<li>Per-tenant keys for premium tenants or where crypto-shredding is needed.</li>
<li>Key admins in the security account via a central key-management pipeline (keys created by IaC, never by hand).</li>
<li>Tags on keys for ownership and classification; Config rules for rotation and policy checks.</li></ul>`,
answer:"KMS key policies are the root of trust: nobody uses a key unless the key policy allows it. I use customer managed keys per data domain and environment, separate key admins from key users, restrict usage with kms:ViaService and encryption context conditions, enable rotation, and handle cross-account access with both key policy and IAM permissions. I protect against KMS-based ransomware by allowing only org-owned keys, blocking key deletion outside break-glass and alerting on it. Premium tenants get their own keys for crypto-shredding; CloudHSM or XKS only when regulation requires."});

DEEP.push({tid:"crypto", title:"Secrets management at scale (hundreds of services)", body:`
<h3>The problem</h3>
<p>Database passwords, API keys for third parties, signing keys, webhook secrets. In a large org they end up in Git, CI variables, Slack messages and wikis. A strategy must cover <b>storage, access, delivery, rotation, detection</b>.</p>
<h3>Architecture</h3>
<pre>Service (workload identity: IAM role / Pod Identity)
   │ GetSecretValue (IAM + resource policy + KMS)
   ▼
Secrets Manager (per-account, CMK encrypted, replicated for DR)
   │ rotation Lambda / managed rotation (RDS, Redshift, DocumentDB)
   ▼
Target system (DB, third-party API)
Delivery options: SDK with caching, Lambda extension, Secrets Store CSI driver (EKS),
                  External Secrets Operator</pre>
<h3>Principles</h3>
<ol>
<li><b>Eliminate secrets first:</b> IAM auth to RDS, OIDC for CI, workload identity between services, mTLS.</li>
<li><b>Centralise what remains</b> in one approved store per platform (Secrets Manager or Vault), with naming conventions (<code>/team/app/env/name</code>) and tags for ABAC access.</li>
<li><b>Least privilege:</b> a service can read only its own secrets path.</li>
<li><b>Rotation by default;</b> dynamic, short-lived secrets where possible (Vault database secrets).</li>
<li><b>Detect leaks:</b> pre-commit and server-side secret scanning with push protection, scanning of logs, honey secrets.</li>
<li><b>Revocation playbook:</b> if a secret leaks, rotate in minutes via automation.</li>
</ol>
<h3>Build vs buy</h3>
<p>Almost always buy/use managed (Secrets Manager, Vault Enterprise/HCP, CyberArk Conjur). Building your own secrets store is building your own crypto-adjacent system: high risk, low differentiation. Evaluate on: integration with your platforms, dynamic secrets, rotation support, HA/DR, audit, cost per secret/API call, multi-cloud needs.</p>`,
answer:"First remove secrets using IAM database auth, OIDC and workload identity. Store the rest in one managed store (Secrets Manager or Vault) with path conventions and ABAC so each service reads only its own secrets via its workload identity, delivered through SDK caching or the CSI driver. Rotate automatically, prefer dynamic short-lived credentials, scan code and logs for leaks with push protection, and keep a tested rotation playbook. Buy rather than build."});

DEEP.push({tid:"k8s", title:"EKS security end to end: the layers, with settings", body:`
<h3>Layer 1: Cluster access (who can talk to the API server)</h3>
<ul>
<li>Private endpoint, or public endpoint restricted to known CIDRs.</li>
<li>Authentication through IAM; manage access with <b>EKS access entries</b> and access policies (replaces the fragile aws-auth ConfigMap).</li>
<li>Map IdP groups (via Identity Center roles) to Kubernetes groups; no shared kubeconfigs.</li>
<li>Audit logs enabled to CloudWatch and analysed (GuardDuty EKS audit monitoring).</li>
</ul>
<h3>Layer 2: Kubernetes RBAC</h3>
<pre>apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: payments }
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch","update","patch"]
# no secrets, no pods/exec, no create pods, no escalate/bind/impersonate</pre>
<p>Namespace-scoped roles per team; cluster-admin only via break-glass; review for dangerous verbs.</p>
<h3>Layer 3: Workload identity</h3>
<ul><li>EKS Pod Identity (or IRSA): each service account gets its own IAM role.</li>
<li>Block pods from node IMDS: IMDSv2 with hop limit 1 on nodes, so pods cannot steal the node role.</li>
<li><code>automountServiceAccountToken: false</code> unless the pod calls the Kubernetes API.</li></ul>
<h3>Layer 4: Pod security</h3>
<pre>securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
  seccompProfile: { type: RuntimeDefault }</pre>
<p>Enforced by Pod Security Admission (<code>pod-security.kubernetes.io/enforce: restricted</code> label per namespace) plus Kyverno/Gatekeeper for org rules (approved registries, signed images, no :latest, resource limits).</p>
<h3>Layer 5: Network</h3>
<ul><li>Default-deny NetworkPolicy per namespace, then explicit allows (needs a CNI that enforces: VPC CNI network policy support, Calico, Cilium).</li>
<li>Security groups for pods for access to RDS etc.</li>
<li>Egress restricted; mesh mTLS (Istio/Linkerd) with AuthorizationPolicies for service-level authZ.</li></ul>
<h3>Layer 6: Secrets</h3>
<ul><li>KMS envelope encryption of Kubernetes secrets in etcd (on by default in newer EKS versions, verify).</li>
<li>Prefer Secrets Store CSI driver pulling from Secrets Manager using Pod Identity.</li></ul>
<h3>Layer 7: Supply chain</h3>
<ul><li>Images from ECR only, scanned (Inspector), signed (cosign/Notation), verified at admission; distroless base images; SBOMs.</li></ul>
<h3>Layer 8: Nodes</h3>
<ul><li>Bottlerocket or EKS-optimised AMIs, managed node groups or Karpenter with frequent AMI rotation (immutable nodes, no SSH), or Fargate for isolation.</li></ul>
<h3>Layer 9: Runtime detection and response</h3>
<ul><li>GuardDuty Runtime Monitoring (eBPF agent) or Falco: shells in containers, crypto miners, reverse shells, access to sensitive files, container escape attempts.</li>
<li>Response runbook: isolate pod via NetworkPolicy label, cordon node, capture evidence, redeploy.</li></ul>
<h3>Layer 10: Upgrades and posture</h3>
<ul><li>Stay within supported Kubernetes versions; CIS EKS benchmark checks (kube-bench), Security Hub EKS controls.</li></ul>`,
answer:"I secure EKS in layers: private API endpoint with access entries mapped to IdP groups and audit logging; namespace-scoped RBAC without secrets, exec or pod-create; Pod Identity per service account and blocked node IMDS; restricted Pod Security plus Kyverno for signed images from ECR; default-deny NetworkPolicies and mesh mTLS; secrets from Secrets Manager via CSI with KMS envelope encryption; Bottlerocket nodes rotated frequently; and GuardDuty Runtime Monitoring with an isolation runbook."});

DEEP.push({tid:"k8s", title:"How attackers move through Kubernetes (and where to stop them)", body:`
<pre>1. Initial access   : RCE in an app pod (Log4Shell), exposed dashboard, leaked kubeconfig
2. Discovery        : read service account token at /var/run/secrets/kubernetes.io/...
                      kubectl auth can-i --list ; env vars ; mounted secrets
3. Credential access: call node IMDS for node IAM role; read secrets via RBAC
4. Privilege escalation: create a privileged pod with hostPath "/" → chroot to node
                      → kubelet credentials, other pods' secrets
5. Lateral movement : other namespaces via flat pod network; cloud APIs with stolen role
6. Impact           : crypto mining, data theft from databases/S3, backdoor DaemonSet</pre>
<table><tr><th>Stage</th><th>Break it with</th></tr>
<tr><td>1</td><td>Patching, image scanning, no exposed dashboards, WAF</td></tr>
<tr><td>2</td><td>automountServiceAccountToken false; minimal RBAC; distroless (no shell, no kubectl)</td></tr>
<tr><td>3</td><td>IMDS hop limit 1; Pod Identity; secrets via CSI with scoped access</td></tr>
<tr><td>4</td><td>Pod Security restricted; admission denying privileged/hostPath; no create pods for app SAs</td></tr>
<tr><td>5</td><td>NetworkPolicies; least-privilege IAM for pods; data perimeter conditions</td></tr>
<tr><td>6</td><td>Runtime detection (GuardDuty/Falco); resource limits; alert on new DaemonSets/ClusterRoleBindings</td></tr></table>`,
answer:"Typical chain: app RCE, read the service account token, steal node credentials from IMDS or secrets via RBAC, escalate by creating a privileged hostPath pod, move laterally over a flat pod network or with cloud credentials, then mine or exfiltrate. I break each step: no auto-mounted tokens and minimal RBAC, IMDS hop limit and Pod Identity, restricted Pod Security with admission control, default-deny NetworkPolicies, and runtime detection alerting on shells, miners and new privileged objects."});

/* Deep-dive lessons: Foundations, Frameworks, Threat modelling, AppSec, DevSecOps, Data */
DEEP.push({tid:"foundations", title:"Building a security programme from zero (first security architect / first hire)", body:`
<p>Asked as: "You are the first security hire at a 200-engineer company. Where do you start?" or "How would you build a security function?"</p>
<h3>Principle: risk-driven, visible early wins, then foundations</h3>
<h3>First 30 days: listen and discover</h3>
<ul>
<li>Meet the CTO, heads of engineering, product, legal, finance, support, sales (what do customers ask in security questionnaires?).</li>
<li>Inventory: cloud accounts, identity provider, SaaS apps, code repos, CI/CD, data stores, endpoints, vendors.</li>
<li>Crown jewels: customer data, source code, signing keys, production access, payment flows.</li>
<li>Quick assessment against NIST CSF 2.0 or CIS IG1 to get a baseline.</li>
<li>Find the scary things: public buckets, admins without MFA, shared root passwords, secrets in repos, no backups.</li>
</ul>
<h3>Days 30-90: fix the dangerous basics</h3>
<table><tr><th>Area</th><th>Quick win</th></tr>
<tr><td>Identity</td><td>SSO for major apps, MFA for everyone (phishing-resistant for admins), remove ex-employees</td></tr>
<tr><td>Cloud</td><td>Enable GuardDuty, CloudTrail org trail, Block Public Access; remove IAM user keys</td></tr>
<tr><td>Code</td><td>Secret scanning with push protection, dependency alerts, branch protection</td></tr>
<tr><td>Endpoints</td><td>MDM + EDR, disk encryption, auto-updates</td></tr>
<tr><td>Data</td><td>Backups verified; know where customer PII lives</td></tr>
<tr><td>Response</td><td>Simple incident process, on-call contact, security@ email/VDP</td></tr></table>
<h3>Months 3-12: build the programme</h3>
<ul>
<li><b>Strategy doc:</b> top risks, 12-18 month roadmap, headcount/budget ask, metrics.</li>
<li><b>Architecture:</b> principles, reference patterns, landing zone, paved roads.</li>
<li><b>AppSec:</b> threat modelling for high-risk features, SAST/SCA in CI, security champions, pen test/bug bounty.</li>
<li><b>Compliance:</b> SOC 2 / ISO 27001 if customers need it, built on automated evidence.</li>
<li><b>Detection & response:</b> central logging, MDR partner if no SOC, IR plan and tabletop.</li>
<li><b>People:</b> hire in order of risk: usually cloud/platform security, then AppSec, then detection/IR or GRC.</li>
</ul>
<h3>How to talk about it</h3>
<p>Say what you would <i>not</i> do: buy a SIEM on day 10, write 40 policies nobody reads, or block releases. Emphasise partnership with engineering and measurable risk reduction.</p>`,
answer:"First 30 days listen and map assets, crown jewels and top risks with a CSF/CIS baseline. Days 30-90 fix dangerous basics: SSO and MFA, cloud logging and GuardDuty, secret scanning, EDR, verified backups, a simple IR process. Then build the programme: strategy and roadmap tied to risk, architecture principles and paved roads, AppSec with champions, compliance on automated evidence, detection via MDR or SOC, and hiring in risk order, reporting progress with clear metrics."});

DEEP.push({tid:"frameworks", title:"Using NIST CSF 2.0 and MITRE ATT&CK in real work", body:`
<h3>NIST CSF 2.0 as a working tool, not a poster</h3>
<p>CSF 2.0 has 6 functions, 22 categories and about 106 subcategories (outcomes). Examples:</p>
<table><tr><th>Function</th><th>Example category</th><th>Example outcome</th></tr>
<tr><td>GOVERN (GV)</td><td>GV.SC Supply chain risk management</td><td>Suppliers are known and prioritised by criticality</td></tr>
<tr><td>IDENTIFY (ID)</td><td>ID.AM Asset management</td><td>Inventories of hardware, software, services and data are maintained</td></tr>
<tr><td>PROTECT (PR)</td><td>PR.AA Identity management, authentication and access control</td><td>Identities and credentials are managed; access is least privilege</td></tr>
<tr><td>DETECT (DE)</td><td>DE.CM Continuous monitoring</td><td>Networks and computing are monitored for adverse events</td></tr>
<tr><td>RESPOND (RS)</td><td>RS.MA Incident management</td><td>Incident response plan is executed</td></tr>
<tr><td>RECOVER (RC)</td><td>RC.RP Recovery plan execution</td><td>Restoration is verified</td></tr></table>
<h3>How to run a CSF assessment</h3>
<ol><li>Score current state per subcategory (0-4 or Tier 1-4) with evidence, not opinion.</li>
<li>Define a target profile based on risk appetite and business (a fintech needs higher DE and PR than a small marketing site).</li>
<li>Gap = target minus current; prioritise gaps by risk and cost.</li>
<li>Turn gaps into a roadmap with owners; re-score every 6-12 months; report to the board as a simple chart by function.</li></ol>
<h3>ATT&CK beyond heatmaps</h3>
<ul><li><b>Threat-informed defence:</b> pick 3-5 threat groups relevant to your sector (e.g. ransomware affiliates, cloud-focused actors like Scattered Spider), list their techniques, and check prevention, detection and response for each.</li>
<li><b>Detection engineering:</b> tag every rule with technique IDs; find gaps.</li>
<li><b>Purple teaming:</b> emulate techniques (Atomic Red Team, Stratus Red Team for AWS) and verify alerts fire.</li>
<li><b>Architecture reviews:</b> ask "which ATT&CK techniques does this design make harder?" e.g. workload identity reduces T1552 Unsecured Credentials; SCPs reduce T1562 Impair Defenses.</li></ul>
<h3>Common cloud techniques to know by name</h3>
<p>T1078.004 Valid Accounts: Cloud Accounts · T1552.005 Cloud Instance Metadata API · T1530 Data from Cloud Storage · T1537 Transfer Data to Cloud Account · T1562.008 Disable or Modify Cloud Logs · T1098 Account Manipulation · T1496 Resource Hijacking (crypto mining) · T1485/T1486 Data Destruction / Encrypted for Impact.</p>`,
answer:"I use CSF 2.0 by scoring current state per subcategory with evidence, setting a risk-based target profile, prioritising gaps into an owned roadmap, and reporting by function to the board. I use ATT&CK for threat-informed defence: map relevant threat groups' techniques to our preventive, detective and response controls, tag detections with technique IDs, validate with purple teaming (Stratus Red Team for AWS), and use it in design reviews to ask which techniques a design makes harder."});

DEEP.push({tid:"threatmodel", title:"Worked threat model: 'Buy Now, Pay Later' checkout feature", body:`
<h3>1. What are we building?</h3>
<p>Customers choose BNPL at checkout. We call a credit-check partner, show an offer, customer accepts with OTP, we create a loan and schedule repayments via auto-debit (UPI AutoPay / e-mandate).</p>
<pre>[Customer app] ──HTTPS──▶ [API Gateway+WAF] ──▶ [Checkout svc] ──▶ [BNPL svc] ──▶ [Credit bureau API]
                                                      │                 │ (external, mTLS)
                                                      ▼                 ▼
                                                 [Orders DB]      [Loans DB] ──▶ [Payments/mandate svc] ──▶ [Bank/NPCI]
                                                                        │
                                                                   [Event bus] ──▶ [Collections, Notifications]
Trust boundaries: internet|edge, edge|services, services|partners, services|data stores, staff admin console|loans</pre>

<h3>2. What can go wrong? (STRIDE on the boundary crossings)</h3>
<table>
<tr><th>#</th><th>Where</th><th>STRIDE</th><th>Threat</th><th>Risk</th></tr>
<tr><td>1</td><td>App → API</td><td>S</td><td>Account takeover used to take loans in victim's name</td><td>High</td></tr>
<tr><td>2</td><td>App → BNPL svc</td><td>T</td><td>Tampering with amount/tenure/offer ID between offer and acceptance</td><td>High</td></tr>
<tr><td>3</td><td>BNPL svc</td><td>E</td><td>BOLA: accept or view another user's offer/loan by ID</td><td>High</td></tr>
<tr><td>4</td><td>BNPL → bureau</td><td>I</td><td>Credit reports (sensitive PII) leaked via logs or over-broad storage</td><td>High</td></tr>
<tr><td>5</td><td>Checkout</td><td>D / business</td><td>Bots doing mass credit checks (cost + bureau limits) or synthetic identity fraud</td><td>Medium</td></tr>
<tr><td>6</td><td>Accept loan</td><td>R</td><td>Customer disputes they agreed; no proof of consent</td><td>Medium</td></tr>
<tr><td>7</td><td>Admin console</td><td>E / I</td><td>Support staff change limits or view full credit reports</td><td>High</td></tr>
<tr><td>8</td><td>Event bus</td><td>S / T</td><td>Forged "repayment received" event marking loans paid</td><td>High</td></tr>
<tr><td>9</td><td>Bureau API</td><td>S</td><td>Partner credentials stolen, used to pull reports on anyone</td><td>High</td></tr>
<tr><td>10</td><td>Race condition</td><td>T</td><td>Double acceptance or double disbursement via parallel requests</td><td>Medium</td></tr></table>

<h3>3. What will we do about it?</h3>
<table><tr><th>#</th><th>Mitigation</th></tr>
<tr><td>1</td><td>Step-up auth (OTP/biometric via device binding) at loan acceptance; risk engine on device/geo/velocity; cooling-off limits for new devices</td></tr>
<tr><td>2</td><td>Server-side offer stored with signed offer ID and expiry; acceptance references the ID only, never client-sent amounts</td></tr>
<tr><td>3</td><td>Object-level authZ: offer.customer_id == token.sub on every call; automated BOLA tests</td></tr>
<tr><td>4</td><td>Store only derived score and decision, not full report; field-level encryption; logging redaction; retention per RBI/DPDP</td></tr>
<tr><td>5</td><td>Bot control, per-user and per-device rate limits, KYC before credit pull, consent capture</td></tr>
<tr><td>6</td><td>Signed, timestamped consent record (terms version, IP, device, OTP event), immutable storage</td></tr>
<tr><td>7</td><td>RBAC + JIT for admin actions, maker-checker for limit changes, masked views, full audit logging</td></tr>
<tr><td>8</td><td>Authenticated producers (IAM on EventBridge/SNS), message signing for payment events, reconciliation with bank statements</td></tr>
<tr><td>9</td><td>mTLS + IP allow-list with partner, credentials in Secrets Manager, per-request purpose logging, anomaly alerts on pull volume</td></tr>
<tr><td>10</td><td>Idempotency keys, database constraints, state machine with conditional updates</td></tr></table>

<h3>4. Did we do a good job?</h3>
<p>Tickets created with owners; abuse-case tests in CI; pen test focused on 2, 3, 8, 10; revisit when adding new partners. Residual risk (e.g. sophisticated synthetic identity fraud) accepted by the product owner with fraud-monitoring KPIs.</p>`,
answer:"I draw the DFD with trust boundaries (edge, services, credit bureau, bank, data stores, admin console), then STRIDE each crossing. Top threats: account takeover taking loans, tampering with offer terms, BOLA on offers/loans, credit report leakage, bot-driven credit pulls, repudiation of consent, insider abuse in admin tools, forged repayment events, partner credential theft and race conditions. Mitigations: step-up auth, server-side signed offers, object-level authZ, data minimisation and field encryption, bot control, signed consent records, maker-checker with JIT, authenticated signed events, mTLS to partners and idempotency. Output is owned tickets and targeted tests."});

DEEP.push({tid:"appsec", title:"Authorisation bugs: why they are #1 and how to kill the class", body:`
<h3>The bug</h3>
<pre>// VULNERABLE: trusts the ID from the URL
app.get("/api/orders/:id", auth, async (req, res) => {
  const order = await db.orders.findById(req.params.id);
  res.json(order);
});

// FIXED: scope the query to the caller (and tenant)
app.get("/api/orders/:id", auth, async (req, res) => {
  const order = await db.orders.findOne({ id: req.params.id,
                                          tenantId: req.user.tenantId,
                                          customerId: req.user.id });
  if (!order) return res.status(404).end();   // 404 avoids confirming existence
  res.json(order);
});</pre>
<h3>Three kinds of authorisation failures</h3>
<table><tr><th>Type</th><th>Example</th><th>Fix</th></tr>
<tr><td>Object level (BOLA/IDOR)</td><td>GET /orders/1002 returns someone else's order</td><td>Ownership/tenant check on every object access</td></tr>
<tr><td>Function level (BFLA)</td><td>Normal user calls POST /admin/refunds</td><td>Deny-by-default route authorisation; separate admin APIs</td></tr>
<tr><td>Property level (mass assignment / excessive exposure)</td><td>PATCH /users/me with {"role":"admin"}; API returns passwordHash</td><td>Allow-listed input DTOs and output serializers</td></tr></table>
<h3>Why scanners miss them</h3>
<p>SAST cannot know business rules ("a customer may only see their own orders"). DAST sees a 200 response and cannot tell it is someone else's data. So the answer is <b>architecture and testing</b>, not tools alone.</p>
<h3>Killing the class (principal-level answer)</h3>
<ol>
<li><b>Deny by default</b> in the framework: every route must declare its policy, a lint/CI check fails otherwise.</li>
<li><b>Central policy engine</b> (Cedar / Verified Permissions, OPA, OpenFGA) called through a shared library: <code>authorize(user, "read", order)</code>.</li>
<li><b>Tenant-scoped data access layer</b>: repositories require a tenant context; plus database row-level security as a second layer.</li>
<li><b>Automated authorisation tests</b>: for every endpoint, call with user A's token on user B's object and expect 403/404 (tools: Autorize-like tests, custom integration test harness).</li>
<li><b>Logging of authorisation denials</b> to detect enumeration attempts.</li>
<li><b>Design review checklist</b> item: "What is the authorisation rule for each object?"</li>
</ol>`,
answer:"Authorisation bugs come in three kinds: object level (BOLA), function level (BFLA) and property level (mass assignment, excessive data exposure). Scanners miss them because they need business context. I kill the class with deny-by-default routing, a central policy engine called via a shared library, a tenant-scoped data access layer plus row-level security, automated cross-user tests for every endpoint in CI, logging of denials, and an explicit authorisation rule in every design review."});

DEEP.push({tid:"appsec", title:"Designing a secure web application from scratch", body:`
<p>Asked as "You are designing a new web application with security as a priority. What steps?"</p>
<h3>Phase 1: Requirements</h3>
<ul><li>Data classification, regulations, users and roles, abuse cases ("as a fraudster I want to…").</li>
<li>Security requirements from OWASP ASVS (level 2 for most business apps, level 3 for high-value).</li></ul>
<h3>Phase 2: Design</h3>
<ul><li>Threat model the architecture.</li>
<li>Authentication delegated to the company IdP/Cognito (OIDC + PKCE, BFF), MFA/passkeys.</li>
<li>Authorisation model decided explicitly (RBAC/ABAC/ReBAC), central enforcement.</li>
<li>Session management: HttpOnly Secure SameSite cookies, short idle timeout, rotation on login.</li>
<li>Data: encryption, field-level protection for sensitive fields, minimal retention.</li>
<li>Architecture: CloudFront + WAF, private subnets, managed database, secrets in Secrets Manager.</li></ul>
<h3>Phase 3: Build</h3>
<ul><li>Framework with auto-escaping, ORM with parameterised queries, CSRF protection, CSP with nonces.</li>
<li>Security headers: HSTS, CSP, X-Content-Type-Options, Referrer-Policy, frame-ancestors.</li>
<li>Input validation (allow-list) and output encoding by context; safe file handling.</li>
<li>Pipeline: SAST, SCA, secret scanning, IaC scanning, container scanning.</li></ul>
<h3>Phase 4: Verify</h3>
<ul><li>Security unit tests (authZ tests), DAST in staging, pen test before launch, bug bounty after.</li></ul>
<h3>Phase 5: Operate</h3>
<ul><li>Security logging (auth events, authZ failures, admin actions) to the SIEM, alerting, rate limits, vulnerability SLAs, incident runbook.</li></ul>`,
answer:"Requirements (data classification, ASVS level, abuse cases), design (threat model, IdP-based OIDC with MFA, explicit authorisation model, secure sessions, encryption, private architecture behind WAF), build (auto-escaping framework, ORM, CSRF and CSP, security headers, secrets manager, scanning in CI), verify (authZ tests, DAST, pen test, bug bounty), operate (security logging and alerting, rate limits, patch SLAs, IR runbook)."});

DEEP.push({tid:"appsec", title:"API security architecture for partners and the public", body:`
<h3>The scenario</h3>
<p>"We are exposing previously internal APIs to partners and the public." Internal APIs often assumed a trusted network: weak auth, verbose errors, no rate limits, IDs that can be enumerated. Exposing them as-is is dangerous.</p>
<h3>Architecture</h3>
<pre>Partner / public client
   │  OAuth2: client credentials (private_key_jwt or mTLS) for partners,
   │          auth code + PKCE for user-delegated access
   ▼
CDN + WAF (bot control, geo, rate-based rules)
   ▼
External API Gateway  (separate from internal gateway!)
   - token validation (aud = external-api), scopes per product
   - OpenAPI schema validation, payload size limits
   - per-client quotas, spike arrest
   - response filtering: only fields allowed for this scope
   ▼
Facade / BFF services (external contract, versioned)
   - object-level authZ with partner/tenant context
   - business limits (max refunds per day)
   ▼
Internal services (never directly exposed)</pre>
<h3>Key decisions</h3>
<ul>
<li><b>Separate external and internal gateways/contracts</b>: the external API is a product with its own model; don't just proxy internal endpoints.</li>
<li><b>Identity per partner</b>, credentials rotated, keys revocable; API keys only identify, OAuth tokens authorise.</li>
<li><b>Inventory and versioning</b>: every exposed endpoint documented; deprecate old versions (OWASP API9).</li>
<li><b>Data minimisation</b> per scope (API3 property-level authorisation).</li>
<li><b>Abuse protection</b> for sensitive business flows (API6): e.g. account creation, OTP sending, coupon redemption.</li>
<li><b>Unsafe consumption</b> (API10): treat partner webhook payloads as untrusted; verify HMAC signatures and timestamps.</li>
<li><b>Monitoring</b>: per-client anomaly detection, audit logs partners can request.</li>
<li><b>Legal/process</b>: partner onboarding with security review and terms.</li>
</ul>`,
answer:"I never expose internal APIs directly. Partners get OAuth client credentials with private_key_jwt or mTLS, users get auth code + PKCE; traffic passes CDN and WAF, then a dedicated external gateway doing token and scope checks, schema validation, quotas and response filtering, then versioned facade services enforcing object-level authorisation and business limits. I maintain an API inventory with deprecation, minimise data per scope, protect sensitive business flows from automation, verify webhook signatures, and monitor per-client anomalies."});

DEEP.push({tid:"devsecops", title:"Building a secure CI/CD pipeline step by step", body:`
<h3>Threats to the pipeline itself</h3>
<ul><li>Developer account takeover pushes malicious code.</li>
<li>Poisoned Pipeline Execution: a PR modifies the pipeline file to dump secrets.</li>
<li>Compromised third-party action/plugin (e.g. tj-actions/changed-files incident in 2025 leaked secrets in CI logs).</li>
<li>Runner compromise persisting between jobs.</li>
<li>Over-privileged deploy credentials used to take over production.</li>
<li>Malicious dependency pulled during build.</li></ul>
<h3>Controls, stage by stage</h3>
<table>
<tr><th>Stage</th><th>Controls</th></tr>
<tr><td>Source</td><td>SSO + phishing-resistant MFA for SCM, branch protection (reviews, status checks, no force-push), CODEOWNERS on pipeline and IaC dirs, signed commits for critical repos, secret scanning push protection</td></tr>
<tr><td>Pipeline definition</td><td>Reusable templates owned by platform team; PRs from forks run without secrets; pipeline changes need platform review; actions pinned by SHA</td></tr>
<tr><td>Build</td><td>Ephemeral isolated runners, least network access, dependencies via internal proxy (CodeArtifact/Artifactory) with pinned hashes, no long-lived secrets</td></tr>
<tr><td>Test</td><td>SAST, SCA, IaC, container scanning; gate only on high-confidence critical issues</td></tr>
<tr><td>Package</td><td>SBOM generation, image signing (cosign/Notation), SLSA provenance attestation, push to immutable registry</td></tr>
<tr><td>Deploy</td><td>OIDC-federated role per environment, prod role assumable only from protected branch/environment with approval, admission control verifies signatures</td></tr>
<tr><td>Runtime</td><td>Continuous scanning of running images, drift detection, runtime monitoring</td></tr>
<tr><td>Audit</td><td>Pipeline logs to SIEM, alerts on runner registration, permission changes, secret access</td></tr></table>
<h3>Change management evidence for auditors (SOX/SOC 2/RBI)</h3>
<p>The PR (who changed what), reviewer approval, test results, deployment record linking commit to release. Automate evidence export; no screenshots.</p>`,
answer:"Treat CI/CD as production. Source: SSO+MFA, branch protection, CODEOWNERS on pipeline files, secret push protection. Pipelines: central templates, no secrets for fork PRs, actions pinned by SHA. Build: ephemeral runners, dependencies via a proxy with pinned hashes. Test: SAST/SCA/IaC/container scanning gating only high-confidence issues. Package: SBOM, signing and SLSA provenance to an immutable registry. Deploy: OIDC roles per environment, prod only from protected branches with approval, admission verifies signatures. Everything logged to the SIEM with automated audit evidence."});

DEEP.push({tid:"data", title:"Data classification and DLP programme: where to start", body:`
<h3>1. Start with a simple scheme people can use</h3>
<table><tr><th>Class</th><th>Examples</th><th>Minimum controls</th></tr>
<tr><td>Public</td><td>Marketing site, docs</td><td>Integrity only</td></tr>
<tr><td>Internal</td><td>Wiki, internal metrics</td><td>SSO, no public sharing</td></tr>
<tr><td>Confidential</td><td>Customer PII, contracts, source code</td><td>Encryption, least privilege, logging, DLP on egress</td></tr>
<tr><td>Restricted</td><td>Card data, health data, credentials, national IDs, M&A</td><td>Field-level encryption/tokenisation, dedicated keys and accounts, JIT access, no non-prod copies</td></tr></table>
<h3>2. Discover before you label</h3>
<ul><li>Structured data: Macie for S3, database scanning (DSPM tools), data catalog (Glue, Collibra).</li>
<li>SaaS: CASB/SSPM discovery of Google Drive/SharePoint/Slack exposure.</li>
<li>Endpoints: DLP agent discovery.</li></ul>
<h3>3. Label automatically where possible</h3>
<p>Default labels by system (anything in the payments database is Restricted), resource tags (<code>data-class=restricted</code>) in AWS enforced by tag policies, Microsoft Purview sensitivity labels for documents, auto-labelling rules for patterns (card numbers, Aadhaar).</p>
<h3>4. Bind controls to labels</h3>
<p>The label must <i>do</i> something: SCPs/RCPs requiring encryption for restricted-tagged buckets, Lake Formation tag-based access, Purview label encrypting a document, DLP rules blocking Restricted data to personal email or unapproved AI tools.</p>
<h3>5. DLP channels and approach</h3>
<ul><li>Email, web uploads (SWG), SaaS sharing (CASB), endpoints (USB, print), code repos, GenAI prompts, and APIs.</li>
<li>Start in monitor mode, measure false positives, then coach (warn user with justification) before block. Block only high-confidence patterns.</li></ul>
<h3>6. Metrics</h3>
<p>% of data stores classified, % Restricted stores meeting control baseline, DLP incidents by channel and trend, time to remediate exposed data.</p>`,
answer:"Start with a four-level scheme people understand, discover data with Macie, DSPM, CASB and endpoint scans, label automatically by system and patterns, and make every label enforce something: encryption requirements, tag-based access, document protection and DLP rules. Roll DLP out across email, web, SaaS, endpoints and GenAI in monitor, then coach, then block mode for high-confidence patterns, and measure coverage and incident trends."});

DEEP.push({tid:"data", title:"DPDP Act for engineers: what you actually build", body:`
<table><tr><th>Obligation</th><th>What engineering builds</th></tr>
<tr><td>Notice and consent (itemised, clear, in English or scheduled languages)</td><td>Consent service storing purpose-level consents with versioned notices, timestamps and withdrawal; APIs other services check before processing</td></tr>
<tr><td>Withdrawal as easy as giving</td><td>Self-service UI and propagation of withdrawal events to all processors</td></tr>
<tr><td>Purpose limitation and erasure when purpose ends</td><td>Data inventory tagged with purpose and retention, automated deletion jobs, deletion events to processors</td></tr>
<tr><td>Data principal rights (access, correction, erasure, grievance, nominee)</td><td>DSR workflow: identity verification, data discovery across systems, response SLAs, audit trail</td></tr>
<tr><td>Reasonable security safeguards</td><td>Encryption, access control, logging and monitoring (logs retained at least one year), backups, contracts with processors</td></tr>
<tr><td>Breach intimation to Board and affected people</td><td>IR playbook with legal; ability to identify affected individuals quickly (data mapping); templates</td></tr>
<tr><td>Children (under 18)</td><td>Age assurance and verifiable parental consent flows; no tracking/behavioural ads to children</td></tr>
<tr><td>Consent Managers</td><td>Integration with registered consent managers where used</td></tr>
<tr><td>Significant Data Fiduciaries</td><td>DPO in India, annual DPIA and independent audit, algorithmic due diligence</td></tr>
<tr><td>Cross-border transfer</td><td>Region controls; transfers allowed except to countries the government restricts; sector rules (e.g. RBI payment data localisation) may be stricter</td></tr></table>
<p>Penalties go up to ₹250 crore per instance (for failing to take reasonable security safeguards). Rules notified 14 November 2025; most obligations phase in over 18 months.</p>`,
answer:"DPDP translates into a consent service with versioned notices and easy withdrawal, a data inventory tagged by purpose and retention with automated deletion, a data-subject-rights workflow, reasonable security safeguards with at least one year of logs, breach playbooks with fast impact identification, parental consent for under-18s, and for significant data fiduciaries a DPO, DPIAs and audits. Sector rules like RBI localisation may be stricter than DPDP transfer rules."});
