TOPICS.push({
id:"crypto", n:10, title:"Cryptography & PKI", domain:"Identity & Crypto", week:2,
fw:"FIPS 140-3 · FIPS 203/204/205 (PQC) · NIST SP 800-57 (key management) · RFC 8446 (TLS 1.3)",
simple:"Cryptography gives us secrecy (encryption), proof that data was not changed (hashes, MACs), and proof of who sent it (digital signatures). As an architect you rarely design algorithms. You choose the right primitive, protect and rotate the keys, and make sure crypto is used correctly. <b>Keys are the real asset:</b> encryption is only as strong as key management.",
analogy:"Symmetric encryption is one key that locks and unlocks a box: fast, but you must share the key secretly. Asymmetric is a padlock you hand out freely (public key) while only you hold the key that opens it (private key). A digital signature is a wax seal only you can make, but anyone can check.",
why:"Interviewers test whether you understand TLS, envelope encryption, KMS vs HSM, certificate lifecycle, and increasingly post-quantum readiness. Principal candidates should discuss crypto agility and key hierarchy design, not just AES and RSA.",
concepts:[
["Symmetric","Same key encrypts and decrypts. AES-256-GCM (authenticated encryption), ChaCha20-Poly1305. Fast; used for bulk data."],
["Asymmetric","Key pair. RSA (2048+ bits, 3072 recommended), ECC (P-256, Curve25519). Used for key exchange and signatures."],
["Hash","One-way fixed-length fingerprint: SHA-256, SHA-3. MD5 and SHA-1 are broken for collision resistance."],
["MAC / HMAC","Keyed hash proving integrity and authenticity with a shared key (HMAC-SHA256)."],
["Digital signature","Hash signed with a private key; anyone verifies with the public key. Gives integrity, authenticity and non-repudiation."],
["Password hashing","Slow, salted, memory-hard: Argon2id (preferred), scrypt, bcrypt, PBKDF2 (FIPS). Never plain SHA-256."],
["AEAD","Authenticated Encryption with Associated Data (AES-GCM): confidentiality plus integrity. Never reuse a nonce with the same key."],
["Envelope encryption","Data encrypted with a data key (DEK); the DEK is encrypted by a key-encryption key (KEK) in KMS/HSM. Scales and allows re-keying cheaply."],
["HSM","Hardware Security Module, tamper-resistant device (FIPS 140-3 Level 3) where keys never leave in plaintext."],
["PKI","Root CA (offline) → intermediate CAs → leaf certificates. Revocation via CRL or OCSP. Certificate Transparency logs publicly record issued certs."],
["Perfect Forward Secrecy","Ephemeral (EC)DHE key exchange so stealing the server's private key later cannot decrypt past sessions. Mandatory in TLS 1.3."],
["mTLS","Both client and server present certificates. Common for service-to-service and B2B APIs."],
["Tokenisation vs encryption","Tokenisation replaces data with a random token and a vault mapping; no mathematical relationship. Reduces PCI scope."],
["Post-quantum cryptography","NIST FIPS 203 ML-KEM (key encapsulation), FIPS 204 ML-DSA and FIPS 205 SLH-DSA (signatures), published Aug 2024. HQC selected in 2025 as a backup KEM."],
["Harvest now, decrypt later","Adversaries record encrypted traffic today to decrypt once quantum computers exist; drives urgency for long-lived secrets."],
["Crypto agility","Ability to swap algorithms and keys without redesign: abstraction layers, inventory (CBOM), config-driven choices."]
],
how:`<p><b>TLS 1.3 handshake in plain words (1 round trip):</b></p>
<pre>ClientHello: supported ciphers + key share (ECDHE public value)
ServerHello: chosen cipher + its key share
  -> both compute the same shared secret (ECDHE), derive session keys
Server sends (encrypted): certificate, CertificateVerify (signature), Finished
Client verifies cert chain to a trusted root, hostname, validity -> Finished
Application data flows, encrypted with AEAD (AES-GCM / ChaCha20)</pre>
<p>TLS 1.3 removed RSA key exchange, static DH, CBC mode ciphers, compression and renegotiation. It allows 0-RTT resumption, which is replayable, so only use it for idempotent requests.</p>
<p><b>Envelope encryption (how AWS KMS works):</b></p>
<pre>App -> KMS GenerateDataKey(KeyId)  -> returns plaintext DEK + encrypted DEK
App encrypts data with plaintext DEK (AES-256-GCM), then wipes DEK from memory
Stores ciphertext + encrypted DEK together
To read: KMS Decrypt(encrypted DEK) -> plaintext DEK -> decrypt data
KMS logs every Decrypt call in CloudTrail; key policy controls who can call it</pre>
<p><b>Key management lifecycle:</b> generate (in HSM/KMS) → distribute (never in plaintext over the wire) → store → use (with authorisation and logging) → rotate → revoke → destroy. Separate duties: key administrators should not be key users.</p>
<p><b>PQC migration plan:</b> (1) build a cryptographic inventory (CBOM) of where RSA/ECC is used; (2) prioritise data with long confidentiality life and long-lived signatures (firmware, code signing roots); (3) adopt hybrid key exchange (X25519 + ML-KEM-768) in TLS, which major browsers and cloud load balancers already support; (4) demand PQC roadmaps from vendors; (5) build crypto agility. NIST IR 8547 plans to deprecate RSA/ECC around 2030 and disallow by 2035.</p>`,
aws:[["Key management","AWS KMS (FIPS 140-3 L3 HSMs), customer managed keys, key policies, grants, automatic rotation"],["Dedicated HSM","AWS CloudHSM (single-tenant), KMS custom key store / external key store (XKS)"],["Certificates","ACM for public/private certs on ALB/CloudFront; AWS Private CA for internal PKI and mTLS"],["Secrets","AWS Secrets Manager with rotation Lambdas; SSM Parameter Store SecureString"],["Isolated processing","Nitro Enclaves for processing decrypted secrets with attestation"],["PQC","Hybrid ML-KEM key exchange supported on AWS KMS, ACM and Secrets Manager TLS endpoints and s2n-tls"]],
cases:`<p><b>Heartbleed (2014):</b> a buffer over-read in OpenSSL leaked server memory, including private keys. Organisations had to patch, revoke and reissue certificates at scale, which showed the need for certificate inventory and automation.</p>
<p><b>Expired certificate outages:</b> repeated large outages (e.g. mobile carriers, Microsoft Teams in 2020) were caused by certificates nobody tracked. Lesson: automated issuance and renewal (ACME, ACM), inventory and expiry alerting. Public TLS certificate maximum validity is dropping in stages toward 47 days by 2029 under CA/Browser Forum rules, so automation is mandatory.</p>`,
mistakes:["Rolling your own crypto or protocol.","Reusing nonces/IVs in AES-GCM.","Hard-coding keys in code or config.","Using fast hashes for passwords.","No certificate inventory, leading to outages.","Key admins who can also use keys (no separation of duties).","Encrypting with a KMS key whose policy lets the whole account decrypt, which adds little protection."],
hook:"Symmetric for speed, asymmetric for exchange and signatures, hashes for fingerprints, KMS for keys, and plan for quantum.",
qs:[
{l:"basic",q:"Symmetric vs asymmetric encryption: when do you use each?",a:"Symmetric (AES) uses one shared key; it is fast and used for bulk data encryption at rest and inside TLS sessions. Asymmetric (RSA, ECC) uses a key pair; it is slow but solves key distribution and enables signatures. In practice they are combined: asymmetric crypto establishes or protects a symmetric key (TLS key exchange, envelope encryption), then symmetric crypto encrypts the data.",t:"Fundamentals."},
{l:"basic",q:"Encoding vs encryption vs hashing?",a:"<b>Encoding</b> (Base64, URL encoding) changes representation, no secret, reversible by anyone. <b>Encryption</b> is reversible with a key and protects confidentiality. <b>Hashing</b> is one-way; used for integrity checks and, with salt and a slow algorithm, for passwords. A common interview trap: Base64 in a JWT payload is not encryption; anyone can read JWT claims.",t:"Clear definitions."},
{l:"basic",q:"How should passwords be stored?",a:"With a slow, salted, adaptive algorithm: Argon2id preferred (memory-hard), or scrypt or bcrypt; PBKDF2 with a high iteration count where FIPS is needed. A unique random salt per password (stored alongside), optionally a secret pepper stored in an HSM/KMS. Tune cost so a hash takes around 100-500 ms on our hardware. Never encrypt passwords reversibly and never use plain SHA-256/MD5.",t:"Practical AppSec crypto."},
{l:"advanced",q:"Explain envelope encryption and why it is used.",a:"Data is encrypted with a data encryption key (DEK) locally; the DEK is then encrypted by a key encryption key (KEK) that never leaves the KMS/HSM. We store the encrypted DEK with the ciphertext. Benefits: (1) performance, since large data is not sent to KMS; (2) the KEK stays in hardware; (3) rotating the KEK only requires re-wrapping small DEKs, not re-encrypting terabytes; (4) access to data is gated by KMS permissions and every unwrap is logged; (5) per-tenant or per-object DEKs limit blast radius and enable crypto-shredding (delete the key to make data unrecoverable).",t:"Core cloud crypto design."},
{l:"advanced",q:"KMS vs CloudHSM vs External Key Store: how do you choose?",a:"<b>KMS (default):</b> managed, FIPS 140-3 Level 3 HSMs underneath, integrated with most AWS services, per-request pricing, key policies and CloudTrail. Fits 90% of needs. <b>CloudHSM:</b> single-tenant HSM you control, for regulatory requirements of dedicated hardware, custom crypto operations (e.g. PKCS#11 apps, TDE for Oracle), or high-volume signing; you manage HA and backups. <b>KMS custom key store backed by CloudHSM:</b> KMS integration but keys in your cluster. <b>External Key Store (XKS):</b> keys stay in your on-prem HSM outside AWS; used for sovereignty ('hold your own key'); trade-offs are latency, availability dependency on your HSM, and operational burden. Choose by regulation, control needs, and operations maturity.",t:"Trade-offs, not product listing."},
{l:"advanced",q:"What is Perfect Forward Secrecy and why does it matter?",a:"PFS means each session uses ephemeral Diffie-Hellman keys, so session keys cannot be derived later even if the server's long-term private key is stolen. Without it (old RSA key exchange), an attacker who recorded traffic and later obtains the private key can decrypt everything. TLS 1.3 mandates ephemeral (EC)DHE, so PFS is built in. It also limits harvest-now-decrypt-later risk against classical attacks, but not against a future quantum computer, which is why hybrid PQC key exchange is being rolled out.",t:"Protocol depth."},
{l:"scenario",q:"Your CISO asks: 'What is our plan for post-quantum cryptography?'",a:"(1) <b>Inventory:</b> discover where public-key crypto is used: TLS endpoints, VPNs, code signing, PKI, SSH, databases, third-party SDKs, HSMs, and record it in a cryptographic bill of materials. (2) <b>Prioritise by data shelf-life:</b> data that must stay secret for 10+ years (health, identity, state secrets) and long-lived trust anchors are first because of harvest-now-decrypt-later. (3) <b>Quick wins:</b> enable hybrid ML-KEM key exchange on TLS termination points and clients where supported (browsers, CDNs, AWS endpoints). (4) <b>Vendor management:</b> require PQC roadmaps in contracts. (5) <b>Crypto agility:</b> centralise crypto in libraries and services so algorithms are configuration. (6) <b>Timeline:</b> align with NIST's deprecation of RSA/ECC by 2030 and disallowance by 2035 and national guidance. Report progress as a percentage of the inventory migrated.",t:"Strategic, current, executive-ready answer."},
{l:"scenario",q:"A developer wants to encrypt a database column holding Aadhaar/SSN numbers. What do you recommend?",a:"First ask whether we need the value at all; often a token or last-4 digits is enough. If needed: application-level encryption with envelope encryption via KMS so DBAs and anyone with database access see only ciphertext; a separate KMS key with a key policy allowing Decrypt only to the service role that must see it; encryption context bound to the record/tenant; for lookups, store a keyed HMAC (blind index) instead of deterministic encryption; log and alert on unusual decrypt volume. Alternatively use a tokenisation vault to remove the data from most systems. Also mask it in logs and non-production environments.",t:"Applied data protection design."},
{l:"design",q:"Design a PKI for internal mTLS across 2,000 microservices.",a:"Offline root CA (or AWS Private CA root with tight controls) → intermediate issuing CAs per environment/region. Short-lived leaf certs (hours to a few days) issued automatically by the service mesh or SPIRE based on workload identity, so revocation is rarely needed. Automate rotation; no human handles private keys; keys generated on the workload and never exported. Trust bundles distributed by the mesh control plane. Name constraints and SPIFFE IDs in SANs. Monitoring: issuance logs, expiry alerts, CA key usage in CloudTrail. Plan root rotation from day one (cross-signing). Keep separate trust domains for prod and non-prod.",t:"Operational PKI design."}
],
quiz:[
{q:"Which is the recommended algorithm for password hashing today?",o:["SHA-256","MD5 with salt","Argon2id","AES-256"],c:2,e:"Argon2id is memory-hard and the OWASP-recommended default."},
{q:"NIST FIPS 203 standardises:",o:["ML-DSA signatures","ML-KEM key encapsulation","SHA-3","AES-GCM"],c:1,e:"FIPS 203 = ML-KEM (from CRYSTALS-Kyber). FIPS 204 = ML-DSA, FIPS 205 = SLH-DSA."},
{q:"What does TLS 1.3 remove?",o:["AEAD ciphers","Ephemeral key exchange","Static RSA key exchange","Certificates"],c:2,e:"RSA key transport was removed so every connection has forward secrecy."},
{q:"Crypto-shredding means:",o:["Overwriting disks 7 times","Destroying the key so encrypted data becomes unrecoverable","Hashing data","Rotating keys yearly"],c:1,e:"Deleting the encryption key renders ciphertext useless; useful for per-tenant deletion."}
]

TOPICS.push({
id:"network", n:5, title:"Network Security & Zero Trust", domain:"Infrastructure", week:3,
fw:"NIST SP 800-207 (Zero Trust) · CISA Zero Trust Maturity Model v2 · CIS Controls 12, 13",
simple:"Network security controls which systems can talk to which, and inspects that traffic for attacks. The old model was a castle with a moat: strong perimeter, trusted inside. That fails once an attacker gets in, or when users and apps live in the cloud and at home. Zero trust says: never trust a connection because of where it comes from; verify the user, the device and the context every time, and give access to one application, not the whole network.",
analogy:"Old model: an office building where your badge opens the front door and then every room. Zero trust: every room has its own reader that checks who you are, whether your laptop is healthy, and whether you need that room right now.",
why:"You will be asked to design segmentation, explain zero trust beyond buzzwords, compare VPN with ZTNA, protect against DDoS, and describe cloud networking controls (security groups vs NACLs, PrivateLink, egress control). Egress filtering and east-west visibility separate senior from principal answers.",
concepts:[
["OSI layers for security","L3/L4 firewalls (IP/port), L7 (WAF, API gateway, proxies). Most modern attacks are L7."],
["Stateful vs stateless firewall","Stateful tracks connections (return traffic allowed automatically, like AWS Security Groups). Stateless evaluates each packet (AWS NACLs need explicit return rules)."],
["NGFW","Next-generation firewall: app awareness, user identity, IPS, TLS inspection."],
["WAF","Web Application Firewall: L7 rules for OWASP attacks, bot control, rate-based rules."],
["IDS / IPS","Detect (passive) vs prevent (inline) intrusions using signatures and anomalies."],
["Segmentation","Separating networks by trust/function (prod vs dev, PCI zone). Microsegmentation goes down to workload level using identity-based policies."],
["Zero Trust (NIST 800-207)","Policy Engine decides, Policy Administrator establishes/ends the session, Policy Enforcement Point sits in the data path. Every access evaluated using identity, device, and context signals."],
["ZTNA","Zero Trust Network Access: brokered, per-application access instead of network-level VPN; apps are invisible to unauthenticated users."],
["SASE / SSE","SASE = network (SD-WAN) + security (SSE) delivered from cloud. SSE = SWG + CASB + ZTNA + FWaaS."],
["Egress control","Controlling outbound traffic stops data exfiltration and C2. Use proxies or DNS/domain allow-lists."],
["DNS security","DNSSEC (integrity of records), DNS filtering (block malicious domains), DNS logs to detect tunnelling and DGA."],
["DDoS","Volumetric (L3/4 floods), protocol (SYN flood), application (L7 HTTP floods). Mitigate with anycast CDN, scrubbing, rate limits, autoscaling."],
["Bastion vs session manager","Replace SSH bastions with identity-aware access (AWS SSM Session Manager) with no inbound ports and full logging."],
["TLS inspection","Decrypting traffic at a proxy to inspect it. Privacy, performance and certificate-pinning trade-offs."]
],
how:`<p><b>Zero trust in practice: the five pillars (CISA ZTMM):</b> Identity, Devices, Networks, Applications & Workloads, Data, plus cross-cutting visibility/analytics, automation/orchestration and governance. Maturity stages: Traditional → Initial → Advanced → Optimal.</p>
<p><b>A practical zero trust roadmap:</b></p>
<ol><li>Strong identity: SSO + phishing-resistant MFA for everything.</li>
<li>Device posture: MDM/EDR signals feed access decisions.</li>
<li>Replace VPN with ZTNA per application, starting with admin tools and third-party access.</li>
<li>Microsegment workloads with identity-based policies (service mesh, security groups referencing other groups).</li>
<li>Encrypt everything in transit, including east-west.</li>
<li>Continuous monitoring and adaptive policy (risk-based step-up).</li></ol>
<p><b>AWS network layering for a web app:</b></p>
<pre>Internet -> Route 53 -> CloudFront (+ AWS WAF, Shield Advanced)
  -> ALB in public subnets (SG: 443 from CloudFront prefix list only)
  -> App in private subnets (SG: allow from ALB SG only)
  -> RDS in isolated subnets (SG: 5432 from App SG only)
Egress: NAT GW -> AWS Network Firewall (domain allow-list) or no internet at all
AWS APIs: VPC endpoints (S3/DynamoDB gateway, others interface) with endpoint policies
Visibility: VPC Flow Logs, Route 53 Resolver query logs, Network Firewall logs</pre>
<p><b>Security Groups vs NACLs:</b> SGs are stateful, attached to ENIs, allow-only, and can reference other SGs (great for microsegmentation). NACLs are stateless, subnet-level, have allow and deny rules evaluated in order; use them as coarse guardrails (e.g. block a known-bad range).</p>`,
aws:[["Perimeter","CloudFront, AWS WAF (managed rules, Bot Control, rate-based rules), Shield Advanced"],["Segmentation","VPCs per account, Security Groups, NACLs, Transit Gateway route tables, VPC Lattice"],["Inspection","AWS Network Firewall (Suricata rules, TLS inspection), Gateway Load Balancer for 3rd-party appliances"],["Private access","VPC endpoints/PrivateLink with endpoint policies; RCPs with aws:SourceVpce conditions"],["DNS","Route 53 Resolver DNS Firewall, query logging"],["Zero-trust access","AWS Verified Access for apps; SSM Session Manager instead of SSH bastions"],["Visibility","VPC Flow Logs, Traffic Mirroring, GuardDuty"]],
cases:`<p><b>SolarWinds (2020):</b> backdoored updates beaconed to attacker domains over HTTPS. Organisations with strict egress allow-lists for servers could block or detect the C2. Lesson: servers rarely need open internet egress.</p>
<p><b>Ivanti / Citrix VPN exploitation (2023-2024):</b> repeated critical CVEs in internet-facing VPN appliances were exploited by nation-state and ransomware groups. This is a strong argument for ZTNA, reducing exposed appliances, and treating edge devices as crown jewels for patching and monitoring.</p>`,
mistakes:["Flat internal networks.","0.0.0.0/0 on SSH/RDP security groups.","Unrestricted egress from servers.","Believing ZTNA alone equals zero trust.","TLS inspection without handling of privacy and pinned apps.","No DNS logging."],
hook:"Deny by default, segment by blast radius, control egress, identity decides, log the flows.",
qs:[
{l:"basic",q:"Security Groups vs NACLs?",a:"Security groups are stateful, applied to network interfaces, support only allow rules, and can reference other security groups, which is ideal for tier-to-tier rules. NACLs are stateless, applied per subnet, support allow and deny, are evaluated in rule-number order, and require explicit return-traffic rules (ephemeral ports). I use SGs as the primary control and NACLs sparingly as coarse subnet-level guardrails.",t:"AWS fundamentals."},
{l:"basic",q:"What is zero trust in one minute?",a:"Zero trust removes implicit trust based on network location. Every request is authenticated and authorised using identity, device health and context, access is least-privilege and per-application, sessions are continuously evaluated, and we assume breach so we segment and monitor everything. NIST 800-207 describes it with a policy engine deciding and enforcement points in the data path. It is a strategy delivered over years, not a product.",t:"Can you cut through buzzwords?"},
{l:"advanced",q:"How would you replace a corporate VPN with ZTNA?",a:"(1) Inventory apps accessed via VPN and who uses them. (2) Integrate the ZTNA broker with the IdP and MDM/EDR for posture. (3) Migrate in waves: start with web apps and third-party/contractor access (highest risk, easiest win), then SSH/RDP via identity-aware proxies, then thick-client apps. (4) Define per-app policies based on groups and device posture. (5) Run in parallel, then shrink VPN to a small legacy population and finally remove it. Measure: apps migrated, VPN users remaining, reduced exposed attack surface. Watch for latency, legacy protocols and emergency access needs.",t:"Migration planning."},
{l:"advanced",q:"How do you prevent data exfiltration from a VPC?",a:"Layered: (1) no direct internet egress for workloads; route through NAT + AWS Network Firewall with domain allow-lists (or a proxy), or no egress at all; (2) VPC endpoints for AWS services with endpoint policies allowing only our buckets/accounts, and RCPs/SCPs restricting S3 access to our organisation (aws:ResourceOrgID, aws:PrincipalOrgID) to block copying data to an attacker's bucket; (3) DNS Firewall to block tunnelling and unknown domains; (4) Macie and DLP on sensitive data; (5) detection with GuardDuty (exfiltration findings), Flow Logs anomalies and CloudTrail data events on sensitive buckets. The data perimeter concept is: trusted identities, accessing trusted resources, from expected networks.",t:"AWS data perimeter depth."},
{l:"scenario",q:"Your public site is under a large L7 DDoS. What do you do?",a:"Immediately: confirm with metrics that it is an attack not a traffic spike; engage Shield Response Team if we have Shield Advanced; tighten WAF: rate-based rules per IP and per session, block or challenge (CAPTCHA/JS challenge) suspicious geos, ASNs, user agents; enable Bot Control; serve cached content from CloudFront; scale origin and protect it so it only accepts traffic from CloudFront; turn off expensive endpoints like search if needed. After: review, pre-build runbooks and WAF rule sets, load test, and ensure the origin is never directly reachable.",t:"Incident handling and layered DDoS thinking."},
{l:"design",q:"Design network segmentation for a PCI cardholder data environment in AWS.",a:"Put the CDE in dedicated AWS accounts (strongest boundary and clear audit scope) within its own OU with strict SCPs. Private subnets only, no internet ingress except via the WAF/ALB path for the payment API. Security groups allowing only named services; connectivity to non-CDE through PrivateLink with explicit endpoint services rather than VPC peering. Egress via Network Firewall with an allow-list (payment processors only). Admin access via SSM Session Manager with MFA and recording. Logging to a separate security account, retained 1 year (3 months immediately available). Tokenise card numbers at entry so most systems never touch PAN, shrinking scope. Quarterly segmentation testing (every 6 months for service providers) to prove isolation.",t:"Regulatory design with scope reduction."}
],
quiz:[
{q:"AWS Security Groups are:",o:["Stateless, allow and deny","Stateful, allow only","Stateless, allow only","Stateful, deny only"],c:1,e:"SGs are stateful and support only allow rules."},
{q:"In NIST 800-207, the component that makes the access decision is the:",o:["Policy Enforcement Point","Policy Engine","Policy Information Point","Gateway"],c:1,e:"The Policy Engine decides; the Administrator executes; the PEP enforces."},
{q:"SSE (Security Service Edge) includes:",o:["SD-WAN","SWG, CASB, ZTNA, FWaaS","Only VPN","SIEM and SOAR"],c:1,e:"SSE is the security half of SASE."},
{q:"Best control to stop copying S3 data to an attacker-owned bucket from your VPC:",o:["NACL","VPC endpoint policy restricting to your org's resources","Shield","Inspector"],c:1,e:"Endpoint policies (and RCP/SCP org conditions) enforce the data perimeter."}
]

TOPICS.push({
id:"cloud", n:6, title:"Cloud Security (AWS)", domain:"Infrastructure", week:3,
fw:"AWS Well-Architected Security Pillar · AWS Security Reference Architecture (SRA) · CIS AWS Foundations Benchmark · CSA CCM",
simple:"In the cloud, the provider secures the physical data centres and the hypervisor; you secure what you put on it: identities, configurations, data, networks, and code. Most cloud breaches are not clever hacks. They are misconfigurations and stolen credentials. Cloud security is mainly about <b>guardrails at scale</b>: making the wrong thing impossible and the right thing easy, across hundreds of accounts.",
analogy:"Renting an apartment in a well-guarded building. The landlord secures the building entrance, lifts and walls (AWS). You still must lock your own door, not leave keys under the mat, and not invite strangers in (your IAM and configuration).",
why:"With an AWS focus, expect deep questions on multi-account strategy, SCPs vs RCPs vs permission boundaries, data perimeters, logging architecture, detecting compromised credentials, and incident response in AWS. Principal-level answers talk about the landing zone as a product with paved roads.",
concepts:[
["Shared responsibility","AWS: security OF the cloud. Customer: security IN the cloud. Moves toward AWS for managed/serverless services."],
["Landing zone","Pre-built, governed multi-account environment (AWS Control Tower or custom) with identity, logging, networking and guardrails."],
["Multi-account strategy","Accounts are the strongest isolation boundary. OUs: Security, Infrastructure, Workloads (Prod/Non-prod), Sandbox, Suspended, Policy Staging."],
["SCP","Service Control Policy: maximum permissions for principals in accounts. Does not grant; affects all principals except the management account."],
["RCP","Resource Control Policy (Nov 2024): maximum permissions on resources (S3, STS, KMS, SQS, Secrets Manager) regardless of who calls. Key for data perimeters."],
["Permission boundary","Maximum permissions for a specific IAM role/user; used to let teams create roles safely."],
["Policy evaluation","Explicit deny wins → SCP/RCP must allow → resource policy → identity policy → permission boundary → session policy. Default is deny."],
["Data perimeter","Only trusted identities, accessing trusted resources, from expected networks. Built with SCPs, RCPs, VPC endpoint policies."],
["CSPM","Cloud Security Posture Management: detects misconfigurations (AWS Security Hub CSPM, Wiz, Prisma)."],
["CWPP","Cloud Workload Protection: runtime protection for VMs/containers/serverless."],
["CIEM","Cloud Infrastructure Entitlement Management: right-sizing permissions."],
["CNAPP","Converged platform: CSPM + CWPP + CIEM + IaC scanning + attack path analysis."],
["IMDSv2","Instance metadata requires a session token obtained via PUT; blocks most SSRF credential theft. Enforce by default."],
["Detective guardrails","AWS Config rules, Security Hub controls, GuardDuty, flagging drift after the fact."],
["Preventive guardrails","SCPs/RCPs, IaC policy checks, declarative policies (e.g. block public AMI sharing), which stop problems before they exist."]
],
how:`<p><b>AWS Security Reference Architecture, simplified:</b></p>
<pre>Management account (billing, Organizations, nothing else runs here)
 ├─ Security OU
 │   ├─ Security Tooling account (delegated admin: GuardDuty, Security Hub,
 │   │                            Inspector, Macie, Detective, Access Analyzer)
 │   └─ Log Archive account (org CloudTrail, Config, Flow Logs; S3 Object Lock)
 ├─ Infrastructure OU  (network hub: Transit GW, egress, Network Firewall, DNS)
 ├─ Workloads OU  ─ Prod / Non-prod (one account per app per env)
 ├─ Sandbox OU (tight budget, no connectivity to prod)
 └─ Suspended OU (deny-all SCP for decommissioned accounts)</pre>
<p><b>Must-have organisation guardrails (SCP examples):</b> deny leaving the organisation; deny disabling CloudTrail/GuardDuty/Config; deny actions outside approved regions; deny creating IAM users/access keys; deny root user actions; require IMDSv2; deny unencrypted resources where possible. <b>RCP examples:</b> deny access to S3/KMS/Secrets from principals outside our organisation; enforce TLS; restrict STS AssumeRole to org principals (confused deputy protection).</p>
<p><b>Logging architecture:</b> organisation CloudTrail (management events + selected data events like S3 on sensitive buckets and Lambda invoke) to the Log Archive account with Object Lock; Config aggregator; VPC Flow Logs; Route 53 query logs; EKS audit logs; ALB/WAF logs; everything normalised into Amazon Security Lake (OCSF) and/or the SIEM.</p>
<p><b>Top AWS attack paths to know:</b> leaked access keys in GitHub → enumerate → escalate via iam:PassRole or CreatePolicyVersion; SSRF → IMDSv1 → role creds; public S3/snapshots/AMIs; overly trusting role trust policies (Principal "*" or missing ExternalId); Lambda environment variable secrets; cross-account confused deputy; compromised CI/CD role with admin.</p>`,
aws:[["Governance","AWS Organizations, Control Tower, SCPs, RCPs, declarative policies, tag policies"],["Posture","Security Hub CSPM (FSBP, CIS), AWS Config, conformance packs, Trusted Advisor"],["Threat detection","GuardDuty (incl. S3, EKS, Runtime, Malware Protection, RDS, Lambda, Extended Threat Detection)"],["Vulnerabilities","Amazon Inspector (EC2, ECR, Lambda, code scanning)"],["Investigation","Amazon Detective, CloudTrail Lake, Security Lake + Athena"],["Data","Macie, KMS, S3 Block Public Access, Object Lock, AWS Backup Vault Lock"]],
cases:`<p><b>Leaked key scenario (very common):</b> a developer commits an access key to a public repo. Within minutes bots find it and launch crypto-mining EC2 instances in every region. Controls that stop or limit it: no IAM users at all (SCP deny iam:CreateAccessKey), region deny SCP, GuardDuty CryptoCurrency and UnauthorizedAccess findings, AWS automatic quarantine policy for exposed keys, budget alarms, and secret scanning in the repo (push protection).</p>
<p><b>Uber (2016):</b> attackers found AWS keys in a private GitHub repo and downloaded rider/driver data from S3; the concealment led to criminal charges for the CSO. Lessons: secrets management, MFA on source control, and honest breach disclosure.</p>`,
mistakes:["Everything in one AWS account.","Workloads running in the management account.","Relying only on detective controls.","CloudTrail logs stored in the same account an attacker controls.","Wildcard trust policies and missing ExternalId for third parties.","IAM users with long-lived keys.","Security Hub findings nobody owns."],
hook:"Accounts isolate, SCPs cap principals, RCPs cap resources, logs go to a vault account, GuardDuty watches, IaC prevents.",
qs:[
{l:"basic",q:"Explain the AWS shared responsibility model with EC2 vs Lambda.",a:"AWS is responsible for security of the cloud: facilities, hardware, network, hypervisor. For <b>EC2</b> (IaaS) the customer handles the guest OS patching, host firewall, agents, application, IAM, data and network configuration. For <b>Lambda</b> (serverless) AWS also manages the OS and runtime patching; the customer still owns the code, dependencies, IAM execution role, event source configuration, secrets and data. The line moves up as services become more managed, but identity, data and configuration always stay with the customer.",t:"Baseline cloud understanding."},
{l:"basic",q:"SCP vs RCP vs permission boundary vs IAM policy?",a:"<b>IAM identity policy</b> grants permissions to a user/role. <b>Permission boundary</b> caps what a specific role can ever get, used for delegated role creation. <b>SCP</b> caps what principals in an account/OU can do, applied from Organizations (not the management account). <b>RCP</b> caps what can be done to resources in an account (S3, KMS, STS, SQS, Secrets Manager and more), no matter who calls, even external principals. None of the caps grant anything; an action must be allowed by the grant and not blocked by any cap, and an explicit deny anywhere wins.",t:"Policy evaluation, a favourite AWS question."},
{l:"advanced",q:"How do you build a data perimeter on AWS?",a:"Three statements: only <b>trusted identities</b> (our org principals and trusted AWS services), accessing <b>trusted resources</b> (our org's resources), from <b>expected networks</b> (our VPCs, corporate IPs). Implementation: SCPs on principals denying access to resources not in our org (aws:ResourceOrgID) with exceptions for AWS-owned resources; RCPs on resources denying principals outside our org (aws:PrincipalOrgID) with service-principal exceptions; VPC endpoint policies restricting to our org's resources; conditions like aws:SourceVpce / aws:SourceIp for sensitive data; roll out in stages with IAM Access Analyzer and CloudTrail analysis to find legitimate external access first. This defends against stolen credentials used from outside and exfiltration to attacker accounts.",t:"Advanced AWS security architecture."},
{l:"advanced",q:"How do you design the logging and detection layer for 400 AWS accounts?",a:"Organisation trail to a dedicated Log Archive account with S3 Object Lock and KMS key restricted to security; Config recorder and aggregator in all accounts/regions; GuardDuty, Security Hub CSPM, Inspector and Macie enabled org-wide with a delegated admin in the Security Tooling account and auto-enable for new accounts; Security Lake normalising CloudTrail, VPC Flow, Route 53, EKS audit, and findings into OCSF, feeding the SIEM; EventBridge routing high-severity findings to automation and on-call. Governance: every account has an owner tag; findings route to owning teams with SLAs; detections as code. Cost control via selective data events and tiered retention.",t:"Scale and operating model."},
{l:"scenario",q:"GuardDuty alerts: an EC2 instance role's credentials are being used from an external IP. Walk me through response.",a:"This is 'InstanceCredentialExfiltration.OutsideAWS'. (1) <b>Triage:</b> confirm the IP, what API calls were made (CloudTrail by access key ID), time window. (2) <b>Contain credentials:</b> attach a deny-all inline policy with a condition revoking sessions issued before now (the 'Revoke active sessions' feature on the role), which invalidates stolen temporary credentials without breaking new ones. (3) <b>Contain host:</b> isolate the instance with a forensic security group, snapshot EBS volumes, capture memory if possible, keep it running for evidence. (4) <b>Scope:</b> check what the attacker did: new IAM entities, data access, persistence (new keys, Lambda, roles). (5) <b>Root cause:</b> likely SSRF on IMDSv1 or RCE on the host; enforce IMDSv2, patch. (6) <b>Eradicate and recover:</b> rebuild from a clean AMI, rotate any secrets the role could read. (7) <b>Lessons learned:</b> hop-limit for IMDS, least-privilege role, detection tuning.",t:"Hands-on AWS IR, a very common question."},
{l:"scenario",q:"A business unit wants to use a third-party SaaS that needs access to our AWS account. How do you set it up securely?",a:"Cross-account IAM role in a limited account, trust policy restricted to the vendor's AWS account ID and requiring a unique ExternalId per customer (prevents confused deputy), least-privilege permissions scoped to specific resources (ideally read-only), permission boundary, monitoring of role use via CloudTrail with alerts on unusual actions, periodic review. Plus vendor risk assessment (SOC 2, data handling), contract terms for breach notification, and a documented offboarding step to delete the role.",t:"Third-party access pattern."},
{l:"design",q:"Design an AWS landing zone for a company moving 200 applications to the cloud.",a:"<b>Structure:</b> Control Tower (or Terraform-based custom LZ) with OUs: Security (Log Archive, Security Tooling), Infrastructure (network hub, shared services), Workloads (Prod, Non-prod), Sandbox, Suspended, Policy Staging. <b>Account vending:</b> automated (Account Factory for Terraform) with baseline: IAM Identity Center permission sets, VPC from IPAM, logging, security services, budgets, owner tags. <b>Identity:</b> Identity Center + corporate IdP, no IAM users, break-glass roles. <b>Network:</b> Transit Gateway hub-and-spoke, centralised egress and inspection, VPC endpoints, DNS Firewall. <b>Guardrails:</b> SCPs, RCPs, declarative policies, Config rules; IaC scanning in pipelines as preventive checks. <b>Detection:</b> org-wide GuardDuty, Security Hub CSPM, Security Lake → SIEM. <b>Data:</b> KMS CMKs per workload, backup policies with vault lock. <b>Operating model:</b> platform team owns LZ as a product with a roadmap, golden IaC modules, and docs; guardrail exceptions through a documented process with expiry.",t:"The single most likely AWS architecture question."}
],
quiz:[
{q:"Which policy type can restrict access to your S3 buckets by principals outside your organisation?",o:["SCP","RCP","Permission boundary","Session policy"],c:1,e:"RCPs apply to resources regardless of the caller, including external principals."},
{q:"SCPs do NOT affect:",o:["Member account root user","Principals in the management account","Service-linked roles only","IAM users"],c:1,e:"SCPs do not apply to the management account (and do not restrict service-linked roles)."},
{q:"Where should the organisation CloudTrail logs be stored?",o:["Each workload account","Management account","A dedicated Log Archive account with Object Lock","Developer laptops"],c:2,e:"A separate, locked-down account prevents attackers from tampering with logs."},
{q:"IMDSv2 mitigates SSRF because it:",o:["Encrypts metadata","Requires a PUT to get a session token","Uses mTLS","Blocks all HTTP"],c:1,e:"Most SSRF only allows GET; the PUT token requirement and hop limit block it."}
]
});

TOPICS.push({
id:"k8s", n:7, title:"Containers & Kubernetes Security", domain:"Infrastructure", week:4,
fw:"CIS Kubernetes/EKS Benchmark · NSA/CISA Kubernetes Hardening Guide · NIST SP 800-190 · Pod Security Standards",
simple:"Containers package an app with its dependencies; Kubernetes runs thousands of them. Security covers four layers (the '4 Cs'): <b>Cloud</b> (the account and nodes), <b>Cluster</b> (API server, RBAC, admission control), <b>Container</b> (image and runtime settings), and <b>Code</b>. A container is not a strong security boundary by default because containers share the host kernel.",
analogy:"Containers are like apartments in one building sharing the same foundation and plumbing (the kernel). A crack in the shared foundation affects everyone. Virtual machines are separate houses.",
why:"Most modern platforms run on Kubernetes. Expect questions on securing EKS, pod security, RBAC, secrets, image supply chain, runtime detection and multi-tenancy.",
concepts:[
["Image security","Minimal base images (distroless), no secrets in layers, pinned by digest, scanned for CVEs, signed (cosign)."],
["Pod Security Standards","Privileged, Baseline, Restricted profiles, enforced by the built-in Pod Security Admission per namespace."],
["securityContext","runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation: false, drop ALL capabilities, seccomp RuntimeDefault."],
["Admission control","Validating/mutating webhooks (OPA Gatekeeper, Kyverno) or ValidatingAdmissionPolicy (CEL) enforce policy at deploy time."],
["Kubernetes RBAC","Role/ClusterRole + RoleBinding/ClusterRoleBinding. Avoid cluster-admin, wildcard verbs, and permissions on secrets, pods/exec, and escalate/bind."],
["NetworkPolicy","Default deny ingress/egress per namespace, then allow specific flows. Needs a CNI that enforces it."],
["Secrets","Kubernetes Secrets are only base64 by default; enable envelope encryption with KMS, or use External Secrets / Secrets Store CSI driver."],
["Service mesh","Istio/Linkerd: mTLS between pods, identity-based authorisation, traffic policy."],
["Runtime security","eBPF-based detection (Falco, GuardDuty Runtime Monitoring): shell in container, crypto-miners, unexpected network, privilege escalation."],
["Container escape","Via privileged pods, hostPath mounts, hostPID/hostNetwork, docker.sock mounts, kernel CVEs."],
["Multi-tenancy","Soft (namespaces + policies) vs hard (separate clusters or sandboxed runtimes like gVisor, Kata, Firecracker)."],
["Node security","Minimal OS (Bottlerocket), automatic patching, IMDSv2 with hop limit 1 so pods cannot steal node role credentials."]
],
how:`<p><b>Securing an EKS cluster: checklist</b></p>
<ol><li><b>Control plane:</b> private API endpoint (or restricted CIDRs); audit logs enabled; access via EKS access entries/IAM Identity Center, not the aws-auth ConfigMap.</li>
<li><b>Identity:</b> EKS Pod Identity or IRSA per service account; block pod access to node IMDS (hop limit 1).</li>
<li><b>Admission:</b> PSA 'restricted' by default; Kyverno/Gatekeeper to require signed images from our registry, resource limits, no privileged, no hostPath.</li>
<li><b>Network:</b> default-deny NetworkPolicies; security groups for pods for sensitive workloads; egress control.</li>
<li><b>Secrets:</b> KMS envelope encryption for etcd secrets; better, fetch from Secrets Manager via the CSI driver.</li>
<li><b>Supply chain:</b> images built in CI, scanned by Inspector/Trivy, signed, SBOM attached; admission verifies signature.</li>
<li><b>Runtime:</b> GuardDuty EKS Protection and Runtime Monitoring or Falco; alerts to SOC.</li>
<li><b>Nodes:</b> managed node groups or Fargate/Karpenter with Bottlerocket; frequent AMI refresh.</li></ol>
<p><b>Dangerous RBAC permissions to call out:</b> create pods (can mount any secret/SA in namespace), pods/exec, get/list secrets, escalate, bind, impersonate, nodes/proxy, and anything cluster-wide.</p>`,
aws:[["Cluster","Amazon EKS, EKS access entries, EKS Pod Identity, IRSA"],["Images","Amazon ECR with enhanced scanning (Inspector), signing via AWS Signer / Notation or cosign"],["Runtime","GuardDuty EKS Audit Log Monitoring and Runtime Monitoring"],["Secrets","Secrets Store CSI driver + Secrets Manager, KMS envelope encryption"],["Nodes","Bottlerocket, Fargate for stronger isolation"]],
cases:`<p><b>Tesla (2018):</b> an unauthenticated Kubernetes dashboard exposed cloud credentials used for crypto-mining. <b>Lessons:</b> never expose management UIs; authentication on everything; monitor for mining.</p>
<p><b>Common real finding:</b> a pod with hostPath '/' and privileged: true in a CI namespace allowed full node takeover and theft of every secret on the node. Admission policies would have blocked the manifest.</p>`,
mistakes:["Running as root and privileged.","Kubernetes Secrets assumed encrypted.","No NetworkPolicies (flat pod network).","Everyone gets cluster-admin.","Images with :latest tag and no scanning.","Pods able to reach node IMDS."],
hook:"Small signed images, restricted pods, least RBAC, default-deny network, secrets from a vault, eBPF watching.",
qs:[
{l:"basic",q:"How would you harden a pod spec?",a:"securityContext with runAsNonRoot: true and a fixed UID, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities drop ALL (add back only what is needed), seccompProfile RuntimeDefault; no privileged, hostNetwork, hostPID or hostPath; resource requests/limits; dedicated service account with automountServiceAccountToken false unless needed; image pinned by digest from our registry. Enforce all this with Pod Security Admission 'restricted' plus a policy engine.",t:"Practical hardening."},
{l:"advanced",q:"How do you secure secrets in Kubernetes?",a:"Kubernetes Secrets are base64-encoded and stored in etcd; anyone with get/list secrets or create-pod in the namespace can read them. Steps: enable etcd envelope encryption with KMS; restrict RBAC on secrets; better, keep secrets in an external manager (AWS Secrets Manager / Vault) and inject at runtime via the Secrets Store CSI driver or External Secrets Operator using the pod's workload identity; prefer short-lived dynamic credentials (Vault database secrets, IAM auth for RDS) so there is little to steal; never bake secrets into images or env vars in manifests in Git (use sealed secrets or SOPS if GitOps).",t:"Common gap in real clusters."},
{l:"advanced",q:"How do you achieve multi-tenancy in Kubernetes for untrusted customer code?",a:"Namespaces with RBAC, quotas and NetworkPolicies are only soft multi-tenancy because tenants share the kernel. For untrusted code I would use hard isolation: separate clusters or node pools per tenant, or sandboxed runtimes (gVisor, Kata Containers, Firecracker microVMs such as Fargate) via RuntimeClass; dedicated nodes with taints; no shared service accounts; egress restrictions; per-tenant KMS keys; and strict admission policies. The choice depends on cost versus the level of hostility of the tenant code.",t:"Isolation trade-offs."},
{l:"scenario",q:"Runtime alert: a shell was spawned inside a production payments container. What do you do?",a:"Treat it as a potential compromise. Capture evidence first: pod spec, image digest, process tree, network connections, runtime alert details; snapshot the node volume if possible. Contain: apply a NetworkPolicy isolating the pod (label it and deny all), cordon the node, do not delete the pod until evidence is captured. Scope: check if it was a legitimate kubectl exec by an engineer (audit logs), what the process did, whether service account tokens or cloud credentials were accessed, and whether other pods on the node are affected. Eradicate: redeploy from a known-good image, rotate secrets available to the pod, fix the entry vector (app RCE, exposed debug endpoint). Improve: block exec in prod via RBAC/admission, readOnly filesystem, distroless images without shells.",t:"Container IR."},
{l:"design",q:"Design a secure EKS platform for 50 product teams.",a:"Platform team provides clusters as a product: separate clusters per environment (and per sensitivity tier such as PCI), teams get namespaces through a self-service GitOps workflow that creates the namespace with RBAC tied to IdP groups, quotas, default-deny NetworkPolicies, and a Pod Identity association. Guardrails: PSA restricted, Kyverno policies (signed images from ECR only, no :latest, limits required, no privileged), CI pipeline templates doing scanning, SBOM and signing. Service mesh for mTLS and service authZ. Secrets via CSI driver. Observability and runtime detection via GuardDuty Runtime Monitoring feeding the SOC. Node lifecycle automated with Karpenter and Bottlerocket. Exceptions via policy exemptions with expiry. Metrics: policy violations blocked, critical CVEs in running images, mean time to patch base images.",t:"Platform thinking."}
],
quiz:[
{q:"Kubernetes Secrets by default in etcd are:",o:["AES encrypted","Base64 encoded only","Hashed","Stored in KMS"],c:1,e:"Enable encryption at rest (KMS provider) explicitly."},
{q:"Which RBAC permission effectively grants access to all secrets in a namespace?",o:["get configmaps","create pods","list services","watch events"],c:1,e:"Creating a pod lets you mount any secret or service account in that namespace."},
{q:"Pod Security Standards profiles are:",o:["Low, Medium, High","Privileged, Baseline, Restricted","Open, Closed","Dev, Prod"],c:1,e:"Enforced by Pod Security Admission per namespace."},
{q:"Strongest isolation for untrusted tenant code:",o:["Separate namespaces","NetworkPolicy","MicroVM/sandboxed runtime or separate clusters","Resource quotas"],c:2,e:"Namespaces share the kernel; microVMs or separate clusters give hard isolation."}
]
});

TOPICS.push({
id:"appsec", n:8, title:"Application & API Security", domain:"Application", week:4,
fw:"OWASP Top 10:2025 · OWASP API Security Top 10 (2023) · OWASP ASVS 5.0 · OWASP SAMM",
simple:"Application security is making sure the software we write cannot be tricked into doing something harmful: showing someone else's data, running an attacker's commands, or letting people skip payment. Most serious app bugs come from two root causes: <b>trusting input</b> and <b>missing authorisation checks</b>.",
analogy:"A bank teller who follows any note handed over the counter ('please give this person the money') without checking whose account it is, is an app with broken access control. A teller who reads a note aloud to the vault robot, which obeys anything it hears, is injection.",
why:"Principal engineers are expected to know OWASP deeply, explain root causes and systemic fixes (frameworks, paved roads) rather than per-bug fixes, and design API security at scale. The 2025 OWASP list is new, so knowing it signals currency.",
concepts:[
["OWASP Top 10:2025","A01 Broken Access Control (now includes SSRF), A02 Security Misconfiguration, A03 Software Supply Chain Failures (new), A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08 Software or Data Integrity Failures, A09 Logging & Alerting Failures, A10 Mishandling of Exceptional Conditions (new)."],
["OWASP API Top 10 (2023)","API1 BOLA, API2 Broken Authentication, API3 Broken Object Property Level Authorization, API4 Unrestricted Resource Consumption, API5 BFLA, API6 Unrestricted Access to Sensitive Business Flows, API7 SSRF, API8 Security Misconfiguration, API9 Improper Inventory Management, API10 Unsafe Consumption of APIs."],
["BOLA / IDOR","Changing an ID in a request (GET /orders/1002) returns another user's data because the server does not check ownership. The number one API risk."],
["BFLA","Broken Function Level Authorization: normal user can call admin functions (DELETE /users)."],
["Mass assignment","Client sends extra fields (isAdmin=true) that the server binds to the model. Use allow-listed DTOs."],
["Injection","SQL, NoSQL, OS command, LDAP, template injection. Fix: parameterised queries, safe APIs, contextual encoding."],
["XSS","Stored, reflected, DOM-based. Fix: output encoding by context, frameworks that auto-escape, Content Security Policy, HttpOnly cookies."],
["CSRF","Browser sends a cookie automatically to a forged request. Fix: SameSite cookies, anti-CSRF tokens, checking Origin."],
["SSRF","Server fetches an attacker-supplied URL, reaching internal services or cloud metadata. Fix: allow-lists, block internal ranges after DNS resolution, IMDSv2, egress control."],
["Deserialisation","Untrusted serialised objects causing RCE (Java, .NET, Python pickle). Avoid native deserialisation of untrusted data."],
["SAST / DAST / IAST / SCA","Static code analysis / dynamic scanning of running app / instrumented runtime analysis / third-party dependency analysis."],
["Secure SDLC","Security requirements, threat modelling, secure coding standards, code review, testing, release gates, monitoring."],
["ASVS","Application Security Verification Standard: levels L1-L3 of verifiable requirements. Version 5.0 released 2025."],
["Security headers","CSP, HSTS, X-Content-Type-Options, frame-ancestors, Referrer-Policy."]
],
how:`<p><b>Systemic fixes beat individual bug fixes:</b></p>
<table><tr><th>Bug class</th><th>Systemic fix (paved road)</th></tr>
<tr><td>SQL injection</td><td>ORM / query builder only; lint rule banning string-built SQL</td></tr>
<tr><td>XSS</td><td>Auto-escaping framework (React, templates), strict CSP with nonces, Trusted Types</td></tr>
<tr><td>BOLA/IDOR</td><td>Central authorisation library; data access layer that always scopes queries by tenant/user; random UUIDs as a minor extra</td></tr>
<tr><td>Secrets in code</td><td>Secret scanning with push protection; secrets manager SDK</td></tr>
<tr><td>SSRF</td><td>Shared hardened HTTP client with allow-lists; egress proxy</td></tr>
<tr><td>Weak auth</td><td>One identity service; no team builds login</td></tr></table>
<p><b>API security architecture:</b></p>
<pre>Client -> CDN/WAF (bots, rate limits, OWASP rules)
  -> API Gateway: authN (JWT validation), coarse scopes, quotas, schema validation
  -> Service: object-level and property-level authZ, business logic limits
  -> Data layer: tenant-scoped queries, row-level security
Plus: API inventory and discovery (shadow/zombie APIs), spec-first (OpenAPI),
      contract testing, logging of authZ decisions</pre>
<p><b>Application security program (what a Principal builds):</b> security champions, secure design reviews, paved roads, tooling in CI with low false positives (tune before you block), bug bounty, vulnerability SLAs by severity, and metrics (mean time to remediate, % repos with scanning, recurring bug classes trending down). OWASP SAMM measures maturity.</p>`,
aws:[["Edge","AWS WAF managed rules (Core, Known Bad Inputs, SQLi), Bot Control, Fraud Control (ATP/ACFP)"],["API","API Gateway (authorisers, usage plans, request validation), AppSync"],["Authorisation","Amazon Verified Permissions (Cedar)"],["Scanning","Amazon Inspector code scanning, CodeGuru Security, third-party SAST/SCA in pipelines"]],
cases:`<p><b>Optus (2022):</b> an unauthenticated API endpoint returned customer records by incrementing IDs, exposing about 10 million customers. <b>Lesson:</b> API inventory, authentication by default, and BOLA checks.</p>
<p><b>MOVEit (2023):</b> SQL injection in a file transfer product was exploited by Cl0p to steal data from thousands of organisations. <b>Lessons:</b> injection still matters; third-party software is your attack surface; exposed file transfer systems are high-value targets.</p>
<p><b>Log4Shell (2021):</b> JNDI lookup in a logging library enabled RCE across the internet. Lessons: SBOM to find where it is used, egress control to block the LDAP callback, and fast patch pipelines.</p>`,
mistakes:["Relying on the WAF instead of fixing code.","Checking authorisation only in the UI or gateway.","Scanning tools blocking builds with high false-positive rates, so teams disable them.","No API inventory.","Verbose error messages and stack traces in production.","Treating rate limiting as optional."],
hook:"Never trust input, always check ownership, fix bug classes with paved roads.",
qs:[
{l:"basic",q:"What is new in the OWASP Top 10:2025?",a:"Two new categories: <b>A03 Software Supply Chain Failures</b> (expanding the old 'vulnerable and outdated components' to the whole build and dependency chain) and <b>A10 Mishandling of Exceptional Conditions</b> (errors, fail-open logic, unhandled exceptions). SSRF was merged into A01 Broken Access Control. Security Misconfiguration rose to A02; Cryptographic Failures moved to A04, Injection to A05 and Insecure Design to A06. Broken Access Control remains number one.",t:"Currency."},
{l:"basic",q:"Explain BOLA and how to prevent it at scale.",a:"Broken Object Level Authorization: an API uses an object ID from the client and returns or modifies the object without verifying the caller is allowed to access it. Prevention at scale: authorisation enforced in the service for every object access using a shared library or policy service; data access layer that automatically scopes queries by tenant and user (e.g. repository methods that require a principal); row-level security in the database as defence in depth; automated tests that call endpoints with another user's IDs; and API security testing in CI. Random UUIDs help against guessing but are not access control.",t:"The most important API risk."},
{l:"basic",q:"How do you prevent XSS in a modern web application?",a:"Use a framework with automatic contextual output encoding (React, Angular) and avoid escape hatches like dangerouslySetInnerHTML; sanitise any HTML you must render with a vetted library (DOMPurify); a strict Content Security Policy with nonces or hashes and no unsafe-inline; Trusted Types to stop DOM XSS sinks; HttpOnly and SameSite cookies so stolen script cannot read session cookies; and input validation as an extra layer. Also keep tokens out of localStorage.",t:"Layered front-end defence."},
{l:"advanced",q:"How would you prevent SSRF in a feature that fetches user-supplied URLs (e.g. webhook or link preview)?",a:"(1) Allow-list schemes (https only) and, where possible, domains. (2) Resolve DNS and validate the resulting IP is not private, loopback, link-local (169.254.0.0/16 including IMDS), or IPv6 equivalents; then connect to that validated IP to avoid DNS rebinding. (3) Disable redirects or revalidate every hop. (4) Run the fetcher in an isolated network segment/Lambda with no access to internal services and no IAM permissions, egress only via a proxy. (5) IMDSv2 everywhere. (6) Timeouts and size limits; do not return raw responses to the user. (7) Log and alert on blocked attempts.",t:"Deep, layered answer."},
{l:"advanced",q:"How do you run an AppSec program across 100 teams with 5 AppSec engineers?",a:"Leverage over labour: (1) paved roads that remove bug classes (auth service, ORM, hardened HTTP client, secure templates); (2) automated scanning (SAST, SCA, secrets, IaC) in CI tuned to high-confidence rules, with results in the developer's pull request; (3) security champions in each team with training and a community; (4) risk-tiered design review so experts spend time only on high-risk changes; (5) bug bounty for external validation; (6) vulnerability SLAs and dashboards per team; (7) OWASP SAMM to measure maturity yearly. My job as principal is to make the secure way the default and measure outcomes like recurring vulnerability classes going down.",t:"Program design and leverage."},
{l:"scenario",q:"A pen test found 40 high-severity findings the week before launch. What do you do?",a:"Triage with the team: validate findings, remove duplicates and false positives, group by root cause (often 40 findings are 5 root causes). Rate by real exploitability and business impact. Agree with the product owner: must-fix before launch (anything exploitable remotely without auth, data exposure, auth bypass), fix-soon with compensating controls (WAF virtual patching, feature flag off, extra monitoring), and accepted risks documented with an owner and date. Then address systemic causes so the next test is cleaner: add the bug classes to scanning and paved roads. I would not block launch on principle alone, nor let it launch with a known critical.",t:"Risk-based decision-making under pressure."},
{l:"design",q:"Design security for a public API platform used by 3rd-party developers.",a:"<b>Onboarding:</b> developer portal, verified organisations, API keys only for identifying the app, OAuth 2.0 client credentials (private_key_jwt) or auth code for user-delegated access, scopes per product. <b>Edge:</b> CDN + WAF, bot management, per-client and per-endpoint rate limits and quotas. <b>Gateway:</b> token validation, schema validation against OpenAPI, payload size limits. <b>Services:</b> object and property-level authZ, business-flow limits (e.g. max refunds/day). <b>Data:</b> minimise fields per scope. <b>Operations:</b> API inventory and versioning with deprecation of old versions, anomaly detection per client, key rotation, revocation, audit logs available to customers. <b>Assurance:</b> API security testing in CI, bug bounty, contract testing.",t:"End-to-end API platform design."}
],
quiz:[
{q:"In OWASP Top 10:2025, SSRF is now part of:",o:["A05 Injection","A01 Broken Access Control","A02 Security Misconfiguration","It was removed"],c:1,e:"SSRF was merged into A01 Broken Access Control."},
{q:"API1:2023 in the OWASP API Top 10 is:",o:["Injection","BOLA","Rate limiting","Excessive data exposure"],c:1,e:"Broken Object Level Authorization is API1."},
{q:"Best primary defence against SQL injection:",o:["WAF","Input length limits","Parameterised queries","Encrypting the database"],c:2,e:"Parameterised queries separate code from data."},
{q:"SameSite cookies mainly protect against:",o:["XSS","CSRF","SQLi","SSRF"],c:1,e:"SameSite stops browsers sending cookies on most cross-site requests."}
]
});

TOPICS.push({
id:"devsecops", n:9, title:"DevSecOps & Software Supply Chain", domain:"Application", week:4,
fw:"SLSA v1.x · NIST SSDF (SP 800-218) · OpenSSF Scorecard · CISA SBOM guidance · EU Cyber Resilience Act",
simple:"Your software is built from your code plus thousands of open-source packages, build tools, container images and CI/CD systems. An attacker who poisons any of these can reach every customer at once. Supply chain security makes sure that what runs in production is exactly what your developers wrote and reviewed, built by a trusted pipeline, from trusted ingredients.",
analogy:"A restaurant must trust its farmers (dependencies), its kitchen (build system), its delivery drivers (artifact registry) and its recipe book (source code). Food safety uses sourcing records, sealed packaging and inspections. SBOMs, signatures and provenance are the same idea.",
why:"After SolarWinds, Codecov, 3CX, the xz backdoor and npm worm campaigns, supply chain is a board-level topic and a new OWASP Top 10 category. Expect questions on SLSA, SBOM, signing, CI/CD hardening and dependency risk.",
concepts:[
["SBOM","Software Bill of Materials listing components and versions (SPDX, CycloneDX). Useful for finding where a vulnerable library is used."],
["VEX","Vulnerability Exploitability eXchange: states whether a CVE in the SBOM actually affects the product."],
["SLSA","Supply-chain Levels for Software Artifacts. Build track levels L1 (provenance exists), L2 (hosted build, signed provenance), L3 (hardened, isolated build)."],
["Provenance","Signed metadata saying which source, which builder, which parameters produced an artifact (in-toto attestations)."],
["Artifact signing","Sigstore/cosign keyless signing using OIDC identity and a transparency log (Rekor); verify at deploy time."],
["Dependency confusion","Attacker publishes a public package with the same name as your internal one; build pulls the public one. Fix: scoped names, private registry proxy, pinning."],
["Typosquatting","Malicious packages with names similar to popular ones (reqeusts)."],
["Lockfiles and pinning","Pin exact versions and hashes; controlled update via Dependabot/Renovate with review."],
["CI/CD threats","Poisoned pipeline execution (PPE), secrets theft from runners, over-privileged deploy credentials, unreviewed pipeline changes."],
["Branch protection","Required reviews, signed commits, status checks, no force-push; CODEOWNERS for sensitive files."],
["IaC scanning","Checkov, tfsec/Trivy, cfn-nag, OPA/conftest on Terraform/CloudFormation before apply."],
["Secret scanning","Pre-commit hooks and server-side push protection (gitleaks, GitHub secret scanning)."],
["NIST SSDF","Secure Software Development Framework: Prepare the organisation, Protect the software, Produce well-secured software, Respond to vulnerabilities."]
],
how:`<p><b>Secure pipeline reference:</b></p>
<pre>Developer -> signed commit -> PR (2 reviews, CODEOWNERS, status checks)
  CI (ephemeral, isolated runner, OIDC to cloud, no long-lived secrets):
    secret scan -> SAST -> SCA (+ licence) -> IaC scan -> unit tests
    build from pinned deps via internal proxy registry
    container scan -> generate SBOM -> sign image + provenance (cosign/SLSA)
  Artifact registry (immutable tags, scan on push)
  CD: admission control verifies signature + provenance + policy
    -> deploy with least-privilege deploy role, environment approvals
  Runtime: continuous scanning of running images against new CVEs</pre>
<p><b>Dependency risk management:</b> private proxy registry (CodeArtifact/Artifactory) with allow-listing or malware scanning; pin with hashes; OpenSSF Scorecard to judge project health; delay adoption of brand-new versions by a few days (cool-down) to avoid fresh malicious releases; SBOM for every release so you can answer 'are we affected?' in minutes.</p>
<p><b>Gating strategy:</b> start in audit mode, tune, then block only on high-confidence critical issues (secrets, critical exploitable CVEs with a fix, known-malicious packages). Everything else is tracked with SLAs. Blocking noisy findings destroys trust.</p>`,
aws:[["Pipelines","CodePipeline/CodeBuild, or GitHub Actions with OIDC federation to IAM roles"],["Registry","CodeArtifact (upstream proxy), ECR with immutable tags and enhanced scanning"],["Signing","AWS Signer (container images with Notation, Lambda code signing)"],["IaC","CloudFormation Guard, Control Tower proactive controls, Config"],["Vulnerability","Inspector (ECR, Lambda, EC2, code scanning), SBOM export"]],
cases:`<p><b>SolarWinds (2020):</b> build system compromised; malicious code inserted during compilation and signed with the legitimate certificate. <b>Lesson:</b> signing proves who built it, not that the build was clean; hermetic, reproducible, isolated builds and provenance matter (SLSA L3).</p>
<p><b>xz Utils (2024):</b> a multi-year social-engineering campaign by a maintainer persona inserted a backdoor into a compression library that affected sshd. Caught by an engineer noticing 500 ms latency. <b>Lesson:</b> open-source maintainer health is a risk factor; depth of detection matters.</p>
<p><b>Codecov (2021):</b> a modified bash uploader script exfiltrated CI environment variables (secrets) from thousands of pipelines. <b>Lesson:</b> no long-lived secrets in CI; verify downloaded scripts by hash.</p>
<p><b>npm worm campaigns (2025):</b> compromised maintainer accounts published self-propagating malicious package versions that stole tokens and republished to other packages. <b>Lessons:</b> phishing-resistant MFA for maintainers, trusted publishing, cool-down periods before adopting new versions.</p>`,
mistakes:["Generating SBOMs nobody uses.","CI runners with admin rights to production.","Pipeline definitions editable without review.","Pulling dependencies directly from the internet at build time.","Signing without verifying at deploy.","Blocking builds on low-quality scanner output."],
hook:"Trusted source, trusted build, trusted ingredients, verified at deploy.",
qs:[
{l:"basic",q:"What is an SBOM and how do you actually use it?",a:"A machine-readable inventory of all components in a software artifact, in SPDX or CycloneDX format, generated at build time. Uses: (1) incident response, e.g. find every service with a vulnerable log4j within minutes; (2) continuous vulnerability matching as new CVEs appear; (3) licence compliance; (4) customer and regulatory requirements (US federal, EU CRA). Pair it with VEX so customers know which CVEs are actually exploitable. An SBOM only helps if it is stored centrally and queryable.",t:"Practical use, not buzzword."},
{l:"basic",q:"What is dependency confusion and how do you stop it?",a:"If a build resolves package names across both a private and a public registry, an attacker can publish a public package with the same name as an internal one and a higher version number, and the build pulls the malicious version. Stop it with scoped/namespaced package names, a single internal proxy registry that routes internal names only to the private source, pinning with hashes via lockfiles, and reserving internal names on public registries.",t:"Knowledge of real attacks."},
{l:"advanced",q:"Explain SLSA levels and what you would target.",a:"SLSA v1 build track: <b>L1</b> provenance exists showing how the artifact was built; <b>L2</b> builds run on a hosted build platform that generates and signs provenance, so tampering after build is detectable; <b>L3</b> hardened build platform where builds are isolated from each other and the signing material is inaccessible to user-defined build steps, preventing tampering during the build. I would target L2 across the board quickly (hosted CI plus signed provenance), L3 for crown-jewel artifacts (customer-deployed agents, SDKs, base images), and verify provenance at deploy with admission control.",t:"Standards depth with prioritisation."},
{l:"advanced",q:"How do you secure CI/CD itself?",a:"Treat CI/CD as production. (1) Identity: SSO + MFA for the SCM; OIDC federation from CI to cloud, no static secrets; separate deploy roles per environment. (2) Change control: branch protection, required reviews, CODEOWNERS on pipeline files so a PR cannot change its own pipeline to steal secrets (poisoned pipeline execution); no secrets exposed to pull requests from forks. (3) Runners: ephemeral, isolated, patched, no shared state, restricted egress. (4) Third-party actions pinned by commit SHA. (5) Artifacts signed and provenance attested. (6) Audit logs of pipeline runs and permission changes monitored by the SOC.",t:"Often-missed attack surface."},
{l:"scenario",q:"A new critical CVE in a popular library is announced at 9 pm. What happens in a mature organisation?",a:"Within the first hour: threat intel confirms exploitability (EPSS, KEV, public exploits); SBOM/SCA query identifies affected services and whether they are internet-facing; WAF virtual patch rules deployed if applicable; egress controls checked. Within 24-72 hours: automated PRs bump the version, pipelines rebuild and redeploy; exceptions tracked. Parallel: detection engineering adds rules for exploitation attempts; hunt for past exploitation. Communicate status to leadership and customers if needed. Afterwards: measure time-to-remediate and fix gaps (services missing SBOMs, slow pipelines).",t:"Operational maturity."},
{l:"design",q:"Design a secure software supply chain for a company shipping an agent installed on customer machines.",a:"High stakes: a compromise reaches every customer. Source: signed commits, two-person review, protected branches, CODEOWNERS, MFA with hardware keys for maintainers. Dependencies: internal proxy registry, pinned hashes, review of new dependencies, reproducible builds where possible. Build: SLSA L3, hermetic ephemeral builders, no network during build except the proxy, provenance attestations. Signing: code-signing keys in HSM, signing only from the release pipeline with approval, separate keys for dev/test. Release: staged rollout (canary rings), update client verifies signature and version (anti-rollback, e.g. using TUF). Monitoring: anomalies in release pipeline, telemetry from agents. IR: key revocation and emergency update plan rehearsed.",t:"Crown-jewel supply chain design."}
],
quiz:[
{q:"SLSA Build L3 adds, compared to L2:",o:["Provenance exists","Hosted build platform","Hardened, isolated builds where signing keys are inaccessible to build steps","Two-person review"],c:2,e:"L3 hardens the build platform against tampering during the build."},
{q:"VEX is used to:",o:["Sign containers","State whether a vulnerability actually affects a product","Scan IaC","Store secrets"],c:1,e:"VEX communicates exploitability status of CVEs in SBOM components."},
{q:"Best way to give GitHub Actions access to AWS:",o:["IAM user keys in secrets","OIDC federation to an IAM role scoped by repo/branch","Root account","SSH keys"],c:1,e:"Short-lived credentials with trust scoped by the OIDC sub claim."},
{q:"Pinning third-party CI actions should use:",o:["Branch name","Latest tag","Full commit SHA","Major version"],c:2,e:"Tags can be moved; commit SHAs are immutable."}
