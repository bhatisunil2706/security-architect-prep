fu:[["SAST first or threat modelling first?","Secret scanning and SCA first (cheap, high signal), threat modelling for critical designs next, SAST after tuning; noisy SAST early destroys trust."]],
flags:["Buying every scanner on day one"]});

REAL.push({cat:"AppSec & API", tid:"appsec", q:"Pen test found a critical issue two days before a major release. The business wants to ship. What do you do?",
why:"Tests risk judgement and influence.",
short:"Validate and understand the finding fast, assess real exploitability and impact, look for a quick fix or compensating control (feature flag, WAF virtual patch, restrict access), and present options with risk to the accountable business owner; if residual risk exceeds appetite, escalate transparently. Document the decision.",
a:`<ol><li>Reproduce and confirm; is it reachable pre-auth? data exposure? how likely?</li>
<li>Options: fix now (how long?), disable the vulnerable feature via flag, virtual patch via WAF, limit exposure (allow-list, beta users), add monitoring.</li>
<li>Present in business terms to the product owner: "Shipping as-is exposes all customer invoices to enumeration by any logged-in user; estimated breach impact X; options A/B/C."</li>
<li>If they accept risk within appetite: written acceptance, time-bound fix date, monitoring. If above appetite: escalate through the risk process openly.</li>
<li>After: why wasn't it caught earlier? add test/paved road.</li></ol>`,
fu:[["Have you ever blocked a release?","Share a real example: what data you used, how you offered alternatives, and the outcome."]],
flags:["'Security always blocks'","'I'd let it ship' without controls"]});

REAL.push({cat:"Kubernetes", tid:"k8s", q:"What does 'secure by default' look like for a Kubernetes platform?",
why:"From real architect scenario lists.",
short:"Teams get namespaces through self-service with RBAC tied to IdP groups, quotas, default-deny network policies and workload identity; admission policies enforce restricted pod security, signed images from the internal registry and resource limits; secrets come from a vault; nodes are immutable and patched; runtime detection is on; exceptions are explicit and time-bound.",
a:`<p>"Secure by default" means a team following the normal path cannot deploy an insecure workload without deliberately asking for an exception.</p>
<ul><li>Namespace vending via GitOps: RBAC (no secrets/exec/create pods for humans in prod), quotas, LimitRanges, default-deny NetworkPolicies, Pod Identity associations.</li>
<li>Admission: PSA restricted, Kyverno/Gatekeeper policies (signed images from ECR only, no :latest, no privileged/hostPath/hostNetwork, required limits and labels).</li>
<li>Golden base images (distroless), CI templates with scan/SBOM/sign.</li>
<li>Secrets via CSI driver from Secrets Manager.</li>
<li>Mesh mTLS by default.</li>
<li>Nodes: Bottlerocket, IMDS hop limit 1, automated rotation.</li>
<li>Observability and runtime detection enabled cluster-wide.</li>
<li>Exceptions: PolicyException resources with owner and expiry, reported weekly.</li></ul>`,
fu:[["How do you roll out new admission policies without outages?","Audit mode first, report violations to owners, fix, then enforce namespace by namespace."]],
flags:["Only listing CIS benchmark"]});

REAL.push({cat:"Kubernetes", tid:"k8s", q:"A pod in production was compromised. How far can the attacker go, and how do you respond?",
why:"Tests understanding of Kubernetes attack paths plus IR.",
short:"Depends on the pod's service account permissions, IAM role, network reach, node access (privileged/hostPath) and secrets mounted. Respond: capture evidence, isolate the pod with a NetworkPolicy, cordon the node, check API audit logs and cloud role usage, rotate reachable secrets, redeploy from a clean image and fix the entry point.",
a:`<p><b>Blast radius questions:</b> Can it call the Kubernetes API (token mounted? RBAC)? Which IAM role does it have (Pod Identity) and can it reach node IMDS? Which secrets are mounted/env? Network: can it reach databases or other namespaces? Is it privileged or using hostPath (node takeover)?</p>
<p><b>Response:</b></p>
<ol><li>Evidence: pod spec, image digest, logs, runtime alerts, process list (kubectl debug with care), node snapshot.</li>
<li>Contain: label pod to apply isolation NetworkPolicy; cordon node; revoke IAM role sessions if cloud credentials may be stolen.</li>
<li>Scope: Kubernetes audit logs (what the SA did), CloudTrail (what the role did), lateral movement to other pods.</li>
<li>Eradicate: delete pod after evidence, redeploy clean image, rotate secrets, patch vulnerability.</li>
<li>Improve: tighten RBAC, remove mounted tokens, distroless images, admission policies.</li></ol>`,
fu:[["How do you prevent pods reaching node IMDS?","IMDSv2 with hop limit 1 on nodes (or block via NetworkPolicy/iptables), and use Pod Identity for pod-level credentials."]],
flags:["Deleting the pod immediately"]});

REAL.push({cat:"Supply chain", tid:"devsecops", q:"How do you integrate security into CI/CD pipelines for cloud deployments?",
why:"Asked in almost every cloud security engineer/architect loop.",
short:"Shift-left scanning (secrets, SAST, SCA, IaC, containers) in reusable pipeline templates with tuned gates; signed artifacts with SBOM and provenance; OIDC-based short-lived deploy credentials per environment with approvals; policy-as-code guardrails; and runtime verification. Also secure the pipeline itself.",
a:`<ul><li><b>Commit:</b> pre-commit and server-side secret scanning; branch protection.</li>
<li><b>Build:</b> SAST (Semgrep/CodeQL), SCA (dependencies, licences), IaC (Checkov/cfn-guard), container scanning (Inspector/Trivy); fail only on high-confidence criticals, report the rest to backlog with SLAs.</li>
<li><b>Package:</b> SBOM, sign images, provenance; push to immutable ECR.</li>
<li><b>Deploy:</b> GitHub Actions/CodePipeline assume environment-specific roles via OIDC; prod requires protected branch + approval; Terraform plans checked by OPA policies.</li>
<li><b>Runtime:</b> admission verifies signatures; drift detection (Config); continuous vulnerability scanning.</li>
<li><b>Pipeline security:</b> pinned actions, ephemeral runners, least privilege, audit logs.</li>
<li><b>Developer experience:</b> results in PR comments, fix suggestions, fast scans.</li></ul>`,
fu:[["How do you avoid slowing developers?","Parallel fast scans, incremental scanning of changed files, only blocking high-confidence issues, and paved templates teams don't have to maintain."]],
flags:["Blocking on every finding"]});

REAL.push({cat:"Supply chain", tid:"devsecops", q:"A malicious version of an npm package you depend on was published yesterday. What do you do?",
why:"Very current scenario after the 2025 npm worm campaigns.",
short:"Use SBOM/SCA to find every repo, build and deployed artifact that pulled the bad version; block the version in the internal registry; check CI logs and runners for execution and secret theft; rotate any exposed credentials (npm/GitHub tokens, cloud keys); rebuild from clean versions; hunt for persistence; then add cool-down periods, pinning and trusted publishing.",
a:`<ol><li><b>Scope:</b> query SBOMs/lockfiles for the package and bad version across repos, container images and developer machines (EDR query).</li>
<li><b>Block:</b> remove/deny that version in CodeArtifact/Artifactory proxy; pin the last good version.</li>
<li><b>Assess execution:</b> malicious code often runs in install scripts: check CI job logs and time windows; developer laptops that ran npm install.</li>
<li><b>Contain:</b> rotate tokens and secrets available to affected CI jobs and machines (npm tokens, GitHub PATs, cloud credentials); invalidate sessions.</li>
<li><b>Hunt:</b> unexpected package publishes from your org (worms republish), new GitHub workflows, outbound connections to attacker domains.</li>
<li><b>Recover:</b> rebuild and redeploy affected artifacts.</li>
<li><b>Prevent:</b> internal proxy with malware scanning, minimum release age (cool-down) before new versions are allowed, lockfiles with integrity hashes, <code>--ignore-scripts</code> where feasible, trusted publishing and MFA for your own packages.</li></ol>`,
fu:[["Why is a cool-down period effective?","Most malicious versions are detected and removed within hours to days; delaying adoption of brand-new versions avoids most of them at little cost."]],
flags:["Just 'update the package'"]});

/* Real-world interview questions: Incidents, Detection, AI, Leadership, GRC */
REAL.push({cat:"Incident scenarios", tid:"ir", q:"You are paged at 2 am: ransomware is spreading across servers. Walk me through the first 24 hours.",
why:"The classic senior scenario; tests calm structure, priorities and business/legal awareness.",
short:"Declare and mobilise (IC, out-of-band channel), contain spread (isolate segments, disable compromised and privileged accounts, block C2, protect backups and identity systems), preserve evidence, scope including data theft, start regulatory clocks, then recover from clean immutable backups in priority order, with regular communication.",
a:`<p><b>Hour 0-1:</b> declare a critical incident; Incident Commander, tech lead, comms, legal; move to out-of-band comms (attackers may read email/Slack); call IR retainer.</p>
<p><b>Hour 1-4 (contain):</b> isolate affected network segments and remote access; disable compromised accounts and all non-essential privileged accounts; block known IOCs/C2 in EDR and firewalls; <b>protect backups and domain controllers/IdP</b> first (isolate, check integrity); stop scheduled tasks/GPOs used to spread; don't mass-power-off (lose memory evidence) unless spread is uncontrolled.</p>
<p><b>Hour 4-12 (scope):</b> patient zero and initial access (VPN without MFA? phishing?), ransomware family, extent of encryption, <b>data exfiltration evidence</b> (large outbound transfers, rclone/Mega), identity plane compromise (krbtgt, Okta admin).</p>
<p><b>Regulatory/business:</b> CERT-In within 6 hours, DPDP/GDPR assessment, insurer notification, law enforcement, customer/partner comms plan, executive decision framework on ransom (never unilateral; sanctions checks).</p>
<p><b>Hour 12-24 (recover plan):</b> business-prioritised recovery order; clean-room rebuild of identity; restore from immutable backups after scanning; reset credentials (krbtgt twice); monitor intensely for re-entry.</p>
<p><b>After:</b> blameless review, fix root cause (MFA, EDR coverage, segmentation, patching of edge devices), rehearse.</p>`,
fu:[["Would you pay the ransom?","Not my decision alone: it's an executive/board decision with legal, insurers and law enforcement input; I provide facts: can we restore, how long, what data was stolen, sanctions status, and the fact that paying doesn't guarantee deletion of stolen data."],
["What if backups are also encrypted?","Check immutable/offline copies, cloud snapshots with vault lock, older restore points, vendor decryptors (No More Ransom), and rebuild from source/IaC where possible."]],
flags:["Panic-driven wiping","Forgetting data exfiltration and legal clocks"]});

REAL.push({cat:"Incident scenarios", tid:"ir", q:"An employee who resigned last week appears to have downloaded large amounts of customer data. How do you handle it?",
why:"Insider scenario; tests legal/HR coordination and evidence handling.",
short:"Involve HR and legal first, preserve evidence quietly, confirm with logs (SaaS/cloud/endpoint/DLP), revoke remaining access, assess data and regulatory impact, follow a formal process (possibly law enforcement), and fix the control gaps (DLP, offboarding, least privilege).",
a:`<ol><li><b>Engage HR and legal</b> immediately; investigation must follow policy and law (privacy, employment law).</li>
<li><b>Preserve evidence:</b> IdP, SaaS audit logs (Google/M365/Salesforce exports), CloudTrail, EDR (USB, uploads), DLP alerts, email; chain of custody; don't alert the person prematurely.</li>
<li><b>Confirm facts:</b> what data, volume, destination (personal email, cloud storage, USB), whether authorised by role.</li>
<li><b>Contain:</b> ensure all accounts, tokens, OAuth apps and devices are revoked; recover company devices.</li>
<li><b>Impact:</b> personal data involved → DPDP breach assessment and notifications; contracts with customers.</li>
<li><b>Action:</b> legal letters, possible police complaint; coordinated by legal.</li>
<li><b>Lessons:</b> high-risk user monitoring around resignations (privacy-respecting), DLP rules for bulk export, least privilege for data exports, faster offboarding.</li></ol>`,
fu:[["How do you avoid a surveillance culture?","Transparent policy, focus on data movement of sensitive data rather than people, pseudonymised analytics, narrow investigation team with oversight."]],
flags:["Confronting the person before preserving evidence"]});

REAL.push({cat:"Incident scenarios", tid:"ir", q:"A critical zero-day is announced in a product we use (e.g. VPN appliance or file transfer tool). What do you do?",
why:"From real architect scenario lists; tests vulnerability response under pressure.",
short:"Confirm exposure via inventory, assess exploitation (KEV, vendor advisory, intel), apply mitigations or take it offline, patch as soon as available, hunt for prior compromise (because patching doesn't evict attackers), communicate status, and review architecture dependence on exposed appliances.",
a:`<ol><li><b>Exposure:</b> asset inventory/ASM: where is it, which versions, internet-facing?</li>
<li><b>Threat:</b> vendor advisory, CISA KEV, threat intel on active exploitation.</li>
<li><b>Mitigate now:</b> vendor workaround, restrict access by IP, WAF/IPS signature, disable feature, or take offline if exploitation is active and risk is high (business decision with owner).</li>
<li><b>Patch</b> in an emergency change as soon as available; verify.</li>
<li><b>Hunt:</b> IOCs from advisories, logs of the appliance, new accounts, web shells, session tokens (like Citrix Bleed: kill sessions after patching).</li>
<li><b>Communicate</b> to leadership and, if relevant, customers.</li>
<li><b>Afterwards:</b> reduce exposed attack surface (ZTNA instead of VPN appliance), faster emergency patch process, vendor risk discussion.</li></ol>`,
fu:[["Why hunt if you patched quickly?","Mass exploitation often starts before disclosure; attackers may already have persistence that survives patching."]],
flags:["Patch-only answer"]});

REAL.push({cat:"Incident scenarios", tid:"ir", q:"Our Okta/Entra admin account was phished and the attacker changed MFA settings. What now?",
why:"Identity provider compromise (MGM/Caesars style); tests understanding that the IdP is the crown jewel.",
short:"Treat as critical: lock the compromised admin, revoke all their sessions and tokens, review and roll back every admin change (MFA policies, new IdPs, new admins, app assignments, API tokens), check downstream apps (AWS, email, code), rotate IdP API tokens, and reinforce with phishing-resistant MFA and help-desk verification.",
a:`<ol><li>Disable account, revoke sessions and refresh tokens; if other admins are uncertain, use break-glass admin from a clean device.</li>
<li>Review IdP admin audit log: new admins, MFA factor resets, policy weakening, new identity providers (inbound federation backdoor), new API tokens, app assignment changes, network zones.</li>
<li>Roll back changes; rotate API tokens and signing keys if possible.</li>
<li>Downstream: AWS Identity Center sessions and assignments, email rules, code repos, VPN; look for data access by impersonated users.</li>
<li>Reset MFA and credentials for affected users.</li>
<li>Prevent: phishing-resistant MFA for admins, admin actions from managed devices only, separate admin accounts, ITDR alerts on MFA changes and new admins, strong help-desk verification.</li></ol>`,
fu:[["What is the 'inbound federation' backdoor?","Attackers add a new identity provider trusted by your IdP so they can log in as any user without passwords; audit and alert on IdP configuration changes."]],
flags:["Only resetting the password"]});

REAL.push({cat:"Detection", tid:"secops", q:"What logs would you collect in AWS, and what would you alert on first?",
why:"Tests detection priorities and cost-awareness.",
short:"Org CloudTrail (all regions), selected data events for sensitive S3/Lambda, GuardDuty findings, VPC Flow and Route 53 Resolver logs, WAF/ALB logs, EKS audit, Config, IdP logs; alert first on root use, logging tampering, IAM persistence (users/keys/trust changes), public exposure, KMS key deletion, GuardDuty high findings and honeytokens.",
a:`<p><b>Collect:</b> see the lesson "Logging strategy". Store centrally in a locked account and Security Lake; send high-value sources to the SIEM.</p>
<p><b>First ten alerts:</b></p>
<ol><li>Root user activity.</li>
<li>CloudTrail/GuardDuty/Config disabled or modified.</li>
<li>IAM user or access key created outside automation.</li>
<li>Role trust policy changed to include external account.</li>
<li>Admin policy attached.</li>
<li>S3 bucket policy/ACL making data public; snapshot/AMI shared publicly.</li>
<li>KMS key disable or scheduled deletion.</li>
<li>Console login without MFA / from unusual country.</li>
<li>GuardDuty high-severity findings (credential exfiltration, crypto mining, attack sequences).</li>
<li>Honeytoken credential used.</li></ol>`,
fu:[["How do you control CloudTrail data event cost?","Enable only for sensitive buckets/functions, use advanced event selectors, send the rest to the data lake rather than the SIEM."]],
flags:["'Log everything to SIEM'"]});

REAL.push({cat:"AI security", tid:"ai", q:"How would you secure a GenAI chatbot that answers questions from internal documents (RAG)?",
why:"The most common 2026 AI security question.",
short:"SSO, permission-aware retrieval using the user's identity, trusted sources only, treat retrieved text as untrusted data, output sanitisation (no remote images/links), enterprise model terms with private endpoints, guardrails for injection and PII, cost and rate limits, full audit logging and continuous red-team evaluation.",
a:`<ul><li><b>Access:</b> SSO; the chatbot is only as permissive as the user.</li>
<li><b>Retrieval authorisation:</b> store ACL metadata per chunk from the source system; filter at query time by the user's groups; sync permission changes; separate indexes for highly sensitive spaces.</li>
<li><b>Ingestion:</b> approved sources only; scan for secrets and PII; provenance tracking.</li>
<li><b>Prompt construction:</b> clear separation of system instructions and retrieved content; retrieved content labelled as data.</li>
<li><b>Guardrails:</b> prompt-attack detection, PII redaction, denied topics (Bedrock Guardrails or equivalent).</li>
<li><b>Output:</b> render as text; block remote images and untrusted links (markdown exfiltration); cite sources.</li>
<li><b>Model provider:</b> Bedrock/enterprise API via private endpoint, no training on our data, retention settings, region.</li>
<li><b>Abuse:</b> per-user rate and token limits, cost alarms.</li>
<li><b>Audit:</b> log prompts, retrieved doc IDs, outputs (with PII controls), access by security only.</li>
<li><b>Testing:</b> red-team suite for injection, data leakage across permissions, jailbreaks; regression in CI.</li></ul>`,
fu:[["Can a system prompt protect confidential data?","No. System prompts can be extracted or overridden; access control must happen before data reaches the model."],
["What changes if the bot can take actions?","It becomes an agent: least agency, user-delegated scoped tokens, human confirmation for writes/external sends, sandboxing, and breaking the lethal trifecta."]],
flags:["Relying on prompt instructions for security"]});

REAL.push({cat:"AI security", tid:"ai", q:"Our developers want to use AI coding assistants and agents (with MCP tools) on company code. What guardrails do you put in place?",
why:"Very current; tests pragmatic enablement.",
short:"Approve enterprise tools with no training on our code and SSO; classify which repos are allowed; restrict agent permissions (no production credentials, sandboxed execution, allow-listed MCP servers with scoped tokens); keep human review and normal CI security gates for AI-written code; log usage; train developers on prompt injection via repos and issues.",
a:`<ul><li><b>Tool approval:</b> enterprise agreements (no training, retention limits, SSO, audit logs); block unapproved tools with coaching.</li>
<li><b>Data scope:</b> which repos/classifications may be used; secrets never in context (secret scanning, .gitignore/ignore files for AI tools).</li>
<li><b>Agent permissions:</b> run in dev containers/sandboxes, no production credentials, network egress allow-lists, command allow-lists or approval prompts for risky commands.</li>
<li><b>MCP/tool governance:</b> approved registry, pinned versions, least OAuth scopes, review for tool poisoning; no random community servers with broad access.</li>
<li><b>Code quality:</b> AI-generated code goes through the same PR review, SAST/SCA and tests; watch for hallucinated dependencies (slopsquatting) via the dependency proxy.</li>
<li><b>Prompt injection awareness:</b> agents reading issues, PRs or web pages can be manipulated; gate write actions and secrets access.</li>
<li><b>Measure:</b> adoption, incidents, security findings in AI-assisted code vs baseline.</li></ul>`,
fu:[["What is slopsquatting?","Attackers register package names that AI tools commonly hallucinate, so generated code installs malware; the dependency proxy and allow-listing stop it."]],
flags:["Blanket ban","No controls on agent permissions"]});

REAL.push({cat:"Leadership & process", tid:"leadership", q:"How would you design a security architecture review process that is rigorous but doesn't block teams?",
why:"From real architect scenario lists; tests operating model.",
short:"Risk-tiered triggers, paved roads that pre-answer common questions, async reviews with published SLAs, clear outputs (required vs recommended vs accepted risk), an ADR library, a fast escalation path, and metrics on lead time and recurring findings that feed new guardrails.",
a:`<p>See the lesson "Running a security architecture review process". In the interview, add a real story: "We cut average review time from 3 weeks to 4 days by moving to async reviews, publishing patterns for the 5 most common designs, and only doing full reviews for 20% of changes that matched triggers."</p>`,
fu:[["How do you ensure teams actually fix required items?","Track as tickets linked to the launch checklist; release management checks required items; exceptions need risk acceptance by the owner."]],
flags:["Weekly board that approves everything"]});

REAL.push({cat:"Leadership & process", tid:"leadership", q:"Tell me about a security architecture you designed end to end. (How to answer)",
why:"Almost always asked; they want depth, trade-offs and your personal role.",
short:"Pick one significant system, give context and constraints, show the architecture with trust boundaries, explain 2-3 key decisions with alternatives rejected and why, describe how you drove adoption, give quantified results, and say what you'd do differently.",
a:`<p><b>Structure (5-7 minutes):</b></p>
<ol><li><b>Context:</b> business, scale, why it mattered (risk, audit finding, incident, growth).</li>
<li><b>Requirements and constraints:</b> security, compliance, latency, budget, team skills, legacy.</li>
<li><b>Architecture:</b> draw it: components, trust boundaries, identity flow, data flow, key controls.</li>
<li><b>Key decisions:</b> "We chose X over Y because…" (e.g. account-per-tenant vs pooled; Cedar vs custom authZ; SPIRE vs mesh-native identity).</li>
<li><b>Your role:</b> what you personally designed, wrote, negotiated.</li>
<li><b>Rollout:</b> pilots, migration, adoption tactics.</li>
<li><b>Results:</b> numbers (findings reduced, incidents avoided, time saved, audit passed).</li>
<li><b>Hindsight:</b> one thing you'd change.</li></ol>
<p>Prepare for deep follow-ups on any box you draw; only draw what you can defend.</p>`,
fu:[["What was the hardest trade-off?","Have one ready: e.g. security vs latency for mTLS, cost of per-tenant keys, developer friction of JIT access."]],
flags:["Describing a team effort without your role","No numbers"]});

REAL.push({cat:"Leadership & process", tid:"leadership", q:"How do you handle an engineering team that refuses to implement a security requirement?",
why:"Influence without authority; very common behavioural-technical hybrid.",
short:"Understand their constraint, explain the risk in their terms with evidence, look for alternative ways to meet the same goal, make the secure path easier (paved road or help), agree a timeline; if still stuck, use the formal risk acceptance/escalation process transparently.",
a:`<ol><li>Listen: is it time, complexity, disagreement on risk, or a tool that doesn't fit?</li>
<li>Reframe the requirement as the outcome needed (e.g. "no long-lived credentials in CI") and offer options.</li>
<li>Show evidence: similar incidents, pen-test results, customer contract requirements.</li>
<li>Reduce cost: provide a module, pair with them, or adjust sequencing.</li>
<li>Agree a plan with dates; compensating controls in the meantime.</li>
<li>If no agreement: document risk, the accountable owner accepts or escalates via the agreed process; tell the team openly.</li>
<li>Learn: if many teams resist the same control, the control or its paved road needs redesign.</li></ol>`,
fu:[["Example?","Use a STAR story with numbers."]],
flags:["'I escalate to the CISO immediately'"]});

REAL.push({cat:"Leadership & process", tid:"grc", q:"What would you put on a monthly security dashboard for executives?",
why:"From real architect scenario lists; tests business communication.",
short:"Top risks with trends, a few outcome metrics (phishing-resistant MFA coverage, KEV/internet-facing criticals past SLA, MTTD/MTTR, restore-test success, critical vendor status), programme milestones and decisions needed; each with target, trend and 'so what'; no vanity counts.",
a:`<p>See lesson "Security metrics and the executive dashboard". Emphasise: fits on one page, starts with risk, uses trends, and ends with asks/decisions.</p>`,
fu:[["How do you show ROI of security?","Risk reduction in scenarios (FAIR), avoided costs (audit effort, incidents), enablement (deals won due to certifications), efficiency (automation hours saved)."]],
flags:["Number of blocked attacks"]});

REAL.push({cat:"Leadership & process", tid:"grc", q:"How would you prepare a cloud-native company for its first SOC 2 Type II or PCI DSS audit?",
why:"Common for principal roles in SaaS/fintech.",
short:"Define scope tightly (reduce PCI scope via tokenisation and segmentation), map controls to a unified framework, implement missing controls as code, automate evidence (Config, Security Hub, Audit Manager, ticketing), run a readiness assessment, fix gaps, then operate controls consistently through the observation period.",
a:`<ol><li><b>Scope:</b> SOC 2: which products and trust criteria; PCI: CDE boundaries, minimise with tokenisation/hosted payment fields and account segmentation.</li>
<li><b>Gap assessment</b> against criteria/requirements.</li>
<li><b>Controls as code:</b> SCPs, Config rules, pipeline checks, IaC so controls are consistent and evidence is automatic.</li>
<li><b>Process controls:</b> access reviews, change management (PR approvals), onboarding/offboarding, vendor reviews, incident response testing, security training.</li>
<li><b>Evidence:</b> Audit Manager, Security Hub reports, exports from IdP/HR/ticketing; a GRC tool.</li>
<li><b>Readiness audit</b> with a firm, fix findings.</li>
<li><b>Observation period</b> (Type II 3-12 months): operate controls consistently; exceptions documented.</li>
<li>Reuse for ISO 27001 later via unified control framework.</li></ol>`,
fu:[["Biggest mistake companies make?","Building controls for the audit that aren't how engineering works, so they fail during the observation period."]],
flags:["Screenshots as the evidence strategy"]});

REAL.push({cat:"Leadership & process", tid:"grc", q:"How do you run a third-party risk programme for 300+ vendors without stopping procurement?",
why:"From real architect scenario lists.",
short:"Tier vendors by data access and criticality, match assessment depth to tier, reuse existing assurance (SOC 2, ISO), automate intake and monitoring, put key security terms in contracts, and apply technical controls (SSO, scoped integrations) that reduce reliance on questionnaires.",
a:`<p>See the GRC topic design question. Add: an intake form that auto-tiers (does it touch customer data? production access? SSO support?), fast lane for low-risk tools (days, not weeks), deep review only for tier 1, continuous monitoring (security ratings, breach alerts), annual reassessment for tier 1, and concentration-risk analysis for critical providers.</p>`,
fu:[["What do you look for in a SOC 2 report?","Scope matches the service you use, Type II period, exceptions and management responses, complementary user entity controls you must implement, subservice organisations (carve-outs)."]],
flags:["Same 300-question questionnaire for every vendor"]});

REAL.push({cat:"Leadership & process", tid:"leadership", q:"How would you secure a large remote workforce?",
why:"From real architect scenario lists.",
short:"Identity-first: SSO with phishing-resistant MFA and conditional access; managed devices with EDR, disk encryption and patching; ZTNA/SSE instead of broad VPN; DLP and CASB for SaaS; secure collaboration settings; awareness training focused on phishing and help-desk fraud; and fast incident response for lost devices.",
a:`<ul><li>Identity: SSO everywhere, passkeys, conditional access with device posture, ITDR.</li>
<li>Devices: MDM enrolment, EDR, encryption, auto-updates, remote wipe; BYOD limited to browser-isolated access.</li>
<li>Access: ZTNA per app; SSE for web and SaaS traffic (SWG, CASB, DLP) wherever users are.</li>
<li>Data: labels, DLP on sensitive data, secure external sharing defaults.</li>
<li>Communication: verify-before-trust processes for payments and credential resets (deepfake voice/video risks).</li>
<li>Support: secure help-desk identity verification, lost-device playbook.</li>
<li>Compliance: data residency and export rules for employees abroad.</li></ul>`,
fu:[["How do you handle contractors on their own laptops?","Browser-based access through ZTNA/isolation, no data download, time-limited accounts, separate groups."]],
flags:["'Everyone on VPN'"]});

/* Extra real questions */
REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"How would you secure a multi-cloud environment (AWS plus Azure/GCP) given their different security models?",
why:"Asked in cloud security loops; tests abstraction and consistency.",
short:"Standardise on outcomes, not tools: one identity plane federated into every cloud, equivalent guardrails in each (SCPs, Azure Policy, GCP org policies), a common logging schema into one SIEM, a CNAPP for unified posture, IaC with shared policy-as-code, and cloud-specific experts for the differences.",
a:`<table><tr><th>Area</th><th>AWS</th><th>Azure</th><th>GCP</th><th>Common approach</th></tr>
<tr><td>Hierarchy</td><td>Organizations, OUs, accounts</td><td>Management groups, subscriptions, resource groups</td><td>Organization, folders, projects</td><td>Same isolation principle: workload/env per account/subscription/project</td></tr>
<tr><td>Guardrails</td><td>SCPs, RCPs</td><td>Azure Policy, deny assignments</td><td>Organization policies, IAM deny policies</td><td>One control catalogue implemented natively in each</td></tr>
<tr><td>Identity</td><td>Identity Center, roles</td><td>Entra ID, managed identities</td><td>Cloud Identity, service accounts, Workload Identity Federation</td><td>Single corporate IdP; workload identity federation between clouds; no static keys</td></tr>
<tr><td>Logs</td><td>CloudTrail</td><td>Activity logs, Entra logs</td><td>Cloud Audit Logs</td><td>Normalise (OCSF) into one SIEM</td></tr>
<tr><td>Threat detection</td><td>GuardDuty</td><td>Defender for Cloud</td><td>Security Command Center</td><td>Native detection + central correlation</td></tr></table>
<p>Also: CNAPP for a single posture view and attack paths across clouds; Terraform with OPA/Checkov policies applied to all providers; a network strategy for inter-cloud links; and clear ownership. Avoid lowest-common-denominator security: use each cloud's strongest native controls under a shared policy.</p>`,
fu:[["GCP service account keys?","Treat like AWS access keys: disable key creation with org policy, use Workload Identity Federation instead."]],
flags:["Assuming controls are identical across clouds"]});

REAL.push({cat:"Crypto & Data", tid:"crypto", q:"How would you design a company-wide cryptography architecture that teams actually adopt?",
why:"From real architect scenario lists; tests crypto governance and developer experience.",
short:"Publish a short crypto standard (approved algorithms, key lengths, protocols), provide vetted libraries and managed services so teams never choose primitives, centralise keys in KMS/HSM with IaC, build an inventory (CBOM) for agility and PQC, automate certificates, and enforce with linting and scanning.",
a:`<ul><li><b>Standard:</b> one page: AES-256-GCM, TLS 1.2+/1.3, Ed25519/ECDSA P-256, RSA ≥3072 where needed, Argon2id for passwords, SHA-256+; banned list (MD5, SHA-1, ECB, custom crypto).</li>
<li><b>Paved roads:</b> wrapper libraries (AWS Encryption SDK, Tink) that make the safe choice by default; envelope encryption helper; token signing service.</li>
<li><b>Keys:</b> KMS/CloudHSM only, created via IaC, separation of duties.</li>
<li><b>Certificates:</b> ACM/Private CA, ACME automation, expiry monitoring.</li>
<li><b>Inventory and agility:</b> CBOM from code scanning and TLS scans; algorithms configurable; PQC migration plan.</li>
<li><b>Enforcement:</b> SAST rules for weak crypto, TLS policy checks, design review triggers for custom crypto.</li>
<li><b>Adoption:</b> make it easier than doing it yourself; office hours; examples per language.</li></ul>`,
fu:[["Why wrapper libraries?","Most crypto failures are misuse (nonce reuse, wrong modes), not broken algorithms; opinionated libraries remove those choices."]],
flags:["Only listing algorithms"]});

REAL.push({cat:"Network", tid:"network", q:"How would you protect a public e-commerce site from DDoS and bots during a big sale?",
why:"Practical for retail/fintech in India (festival sales).",
short:"Serve through CloudFront with Shield Advanced, lock origins to CloudFront, cache aggressively, WAF rate-based rules and Bot Control/Fraud Control for login, signup and checkout, queue-based virtual waiting room for spikes, autoscaling tested with load tests, and a pre-agreed runbook with the Shield Response Team.",
a:`<ul><li>Before: load test to 3-5× expected peak; pre-warm; review WAF rules; enable Shield Advanced proactive engagement; runbook and war-room staffing.</li>
<li>Edge: CloudFront caching, WAF managed rules, rate-based rules per IP and per session/header, Bot Control targeted mode on login/checkout, CAPTCHA/challenge actions, geo/ASN rules if appropriate.</li>
<li>Business-flow abuse: inventory hoarding bots (cart limits, per-account purchase limits), coupon abuse detection, account creation fraud controls.</li>
<li>Origin: only reachable via CloudFront; autoscaling; queue writes; graceful degradation (disable recommendations/search) under load.</li>
<li>Virtual waiting room to smooth traffic spikes.</li>
<li>Monitoring: real-time dashboards, alerts on error rates and WAF block rates.</li></ul>`,
fu:[["How do you avoid blocking real customers?","Challenge rather than block for uncertain traffic, monitor false positives in count mode first, and whitelist known partners/monitoring."]],
flags:["Only 'enable Shield'"]});

</script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var store={get:function(k,d){try{var v=localStorage.getItem("sap."+k);return v?JSON.parse(v):d}catch(e){return d}},
           set:function(k,v){try{localStorage.setItem("sap."+k,JSON.stringify(v))}catch(e){}}};
var T=TOPICS.slice().sort(function(a,b){return a.n-b.n});
var byId={};T.forEach(function(t){byId[t.id]=t});
var done=new Set(store.get("done",[]));
var known=new Set(store.get("known",[]));
var LV={basic:"Basic",advanced:"Advanced",scenario:"Scenario",design:"Design"};
function pad(n){return (n<10?"0":"")+n}
function strip(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent||""}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}

var QS=[];T.forEach(function(t){t.qs.forEach(function(q,i){QS.push({tid:t.id,tn:t.n,tt:t.title,l:q.l,q:q.q,a:q.a,t:q.t,key:t.id+":"+i})})});
var CARDS=[];T.forEach(function(t){t.concepts.forEach(function(c,i){CARDS.push({tid:t.id,tn:t.n,front:c[0],back:c[1],key:t.id+":c"+i})});CARDS.push({tid:t.id,tn:t.n,front:"Memory hook: "+t.title,back:t.hook,key:t.id+":h"})});
var QZ=[];T.forEach(function(t){t.quiz.forEach(function(q){QZ.push({tid:t.id,tn:t.n,q:q.q,o:q.o,c:q.c,e:q.e})})});

var LESSONS=(window.DEEP||[]).map(function(d,i){return {i:i,tid:d.tid,title:d.title,body:d.body,answer:d.answer}}).filter(function(d){return byId[d.tid]});
var RQ=(window.REAL||[]).map(function(r,i){return {i:i,cat:r.cat,tid:r.tid,q:r.q,why:r.why,short:r.short,a:r.a,fu:r.fu||[],flags:r.flags||[]}});
LV.real="Real";
RQ.forEach(function(r){var t=byId[r.tid]||{n:0,title:""};QS.push({tid:r.tid,tn:t.n,tt:t.title,l:"real",q:r.q,a:"<p><b>60-second version:</b> "+r.short+"</p>"+r.a,t:r.why,key:"real:"+r.i,real:true})});
function rqItem(r,open){
  var t=byId[r.tid];
  return "<details class='rq'"+(open?" open":"")+" id='rq-"+r.i+"'><summary><span class='cat'>"+esc(r.cat)+"</span><span class='qt'>"+r.q+(t?"<span class='qsrc'>Related: T"+pad(t.n)+" · "+esc(t.title)+"</span>":"")+"</span></summary><div class='rq-body'>"+
  "<div><span class='lab'>Why interviewers ask this</span><div class='reading' style='font-size:16px'>"+r.why+"</div></div>"+
  "<div><span class='lab'>Your 60-second answer</span><div class='short'>"+r.short+"</div></div>"+
  "<div><span class='lab'>Full answer</span><div class='prose'>"+r.a+"</div></div>"+
  (r.fu.length?"<div><span class='lab'>Likely follow-up questions</span><div class='fu'>"+r.fu.map(function(f){return "<div><b>"+f[0]+"</b><span>"+f[1]+"</span></div>"}).join("")+"</div></div>":"")+
  (r.flags.length?"<div><span class='lab'>Red flags to avoid</span><div class='flags'>"+r.flags.map(function(f){return "<span>"+esc(f)+"</span>"}).join("")+"</div></div>":"")+
  "</div></details>";
}
function lessonBlock(d){
  var t=byId[d.tid];
  return "<article class='lesson' id='lesson-"+d.i+"'><div class='lesson-head'><span class='tid'>L"+pad(d.i+1)+"</span><h3 class='lesson-title'>"+esc(d.title)+"</h3></div><div class='prose'>"+d.body+"</div><div class='say'><span class='lab'>How to say it in the interview</span><p>"+d.answer+"</p></div></article>";
}

var main=$("#main");
function saveDone(){store.set("done",Array.from(done))}
function saveKnown(){store.set("known",Array.from(known))}

/* ---------- Theme ---------- */
var themes=["auto","light","dark"];var theme=store.get("theme","auto");
function applyTheme(){var r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);$("#themeBtn").textContent="Theme: "+theme}
$("#themeBtn").addEventListener("click",function(){theme=themes[(themes.indexOf(theme)+1)%3];store.set("theme",theme);applyTheme()});
applyTheme();

/* ---------- Rail ---------- */
var VIEWS=[["roadmap","Roadmap & plan"],["real","Real interview questions"],["lessons","In-depth lessons"],["questions","Question bank"],["mock","Mock interview"],["design","System design cases"],["flashcards","Flashcards"],["quiz","Quiz"],["glossary","Glossary"],["cheatsheet","24-hour cheat sheet"]];
function renderRail(route){
  var h="<h4>Study tools</h4><div class='nav'>";
  VIEWS.forEach(function(v){h+="<a href='#"+v[0]+"' class='"+(route===v[0]?"on":"")+"'>"+v[1]+"</a>"});
  h+="</div>";
  var pct=Math.round(done.size/T.length*100);
  h+="<h4>Progress</h4><div class='meter'><i style='width:"+pct+"%'></i></div><div class='meter-label'>"+done.size+" of "+T.length+" topics studied</div>";
  var dom="";
  T.forEach(function(t){
    if(t.domain!==dom){if(dom)h+="</div>";dom=t.domain;h+="<h4>"+esc(dom)+"</h4><div class='nav'>"}
    h+="<a href='#t."+t.id+"' class='"+(route==="t."+t.id?"on":"")+"'><span class='num'>T"+pad(t.n)+"</span>"+esc(t.title)+"<span class='tick"+(done.has(t.id)?" d":"")+"' aria-label='"+(done.has(t.id)?"studied":"not studied")+"'></span></a>";
  });
  h+="</div>";
  $("#rail").innerHTML=h;
}
$("#menuBtn").addEventListener("click",function(){document.body.classList.toggle("nav-open")});
$("#rail").addEventListener("click",function(e){if(e.target.closest("a"))document.body.classList.remove("nav-open")});

/* ---------- Shared bits ---------- */
function qItem(q,showSrc){
  return "<details class='q'><summary><span class='lv lv-"+q.l+"'>"+LV[q.l]+"</span><span class='qt'>"+q.q+(showSrc?"<span class='qsrc'>T"+pad(q.tn)+" · "+esc(q.tt)+"</span>":"")+"</span></summary><div class='ans'><div class='prose'>"+(/^\s*</.test(q.a)?q.a:"<p>"+q.a+"</p>")+"</div><p class='test'><span class='lab'>What the interviewer is testing</span>"+q.t+"</p></div></details>";
}
function wrapTables(root){$$("table",root).forEach(function(tb){if(tb.parentNode.classList.contains("tbl"))return;var w=document.createElement("div");w.className="tbl";tb.parentNode.insertBefore(w,tb);w.appendChild(tb)})}

/* ---------- Roadmap ---------- */
function vRoadmap(){
  var pct=Math.round(done.size/T.length*100);
  var h="<div class='col'><div class='intro'><div><div class='eyebrow'>Your mentor's plan</div><h1>Eight weeks to the Security Architect loop</h1><p class='reading'>Twenty topics, from first principles to principal-level leadership, written in plain language with an AWS focus. Study one topic at a time: read it, answer its questions out loud, then test yourself with flashcards and the quiz. Mark a topic studied when you can explain its memory hook without looking.</p></div>";
  h+="<div class='stat'><span class='lab'>Topics studied</span><div class='big'>"+done.size+"<span class='muted' style='font-size:22px'> / "+T.length+"</span></div><div class='meter'><i style='width:"+pct+"%'></i></div><p class='muted' style='margin:10px 0 0;font-size:13px'>"+LESSONS.length+" in-depth lessons · "+RQ.length+" real interview questions · "+(QS.length-RQ.length)+" practice questions · "+CARDS.length+" flashcards · "+QZ.length+" quiz items · "+DESIGNS.length+" design cases</p></div></div>";
  h+="<div class='grid2'><a class='panel' href='#lessons' style='text-decoration:none;color:var(--ink)'><span class='lab'>Learn</span><h3 style='margin:0 0 4px'>In-depth lessons →</h3><p class='muted' style='margin:0'>Full explanations with AWS policies, flows and trade-offs, e.g. RBAC vs ABAC on AWS, building security infrastructure from scratch, KMS, IAM evaluation.</p></a><a class='panel' href='#real' style='text-decoration:none;color:var(--ink)'><span class='lab'>Practise</span><h3 style='margin:0 0 4px'>Real interview questions →</h3><p class='muted' style='margin:0'>Scenario questions asked in architect loops, each with a 60-second answer, full answer, follow-ups and red flags.</p></a><a class='panel' href='#mock' style='text-decoration:none;color:var(--ink)'><span class='lab'>Rehearse</span><h3 style='margin:0 0 4px'>Mock interview →</h3><p class='muted' style='margin:0'>Random real question, a timer and self-rating.</p></a></div>";
  h+="<h2>The 8-week plan</h2><p class='muted' style='margin-top:-6px'>About 60-90 minutes a day. If your interview is sooner, compress two weeks into one and use the cheat sheet daily.</p><div class='weeks'>";
  PLAN.forEach(function(w){
    var all=w.topics.every(function(n){return done.has(T[n-1].id)});
    h+="<div class='week"+(all?" full":"")+"'><div class='wk'>WEEK "+w.w+"</div><h3>"+esc(w.title)+"</h3><p>Goal: "+esc(w.goal)+"</p><div class='tlinks'>";
    w.topics.forEach(function(n){var t=T[n-1];h+="<a class='tlink"+(done.has(t.id)?" d":"")+"' href='#t."+t.id+"'><span class='num' style='font-family:var(--f-mono);font-size:11px'>T"+pad(t.n)+"</span>"+esc(t.title)+"</a>"});
    h+="</div></div>";
  });
  h+="</div><h2 style='margin-top:30px'>What the interview loop usually looks like</h2><div class='grid2'>";
  [["Recruiter / hiring manager screen","Your story, scope of past impact, why this role. Have a 2-minute career summary with your biggest security wins."],
   ["Technical deep dive","Identity, cloud, AppSec, crypto fundamentals. Expect follow-up 'why' questions until you hit the edge of your knowledge."],
   ["Threat modeling exercise","A system on a whiteboard. Draw the DFD, mark trust boundaries, STRIDE the crossings, prioritise."],
   ["Security system design","45-60 minutes on an open problem. Use C-A-T-C-D-T. This round carries the most weight at Principal level."],
   ["Leadership / behavioral","Conflict, influence without authority, failure, strategy. STAR-L with numbers."],
   ["Bar raiser / executive","Can you explain risk to a CFO? Do you raise the bar for the whole org?"]].forEach(function(p){h+="<div class='panel'><h3>"+p[0]+"</h3><p class='muted' style='margin:0'>"+p[1]+"</p></div>"});
  h+="</div><h2>How to use each tool</h2><div class='grid2'>";
  [["Topics","Plain-language explanation, analogy, key concepts, how it works, AWS mapping, real breaches, common mistakes, then interview questions with model answers."],
   ["Question bank","Every question in one place. Filter by level: Basic, Advanced, Scenario, Design."],
   ["Mock interview","A random question with a timer. Answer out loud or in the notes box, then compare with the model answer and rate yourself."],
   ["Flashcards and quiz","For spaced revision. Cards you mark 'Got it' can be hidden so you focus on weak ones."]].forEach(function(p){h+="<div class='panel'><h3>"+p[0]+"</h3><p class='muted' style='margin:0'>"+p[1]+"</p></div>"});
  h+="</div><p class='muted' style='font-size:13px'>Standards checked as of September 2026: NIST CSF 2.0, OWASP Top 10:2025, OWASP LLM Top 10 2025, OWASP Agentic Top 10 2026, PCI DSS 4.0.1, NIST PQC FIPS 203-205, India DPDP Rules 2025. Progress is saved in this browser only.</p></div>";
  main.innerHTML=h;
}

/* ---------- Topic ---------- */
function vTopic(t,scrollTo){
  var i=T.indexOf(t),prev=T[i-1],next=T[i+1];
  var isDone=done.has(t.id);
  var h="<article class='col'><header class='t-head'><div class='eyebrow'><span class='tid'>T"+pad(t.n)+"</span>"+esc(t.domain)+" · Week "+t.week+"</div><h1>"+esc(t.title)+"</h1><p class='fw'>"+esc(t.fw)+"</p><div class='t-actions'><button class='btn' id='doneBtn' aria-pressed='"+isDone+"'>"+(isDone?"✓ Studied":"Mark as studied")+"</button><a class='btn' href='#quiz."+t.id+"'>Quiz this topic</a><a class='btn' href='#flashcards."+t.id+"'>Flashcards</a></div></header>";
  var myL=LESSONS.filter(function(d){return d.tid===t.id});
  var myR=RQ.filter(function(r){return r.tid===t.id});
  var secs=[["s1","Simple words"]];
  if(myL.length)secs.push(["sL","In-depth lessons ("+myL.length+")"]);
  secs.push(["s3","Key concepts"],["s4","How it works"]);
  if(t.aws.length)secs.push(["s5","AWS mapping"]);
  secs.push(["s6","Real cases"],["s7","Mistakes"]);
  if(myR.length)secs.push(["sR","Real interview questions ("+myR.length+")"]);
  secs.push(["s8","Practice questions ("+t.qs.length+")"]);
  h+="<div class='toc'>"+secs.map(function(s){return "<button data-jump='"+s[0]+"'>"+s[1]+"</button>"}).join("")+"</div>";
  h+="<section class='blk' id='s1'><h2>In simple words</h2><p class='lead'>"+t.simple+"</p><div class='analogy'><span class='lab'>Analogy</span><p>"+t.analogy+"</p></div><h3>Why interviewers ask about this</h3><p class='reading'>"+t.why+"</p></section>";

var lastQ="";
function hl(text,s){var i=text.toLowerCase().indexOf(s);if(i<0)return esc(text.slice(0,140));var a=Math.max(0,i-60);return (a?"…":"")+esc(text.slice(a,i))+"<mark>"+esc(text.slice(i,i+s.length))+"</mark>"+esc(text.slice(i+s.length,i+s.length+90))+"…"}
function vSearch(){
  var s=lastQ.trim().toLowerCase();
  var h="<div class='col sres'><div class='eyebrow'>Search</div><h1>“"+esc(lastQ)+"”</h1>";
  if(s.length<2){main.innerHTML=h+"<p class='muted'>Type at least two characters.</p></div>";return}
  var tops=[];
  T.forEach(function(t){var blob=[t.title,strip(t.simple),t.concepts.map(function(c){return c[0]+" "+strip(c[1])}).join(" "),strip(t.how),strip(t.cases),t.aws.map(function(a){return a.join(" ")}).join(" ")].join(" ");if(blob.toLowerCase().indexOf(s)>=0)tops.push({t:t,snip:hl(blob,s)})});
  var qs=QS.filter(function(q){return !q.real&&(q.q+" "+strip(q.a)).toLowerCase().indexOf(s)>=0});
  var ls=LESSONS.map(function(d){return {d:d,txt:d.title+" "+strip(d.body)}}).filter(function(x){return x.txt.toLowerCase().indexOf(s)>=0});
  var rs=RQ.filter(function(r){return (r.q+" "+r.short+" "+strip(r.a)).toLowerCase().indexOf(s)>=0});
  var gl=GLOSS.filter(function(g){return (g[0]+" "+g[1]).toLowerCase().indexOf(s)>=0});
  h+="<p class='muted'>"+ls.length+" lessons · "+rs.length+" real interview questions · "+tops.length+" topics · "+qs.length+" practice questions · "+gl.length+" glossary terms</p>";
  if(gl.length)h+="<h3>Glossary</h3><div class='gloss'>"+gl.map(function(g){return "<div><b>"+esc(g[0])+"</b>"+esc(g[1])+"</div>"}).join("")+"</div>";
  if(ls.length)h+="<h3>In-depth lessons</h3>"+ls.map(function(x){return "<a class='hit' href='#l."+x.d.i+"'><b>L"+pad(x.d.i+1)+" · "+esc(x.d.title)+"</b><span class='snip'>"+hl(x.txt,s)+"</span></a>"}).join("");
  if(rs.length)h+="<h3>Real interview questions</h3><div class='qlist'>"+rs.map(function(r){return rqItem(r)}).join("")+"</div>";
  if(tops.length)h+="<h3>Topics</h3>"+tops.map(function(x){return "<a class='hit' href='#t."+x.t.id+"'><b>T"+pad(x.t.n)+" · "+esc(x.t.title)+"</b><span class='snip'>"+x.snip+"</span></a>"}).join("");
  if(qs.length)h+="<h3>Questions</h3><div class='qlist'>"+qs.map(function(q){return qItem(q,true)}).join("")+"</div>";
  if(!tops.length&&!qs.length&&!gl.length&&!ls.length&&!rs.length)h+="<p>No matches. Try a shorter or different term, such as an acronym.</p>";
  main.innerHTML=h+"</div>";wrapTables(main);
}
var st;
$("#q").addEventListener("input",function(){var v=this.value;clearTimeout(st);st=setTimeout(function(){lastQ=v;if(v.trim().length>=2){if(route()!=="search")location.hash="search";else vSearch()}},220)});
$("#q").addEventListener("keydown",function(e){if(e.key==="Enter"){lastQ=this.value;if(route()!=="search")location.hash="search";else vSearch()}});

/* ---------- Router ---------- */
function route(){return (location.hash||"#roadmap").slice(1)}
function render(){
  var r=route();clearInterval(mk.iv);
  var parts=r.split(".");
  var railKey=r;var keepScroll=false;
  if(parts[0]==="t"&&byId[parts[1]])vTopic(byId[parts[1]]);
  else if(parts[0]==="l"&&LESSONS[+parts[1]]){var L=LESSONS[+parts[1]];vTopic(byId[L.tid],"lesson-"+L.i);railKey="t."+L.tid;keepScroll=true}
  else if(parts[0]==="r"&&RQ[+parts[1]]){var R=RQ[+parts[1]];rf.cat="all";rf.s="";vReal();railKey="real";keepScroll=true;setTimeout(function(){var el=document.getElementById("rq-"+R.i);if(el){el.open=true;el.scrollIntoView({block:"start"})}},30)}
  else if(parts[0]==="real")vReal();
  else if(parts[0]==="lessons")vLessons();
  else if(parts[0]==="questions")vQuestions();
  else if(parts[0]==="flashcards"){vFlash(byId[parts[1]]?parts[1]:null);railKey="flashcards"}
  else if(parts[0]==="quiz"){vQuiz(byId[parts[1]]?parts[1]:null);railKey="quiz"}
  else if(parts[0]==="mock")vMock();
  else if(parts[0]==="design")vDesign();
  else if(parts[0]==="glossary")vGloss();
  else if(parts[0]==="cheatsheet")vCheat();
  else if(parts[0]==="search")vSearch();
  else {vRoadmap();railKey="roadmap"}
  renderRail(railKey);
  if(!keepScroll)window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
})();
</script>
