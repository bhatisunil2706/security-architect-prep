TOPICS.push({
id:"leadership", n:19, title:"Principal-Level Leadership", domain:"Architect Craft", week:8,
fw:"Architecture Decision Records · Staff/Principal engineering archetypes · Influence without authority",
simple:"At Principal level your impact comes through other people: setting direction, making decisions others can follow, raising the bar across many teams, and translating between executives and engineers. You will rarely be the one fixing the bug; you will be the one making sure that bug class never happens again.",
analogy:"A city planner does not build houses. They decide the zoning, the roads, the water pipes, and the building codes so thousands of builders can work quickly and safely.",
why:"Every Principal loop has a leadership or 'bar raiser' round. They check scope of impact (org-wide, not team-level), how you handle conflict and ambiguity, and whether you multiply others.",
concepts:[
["ADR","Architecture Decision Record: context, decision, alternatives considered, consequences. Short, versioned, discoverable."],
["Security strategy","3-year vision → yearly objectives → quarterly initiatives, tied to business risk and measurable."],
["Paved road / golden path","Secure-by-default platform components teams choose because they are easier."],
["Guardrails vs gates","Guardrails prevent disaster automatically without slowing flow; gates are manual approvals. Prefer guardrails."],
["Influence without authority","Build coalitions, use data, understand others' goals, write clearly, give credit."],
["Risk communication","Translate technical issues into business impact, options, and a recommendation."],
["Disagree and commit","Voice disagreement with data, then support the decision fully once made (with risk documented)."],
["Mentoring","Growing security champions and engineers; raising the org's capability."],
["Build vs buy","Commodity security capabilities are usually bought; differentiating ones built. Consider total cost of ownership."],
["Staff archetypes","Tech lead, architect, solver, right hand (Will Larson's model). Know which you are."]
],
how:`<p><b>ADR template:</b></p>
<pre>Title: Use AWS IAM Identity Center with Okta for workforce AWS access
Status: Accepted (2026-03-10)
Context: 180 accounts, IAM users with keys, audit finding on stale access
Decision: Federate Okta to Identity Center; permission sets per job role;
          SCP denies iam:CreateUser / CreateAccessKey
Alternatives: per-account SAML federation (rejected: management overhead);
              keep IAM users (rejected: key sprawl)
Consequences: + central offboarding, MFA, no keys; - migration effort 6 weeks,
              CI pipelines must move to OIDC first</pre>
<p><b>Framing any risk for executives (the 4-part message):</b> What is happening (plain words) → Business impact (money, customers, regulators) → Options with cost and risk reduction → My recommendation and what I need from you.</p>
<p><b>Handling pushback from a senior engineering leader:</b> seek to understand their constraint; find the shared goal (shipping safely); offer options rather than 'no'; bring data; escalate only with a documented risk and both options, never as an ambush.</p>`,
aws:[],
cases:`<p><b>Example of org-wide impact story:</b> 'I noticed 60% of our pen-test findings were access control bugs. Instead of fixing them one by one, I led the design of a shared authorisation library and a Cedar-based policy service, got 3 pilot teams on board, wrote the ADR, and built adoption through champions. Within 12 months 40 services used it and access-control findings dropped by 70%.'</p>`,
mistakes:["Being the 'Department of No'.","Solving every problem personally (does not scale).","Strategy with no metrics.","Writing 30-page documents nobody reads.","Escalating before trying to align."],
hook:"Direction, decisions, leverage, and translation between business and engineering.",
qs:[
{l:"advanced",q:"How do you decide what to work on as a Principal engineer?",a:"I look for the intersection of highest business risk, org-wide leverage, and problems nobody else is positioned to solve. Inputs: risk register, incident and pen-test trends, business roadmap (new markets, products, AI), and conversations with engineering leaders. I prefer work that removes a whole class of risk or unlocks many teams (e.g. a workload identity platform) over one-off projects. I keep a small portfolio: one or two big strategic bets, some mentoring and reviews, and a reserve for incidents. I review it quarterly with my manager.",t:"Scope and prioritisation."},
{l:"advanced",q:"How do you write a security strategy?",a:"Start from business strategy and risk: what is the company trying to do in 3 years and what could stop it. Assess current state (CSF 2.0 profile, incidents, audits, threat landscape). Define 4-6 strategic themes (e.g. identity-first security, secure-by-default platforms, data protection, resilience, AI security), each with target outcomes and metrics. Build a phased roadmap with investments and dependencies. Socialise it with engineering, product, risk and finance before presenting. Review progress quarterly and adjust. Keep it to a few pages plus a one-page summary.",t:"Strategic thinking."},
{l:"scenario",q:"A director wants to launch a feature you believe has a serious security flaw. They outrank you. What do you do?",a:"First make sure I understand the business goal and deadline, and confirm the flaw with evidence (a proof of concept if possible). Then present options, not just objections: e.g. launch with the feature flag limited to a subset, add a compensating control (rate limits, extra monitoring), or a two-week fix. If they still choose to launch, I document the risk in business terms and ask the accountable owner to formally accept it; if it exceeds the organisation's risk appetite, I escalate transparently through the agreed risk process, telling the director I am doing so. Then I help make the launch as safe as possible. I would never silently block or go around them.",t:"Integrity and influence."},
{l:"scenario",q:"How have you scaled security knowledge across an organisation?",a:"Structure the answer as a program: security champions network (one per team, monthly sessions, recognition, small time allocation agreed with managers); secure design templates and paved roads; internal documentation and short videos; brown-bag sessions on real incidents; office hours; embedding security reviews in design doc templates. Measure: number of active champions, % designs with threat models, reduction of recurring findings, developer satisfaction. Give a concrete personal example with numbers.",t:"Multiplier effect."}
],
quiz:[
{q:"An ADR should include:",o:["Only the decision","Context, decision, alternatives, consequences","Source code","Meeting minutes"],c:1,e:"Alternatives and consequences make decisions reviewable later."},
{q:"Guardrails are preferred over gates because:",o:["They are cheaper licences","They prevent problems automatically without slowing delivery","Auditors require them","They need approvals"],c:1,e:"Automated prevention scales; manual gates create queues."}
]
});

TOPICS.push({
id:"behavioral", n:20, title:"Behavioral Interviews (STAR)", domain:"Architect Craft", week:8,
fw:"STAR / STAR-L method · Leadership principles style questions",
simple:"Behavioral questions ask about real past situations: 'Tell me about a time you...'. Use <b>STAR</b>: Situation, Task, Action, Result, and add <b>L</b> for Learning. Prepare 8-10 strong stories from your 11+ years that you can adapt to many questions.",
analogy:"A good story is like a well-written incident report: context, your role, what you did and why, measurable outcome, what changed afterwards.",
why:"Senior hiring decisions often hinge on behavioral rounds. With 11+ years, you have great material; the risk is rambling. Practice concise 2-3 minute stories with numbers and a clear 'I' (not only 'we').",
concepts:[
["Situation (15%)","Brief context: company, scale, problem, stakes."],
["Task (10%)","Your specific responsibility or goal."],
["Action (50%)","What YOU did, decisions, trade-offs, how you influenced others. Most of the time goes here."],
["Result (20%)","Quantified outcome: %, time, money, risk reduced, adoption."],
["Learning (5%)","What you would do differently or what you now do systematically."],
["Story bank","Prepare stories for: conflict, failure, influence, ambiguity, big impact, incident, mentoring, tough trade-off, disagreeing with a boss, delivering under pressure."],
["Principal signal","Scope beyond your team, long-term thinking, multiplying others, handling ambiguity."]
],
how:`<p><b>Your story bank worksheet (fill these 10 from your career):</b></p>
<table><tr><th>#</th><th>Theme</th><th>Prompt to recall your story</th></tr>
<tr><td>1</td><td>Biggest impact</td><td>A security initiative that changed the whole org's risk posture</td></tr>
<tr><td>2</td><td>Incident</td><td>A serious incident where you led or made key decisions</td></tr>
<tr><td>3</td><td>Conflict</td><td>A strong disagreement with an engineering or product leader</td></tr>
<tr><td>4</td><td>Failure</td><td>A decision that went wrong and what you changed</td></tr>
<tr><td>5</td><td>Influence without authority</td><td>Getting many teams to adopt something you did not own</td></tr>
<tr><td>6</td><td>Ambiguity</td><td>A vague problem you turned into a clear plan</td></tr>
<tr><td>7</td><td>Trade-off</td><td>Accepting risk to meet a business deadline, responsibly</td></tr>
<tr><td>8</td><td>Mentoring</td><td>Growing an engineer or building a champions program</td></tr>
<tr><td>9</td><td>Executive communication</td><td>Explaining risk to leadership and getting investment</td></tr>
<tr><td>10</td><td>Technical depth</td><td>The hardest technical security problem you solved</td></tr></table>
<p><b>Tips:</b> use 'I' for your actions; include numbers; keep each story under 3 minutes; have a 30-second version; prepare follow-ups ('what would you do differently?'); be honest about failures and show what you learned.</p>`,
aws:[],
cases:`<p><b>Example STAR answer (conflict):</b> <i>S:</i> Our payments team planned to store card numbers in a new analytics database for fraud models, launching in 6 weeks. <i>T:</i> As staff security engineer I owned the PCI architecture. <i>A:</i> Instead of saying no, I met the data science lead to understand the need: they needed consistent identifiers, not actual card numbers. I proposed keyed-HMAC tokens computed at ingestion, built a proof of concept in a week, and got QSA confirmation that the analytics platform would stay out of PCI scope. <i>R:</i> Launched on time, avoided expanding PCI scope to about 40 more systems (saving an estimated 3 months of audit work), and the pattern became our standard. <i>L:</i> I now involve data teams earlier in the roadmap.</p>`,
mistakes:["Saying 'we' for everything.","No numbers.","Long setup, short action.","Blaming others in conflict stories.","Choosing a 'failure' that is really a humble-brag."],
hook:"STAR-L, mostly Action, always numbers, always 'I'.",
qs:[
{l:"scenario",q:"Tell me about a time you failed.",a:"<b>Structure:</b> pick a real failure with meaningful stakes, own it, show learning that changed behaviour. <b>Example shape:</b> 'I rolled out a mandatory SAST gate across 50 repos to cut vulnerabilities. I did not tune rules first, false positives were high, builds were blocked, and teams bypassed the tool. I owned it: switched to audit mode, worked with 3 teams to tune rules to high-confidence checks, then re-introduced blocking only for secrets and critical injection rules. Adoption went to 95% and developer complaints dropped. Now I always pilot with a few teams and measure false-positive rates before enforcing any control.'",t:"Self-awareness and growth."},
{l:"scenario",q:"Tell me about a time you influenced a decision without authority.",a:"Show understanding of stakeholders, data, and coalition-building. Shape: the problem and why it mattered to the business; stakeholders and their concerns; how you used data (incident trends, cost), a pilot or prototype, and allies; how you handled resistance; the decision and measurable outcome; what you learned about influence.",t:"Principal-level influence."},
{l:"scenario",q:"Why do you want to move to a Security Architect / Principal role?",a:"Connect your experience to the scope of the role: 'Over 11 years, especially as a Staff engineer, I found my biggest impact came from fixing classes of problems rather than instances, e.g. [example]. I want a role where that is the core job: setting security architecture direction across the organisation, building paved roads, and partnering with engineering leadership. I am energised by areas like cloud identity and AI security where architecture choices matter most.' Keep it positive and specific to the company.",t:"Motivation and fit."},
{l:"scenario",q:"Describe a situation where you had to make a decision with incomplete information.",a:"Show your decision process: what you knew, what you did not, the cost of waiting vs acting, how you reduced uncertainty quickly (time-boxed investigation), the reversible vs irreversible nature of the decision, who you consulted, the decision, and how you monitored and adjusted. Incident examples work well: e.g. deciding to rotate all production secrets within 2 hours after a CI compromise before full scoping was complete.",t:"Judgement under ambiguity."}
],
quiz:[
{q:"In STAR, which part should take most of your time?",o:["Situation","Task","Action","Result"],c:2,e:"About half the answer should be what you did and why."}
]
});

{id:"d1", title:"Multi-tenant SaaS: tenant isolation", prompt:"Design a B2B SaaS platform on AWS serving 2,000 enterprise tenants. Some large tenants demand strong isolation and their own keys.",
clarify:["How sensitive is tenant data (PII, financial)?","Do tenants have compliance needs (SOC 2, ISO, DPDP, HIPAA)?","Tenant size distribution: few large, many small?","Do tenants need BYOK/HYOK?","Regions and data residency?"],
threats:["Cross-tenant data access (BOLA with tenant ID, shared cache keys, misrouted queries)","Noisy neighbour / resource exhaustion (DoS)","Compromise of shared services reaching all tenants","Tenant admin account takeover","Insider/support staff over-access"],
diagram:`Tenant users --SSO (SAML/OIDC per tenant IdP)--> Auth service (issues JWT with tenant_id)
      |
CloudFront + WAF (per-tenant rate limits)
      |
API Gateway / ALB --> Stateless services (tenant context from token only)
      |                         |
      |              Policy check: tenant_id in token == resource tenant
      v                         v
 Pool tier:  shared DB, row-level security (tenant_id), per-tenant DEKs
 Silo tier:  dedicated account/VPC/DB per premium tenant, tenant CMK
      |
 Logs tagged with tenant_id -> Security Lake -> SIEM`,
controls:["<b>Tiered isolation model:</b> pool (shared infrastructure, logical isolation) for small tenants; bridge (shared compute, dedicated database/schema); silo (dedicated AWS account) for premium/regulated tenants. Same code, deployment templates differ.","<b>Tenant context:</b> derived only from the authenticated token, never from request parameters; propagated through services; every data access function requires tenant context.","<b>Data layer:</b> PostgreSQL row-level security keyed on a session tenant variable, plus a repository layer enforcing it (two independent checks). Cache keys prefixed by tenant.","<b>Dynamic IAM scoping:</b> services assume a role with a session tag tenant_id; IAM policies use aws:PrincipalTag to restrict S3 prefixes/DynamoDB leading keys to that tenant, so even a code bug cannot read another tenant's objects.","<b>Keys:</b> per-tenant data keys; premium tenants get their own KMS CMK (BYOK via key import or XKS for HYOK) so they can revoke access (crypto-shredding on offboarding).","<b>Identity:</b> per-tenant IdP federation, tenant admin roles, SCIM, enforced MFA for tenant admins.","<b>Resource fairness:</b> per-tenant quotas, rate limits, and concurrency caps.","<b>Support access:</b> just-in-time, tenant-approved, time-bound, logged and visible to the tenant."],
detect:["Alert on any query returning rows from more than one tenant in a single request (instrument the data layer)","Cross-tenant access attempts rejected by policy (spike = attack or bug)","Tenant admin anomalies, bulk exports","Customer-facing audit logs"],
tradeoffs:["Silo is costly and slower to operate but simplest to prove isolation; pool is efficient but needs rigorous testing.","Tenant-specific keys add KMS cost and latency; use data key caching.","Automated cross-tenant tests in CI (tenant A token against tenant B IDs) are a must."]},

{id:"d2", title:"Zero trust for 50,000 employees", prompt:"Design a zero trust architecture for a global company of 50,000 employees with hybrid work, on-prem data centres and AWS.",
clarify:["Current state: VPN, AD, IdP?","Device fleet: managed laptops, BYOD, mobile?","App mix: SaaS, web apps, thick clients, legacy?","Contractors and third parties count?","Regulatory drivers?"],
threats:["Phishing and credential theft","Lateral movement after endpoint compromise","VPN appliance exploitation","Third-party/contractor access abuse","Session token theft"],
diagram:`User + Device
  | (1) SSO: IdP with phishing-resistant MFA (passkeys)
  | (2) Device posture: MDM/EDR signals (managed, patched, EDR healthy)
  v
Policy Engine (IdP conditional access + ZTNA broker)  <- signals: UEBA, threat intel
  |
PEPs: ZTNA connectors | Identity-aware proxy | SWG/CASB | AWS Verified Access
  |
Apps: SaaS (SSO + CASB) | internal web (ZTNA) | SSH/RDP (access proxy, recorded)
Workloads: microsegmentation (SG references, service mesh mTLS)
Data: classification + DLP on endpoints, SaaS, web`,
controls:["<b>Identity foundation:</b> single IdP, all apps behind SSO, passkeys/FIDO2 for everyone, admins first; kill legacy auth protocols.","<b>Device trust:</b> only managed, compliant devices reach sensitive apps; BYOD gets browser-isolated or limited access.","<b>Application access:</b> replace VPN with ZTNA per app; apps not exposed to the internet; SSE for web and SaaS traffic.","<b>Privileged access:</b> PAM, JIT elevation, session recording.","<b>Workloads:</b> microsegmentation, mTLS, workload identity.","<b>Data:</b> DLP across endpoint, SaaS and web with classification labels.","<b>Continuous evaluation:</b> risk signals re-evaluate sessions (CAEP), step-up on anomalies.","<b>Phased roadmap:</b> Year 1 identity + MFA + device posture + ZTNA for third parties; Year 2 VPN retirement + microsegmentation; Year 3 continuous adaptive policies (CISA ZTMM Advanced to Optimal)."],
detect:["ITDR on IdP logs (impossible travel, token replay, MFA changes)","EDR telemetry tied to user identity","ZTNA access logs into SIEM"],
tradeoffs:["User friction vs security: use risk-based step-up rather than constant prompts.","Legacy thick-client apps may need interim VPN or app wrappers.","Vendor consolidation (SASE) vs best-of-breed; concentration risk."]},

{id:"d3", title:"Secure payments platform (PCI DSS)", prompt:"Design a payments platform accepting card payments for an e-commerce company, minimising PCI scope, on AWS.",
clarify:["Merchant level and transaction volume?","Card-present or card-not-present?","Build own vault or use a PSP?","Refunds, recurring payments?","Regions (RBI card tokenisation rules in India)?"],
threats:["Card data theft (skimming scripts on payment page — Magecart)","API abuse: card testing, refund fraud","Insider access to card data","Compromise spreading into the CDE","Key compromise"],
diagram:`Browser --> Checkout page (CSP + script integrity monitoring)
   |  card fields in PSP-hosted iframe / hosted fields
   v
PSP (tokenises PAN) --token--> Our Payments API (API GW + WAF, fraud rules)
                                  |
                  CDE-lite accounts: payments service (tokens only)
                                  |  PrivateLink
                  Token vault (if needed): dedicated account, CloudHSM/KMS
                                  |
          Egress: Network Firewall allow-list -> PSP/acquirer only
          Logs -> Log Archive (1 yr retention, 3 months hot)`,
controls:["<b>Scope reduction first:</b> use PSP hosted fields/iframe so PAN never touches our servers (SAQ A/A-EP instead of full scope); store only tokens (network tokens where available).","<b>Payment page integrity:</b> PCI DSS 4.0 req 6.4.3 and 11.6.1: inventory and authorise scripts, strict CSP, change detection on the page.","<b>Isolation:</b> payments in dedicated AWS accounts/OU with SCPs; PrivateLink only; no internet ingress except via WAF.","<b>Access:</b> MFA for all CDE access (req 8.4.2), JIT, session recording.","<b>Keys:</b> HSM-backed, split knowledge/dual control for key ceremonies, rotation.","<b>Fraud:</b> velocity rules, 3-D Secure 2, device fingerprinting, card-testing detection (small auth attempts), WAF Fraud Control.","<b>Assurance:</b> quarterly ASV scans, annual pen test plus segmentation tests, authenticated internal scans, targeted risk analyses."],
detect:["Card-testing spikes, refund anomalies","Script changes on checkout pages","Access to token vault outside normal patterns","KMS/HSM key usage anomalies"],
tradeoffs:["PSP dependence vs control and fees.","Own vault gives flexibility (multi-PSP routing) but brings full PCI scope.","3DS friction vs fraud liability shift."]},

{id:"d4", title:"Secure data lake & analytics", prompt:"Design a secure analytics platform where 300 analysts query customer data from many source systems.",
clarify:["Data types: PII, financial, health?","Who consumes: analysts, data scientists, ML pipelines, partners?","Need for raw identifiers or pseudonymised is enough?","Residency and retention rules?"],
threats:["Over-broad analyst access to raw PII","Bulk exfiltration via query or export","Ingestion of poisoned/malicious data","Shadow copies to personal tools","Re-identification of pseudonymised data"],

                                          |  PII detection (Macie/Glue), tokenise/pseudonymise
                                          v
                                  Curated zone (pseudonymised)  --> Analysts via Athena/Redshift
                                          |  Lake Formation: column/row/tag-based access (LF-TBAC)
                                          v
                        Re-identification service (separate key, approval, logged)
Exports: controlled, watermarked, DLP; no direct S3 download for analysts`,

detect:["Unusual query volume per analyst","Access to raw zone by humans","Large exports, new external destinations"],
tradeoffs:["Analyst productivity vs privacy: offer synthetic or aggregated datasets.","Central governance vs data mesh domain ownership: central policies, federated ownership."]},

DEEP.push({tid:"iam", title:"RBAC vs ABAC vs ReBAC, explained properly (with AWS examples)", body:`
<p>This is one of the most common architect questions, and interviewers want more than definitions. They want to hear <b>how each model works mechanically, where it breaks, and how you would combine them in AWS</b>.</p>

<h3>1. RBAC: Role-Based Access Control</h3>
<p><b>Idea:</b> permissions are attached to <i>roles</i>; people get roles. You never give a permission to a person directly. "Maya is a Payments-Developer, and Payments-Developer can deploy to payments-dev."</p>
<pre>User ──member of──▶ Role ──has──▶ Permissions
Maya ──────────────▶ PaymentsDev ──▶ deploy:payments-dev, read:payments-logs</pre>
<p><b>Strengths:</b> easy to understand, easy to audit ("who has the Admin role?"), maps well to job functions and to HR data, fits access reviews and separation-of-duties rules.</p>
<p><b>Where it breaks, "role explosion":</b> suppose you have 40 teams × 3 environments × 3 access levels (read, deploy, admin). That is 360 roles. Add regions or data classifications and it multiplies again. Every new team means new roles and new policies. RBAC is static: it cannot easily say "only during business hours" or "only for resources your own team owns" without creating yet more roles.</p>

<h3>2. ABAC: Attribute-Based Access Control</h3>
<p><b>Idea:</b> access is decided by a <i>rule over attributes</i> of the subject (user), the resource, the action and the environment. One rule replaces many roles.</p>
<pre>ALLOW if  user.team        == resource.team
      and user.clearance  >= resource.classification
      and request.mfa     == true
      and device.managed  == true</pre>
<p><b>Strengths:</b> scales with growth (a new team needs no new policy, only correct tags), supports context (time, MFA, device, network), fine-grained.</p>
<p><b>Weaknesses:</b> harder to answer "who can access X?" (you must evaluate rules against all attributes); security now depends on <b>attribute integrity</b>: if a user can change their own tag or tag a resource with another team's tag, they can grant themselves access. Debugging denials is harder.</p>

<h3>3. ReBAC: Relationship-Based Access Control</h3>
<p><b>Idea:</b> access follows relationships in a graph: "Asha is an <i>editor</i> of folder F; document D is <i>in</i> folder F; therefore Asha can edit D." This is how Google Drive/Docs sharing works (Google Zanzibar). Open-source: OpenFGA, SpiceDB, Permify.</p>
<p><b>Best for:</b> end-user sharing and collaboration, hierarchies (org → project → resource), multi-tenant SaaS where customers manage their own permissions.</p>

<h3>4. How ABAC actually works in AWS IAM</h3>
<p>AWS ABAC uses <b>tags</b>. The principal's tags (<code>aws:PrincipalTag/…</code>) are compared with the resource's tags (<code>aws:ResourceTag/…</code>) or tags in the request (<code>aws:RequestTag/…</code>). One policy for all teams:</p>
<pre>{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "ManageOwnTeamInstances",
      "Effect": "Allow",
      "Action": ["ec2:StartInstances","ec2:StopInstances","ec2:RebootInstances"],
      "Resource": "*",
      "Condition": {
        "StringEquals": { "aws:ResourceTag/team": "\${aws:PrincipalTag/team}" }
      }
    },
    {
      "Sid": "CreateOnlyWithOwnTeamTag",
      "Effect": "Allow",
      "Action": ["ec2:RunInstances","ec2:CreateTags"],
      "Resource": "*",
      "Condition": {
        "StringEquals": { "aws:RequestTag/team": "\${aws:PrincipalTag/team}" },
        "ForAllValues:StringEquals": { "aws:TagKeys": ["team","env","app"] }
      }
    },
    {
      "Sid": "NobodyChangesTheTeamTag",
      "Effect": "Deny",
      "Action": ["ec2:CreateTags","ec2:DeleteTags"],
      "Resource": "*",
      "Condition": { "ForAnyValue:StringEquals": { "aws:TagKeys": ["team"] },
                     "Null": { "aws:RequestTag/team": "true" } }
    }
  ]
}</pre>
<p><b>Where do principal tags come from?</b></p>
<ul>
<li><b>IAM Identity Center:</b> "attributes for access control". The IdP (Okta/Entra ID) sends user attributes like <code>department</code>, <code>costCenter</code>, <code>team</code> in the SAML assertion; Identity Center passes them as session tags. So HR data drives access automatically.</li>
<li><b>SAML/OIDC federation:</b> session tags via <code>https://aws.amazon.com/SAML/Attributes/PrincipalTag:team</code>.</li>
<li><b>AssumeRole with session tags:</b> <code>sts:TagSession</code>; you can mark them transitive for role chaining.</li>
<li><b>Tags on IAM roles</b> for workloads.</li>
</ul>
<p><b>The golden rule of ABAC security: protect the attributes.</b> In AWS that means: deny <code>sts:TagSession</code> except from trusted IdP paths; deny changing the governance tags (team, env, data-class) except by a platform role; use tag policies in AWS Organizations to standardise keys/values; use SCPs to require tags on creation. If attributes can be forged, ABAC is worthless.</p>

<h3>5. RBAC in AWS</h3>
<p>RBAC in AWS is <b>IAM roles</b> and, for people, <b>IAM Identity Center permission sets</b> (e.g. <code>ReadOnly</code>, <code>Developer</code>, <code>SecurityAuditor</code>, <code>NetworkAdmin</code>) assigned to IdP groups per account. It is simple and auditable. Its problem at scale: permission set × account assignments explode, and fine-grained "only your team's resources" in shared accounts needs ABAC.</p>

<h3>6. What I would recommend (the answer interviewers want)</h3>
<table>
<tr><th>Layer</th><th>Model</th><th>Why</th></tr>
<tr><td>Workforce access to AWS accounts</td><td>RBAC (permission sets per job function) + account-per-workload</td><td>Account boundary does most of the isolation; roles stay few and auditable.</td></tr>
<tr><td>Shared accounts / shared resources (data lake, shared EKS, S3 prefixes)</td><td>ABAC with tags from IdP</td><td>Avoids a role per team; new teams onboard by tags.</td></tr>
<tr><td>Context (MFA, network, time, device)</td><td>ABAC conditions (aws:MultiFactorAuthPresent, aws:SourceVpce, aws:SourceIp)</td><td>RBAC cannot express context.</td></tr>
<tr><td>Customer-facing app permissions (sharing, org hierarchy)</td><td>ReBAC (OpenFGA) or Cedar with Amazon Verified Permissions</td><td>Natural fit for "who shared what with whom".</td></tr>
<tr><td>Guardrails</td><td>SCPs/RCPs (deny-based)</td><td>Cap everything regardless of model.</td></tr>
</table>
<p><b>Hybrid is normal:</b> "Roles give coarse access, attributes narrow it down." For example, a <code>DataAnalyst</code> permission set (RBAC) whose policy only allows Lake Formation tables where <code>data-domain = \${aws:PrincipalTag/domain}</code> (ABAC).</p>

<h3>7. Cedar and Amazon Verified Permissions (for your applications)</h3>
<pre>permit (
  principal in Role::"PaymentsApprover",
  action == Action::"approveRefund",
  resource
) when {
  resource.amount &lt; 50000 &&
  principal.region == resource.region &&
  context.mfa == true
};</pre>
<p>This one policy mixes RBAC (role membership), ABAC (region, amount) and context (MFA). Verified Permissions evaluates it centrally, logs every decision, and the policy language is formally analysable, so you can prove things like "no policy lets a user approve their own refund".</p>

<h3>8. Trade-off summary to say out loud</h3>
<ul>
<li>RBAC: simple, auditable, static; suffers role explosion.</li>
<li>ABAC: scalable, contextual; needs trustworthy attributes and good tooling to answer "who can access what".</li>
<li>ReBAC: natural for sharing and hierarchy; needs a dedicated authorisation service and consistency handling.</li>
<li>Architects choose per layer and usually combine them.</li>
</ul>`,
answer:"RBAC grants permissions via roles: simple and auditable but causes role explosion as teams, environments and resources multiply. ABAC evaluates rules over attributes of user, resource and context, so one policy scales to all teams, but it depends on attribute integrity and is harder to audit. In AWS I use RBAC for workforce access (Identity Center permission sets by job function, with accounts as the main boundary) and ABAC with IdP-sourced session tags for shared resources, plus context conditions like MFA and source VPC. I protect the tags with SCPs and tag policies. For application-level sharing I use ReBAC or Cedar via Verified Permissions."});

DEEP.push({tid:"iam", title:"How AWS decides allow or deny: IAM policy evaluation in depth", body:`
<p>If you understand this flow you can answer almost any AWS IAM question, including tricky cross-account ones.</p>

<h3>1. The policy types</h3>
<table>
<tr><th>Type</th><th>Attached to</th><th>Grants?</th><th>Purpose</th></tr>
<tr><td>Identity-based policy</td><td>User, group, role</td><td>Yes</td><td>What this identity can do</td></tr>
<tr><td>Resource-based policy</td><td>S3 bucket, KMS key, SQS, Lambda, role trust policy…</td><td>Yes</td><td>Who can access this resource (incl. other accounts)</td></tr>
<tr><td>Permission boundary</td><td>User or role</td><td>No, caps</td><td>Maximum an identity can have (delegated admin)</td></tr>
<tr><td>SCP</td><td>OU/account</td><td>No, caps</td><td>Maximum for all principals in account</td></tr>
<tr><td>RCP</td><td>OU/account</td><td>No, caps</td><td>Maximum for access to resources in account</td></tr>
<tr><td>Session policy</td><td>Passed at AssumeRole</td><td>No, caps</td><td>Narrow a session further</td></tr>
<tr><td>VPC endpoint policy</td><td>Endpoint</td><td>No, caps</td><td>What can pass through the endpoint</td></tr>
</table>

<h3>2. The evaluation order (same account)</h3>
<pre>1. Default = DENY (implicit)
2. Any explicit DENY in any applicable policy?  ─yes─▶ DENY (final)
3. SCPs allow it (every level from root to account)?    ─no─▶ DENY
4. RCPs allow it?                                        ─no─▶ DENY
5. Resource-based policy allows it?  → (for same account, this alone can be enough
                                         for many services, e.g. S3 bucket policy
                                         naming the role ARN)
6. Identity-based policy allows it?                      ─no─▶ DENY
7. Permission boundary allows it?                        ─no─▶ DENY
8. Session policy allows it?                             ─no─▶ DENY
9. ALLOW</pre>
<p>Remember three rules: <b>default deny</b>, <b>explicit deny always wins</b>, and <b>guardrails (SCP/RCP/boundary/session) never grant, they only cap</b>.</p>

<h3>3. Cross-account access: both sides must agree</h3>
<p>Account A's role wants to read a bucket in Account B:</p>
<ul>
<li>Account A: the role's identity policy must allow <code>s3:GetObject</code> on B's bucket ARN, and A's SCPs must allow it.</li>
<li>Account B: the bucket policy must allow A's role (or A's account), and B's RCPs must allow it.</li>
<li>If the objects are encrypted with a KMS key in B, the <b>key policy</b> in B must allow A's role to <code>kms:Decrypt</code>, and A's role must also have kms:Decrypt permission. KMS is the classic trap: bucket access works but reads fail with AccessDenied from KMS.</li>
</ul>
<p>Alternative pattern: A's role assumes a role in B (the role's <b>trust policy</b> in B allows A). Then everything is evaluated as a B principal. This is cleaner for many resources.</p>

<h3>4. Trust policies and the confused deputy problem</h3>
<pre>{
  "Effect": "Allow",
  "Principal": { "AWS": "arn:aws:iam::111122223333:root" },
  "Action": "sts:AssumeRole",
  "Condition": { "StringEquals": { "sts:ExternalId": "c7f1-unique-per-customer" } }
}</pre>
<p>A third-party SaaS (account 1111…) assumes roles in many customers' accounts. Without an <b>ExternalId</b>, a malicious customer of that SaaS could give the vendor <i>your</i> role ARN and make the vendor act on your account. The unique ExternalId (generated by the vendor per customer) prevents that. For AWS services acting on your behalf, use <code>aws:SourceArn</code> / <code>aws:SourceAccount</code> conditions (or org-wide RCPs with <code>aws:SourceOrgID</code>).</p>

<h3>5. Privilege escalation paths you must know</h3>
<table>
<tr><th>Permission</th><th>Why dangerous</th></tr>
<tr><td>iam:PassRole + ec2:RunInstances / lambda:CreateFunction</td><td>Launch compute with a more powerful role, then use its credentials</td></tr>
<tr><td>iam:CreatePolicyVersion / SetDefaultPolicyVersion</td><td>Rewrite your own policy to admin</td></tr>
<tr><td>iam:AttachRolePolicy / PutRolePolicy on own role</td><td>Grant yourself anything</td></tr>
<tr><td>iam:UpdateAssumeRolePolicy</td><td>Let yourself assume a privileged role</td></tr>
<tr><td>iam:CreateAccessKey on another user</td><td>Steal that user's identity</td></tr>
<tr><td>lambda:UpdateFunctionCode on a function with a strong role</td><td>Run code as that role</td></tr>
<tr><td>ssm:SendCommand / StartSession to privileged instances</td><td>Use the instance role</td></tr>
</table>
<p>Mitigations: restrict <code>iam:PassRole</code> with <code>iam:PassedToService</code> and specific role ARNs; permission boundaries for anyone who can create roles; SCP denying IAM changes outside a platform role; IAM Access Analyzer custom policy checks in CI (e.g. "no new policy grants iam:*").</p>

<h3>6. Useful condition keys to name in interviews</h3>
<ul>
<li><code>aws:PrincipalOrgID</code> / <code>aws:ResourceOrgID</code>: restrict to your organisation (data perimeter).</li>
<li><code>aws:SourceVpce</code>, <code>aws:SourceVpc</code>, <code>aws:SourceIp</code>: expected networks.</li>
<li><code>aws:MultiFactorAuthPresent</code>, <code>aws:MultiFactorAuthAge</code>: MFA context.</li>
<li><code>aws:SecureTransport</code>: deny non-TLS.</li>
<li><code>aws:RequestedRegion</code>: region restriction SCP.</li>
<li><code>aws:PrincipalTag</code>, <code>aws:ResourceTag</code>, <code>aws:RequestTag</code>, <code>aws:TagKeys</code>: ABAC.</li>
<li><code>aws:ViaAWSService</code>, <code>aws:CalledVia</code>: allow access only when made through a service (e.g. KMS via S3).</li>
<li><code>kms:EncryptionContext:*</code>, <code>kms:ViaService</code>: bind key use to context and service.</li>
</ul>

<h3>7. Debugging AccessDenied (practical)</h3>
<ol>
<li>Read the error: AWS now often says which policy type denied (e.g. "explicit deny in a service control policy").</li>
<li>CloudTrail event: errorCode, principal, source IP, VPC endpoint.</li>
<li>IAM Policy Simulator / Access Analyzer policy validation.</li>
<li>Check in order: explicit denies (SCP, RCP, boundary), resource policy, KMS key policy, VPC endpoint policy.</li>
</ol>`,
answer:"Default deny; any explicit deny wins; SCPs, RCPs, permission boundaries and session policies only cap; an allow must come from an identity or resource policy. Cross-account needs both sides: identity policy in the source account and resource policy (and KMS key policy) in the target. For third-party roles use ExternalId to stop confused deputy. I watch for escalation paths like iam:PassRole plus compute creation and restrict them with PassedToService conditions, boundaries and SCPs."});

DEEP.push({tid:"iam", title:"OAuth 2.0, OIDC and SAML: the flows, tokens and where they go wrong", body:`
<h3>1. Who is who</h3>
<table>
<tr><th>Role</th><th>OAuth/OIDC name</th><th>SAML name</th><th>Example</th></tr>
<tr><td>The user</td><td>Resource owner / End-user</td><td>Principal</td><td>You</td></tr>
<tr><td>The app you log in to</td><td>Client / Relying Party</td><td>Service Provider (SP)</td><td>Jira, your web app</td></tr>
<tr><td>Login server</td><td>Authorization Server / OpenID Provider</td><td>Identity Provider (IdP)</td><td>Okta, Entra ID, Cognito</td></tr>
<tr><td>The API</td><td>Resource Server</td><td>(n/a)</td><td>Your orders API</td></tr>
</table>

<h3>2. Which flow for which client (very common question)</h3>
<table>
<tr><th>Client</th><th>Flow</th><th>Notes</th></tr>
<tr><td>Server-side web app</td><td>Authorization Code (+ PKCE)</td><td>Confidential client; authenticate with private_key_jwt or client secret</td></tr>
<tr><td>Single-page app (React)</td><td>Authorization Code + PKCE, ideally via a BFF</td><td>Keep tokens out of the browser; BFF holds tokens, browser gets HttpOnly cookie</td></tr>
<tr><td>Mobile app</td><td>Authorization Code + PKCE via system browser (AppAuth)</td><td>Never embedded webviews for login; no client secret in app</td></tr>
<tr><td>Service to service</td><td>Client Credentials</td><td>Prefer mTLS or private_key_jwt; or platform workload identity</td></tr>
<tr><td>TV / CLI / IoT</td><td>Device Authorization Grant</td><td>User approves on another device; watch for device-code phishing</td></tr>
<tr><td>Service calling another on behalf of a user</td><td>Token Exchange (RFC 8693)</td><td>Downscoped token with new audience</td></tr>
<tr><td>Legacy</td><td>Implicit, Password grant</td><td>Removed in OAuth 2.1, do not use</td></tr>
</table>

<h3>3. The three token types</h3>
<ul>
<li><b>ID token</b> (OIDC, always a JWT): for the <i>client</i>, says who logged in. Validate iss, aud (your client_id), exp, nonce, signature. Never send it to APIs as an access token.</li>
<li><b>Access token</b>: for the <i>API</i>. Can be a JWT (self-contained) or opaque (API calls introspection endpoint). Short-lived (5-60 min). API validates aud = itself and scopes.</li>
<li><b>Refresh token</b>: for getting new access tokens without re-login. Long-lived, must be stored securely, rotated on each use with reuse detection (if an old one is reused, revoke the whole family: sign of theft).</li>
</ul>

<h3>4. SAML in one picture (SP-initiated)</h3>
<pre>1. User opens app (SP) → not logged in
2. SP redirects browser to IdP with AuthnRequest
3. User logs in at IdP (MFA)
4. IdP posts a signed XML Assertion (subject, attributes, audience, NotOnOrAfter) to SP's ACS URL
5. SP validates signature, audience, time, InResponseTo, then creates its own session</pre>
<p><b>SAML attacks to know:</b> XML Signature Wrapping (attacker moves the signed element and inserts an unsigned one the SP reads), missing audience check, replay of assertions, accepting unsigned assertions, IdP-initiated SSO being abused (no InResponseTo check). Mitigation: mature libraries, strict validation, short lifetimes.</p>

<h3>5. JWT attacks to know</h3>
<ul>
<li><code>alg: none</code> accepted.</li>
<li>Algorithm confusion: server expects RS256 but library accepts HS256 and uses the public key as HMAC secret.</li>
<li><code>kid</code> / <code>jku</code> / <code>x5u</code> header injection pointing to attacker keys.</li>
<li>No audience check: token for API A accepted by API B.</li>
<li>Weak HMAC secrets brute-forced offline.</li>
<li>Sensitive data in the payload (it is only Base64, anyone can read it).</li>
</ul>

<h3>6. Where tokens should live in a browser</h3>
<table><tr><th>Storage</th><th>Risk</th></tr>
<tr><td>localStorage / sessionStorage</td><td>Any XSS reads it and sends it away</td></tr>
<tr><td>JS memory only</td><td>Better, lost on refresh; XSS can still use it while page is open</td></tr>
<tr><td>HttpOnly, Secure, SameSite=Lax/Strict cookie (session to BFF)</td><td>Best: JS cannot read it; add CSRF defence for state-changing requests</td></tr></table>

<h3>7. Stolen tokens: sender-constrained tokens</h3>
<p>A bearer token works for whoever holds it. <b>DPoP</b> (RFC 9449) or <b>mTLS-bound tokens</b> (RFC 8705) bind the token to a key the client holds, so a stolen token is useless without the private key. Use for high-value APIs (banking, admin).</p>

<h3>8. SSO session vs app session vs token lifetime</h3>
<p>Logging out of one app does not end the IdP session; revoking an IdP session does not kill app sessions already created. Design for: short app sessions for sensitive apps, back-channel logout (OIDC) or Shared Signals/CAEP events for revocation, and re-authentication for sensitive actions (<code>max_age</code>, <code>acr_values</code> for step-up MFA).</p>`,
answer:"SAML and OIDC are for authentication and federation; OAuth 2.0 is for delegated API authorisation. Use auth code + PKCE for web, SPA (via BFF) and mobile, client credentials or workload identity for machines, token exchange for downstream calls. ID tokens are for the client, access tokens for APIs with audience checks, refresh tokens are rotated with reuse detection. I defend against alg confusion, missing aud checks, XML signature wrapping, and token theft with HttpOnly cookies, short lifetimes and DPoP/mTLS binding for high-value APIs."});

DEEP.push({tid:"iam", title:"Machine and workload identity: killing static credentials", body:`
<p>In most cloud breaches the stolen credential is not a human password; it is an access key, a CI token, or a secret in a config file. The architectural goal: <b>every workload proves its identity using something the platform gives it, and receives short-lived credentials</b>.</p>

<h3>The options on AWS and beyond</h3>
<table>
<tr><th>Where the workload runs</th><th>Mechanism</th><th>How it works</th></tr>
<tr><td>EC2</td><td>Instance profile (IAM role)</td><td>IMDS provides rotating STS credentials. Enforce IMDSv2.</td></tr>
<tr><td>Lambda / ECS / Fargate</td><td>Execution/task role</td><td>Credentials injected by the service.</td></tr>
<tr><td>EKS pods</td><td>EKS Pod Identity (newer, simpler) or IRSA</td><td>Service account mapped to IAM role; IRSA uses the cluster's OIDC provider and a projected token, exchanged via sts:AssumeRoleWithWebIdentity.</td></tr>
<tr><td>On-prem servers / other clouds</td><td>IAM Roles Anywhere</td><td>X.509 certificate from your private CA exchanged for STS credentials.</td></tr>
<tr><td>GitHub Actions / GitLab CI</td><td>OIDC federation</td><td>Per-job OIDC token; role trust restricts repo/branch/environment via the <code>sub</code> claim.</td></tr>
<tr><td>Cross-platform microservices</td><td>SPIFFE/SPIRE</td><td>Workload attestation (node + process), issues short-lived X.509 SVIDs used for mTLS.</td></tr>
<tr><td>Azure / GCP calling AWS</td><td>Web identity federation</td><td>Their workload identity token trusted by an AWS IAM OIDC provider.</td></tr>
</table>

<h3>GitHub Actions trust policy (know how to write it)</h3>
<pre>{
  "Effect": "Allow",
  "Principal": { "Federated": "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com" },
  "Action": "sts:AssumeRoleWithWebIdentity",
  "Condition": {
    "StringEquals": {
      "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
      "token.actions.githubusercontent.com:sub": "repo:acme/payments:environment:production"
    }
  }
}</pre>
<p><b>Common mistake:</b> using <code>StringLike</code> with <code>repo:acme/*</code> or forgetting the sub condition, which lets any repository (or any GitHub user's repo!) assume the role.</p>

<h3>When secrets cannot be avoided</h3>
<ul>
<li>Store in <b>AWS Secrets Manager</b> (or Vault), encrypted with a CMK, access by IAM role only.</li>
<li>Automatic rotation (Lambda rotation functions; RDS managed rotation).</li>
<li>Prefer <b>dynamic secrets</b>: Vault database engine creates a user per request with a TTL; RDS IAM authentication gives 15-minute tokens.</li>
<li>Never in code, images, env vars in Git, or CI logs; secret scanning with push protection.</li>
<li>Monitor: GetSecretValue by unusual principals; honey secrets.</li>
</ul>

<h3>Metrics to show maturity</h3>
<p>Number of IAM users with access keys (target zero), age of oldest key, % pipelines using OIDC, % services on workload identity, secrets rotated in the last 90 days.</p>`,
answer:"Workloads should never hold static keys. On AWS: instance/task/execution roles, EKS Pod Identity or IRSA for pods, Roles Anywhere with X.509 for on-prem, OIDC federation for CI with the sub claim pinned to repo and environment. Across platforms, SPIFFE/SPIRE for mTLS identities. Remaining secrets live in Secrets Manager with rotation, preferably dynamic short-lived credentials, and I track IAM user keys down to zero."});

DEEP.push({tid:"iam", title:"Privileged access on AWS: break-glass, just-in-time and the root user", body:`
<h3>Root user of every account</h3>
<ul>
<li>With AWS Organizations you can now <b>centrally manage root access</b>: remove root credentials from member accounts and perform privileged root tasks (like unlocking a bucket policy that locks everyone out) from the management/delegated account.</li>
<li>For the management account: hardware MFA (FIDO2 keys, two of them), password in a vault with dual control, no access keys, alarms on any root login (CloudTrail → EventBridge → page security).</li>
</ul>
<h3>Standing access vs just-in-time</h3>
<p>Standing admin rights are the biggest blast-radius multiplier: phish one admin and you own everything. Just-in-time (JIT) means users request elevated access for a period with justification and approval.</p>
<pre>Engineer → request "ProdAdmin in payments-prod for 2h, ticket INC-4421"
   → approver (on-call lead) approves in Slack/portal
   → Identity Center assignment created (or group membership added)
   → session starts, all actions in CloudTrail tagged with the user
   → auto-revoked after 2h, summary sent to security</pre>
<p>On AWS this is done with the <b>TEAM</b> open-source solution (Temporary Elevated Access Management) for Identity Center, or with PAM tools (CyberArk, Okta/Entra PIM, Teleport) managing group membership.</p>
<h3>Break-glass</h3>
<ul>
<li>For when the IdP or Identity Center is down. Two break-glass IAM users or roles in the management/security account, hardware MFA, credentials sealed with dual control.</li>
<li>Any use triggers an immediate high-severity alert. Test quarterly so they work on the worst day.</li>
</ul>
<h3>Session security</h3>
<p>Short session durations for admin permission sets (1 hour), phishing-resistant MFA at the IdP, SSM Session Manager for shell access (logged to S3/CloudWatch, no SSH keys, no open ports), and separate admin identities or at least separate browser profiles for privileged work.</p>`,
answer:"No standing admin: JIT elevation through Identity Center (e.g. the TEAM solution or a PAM product) with approval, time limits and full CloudTrail attribution. Root credentials centrally managed or locked with hardware MFA and alerting on any use. Two tested break-glass identities for IdP outages. Short admin session durations and SSM Session Manager instead of SSH."});

/* Deep-dive lessons: Cloud (topic cloud) */
DEEP.push({tid:"cloud", title:"How to build a security infrastructure on AWS from scratch", body:`
<p>This is the classic "how would you build security infra" question. The strong answer is <b>phased and prioritised</b>, covers <b>people, process and technology</b>, and treats the platform as a product. Below is the blueprint I would walk through, with what to do first and why.</p>

<h3>Step 0: Understand the business (first 2 weeks)</h3>
<ul>
<li>What do we sell, what data do we hold (PII, card, health), which regulations (DPDP, PCI, SOC 2 customers ask for)?</li>
<li>Where do we run today (one AWS account? many? on-prem?), how many engineers, how do they deploy?</li>
<li>What are the crown jewels and the top 5 risks? What has already gone wrong (incidents, audit findings)?</li>
</ul>

<h3>Step 1: Foundation — organisation and accounts (weeks 1-6)</h3>
<pre>AWS Organization (management account: billing + org only, nothing runs here)
├── Security OU
│   ├── log-archive        ← org CloudTrail, Config, VPC Flow, ALB/WAF logs (Object Lock)
│   └── security-tooling   ← delegated admin for GuardDuty, Security Hub, Inspector,
│                             Macie, Detective, Access Analyzer, Firewall Manager
├── Infrastructure OU
│   ├── network-hub        ← Transit Gateway, egress VPC, Network Firewall, DNS
│   └── shared-services    ← CI/CD, artifact repos, directory
├── Workloads OU
│   ├── Prod OU   (payments-prod, orders-prod, …)
│   └── NonProd OU (payments-dev, payments-stage, …)
├── Sandbox OU   (budget-capped, no connectivity to prod)
├── Policy-Staging OU  (test SCPs before rollout)
└── Suspended OU (deny-all)</pre>
<p><b>Why accounts?</b> The account is AWS's hardest isolation boundary: separate IAM, separate quotas, separate blast radius, clean billing and audit scope. Use Control Tower or Terraform (AFT / Landing Zone Accelerator) to vend accounts with a baseline automatically.</p>

<h3>Step 2: Identity (weeks 1-6, in parallel)</h3>
<ul>
<li>IAM Identity Center federated with the corporate IdP (Okta/Entra) via SAML + SCIM. Phishing-resistant MFA at the IdP.</li>
<li>Permission sets per job function: ReadOnly, Developer, Operator, SecurityAudit, NetworkAdmin, BreakGlass. Assigned to IdP groups, not people.</li>
<li>No IAM users. SCP to deny <code>iam:CreateUser</code> and <code>iam:CreateAccessKey</code> (except a tightly controlled path).</li>
<li>CI/CD uses OIDC federation. Workloads use roles.</li>
<li>Root access centrally managed; break-glass tested.</li>
</ul>

<h3>Step 3: Guardrails (weeks 3-8)</h3>
<p><b>Preventive (stop it happening):</b></p>
<ul>
<li>SCPs: deny leaving the org; deny disabling CloudTrail, Config, GuardDuty, Security Hub; region restriction; deny root; require IMDSv2; deny public AMI/snapshot sharing (declarative policies); protect security roles from modification.</li>
<li>RCPs: deny access to S3/KMS/Secrets Manager/SQS/STS from outside the org; enforce TLS.</li>
<li>Account-level S3 Block Public Access; EBS encryption by default.</li>
<li>IaC policy checks in pipelines (Checkov, cfn-guard, OPA) so bad configs never deploy.</li>
</ul>
<p><b>Detective (find drift):</b> Config rules + Security Hub CSPM standards (AWS Foundational Security Best Practices, CIS). <b>Corrective:</b> EventBridge + Lambda/SSM automation for safe fixes (e.g. re-enable Block Public Access), with care to avoid breaking production.</p>

<h3>Step 4: Logging and detection (weeks 2-10)</h3>
<ul>
<li>Organization CloudTrail (management events all regions, data events for sensitive S3 buckets and Lambda) → log-archive bucket with Object Lock, KMS key only security can manage.</li>
<li>GuardDuty org-wide with protection plans (S3, EKS, Runtime Monitoring, Malware Protection, RDS, Lambda), auto-enable for new accounts.</li>
<li>Security Hub as the finding aggregator; Inspector for vulnerabilities; Macie for sensitive data; IAM Access Analyzer for external and unused access.</li>
<li>Security Lake (OCSF) → SIEM. VPC Flow Logs, Route 53 Resolver logs, WAF, EKS audit logs.</li>
<li>Routing: high-severity findings → on-call; medium → owning team's queue with SLA.</li>
</ul>

<h3>Step 5: Network (weeks 4-12)</h3>
<ul>
<li>IPAM for non-overlapping CIDRs; VPC per account; Transit Gateway hub-and-spoke with route-table segmentation (prod cannot reach dev).</li>
<li>Centralised egress through Network Firewall with domain allow-lists; centralised inspection for east-west if required.</li>
<li>Interface/Gateway VPC endpoints with endpoint policies; Route 53 Resolver DNS Firewall.</li>
<li>Ingress only via CloudFront/ALB with WAF and Shield; no SSH/RDP from the internet, use SSM Session Manager.</li>
</ul>

<h3>Step 6: Data protection (weeks 6-16)</h3>
<ul>
<li>Data classification scheme and tags; Macie discovery.</li>
<li>KMS CMKs per workload/data domain, key policies separating admins from users; encryption everywhere.</li>
<li>Backups via AWS Backup policies, vault lock, copies to a separate backup account/region.</li>
<li>Secrets Manager with rotation.</li>
</ul>

<h3>Step 7: Secure delivery (weeks 8-20)</h3>
<ul>
<li>Golden pipeline templates: secret scanning, SAST, SCA, IaC scanning, container scanning, SBOM, image signing.</li>
<li>Golden AMIs/base images rebuilt weekly; ECR scanning.</li>
<li>Terraform modules for common patterns (secure S3 bucket, private API, RDS) = paved roads.</li>
</ul>

<h3>Step 8: Response and resilience (weeks 10-24)</h3>
<ul>
<li>IR runbooks for top AWS scenarios (key leak, compromised instance, public bucket, root login, ransomware on data).</li>
<li>Forensics account with pre-provisioned roles; automated evidence capture.</li>
<li>Tabletop exercise with engineering and leadership; restore tests.</li>
</ul>

<h3>Step 9: Operating model (ongoing)</h3>
<ul>
<li>Platform/security engineering owns the landing zone as a product with a roadmap and docs.</li>
<li>Security champions per team; design reviews for high-risk changes; exceptions with expiry.</li>
<li>Metrics: % accounts on baseline, critical findings open > SLA, IAM users with keys, MTTR of GuardDuty high findings, % pipelines with OIDC.</li>
</ul>

<h3>How to present the priorities if asked "what first?"</h3>
<ol>
<li><b>Identity</b> (SSO + MFA, kill access keys): most breaches start here.</li>
<li><b>Logging you can trust</b> (org CloudTrail to a locked account): without it you cannot investigate anything.</li>
<li><b>Threat detection on</b> (GuardDuty everywhere): cheap and immediate value.</li>
<li><b>Preventive guardrails</b> (SCPs, Block Public Access).</li>
<li><b>Account separation</b> for prod vs non-prod.</li>
<li>Then network, data, pipelines, and maturity.</li>
</ol>`,
answer:"I start from business risk, then build in phases: (1) Organizations with a multi-account structure (security, log archive, network, prod/non-prod workloads, sandbox); (2) identity through Identity Center federated to the IdP with MFA, no IAM users, OIDC for CI; (3) preventive guardrails with SCPs/RCPs and IaC checks; (4) org-wide logging to a locked log-archive account and GuardDuty, Security Hub, Inspector, Macie via a delegated security account feeding a SIEM; (5) hub-and-spoke network with controlled egress; (6) KMS, backups and secrets; (7) secure pipelines and golden images; (8) IR runbooks and exercises; all run as a platform product with metrics. If asked what first: identity, trustworthy logs, GuardDuty, guardrails."});

DEEP.push({tid:"cloud", title:"SCPs, RCPs and the AWS data perimeter (with real policies)", body:`
<h3>1. The three perimeter statements</h3>
<table><tr><th>Statement</th><th>Blocks</th><th>Tool</th></tr>
<tr><td>Only <b>trusted identities</b> can access my resources</td><td>Someone else's account using a misconfigured bucket policy</td><td>RCP / resource policies with aws:PrincipalOrgID</td></tr>
<tr><td>My identities can only access <b>trusted resources</b></td><td>Exfiltration to an attacker-owned bucket; malware pulled from attacker bucket</td><td>SCP + VPC endpoint policies with aws:ResourceOrgID</td></tr>
<tr><td>Access only from <b>expected networks</b></td><td>Stolen credentials used from an attacker laptop</td><td>SCP/RCP with aws:SourceVpc, aws:SourceIp, aws:ViaAWSService</td></tr></table>

<h3>2. RCP: only my organisation's principals can touch my S3 and KMS</h3>
<pre>{
  "Version": "2012-10-17",
  "Statement": [{
    "Sid": "EnforceOrgIdentities",
    "Effect": "Deny",
    "Principal": "*",
    "Action": ["s3:*","kms:*","sqs:*","secretsmanager:*","sts:AssumeRole"],
    "Resource": "*",
    "Condition": {
      "StringNotEqualsIfExists": {
        "aws:PrincipalOrgID": "o-abc123xyz",
        "aws:ResourceTag/dp:exclude:identity": "true"
      },
      "BoolIfExists": { "aws:PrincipalIsAWSService": "false" }
    }
  }]
}</pre>
<p>The exclusion tag handles legitimate third-party access (e.g. a partner bucket), and <code>aws:PrincipalIsAWSService</code> lets AWS services (CloudTrail writing logs) keep working. Even if a developer writes a bucket policy with <code>"Principal":"*"</code>, the RCP stops external access.</p>

<h3>3. SCP: my principals can only use my organisation's resources</h3>
<pre>{
  "Sid": "EnforceOrgResources",
  "Effect": "Deny",
  "Action": ["s3:*","sqs:*","kms:*"],
  "Resource": "*",
  "Condition": {
    "StringNotEqualsIfExists": {
      "aws:ResourceOrgID": "o-abc123xyz",
      "aws:PrincipalTag/dp:exclude:resource": "true"
    }
  }
}</pre>
<p>Watch out for AWS-owned resources your workloads legitimately use (e.g. Amazon Linux repo buckets, ECR public layers, service-owned buckets); allow-list them explicitly.</p>

<h3>4. Expected networks</h3>
<pre>{
  "Sid": "EnforceNetworkPerimeter",
  "Effect": "Deny",
  "Action": "*",
  "Resource": "*",
  "Condition": {
    "NotIpAddressIfExists": { "aws:SourceIp": ["203.0.113.0/24"] },
    "StringNotEqualsIfExists": { "aws:SourceVpc": ["vpc-0a1b2c","vpc-0d4e5f"] },
    "BoolIfExists": { "aws:ViaAWSService": "false", "aws:PrincipalIsAWSService": "false" },
    "ArnNotLikeIfExists": { "aws:PrincipalArn": ["arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*"] }
  }
}</pre>
<p>Usually applied to <b>sensitive data resources or workload roles</b>, not everything, because humans and SaaS integrations come from many networks. This control is what makes stolen instance credentials useless outside your VPC.</p>

<h3>5. Other essential SCPs</h3>
<pre>// Region lock (keep global services exempt)
{"Effect":"Deny","NotAction":["iam:*","organizations:*","sts:*","support:*",
  "cloudfront:*","route53:*","waf:*","budgets:*"],
 "Resource":"*",
 "Condition":{"StringNotEquals":{"aws:RequestedRegion":["ap-south-1","ap-south-2"]}}}

// Protect security services
{"Effect":"Deny","Action":["cloudtrail:StopLogging","cloudtrail:DeleteTrail",
  "guardduty:DeleteDetector","guardduty:DisassociateFromMasterAccount",
  "config:StopConfigurationRecorder","securityhub:DisableSecurityHub"],
 "Resource":"*",
 "Condition":{"ArnNotLike":{"aws:PrincipalArn":"arn:aws:iam::*:role/SecurityPlatformAdmin"}}}

// Require IMDSv2
{"Effect":"Deny","Action":"ec2:RunInstances",
 "Resource":"arn:aws:ec2:*:*:instance/*",
 "Condition":{"StringNotEquals":{"ec2:MetadataHttpTokens":"required"}}}</pre>

<h3>6. Rolling out without breaking production</h3>
<ol>
<li>Analyse CloudTrail (or IAM Access Analyzer) for current external/unexpected access.</li>
<li>Apply to Policy-Staging OU and sandbox first.</li>
<li>Roll out OU by OU, non-prod before prod, with an exception tag process.</li>
<li>Monitor AccessDenied events in CloudTrail for a week after each step.</li>
</ol>
<p>SCP limits to remember: 5 SCPs per target, 5,120 characters each, and they do not apply to the management account, which is why nothing runs there.</p>`,
answer:"A data perimeter means trusted identities, trusted resources, expected networks. RCPs deny access to my S3, KMS, SQS, Secrets and STS by principals outside my org ID (with service and tagged exceptions); SCPs deny my principals access to resources outside my org; network conditions (SourceVpc, SourceIp, ViaAWSService) make stolen credentials useless outside our networks for sensitive data. I add SCPs for region lock, protecting security services and requiring IMDSv2, and roll out through a staging OU while watching CloudTrail AccessDenied events."});

DEEP.push({tid:"cloud", title:"Securing S3 end to end (the most asked AWS security question)", body:`
<p>"How would you secure an S3 bucket with sensitive data?" A strong answer goes through layers in order and mentions detection.</p>
<h3>Layer 1: Account and org guardrails</h3>
<ul><li>S3 Block Public Access at account level (and SCP denying its removal).</li>
<li>RCP denying non-org principals; SCP denying uploads to non-org buckets.</li>
<li>Object Ownership = BucketOwnerEnforced (ACLs disabled; only policies matter).</li></ul>
<h3>Layer 2: Bucket policy</h3>
<pre>{
  "Statement": [
    {"Sid":"DenyNonTLS","Effect":"Deny","Principal":"*","Action":"s3:*",
     "Resource":["arn:aws:s3:::acme-pii","arn:aws:s3:::acme-pii/*"],
     "Condition":{"Bool":{"aws:SecureTransport":"false"}}},
    {"Sid":"OnlyViaOurEndpoint","Effect":"Deny","Principal":"*","Action":"s3:*",
     "Resource":["arn:aws:s3:::acme-pii","arn:aws:s3:::acme-pii/*"],
     "Condition":{"StringNotEquals":{"aws:SourceVpce":"vpce-0abc123"},
                  "ArnNotLike":{"aws:PrincipalArn":"arn:aws:iam::*:role/BreakGlass"}}},
    {"Sid":"RequireKMS","Effect":"Deny","Principal":"*","Action":"s3:PutObject",
     "Resource":"arn:aws:s3:::acme-pii/*",
     "Condition":{"StringNotEquals":{"s3:x-amz-server-side-encryption-aws-kms-key-id":
        "arn:aws:kms:ap-south-1:123456789012:key/1111-2222"}}}
  ]
}</pre>
<h3>Layer 3: Encryption with a dedicated KMS key</h3>
<ul><li>SSE-KMS with a customer managed key; S3 Bucket Keys to cut KMS cost.</li>
<li>The key policy allows <code>kms:Decrypt</code> only to the reading service roles. This is a <b>second, independent authorisation</b>: even an overly broad S3 permission cannot read data without the key.</li></ul>
<h3>Layer 4: Identity</h3>
<ul><li>Only specific roles with prefix-scoped permissions; no <code>s3:*</code>; ABAC for multi-team buckets; S3 Access Points or Access Grants for many consumers.</li></ul>
<h3>Layer 5: Data protection features</h3>
<ul><li>Versioning + MFA Delete or Object Lock (compliance mode) for data that must not be deleted; lifecycle rules for retention and deletion; replication to a separate account for DR.</li></ul>
<h3>Layer 6: Detection</h3>
<ul><li>CloudTrail data events on the bucket; GuardDuty S3 Protection (anomalous access, exfiltration patterns, Tor access); Macie for sensitive data discovery and public exposure; IAM Access Analyzer for external access; Config rules for drift; alarms on bucket policy changes.</li></ul>
<h3>Layer 7: Process</h3>
<ul><li>Buckets created only via the approved Terraform module; periodic access reviews; data classification tag on the bucket drives these controls.</li></ul>`,
answer:"Layers: account Block Public Access and org RCPs; ACLs disabled; bucket policy enforcing TLS, access only via our VPC endpoint and specific roles, and required SSE-KMS; a dedicated CMK whose key policy is a second authorisation check; least-privilege prefix-scoped roles or Access Points; versioning/Object Lock and replication; detection via CloudTrail data events, GuardDuty S3 Protection, Macie and Access Analyzer; buckets created only through a hardened module."});

DEEP.push({tid:"cloud", title:"Threat detection and automated response on AWS", body:`
<h3>The detection stack and what each tool does</h3>
<table>
<tr><th>Service</th><th>What it watches</th><th>Example findings</th></tr>
<tr><td>GuardDuty</td><td>CloudTrail, VPC Flow, DNS, S3 data events, EKS audit, runtime agent, EBS malware scans</td><td>InstanceCredentialExfiltration, CryptoCurrency:EC2, UnauthorizedAccess:IAMUser/TorIPCaller, Discovery:S3, attack sequences (Extended Threat Detection)</td></tr>
<tr><td>Security Hub CSPM</td><td>Configuration against standards</td><td>S3 bucket public, SG open 22 to world, root without MFA</td></tr>
<tr><td>Inspector</td><td>Software vulnerabilities and network reachability</td><td>Critical CVE in ECR image, EC2 port reachable from internet</td></tr>
<tr><td>Macie</td><td>Sensitive data in S3</td><td>Bucket contains Aadhaar/PAN/credit card numbers</td></tr>
<tr><td>IAM Access Analyzer</td><td>External access, unused access</td><td>Role trusted by external account, unused admin permissions</td></tr>
<tr><td>Detective</td><td>Investigation graph</td><td>Visualise all activity of a role over time</td></tr>
<tr><td>Security Lake</td><td>Normalised data lake (OCSF)</td><td>Custom SIEM detections, hunting</td></tr>
</table>

<h3>Automation pattern</h3>
<pre>GuardDuty / Security Hub finding
   → EventBridge rule (filter by type + severity)
   → Step Functions workflow:
        1. Enrich: account owner (tags), role details, CloudTrail last 1h
        2. Decide: auto-contain? (only for well-understood, high-confidence types)
        3. Contain: e.g. revoke role sessions, isolate instance SG, snapshot EBS
        4. Notify: Slack/PagerDuty with context + ticket
        5. Record: case in SIEM/ticketing</pre>

<h3>Which actions to automate (and which not)</h3>
<table><tr><th>Safe to auto-remediate</th><th>Needs a human</th></tr>
<tr><td>Re-enable S3 Block Public Access on non-website buckets; quarantine exposed access keys; snapshot volumes for evidence; tag resources for investigation</td><td>Terminating production instances; revoking production roles used by live services; deleting resources</td></tr></table>

<h3>Custom detections worth writing (SIEM/Security Lake)</h3>
<ul>
<li>ConsoleLogin without MFA or by root.</li>
<li>CreateUser / CreateAccessKey / AttachUserPolicy with AdministratorAccess.</li>
<li>UpdateAssumeRolePolicy adding an external account.</li>
<li>PutBucketPolicy / PutBucketAcl making data public.</li>
<li>StopLogging / DeleteTrail / DeleteDetector (should also be SCP-blocked: the attempt itself is a signal).</li>
<li>ScheduleKeyDeletion / DisableKey on KMS keys (ransomware-in-the-cloud pattern).</li>
<li>Bursts of GetObject or ListObjects from one principal; GetSecretValue on many secrets.</li>
<li>AssumeRole from unusual source IP/ASN; use of honeytoken credentials.</li>
</ul>`,
answer:"GuardDuty for threats, Security Hub CSPM for posture, Inspector for vulnerabilities, Macie for sensitive data, Access Analyzer for external/unused access, all org-wide via a delegated admin, aggregated in Security Hub and Security Lake/SIEM. EventBridge routes findings to Step Functions that enrich, auto-contain only high-confidence cases (quarantine keys, isolate instance, snapshot), and notify owners. I add custom CloudTrail detections for IAM persistence, logging tampering, KMS key deletion and bulk data access."});

DEEP.push({tid:"cloud", title:"Serverless (Lambda) and API Gateway security", body:`
<h3>What changes with serverless</h3>
<p>No servers to patch, but the attack surface moves to <b>event sources, IAM roles, dependencies and configuration</b>. Every event (API call, S3 upload, SQS message) is untrusted input.</p>
<h3>Controls</h3>
<ul>
<li><b>One role per function</b>, least privilege. Shared roles across functions turn one bug into a full-app compromise.</li>
<li><b>Input validation</b> on every event source; API Gateway request validation with JSON schemas.</li>
<li><b>Authentication at the edge:</b> API Gateway JWT authorisers (Cognito/OIDC), Lambda authorisers for custom logic, IAM auth for internal calls, mTLS for B2B.</li>
<li><b>Secrets</b> from Secrets Manager/Parameter Store at runtime (cached via the Lambda extension), never plain env vars for sensitive values.</li>
<li><b>Dependencies</b>: scanned with Inspector Lambda scanning; minimal packages; code signing for Lambda to allow only signed artifacts.</li>
<li><b>Network</b>: put functions in a VPC only when they need private resources; use VPC endpoints; egress control.</li>
<li><b>Resource policies</b> on functions so only intended sources can invoke (with SourceArn/SourceAccount).</li>
<li><b>Limits</b>: reserved concurrency, timeouts, API throttling and usage plans to prevent denial of wallet.</li>
<li><b>Logging</b>: structured logs without secrets; CloudTrail data events for Invoke on sensitive functions; GuardDuty Lambda Protection for network anomalies.</li>
</ul>
<h3>Serverless-specific attacks</h3>
<p>Event injection (malicious S3 object names or SQS payloads reaching shell commands or queries), over-privileged roles used after code injection, reading credentials from environment (<code>AWS_SESSION_TOKEN</code> is in env), and denial of wallet through recursive invocations or unthrottled public APIs.</p>`,
answer:"Serverless shifts security to IAM, event inputs, dependencies and config. I use one least-privilege role per function, validate every event, authenticate at API Gateway (JWT/IAM/mTLS), fetch secrets at runtime, scan and sign code, restrict invocation via resource policies, set concurrency and throttling limits against denial of wallet, and monitor with CloudTrail data events and GuardDuty Lambda Protection."});
