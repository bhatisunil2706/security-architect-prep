<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Security Architect and Principal Security Engineer interview preparation: lessons, real scenario questions, mock interviews.">
<title>Security Architect Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: study workbench. Fixed index rail on the left, one reading column on the right. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E4E9E7; --ink:#15201E; --muted:#56635F; --line:#CCD5D2;
  --accent:#0B6B63; --accent-ink:#FFFFFF; --accent-soft:#D5EAE6;
  --basic:#2F6B3A; --advanced:#8A4B00; --scenario:#9B2F3B; --design:#3D4FA3;
  --good:#2F6B3A; --bad:#9B2F3B;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:288px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141D1B; --sunk:#1B2624; --ink:#E2EAE7; --muted:#97A7A2; --line:#2A3835;
  --accent:#4CC2B4; --accent-ink:#06201D; --accent-soft:#16332F;
  --basic:#7FCB8C; --advanced:#F0A64B; --scenario:#F28C97; --design:#9EAAF6; --good:#7FCB8C; --bad:#F28C97;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1B; --sunk:#1B2624; --ink:#E2EAE7; --muted:#97A7A2; --line:#2A3835;
  --accent:#4CC2B4; --accent-ink:#06201D; --accent-soft:#16332F;
  --basic:#7FCB8C; --advanced:#F0A64B; --scenario:#F28C97; --design:#9EAAF6; --good:#7FCB8C; --bad:#F28C97;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font-weight:800;font-stretch:78%;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.search{flex:1;display:flex;justify-content:flex-end;min-width:0}
.search input{width:100%;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap;font-size:13px}
.icon-btn:hover{border-color:var(--accent)}
#menuBtn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100% - 56px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px 40px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px);overflow-y:auto}
.rail h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px;font-weight:600}
.rail h4:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:26px;flex:none}
.nav .tick{margin-left:auto;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.nav .tick.d{background:var(--accent);border-color:var(--accent)}
.meter{margin:4px 8px 0;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter-label{font-size:12px;color:var(--muted);margin:6px 8px 0;font-variant-numeric:tabular-nums}

main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px;min-width:0}
.col{max-width:820px;margin:0 auto}
.col.wide{max-width:1040px}

/* Type */
h1{font-weight:800;font-stretch:80%;font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:6px 0 10px;text-wrap:balance;letter-spacing:-.005em}
h2{font-weight:700;font-stretch:85%;font-size:22px;margin:0 0 12px;text-wrap:balance}
h3{font-weight:700;font-size:16px;margin:18px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tid{font-family:var(--f-mono);letter-spacing:0;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px}
.fw{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.6}
.prose,.lead,.reading{font-family:var(--f-body);font-size:17px;line-height:1.62}
.lead{font-size:19px}
.prose p,.reading p{margin:0 0 12px}
.prose ol,.prose ul{padding-left:22px;margin:0 0 12px}
.prose li{margin:4px 0}
.muted{color:var(--muted)}
.lab{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--sunk);border:1px solid var(--line);padding:14px 16px;border-radius:8px;overflow-x:auto;white-space:pre;margin:0 0 14px}
.tbl{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-family:var(--f-display);font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600}
tr:last-child td{border-bottom:0}

/* Topic page */
.t-head{padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.t-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 28px}
.toc button{border:0;background:var(--sunk);padding:5px 10px;border-radius:20px;font-size:12.5px;cursor:pointer}
.toc button:hover{background:var(--accent-soft)}
section.blk{margin:0 0 34px;scroll-margin-top:80px}
.analogy{margin-top:16px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.analogy p{margin:0;font-family:var(--f-body);font-size:16.5px;font-style:italic}
dl.concepts{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);border-top:1px solid var(--line);margin:0}
dl.concepts dt,dl.concepts dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.concepts dt{font-weight:700;padding-right:16px;font-size:14.5px}
dl.concepts dd{font-family:var(--f-body);font-size:16px}
ul.mist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.mist li{font-family:var(--f-body);font-size:16px;padding-left:22px;position:relative}
ul.mist li::before{content:"✕";position:absolute;left:0;color:var(--bad);font-family:var(--f-display);font-weight:700;font-size:13px;top:2px}
.hook{background:var(--ink);color:var(--bg);padding:16px 20px;border-radius:10px;margin:0 0 34px;font-weight:600;font-size:17px;line-height:1.4}
.hook .lab{color:inherit;opacity:.7}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}
.pager a{text-decoration:none;color:var(--ink);max-width:48%}
.pager small{display:block;color:var(--muted);font-size:12px}

/* Questions */
.qlist{display:grid;gap:8px}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.q[open]{border-color:var(--accent)}
details.q summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px 14px}
details.q summary::-webkit-details-marker{display:none}
.qt{font-weight:600;font-size:15.5px;line-height:1.4;min-width:0}
.qsrc{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.ans{padding:0 16px 14px;border-top:1px dashed var(--line)}
.ans .prose{padding-top:12px}
.test{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 0}
.lv{flex:none;font-family:var(--f-mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:4px;margin-top:1px;border:1px solid currentColor}
.lv-basic{color:var(--basic)} .lv-advanced{color:var(--advanced)} .lv-scenario{color:var(--scenario)} .lv-design{color:var(--design)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,.field{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;max-width:100%}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}

/* Roadmap */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat .big{font-weight:800;font-stretch:78%;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stat .meter{margin:12px 0 0;height:8px}
.weeks{display:grid;gap:0;border-left:2px solid var(--ink);margin-left:12px}
.week{position:relative;padding:0 0 22px 28px}
.week::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.week.full::before{background:var(--accent);border-color:var(--accent)}
.week .wk{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.week h3{margin:2px 0 4px;font-size:18px}
.week p{margin:0 0 8px;font-family:var(--f-body);font-size:15.5px;color:var(--muted)}
.tlinks{display:flex;flex-wrap:wrap;gap:6px}
.tlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13.5px}
.tlink:hover{border-color:var(--accent)}
.tlink.d{background:var(--accent-soft);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h3{margin-top:0}
.panel p,.panel li{font-size:14.5px}
.panel ul{padding-left:18px;margin:0}

/* Flashcards */
.card-stage{perspective:1400px;margin:0 0 16px}
.fcard{position:relative;min-height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s ease}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--surface);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--sunk)}
.face .term{font-weight:800;font-stretch:80%;font-size:clamp(24px,4vw,36px);line-height:1.1;text-wrap:balance}
.face .def{font-family:var(--f-body);font-size:19px;line-height:1.55}
.face .src{position:absolute;top:14px;left:18px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.face .hint{position:absolute;bottom:12px;right:16px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}

/* Quiz */
.qz-q{font-weight:700;font-size:20px;line-height:1.35;margin:6px 0 16px;text-wrap:balance}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{font-family:var(--f-body);font-size:16px;background:var(--sunk);padding:12px 14px;border-radius:8px;margin:0 0 14px}
.progress-line{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Mock */
.timer{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;resize:vertical}
.rate button{min-width:44px}
.hist{font-size:14px}
.hist li{margin:4px 0}

/* Design cases */
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 12px}
.case summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:baseline}
.case summary::-webkit-details-marker{display:none}
.case summary .tid{flex:none}
.case summary b{font-size:18px;font-stretch:88%}
.case[open] summary{border-bottom:1px solid var(--line)}
.case .body{padding:16px 18px 18px}
.case .body ul{font-family:var(--f-body);font-size:16px;padding-left:20px;margin:0 0 14px}
.case .body li{margin:5px 0}
.prompt{font-family:var(--f-body);font-size:17px;font-style:italic;margin:0 0 14px}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 24px}
.frame div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.frame b{display:block;font-size:22px;font-stretch:78%;font-weight:800;color:var(--accent)}

/* Glossary / cheat */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 20px}
.gloss div{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.gloss b{font-family:var(--f-mono);font-size:13.5px;margin-right:8px}
.cheat{columns:2 340px;column-gap:20px}
.cheat .panel{break-inside:avoid;margin:0 0 14px}
.cheat li{font-family:var(--f-body);font-size:15.5px;margin:5px 0}
.sres h3{margin-top:26px}
.sres a.hit{display:block;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 6px;text-decoration:none;color:var(--ink)}
.sres a.hit:hover{border-color:var(--accent)}
.sres .snip{display:block;font-size:13px;color:var(--muted);margin-top:2px}
mark{background:var(--accent-soft);color:inherit;padding:0 1px}

/* Lessons */
code{font-family:var(--f-mono);font-size:.84em;background:var(--sunk);border:1px solid var(--line);padding:1px 5px;border-radius:4px;word-break:break-word}
pre code{background:none;border:0;padding:0}
.lesson{border-top:2px solid var(--ink);padding-top:16px;margin:0 0 40px;scroll-margin-top:80px}
.lesson-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.lesson-head .tid{flex:none}
.lesson-title{font-weight:800;font-stretch:84%;font-size:clamp(21px,2.6vw,26px);line-height:1.15;margin:0;text-wrap:balance}
.lesson .prose h3{font-family:var(--f-display);font-size:17px;margin:24px 0 8px;font-weight:700}
.lesson .prose table{font-size:13.5px}
.say{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin-top:16px}
.say p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.55}
.lesson-list{display:grid;gap:6px;margin:0 0 8px}
.lesson-list a{display:flex;gap:10px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
.lesson-list a:hover{border-color:var(--accent)}
.lesson-list .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400;flex:none}

/* Real interview questions */
.rq{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rq[open]{border-color:var(--accent)}
.rq summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.rq summary::-webkit-details-marker{display:none}
.rq .qt{font-size:16.5px}
.cat{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--ink);color:var(--bg);margin-top:2px;white-space:nowrap}
.rq-body{padding:0 18px 18px;border-top:1px dashed var(--line);display:grid;gap:14px}
.rq-body > div:first-child{padding-top:14px}
.short{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-family:var(--f-body);font-size:16px}
.fu{display:grid;gap:8px}
.fu div{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.fu b{display:block;font-size:14.5px;margin-bottom:2px}
.fu span{font-family:var(--f-body);font-size:15.5px}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags span{font-size:13px;border:1px solid var(--bad);color:var(--bad);border-radius:20px;padding:3px 10px}
.lv-real{color:var(--accent)}

/* Mobile */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  #menuBtn{display:inline-block}
  .rail{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 57px);bottom:0;height:auto;width:min(86vw,320px);z-index:40;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.nav-open .rail{transform:none}
  .intro{grid-template-columns:1fr}
  dl.concepts{grid-template-columns:1fr}
  dl.concepts dt{border-bottom:0;padding-bottom:0}
  .brand small{display:none}
}
@media (max-width:520px){ .search input{max-width:none} .brand b{font-size:16px} }
@media (prefers-reduced-motion:reduce){ .fcard,.rail{transition:none} }
</style>

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="top">
  <button class="icon-btn" id="menuBtn" aria-label="Open topic menu">☰ Menu</button>
  <a class="brand" href="#roadmap"><b>Security Architect Prep</b><small>AWS · Staff → Principal</small></a>
  <div class="search"><input id="q" type="search" placeholder="Search topics, questions, terms…" aria-label="Search everything"></div>
  <button class="icon-btn" id="themeBtn" aria-label="Change theme">Theme: auto</button>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"><div class="col"><p class="muted">Loading…</p></div></main>
</div>

<script>
/* Topics 1-3: Foundations */
window.TOPICS = window.TOPICS || [];
TOPICS.push({
id:"foundations", n:1, title:"Security Foundations", domain:"Foundations", week:1,
fw:"NIST CSF 2.0 (all functions) · NIST SP 800-160 · Saltzer & Schroeder principles",
simple:"Security is about protecting the things a business cares about (data, money, reputation, uptime) from people and events that could harm them, at a cost that makes sense. Every control you will ever design exists to protect Confidentiality (only the right people see it), Integrity (nobody changes it wrongly) or Availability (it works when needed).",
analogy:"Think of a bank branch. The vault door is one control, but the bank also has guards, cameras, dual-custody rules for opening the vault, a time lock, alarms linked to police, and insurance. No single layer is perfect; together they make a robbery very hard and very likely to be caught. That is defense in depth.",
why:"At Staff or Principal level you are not judged on knowing tools. You are judged on whether you can reason from first principles, explain trade-offs, and tie every control back to a business risk. Interviewers often open with a foundations question to see if you can explain simple ideas crisply without jargon.",
concepts:[
["CIA triad","Confidentiality, Integrity, Availability. Often extended with Authenticity, Non-repudiation and Privacy."],
["Risk","Likelihood x Impact. Threat (who/what) exploits a Vulnerability (weakness) to harm an Asset (what we value)."],
["Defense in depth","Multiple independent layers so one failure does not cause a breach (identity, network, host, app, data, monitoring)."],
["Least privilege","Every user, service and process gets only the access it needs, only for as long as it needs it."],
["Separation of duties","No single person can complete a sensitive action alone (e.g. the developer who writes code cannot deploy it to production unreviewed)."],
["Secure by default","The out-of-the-box state is the safe state: deny by default, encryption on, public access off."],
["Fail secure (fail closed)","When a control breaks, it blocks rather than allows. Trade-off: availability for security. Choose per system."],
["Complete mediation","Check authorization on every request, not only the first one. Caching access decisions creates gaps."],
["Economy of mechanism","Keep designs simple. Complex security is hard to verify and easy to misconfigure."],
["Attack surface","All the points where an attacker can try to enter or extract data. Reduce it before you defend it."],
["Assume breach","Design as if the attacker is already inside: limit blast radius, detect lateral movement, protect crown jewels."],
["Zero trust","Never trust based on network location. Verify identity, device and context explicitly on every access."],
["Shift left / shift everywhere","Find security problems early in design and code, but also keep controls in runtime."],
["Residual risk","Risk that remains after controls. The business owner, not security, formally accepts it."]
],
how:`<p><b>How to think like an architect about any problem:</b></p>
<ol>
<li><b>What are we protecting?</b> Identify assets and their value (customer PII, payment data, source code, availability of the checkout service).</li>
<li><b>From whom?</b> Threat actors and their motivation: opportunistic criminals, ransomware groups, insiders, nation-states, competitors.</li>
<li><b>How could it go wrong?</b> Threat model the data flows (see Topic 3).</li>
<li><b>What controls reduce risk the most per rupee/dollar?</b> Preventive, detective, corrective, deterrent, compensating.</li>
<li><b>What is left?</b> Residual risk, documented and accepted by an owner.</li>
<li><b>How will we know it is working?</b> Metrics, logs, testing, audits.</li>
</ol>
<p><b>Control types you should name fluently:</b></p>
<table><tr><th>By function</th><th>Example</th></tr>
<tr><td>Preventive</td><td>MFA, WAF rule, SCP denying public S3</td></tr>
<tr><td>Detective</td><td>GuardDuty finding, SIEM alert, file integrity monitoring</td></tr>
<tr><td>Corrective</td><td>Auto-remediation Lambda, restore from backup</td></tr>
<tr><td>Deterrent</td><td>Login banner, visible monitoring, legal policy</td></tr>
<tr><td>Compensating</td><td>Extra monitoring on a legacy server that cannot be patched</td></tr></table>
<p>By nature they are <b>administrative</b> (policy, training), <b>technical</b> (encryption, firewall) or <b>physical</b> (badge access).</p>`,
aws:[["Least privilege","IAM policies, IAM Access Analyzer (unused access, policy generation)"],["Secure by default","S3 Block Public Access, EBS default encryption, Organizations SCPs/RCPs"],["Defense in depth","WAF + ALB + Security Groups + IAM + KMS + GuardDuty"],["Assume breach","Multi-account isolation, VPC segmentation, CloudTrail + Security Lake"]],
cases:`<p><b>Capital One (2019):</b> A misconfigured WAF on EC2 allowed Server-Side Request Forgery to reach the instance metadata service (IMDSv1), steal the instance role credentials, and read more than 100 million records from S3. The role had far more S3 access than the WAF needed. <b>Lessons:</b> least privilege on workload roles, IMDSv2 (session tokens stop simple SSRF), detect unusual S3 listing from one role, defense in depth.</p>
<p><b>Target (2013):</b> Attackers entered through an HVAC vendor's credentials and moved to point-of-sale systems because the network was flat. Alerts fired but were not acted on. <b>Lessons:</b> segmentation, third-party access control, and detection is useless without response.</p>`,
mistakes:["Treating compliance as security (passing an audit does not mean you are safe).","Adding tools instead of reducing attack surface.","Fail-open designs that nobody consciously chose.","Security owning risk acceptance instead of the business owner.","Forgetting availability: a control that breaks the product will be bypassed."],
hook:"Assets, actors, attack paths, controls, residual risk, evidence. Six A-words-ish, in that order.",
qs:[
{l:"basic",q:"Explain the CIA triad with one real example for each.",a:"<b>Confidentiality:</b> only authorised parties can read data. Example: customer card numbers are tokenised and only the payment service can detokenise. <b>Integrity:</b> data and systems are not altered without authorisation. Example: code signing so only builds from our pipeline run in production. <b>Availability:</b> systems work when needed. Example: multi-AZ deployment with DDoS protection for checkout. Add that these often trade off: strong encryption and strict controls can hurt availability, so the architect balances them per system based on business impact.",t:"Can you explain basics simply and give concrete, non-textbook examples?"},
{l:"basic",q:"What is the difference between a threat, a vulnerability and a risk?",a:"A <b>threat</b> is something that can cause harm (a ransomware group, an insider, a flood). A <b>vulnerability</b> is a weakness that a threat can use (an unpatched VPN, a weak password policy). <b>Risk</b> is the likelihood that a threat exploits a vulnerability multiplied by the business impact. Example: an internet-facing Citrix gateway with a critical CVE (vulnerability), actively exploited by ransomware crews (threat), in front of all our corporate systems (high impact) = high risk, patch or isolate within 24-48 hours.",t:"Precise vocabulary; ability to prioritise."},
{l:"basic",q:"What does least privilege mean in practice in a cloud environment?",a:"Every identity (human or machine) gets only the permissions it needs, scoped to specific resources, for only the time needed. In AWS that means: role-based access via IAM Identity Center permission sets rather than IAM users; no wildcard actions or resources on production roles; per-service workload roles; just-in-time elevation for admin access; SCPs as guardrails; and continuous right-sizing using IAM Access Analyzer unused-access findings and last-accessed data. I also mention that least privilege is a process, not a one-time setup, because permissions drift upward over time.",t:"Practical, cloud-native thinking and awareness of permission drift."},
{l:"advanced",q:"When would you choose fail-open over fail-closed? Give an example.",a:"Fail-closed is the default for security controls protecting confidentiality or integrity (authorization service unavailable → deny). But fail-open can be correct when availability is the dominant business risk and there is a compensating control. Example: an inline fraud-scoring or bot-detection service in the checkout path. If it times out, blocking every order may cost more than the fraud risk for a few minutes, so we fail open, log every unscored transaction, apply a lower transaction limit, and alert. The key point: it must be a conscious, documented decision with an owner, a time bound and compensating detection, never an accident of the code.",t:"Nuance and business judgement instead of dogma."},
{l:"advanced",q:"Defense in depth is sometimes criticised as 'just buying more tools'. How do you defend it, or refine it?",a:"Defense in depth is about <b>independent</b> layers, not more layers. Two WAFs from different vendors are not depth if they fail the same way. Good depth means controls at different points of the attack chain (identity, network, workload, data, detection) so an attacker must defeat several unrelated mechanisms. I refine it with: (1) map layers to the kill chain or MITRE ATT&CK so each layer has a purpose; (2) remove layers that add cost without independent coverage; (3) prefer controls that reduce attack surface over controls that inspect traffic; (4) always pair prevention with detection because every preventive layer eventually fails.",t:"Architect-level critique; can you avoid tool sprawl?"},
{l:"advanced",q:"What does 'assume breach' change about how you design a system?",a:"It moves focus from keeping attackers out to limiting what they can do once inside. Design changes: (1) segment by blast radius, e.g. separate AWS accounts per workload and environment; (2) no standing admin access, use just-in-time; (3) short-lived credentials everywhere; (4) encrypt data with keys whose use is separately authorised and logged; (5) log to an immutable, separate security account; (6) build detections for lateral movement and data staging; (7) practise recovery (immutable backups, restore drills). The design question becomes 'if this component is fully compromised, what else falls?'",t:"Blast-radius thinking."},
{l:"scenario",q:"A product VP says 'security keeps slowing us down'. How do you respond as a principal engineer?",a:"I first listen and get specifics: which reviews, which tickets, how many days. Then I treat it as a product problem. Typical fixes: (1) paved roads, secure templates and golden modules so teams get security by default without asking; (2) guardrails instead of gates, e.g. preventive SCPs and automated checks in CI rather than manual reviews; (3) risk-tiered reviews so only high-risk changes get a deep design review; (4) publish an SLA for security reviews; (5) self-service threat modelling templates. I would measure lead time for security reviews and developer satisfaction, and agree a target with the VP. The message: my goal is to make the secure path the fastest path.",t:"Influence, empathy, and platform thinking."},
{l:"scenario",q:"You join a company with no security architecture function. What do you do in your first 90 days?",a:"<b>Days 1-30, listen and map:</b> meet engineering, product, legal, risk, SRE; inventory crown-jewel assets, data flows, cloud accounts, identity providers; read past incidents and audit findings. <b>Days 31-60, quick wins and a baseline:</b> fix critical exposures (public buckets, MFA gaps, admin sprawl), assess against NIST CSF 2.0 to get a maturity baseline, write 5-8 security architecture principles, start a lightweight design review process. <b>Days 61-90, strategy:</b> a 12-18 month roadmap tied to business risk, reference architectures (identity, network, data), secure paved roads, and metrics. I would share progress with leadership monthly. The key is earning trust through early wins while building the longer program.",t:"Structured leadership thinking; prioritising by risk."},
{l:"design",q:"List the security architecture principles you would publish for an engineering organisation.",a:"About 8, each short and testable: (1) Identity is the perimeter: every request is authenticated and authorised. (2) Least privilege and just-in-time access; no standing admin. (3) Secure by default: templates ship with encryption, logging and private networking on. (4) Encrypt everything in transit and at rest, keys managed centrally. (5) Segment by blast radius: account, VPC and tenant isolation. (6) No secrets in code; short-lived credentials. (7) Everything is logged centrally and immutably; every alert has an owner. (8) Automate guardrails over manual gates. (9) Design for recovery: tested backups and runbooks. (10) Prefer managed services and buy-over-build for commodity security. I would attach to each principle an example, the paved road that implements it, and how compliance is checked automatically.",t:"Can you turn philosophy into enforceable standards?"}
],
quiz:[
{q:"A legacy server cannot be patched, so you add strict network isolation and extra monitoring. This is a:",o:["Deterrent control","Compensating control","Corrective control","Directive control"],c:1,e:"A compensating control provides alternative protection when the primary control (patching) is not possible."},
{q:"Who should formally accept residual risk?",o:["The CISO","The security architect","The business/asset owner","The auditor"],c:2,e:"The business owner of the asset owns the risk and accepts residual risk; security advises."},
{q:"Which principle says every access must be checked, not just the first?",o:["Economy of mechanism","Complete mediation","Open design","Psychological acceptability"],c:1,e:"Complete mediation: authorisation checked on every access."},
{q:"In the Capital One breach, which control would most directly have blocked the credential theft?",o:["S3 versioning","IMDSv2 on EC2","CloudFront","AWS Shield"],c:1,e:"IMDSv2 requires a session token via PUT, which blocks the simple SSRF used to read role credentials."}
]
});

TOPICS.push({
id:"frameworks", n:2, title:"Architecture Frameworks & Standards", domain:"Foundations", week:1,
fw:"SABSA · TOGAF · NIST CSF 2.0 · NIST SP 800-53 r5 · ISO/IEC 27001:2022 · CIS Controls v8.1 · MITRE ATT&CK · D3FEND",
simple:"Frameworks are shared checklists and vocabularies so that everybody (engineers, auditors, executives) talks about security the same way. Some tell you <i>how to design</i> (SABSA, TOGAF), some tell you <i>what controls to have</i> (NIST 800-53, CIS, ISO 27001 Annex A), some tell you <i>how to organise a program</i> (NIST CSF), and some describe <i>how attackers behave</i> (MITRE ATT&CK).",
analogy:"Building codes for a house. The architect's drawing method (SABSA/TOGAF) is different from the building code checklist (NIST 800-53/CIS), which is different from the city inspector's certificate (ISO 27001, SOC 2), which is different from the police report on how burglars break in (ATT&CK).",
why:"Interviewers expect a Security Architect to map controls to frameworks, explain which framework fits which purpose, and avoid 'framework worship'. You should be able to say: 'We used NIST CSF 2.0 to baseline maturity, CIS Controls for prioritised quick wins, ATT&CK to test detection coverage, and ISO 27001 for certification our customers asked for.'",
concepts:[
["NIST CSF 2.0 (Feb 2024)","Six functions: GOVERN (new in 2.0), IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER. Outcome-based, uses Profiles (current vs target) and Tiers (1 Partial to 4 Adaptive)."],
["NIST SP 800-53 Rev 5","Large catalogue of security and privacy controls in 20 families (AC access control, AU audit, SC system & comms, etc.). Basis of FedRAMP."],
["ISO/IEC 27001:2022","Certifiable ISMS standard. Clauses 4-10 describe the management system; Annex A has 93 controls in 4 themes: Organisational (37), People (8), Physical (14), Technological (34)."],
["ISO/IEC 27002","Guidance on implementing the Annex A controls."],
["CIS Controls v8.1","18 prioritised controls with Implementation Groups IG1 (basic hygiene), IG2, IG3. Great for 'where do I start'."],
["SABSA","Business-driven security architecture. 6x6 matrix: layers Contextual, Conceptual, Logical, Physical, Component, Operational; columns What, Why, How, Who, Where, When. Starts from business attributes (e.g. 'available', 'auditable')."],
["TOGAF","Enterprise architecture framework. ADM (Architecture Development Method) cycle; security woven into each phase."],
["MITRE ATT&CK","Knowledge base of adversary Tactics (why, e.g. Persistence), Techniques (how, e.g. T1078 Valid Accounts) and Procedures. Matrices for Enterprise, Cloud, Mobile, ICS."],
["MITRE D3FEND","Defensive countermeasure knowledge graph mapped to ATT&CK techniques."],
["Cyber Kill Chain","Lockheed Martin: Recon, Weaponisation, Delivery, Exploitation, Installation, C2, Actions on Objectives."],
["CSA CCM","Cloud Security Alliance Cloud Controls Matrix, cloud-specific controls mapped to other frameworks."],
["NIST SP 800-207","Zero Trust Architecture reference: Policy Engine, Policy Administrator, Policy Enforcement Point."],
["COBIT","IT governance framework, useful for aligning IT and business objectives."]
],
how:`<p><b>Pick the framework by the question you are answering:</b></p>
<table><tr><th>Question</th><th>Framework</th></tr>
<tr><td>How mature is our program? Where are gaps?</td><td>NIST CSF 2.0 profiles and tiers</td></tr>
<tr><td>What should we do first with limited budget?</td><td>CIS Controls IG1 then IG2</td></tr>
<tr><td>Customers need a certificate</td><td>ISO 27001 or SOC 2 Type II</td></tr>
<tr><td>US federal / highly regulated control set</td><td>NIST 800-53, FedRAMP</td></tr>
<tr><td>How do I design security from business needs?</td><td>SABSA (attributes to controls)</td></tr>
<tr><td>Are our detections covering real attacker behaviour?</td><td>MITRE ATT&CK coverage map</td></tr>
<tr><td>Cloud provider controls</td><td>CSA CCM, AWS Well-Architected Security Pillar</td></tr></table>
<p><b>Unified control framework:</b> mature companies build one internal control set, then map it to many frameworks (ISO, SOC 2, PCI, DPDP) so one piece of evidence satisfies many audits. Say this in interviews; it shows scale thinking.</p>
<p><b>SABSA in one breath:</b> start with business drivers, turn them into business attributes (confidential, available, compliant), define metrics for each attribute, then trace every technical control back to an attribute. This gives two-way traceability: every control has a business reason, every business need has a control.</p>`,
aws:[["Framework mapping","AWS Security Hub CSPM standards (CIS AWS Foundations, NIST 800-53, PCI DSS, AWS FSBP)"],["Evidence collection","AWS Audit Manager, AWS Config conformance packs"],["Architecture review","AWS Well-Architected Tool, Security Pillar"]],
cases:`<p><b>Typical use at a fintech:</b> CSF 2.0 used for board reporting (current Tier 2, target Tier 3 in 18 months), CIS IG2 as the engineering backlog, ISO 27001 certification for enterprise customers, PCI DSS for the card data environment, and ATT&CK for SOC detection coverage heatmaps showing coverage rising from 35% to 60% of relevant techniques.</p>`,
mistakes:["Picking a framework before knowing the question.","Implementing every control 'because the framework says so' without risk context.","Equating ISO certification with good security.","Ignoring GOVERN in CSF 2.0; interviewers like candidates who know it is new.","ATT&CK coverage counts without testing whether detections actually fire."],
hook:"CSF = how mature, CIS = what first, ISO/SOC2 = prove it, 800-53 = the big catalogue, SABSA = why each control, ATT&CK = how they attack.",
qs:[
{l:"basic",q:"What changed in NIST CSF 2.0 compared to 1.1?",a:"Released February 2024. Key changes: (1) a new <b>GOVERN</b> function covering strategy, risk management, roles, policy, oversight and <b>supply chain risk</b>; (2) scope widened from critical infrastructure to all organisations; (3) better guidance through implementation examples and quick-start guides; (4) Profiles and Tiers remain, with more emphasis on organisational profiles. The six functions are Govern, Identify, Protect, Detect, Respond, Recover.",t:"Currency of knowledge."},
{l:"basic",q:"Tactic vs technique vs procedure in ATT&CK?",a:"A <b>tactic</b> is the attacker's goal at a step (e.g. Credential Access). A <b>technique</b> is how they achieve it (e.g. T1552 Unsecured Credentials; sub-technique T1552.005 Cloud Instance Metadata API). A <b>procedure</b> is the specific implementation seen in the wild (e.g. a group curling 169.254.169.254 from a compromised web app). Detections are best written against techniques and validated with procedures.",t:"Detection-engineering literacy."},
{l:"basic",q:"How is ISO 27001 structured?",a:"Clauses 4-10 are mandatory management-system requirements: context, leadership, planning (risk assessment and treatment), support, operation, performance evaluation (internal audit, management review), improvement. Annex A (2022 edition) has 93 controls in four themes: organisational, people, physical, technological. You produce a Statement of Applicability (SoA) saying which controls apply and why. Certification is by an accredited body with surveillance audits annually and recertification every 3 years.",t:"Understands certification mechanics."},
{l:"advanced",q:"Explain SABSA to an engineer who thinks it is just paperwork.",a:"SABSA's value is traceability. You start with what the business needs, expressed as attributes like 'available', 'private', 'auditable', and give each one a metric. Every control you build must trace back to an attribute, which stops us from building controls nobody needs and exposes business needs no control covers. The six layers go from business context down to the operational level, and the columns ask what, why, how, who, where and when at each layer. You do not need to fill the full matrix; using the attribute profile alone during design reviews already improves decisions and makes risk conversations with executives much easier.",t:"Can you make abstract frameworks practical?"},
{l:"advanced",q:"How would you measure detection coverage using ATT&CK without fooling yourself?",a:"(1) Choose the relevant technique set using threat intelligence for our industry and our tech stack (cloud, identity, SaaS), not the whole matrix. (2) For each technique record: data source available? detection exists? detection tested? response playbook exists? (3) Validate with purple-team or breach-and-attack simulation (e.g. Atomic Red Team, Stratus Red Team for cloud). (4) Report coverage as 'tested detections for prioritised techniques', not 'rules mapped'. (5) Track false-positive rates and mean time to detect as quality measures. A heatmap of untested mappings is vanity.",t:"Rigour and measurement honesty."},
{l:"scenario",q:"Your company must meet ISO 27001, SOC 2, PCI DSS and the DPDP Act. How do you avoid four separate compliance programs?",a:"Build a <b>unified control framework</b> (UCF): one internal control library, each control mapped to all four frameworks, with a single owner, a single test procedure and automated evidence where possible (AWS Config, Security Hub, Audit Manager, ticketing exports). Scope carefully: PCI applies only to the card data environment, so segment it tightly to reduce audit scope. Run a single annual control-testing calendar and a GRC tool to hold mappings. This cuts audit effort, avoids conflicting policies and lets engineering see one set of requirements.",t:"Efficiency at scale; scoping."},
{l:"design",q:"Map a cloud landing zone's controls to NIST CSF 2.0 functions.",a:"<b>GOVERN:</b> security policies, account vending with ownership tags, risk register. <b>IDENTIFY:</b> AWS Config inventory, asset tagging, data classification with Macie. <b>PROTECT:</b> IAM Identity Center with MFA, SCPs/RCPs, KMS encryption, private subnets, WAF. <b>DETECT:</b> CloudTrail org trail, GuardDuty, Security Hub CSPM, Security Lake feeding the SIEM. <b>RESPOND:</b> EventBridge-driven automation, incident runbooks, forensic account. <b>RECOVER:</b> AWS Backup with vault lock in a separate account, cross-region DR, restore tests.",t:"Framework fluency tied to real design."}
],
quiz:[
{q:"Which function was added in NIST CSF 2.0?",o:["Recover","Govern","Identify","Assure"],c:1,e:"GOVERN was added in CSF 2.0 (Feb 2024)."},
{q:"How many controls are in ISO 27001:2022 Annex A?",o:["114","93","18","153"],c:1,e:"93 controls in 4 themes. The 2013 edition had 114."},
{q:"CIS Controls Implementation Group 1 represents:",o:["Advanced controls for large enterprises","Essential cyber hygiene","Only cloud controls","Physical security"],c:1,e:"IG1 is essential cyber hygiene, the minimum for every organisation."},
{q:"SABSA starts from:",o:["Technical controls","Business attributes","Attack techniques","Audit findings"],c:1,e:"SABSA is business-driven, starting from business attributes and requirements."}
]

TOPICS.push({
id:"threatmodel", n:3, title:"Threat Modeling", domain:"Foundations", week:1,
fw:"STRIDE · PASTA · LINDDUN · Attack Trees · Threat Modeling Manifesto · OWASP Threat Dragon",
simple:"Threat modeling is sitting down with a diagram of a system and asking four questions: What are we building? What can go wrong? What are we going to do about it? Did we do a good enough job? It is the single most important skill of a security architect because it is how you find design flaws before any code exists.",
analogy:"Before moving into a new house, you walk around and think like a burglar: which window is hidden from the street, which door lock is weak, where is the spare key. Then you fix the worst ones first. Threat modeling is that walk-around, for software.",
why:"Almost every Security Architect interview has a live threat-model exercise: 'Here is a payment API, threat model it.' They are testing structure, prioritisation, and whether you propose sensible controls rather than listing every attack you know.",
concepts:[
["Four questions (Shostack)","What are we working on? What can go wrong? What are we going to do about it? Did we do a good job?"],
["DFD","Data Flow Diagram: external entities, processes, data stores, data flows, and trust boundaries."],
["Trust boundary","A line where data or control passes between different trust levels (internet to DMZ, service to database, tenant to tenant). Most threats live on boundaries."],
["STRIDE","Spoofing (authN), Tampering (integrity), Repudiation (non-repudiation/logging), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authZ)."],
["STRIDE per element","External entity: S,R. Process: all six. Data store: T,I,D (and R if it is a log). Data flow: T,I,D."],
["PASTA","Process for Attack Simulation and Threat Analysis: 7 risk-centric stages from business objectives to attack simulation and residual risk."],
["LINDDUN","Privacy threat model: Linking, Identifying, Non-repudiation, Detecting, Data disclosure, Unawareness, Non-compliance."],
["Attack tree","Root is attacker goal; children are ways to achieve it (AND/OR nodes). Good for high-value targets."],
["DREAD","Old scoring model (Damage, Reproducibility, Exploitability, Affected users, Discoverability). Largely replaced by simple likelihood x impact."],
["Abuse case","'As an attacker I want to...' user story used to derive security requirements."],
["Threat modeling as code","Tools like pytm, Threagile, or diagrams in repo so models update with the system."]
],
how:`<p><b>A repeatable 60-minute session (the one to describe in interviews):</b></p>
<ol>
<li><b>Scope (5 min):</b> the feature, its business value, the data classification involved.</li>
<li><b>Draw (15 min):</b> DFD with actors, services, stores, third parties. Draw trust boundaries explicitly.</li>
<li><b>Identify (20 min):</b> walk each boundary crossing with STRIDE. Ask: who calls this, how are they authenticated, how is the request authorised, what is logged, what if this component is compromised?</li>
<li><b>Prioritise (10 min):</b> likelihood x impact, high/medium/low is enough.</li>
<li><b>Mitigate (10 min):</b> for each high/medium threat pick: mitigate, eliminate (remove the feature), transfer, or accept (with owner). Write them as tickets in the team's backlog.</li>
</ol>
<p><b>STRIDE to control mapping (memorise this):</b></p>
<table><tr><th>Threat</th><th>Property violated</th><th>Typical controls</th></tr>
<tr><td>Spoofing</td><td>Authentication</td><td>MFA, mTLS, signed tokens, workload identity</td></tr>
<tr><td>Tampering</td><td>Integrity</td><td>TLS, signatures/HMAC, input validation, immutability</td></tr>
<tr><td>Repudiation</td><td>Non-repudiation</td><td>Tamper-evident audit logs, signed transactions</td></tr>
<tr><td>Information disclosure</td><td>Confidentiality</td><td>Encryption, authorisation, data minimisation</td></tr>
<tr><td>Denial of service</td><td>Availability</td><td>Rate limits, quotas, autoscaling, Shield/WAF</td></tr>
<tr><td>Elevation of privilege</td><td>Authorisation</td><td>Least privilege, object-level authZ checks, sandboxing</td></tr></table>
<p><b>Scaling it:</b> a Principal engineer cannot attend every session. Build a tiered approach: self-service questionnaire for low-risk changes, team-run STRIDE with a template for medium, architect-led for high-risk (new data types, new external integrations, auth changes, multi-tenant boundaries). Train security champions to run sessions.</p>`,
aws:[["Diagram and model","Threat Composer (open source AWS tool), OWASP Threat Dragon"],["Common AWS trust boundaries","Internet to CloudFront/ALB; VPC to AWS APIs; account to account; pod to IMDS; tenant data in shared tables"]],
cases:`<p><b>Example: 'Upload profile photo' feature.</b> DFD: user browser, API Gateway, upload Lambda, S3 bucket, image-resizer, CloudFront. Threats found: (S) forged pre-signed URL requests without auth, (T) malicious file (polyglot/SVG with script) served to other users, (I) bucket made public by mistake or predictable object keys exposing other users' photos, (D) huge uploads exhausting storage/cost, (E) image library RCE (ImageTragick style). Controls: auth before pre-signed URL issue, content-length and content-type conditions on the pre-signed policy, random object keys, Block Public Access with CloudFront Origin Access Control, strip metadata and re-encode images in an isolated Lambda, serve from a separate cookie-less domain, malware scanning.</p>`,
mistakes:["Starting with a list of attacks instead of a diagram.","Not drawing trust boundaries.","Producing a 40-page document nobody reads; outputs should be backlog tickets.","Security team doing it alone without developers.","One-time exercise; the model must be revisited when the design changes.","Listing every threat with equal weight instead of prioritising."],
hook:"Draw it, box the boundaries, STRIDE each crossing, rank, ticket it.",
qs:[
{l:"basic",q:"Walk me through STRIDE.",a:"STRIDE is a mnemonic for six threat categories, each mapping to a security property: Spoofing violates authentication, Tampering violates integrity, Repudiation violates non-repudiation, Information disclosure violates confidentiality, Denial of service violates availability, Elevation of privilege violates authorisation. I apply it per element on a data flow diagram, focusing on where data crosses trust boundaries, then map each identified threat to a control like MFA, TLS, audit logging, encryption, rate limiting or object-level authorisation.",t:"Fluency, and linking threats to properties and controls."},
{l:"basic",q:"What is a trust boundary and why does it matter?",a:"It is any point where data or execution moves between components with different privilege or trust levels, such as internet to API, one tenant's data to another, application to database, or a container to the host. Boundaries matter because that is where assumptions break: input must be validated, identity re-established, and authorisation enforced. Most serious findings in threat models sit on boundaries.",t:"Core modelling concept."},
{l:"advanced",q:"STRIDE vs PASTA vs attack trees: when would you use each?",a:"<b>STRIDE</b> is fast, developer-friendly and good for feature-level design reviews. <b>PASTA</b> is risk-centric and heavier: it starts from business objectives and ends with attack simulation, suitable for a critical system like a payments platform where you need a defensible risk analysis for executives or regulators. <b>Attack trees</b> are great for a single high-value goal, e.g. 'steal signing keys', letting you reason about the cheapest attacker path and where one control cuts many branches. I often combine: STRIDE for breadth, an attack tree for the crown-jewel scenario, and LINDDUN when personal data is heavy.",t:"Method selection by context."},
{l:"advanced",q:"How do you scale threat modeling across 300 engineers and 60 teams?",a:"(1) Risk-tiered triggers: new external interface, new sensitive data, auth/crypto changes, new third party, or multi-tenant changes require a model; other changes use a checklist. (2) Templates and a 1-page guide, plus pre-built models for common patterns (public API, event pipeline, file upload). (3) Security champions in each team trained to facilitate. (4) Threat modeling integrated into design docs (a required section) rather than a separate process. (5) Architects review only high-risk ones and do spot checks. (6) Track: percentage of high-risk designs with models, number of findings fixed before release, time from request to review. (7) Threat models live in the repo so they evolve.",t:"Scaling and operating model, key for Principal roles."},
{l:"scenario",q:"Threat model a password reset flow.",a:"<b>Flow:</b> user requests reset with email, system emails a token link, user sets new password. <b>Threats:</b> (S) account enumeration via different responses; (S) token guessable or long-lived; (T) host header injection making the link point to attacker domain; (I) token leaked in Referer header or logs; (D) email flooding a victim; (E) resetting without invalidating sessions lets an attacker keep access; (R) no audit trail. <b>Controls:</b> identical response for known/unknown emails; 128-bit random single-use token, stored hashed, 15-30 min expiry; build URL from config not the Host header; Referrer-Policy no-referrer and no tokens in logs; rate-limit per account and IP; require MFA step if enrolled; invalidate all sessions and refresh tokens after reset; notify the user by email; log events.",t:"Live modelling on a very common interview scenario."},
{l:"scenario",q:"A team says 'we don't have time for threat modeling, we ship in 2 weeks'. What do you do?",a:"I offer a 45-minute focused session on the riskiest part only (usually the new external interface or new data flow), with the output being a handful of tickets, not a document. I explain the cost argument: design flaws found now cost hours; found in pen test or production they cost weeks or an incident. If they still cannot, I record the risk, agree which items must be done before launch versus after, and get the product owner to accept the residual risk formally. Over time I reduce friction with templates so it never feels like a blocker.",t:"Pragmatism and influence."},
{l:"design",q:"Threat model an internal LLM chatbot that can read company Confluence and create Jira tickets.",a:"<b>Components:</b> user via SSO, chat UI, orchestrator, LLM API, retrieval index (vector store) built from Confluence, Jira tool. <b>Key threats:</b> indirect prompt injection from a Confluence page causing the agent to create or modify tickets or leak data; data leakage across permission boundaries if the index ignores Confluence ACLs; excessive agency (tool can delete or change tickets); sensitive data sent to the LLM provider; logs storing secrets; denial of wallet via huge prompts. <b>Controls:</b> enforce per-user ACL filtering at retrieval time using the user's identity; tool calls run with the user's delegated, scoped token, not a super-user; read-only by default and human confirmation for write actions; treat retrieved content as untrusted and separate it from instructions; output filtering for secrets and PII; provider with no training on our data and a regional endpoint; rate limits and cost budgets; full audit log of prompts, retrieved documents and tool calls.",t:"Modern threats plus classic authZ thinking."}
],
quiz:[
{q:"Which STRIDE category maps to the loss of non-repudiation?",o:["Spoofing","Tampering","Repudiation","Elevation of privilege"],c:2,e:"Repudiation: a user can deny an action because there is no trustworthy record."},
{q:"For a data store element in STRIDE-per-element, which threats primarily apply?",o:["S, R","T, I, D","S, E","All six"],c:1,e:"Data stores face Tampering, Information disclosure, Denial of service (plus Repudiation for logs)."},
{q:"LINDDUN is focused on:",o:["Availability","Privacy threats","Cloud misconfiguration","Supply chain"],c:1,e:"LINDDUN is a privacy threat modelling framework."},
{q:"The best output of a threat modelling session is:",o:["A 40-page PDF","Prioritised, owned tickets in the team's backlog","A pen test","A signed policy"],c:1,e:"Actionable backlog items owned by the team are what change the system."}
]

TOPICS.push({
id:"iam", n:4, title:"Identity & Access Management", domain:"Identity & Crypto", week:2,
fw:"NIST SP 800-63-4 (digital identity) · NIST CSF PR.AA · CIS Controls 5, 6 · OWASP ASVS V2-V4",
simple:"IAM answers two questions for every request: <b>Who are you?</b> (authentication, AuthN) and <b>What are you allowed to do?</b> (authorisation, AuthZ). In modern companies identity is the new perimeter: most breaches start with a stolen or abused identity, not a broken firewall.",
analogy:"At an airport, your passport proves who you are (authentication), your boarding pass says which flight and seat you may use (authorisation), and the airline trusts the passport because a government issued it (federation). The boarding pass expires after the flight (short-lived token).",
why:"Identity questions are guaranteed. Expect: explain OAuth vs OIDC vs SAML, draw the authorization code flow with PKCE, design access for 20,000 employees, secure service-to-service auth, handle privileged access. Staff/Principal candidates must discuss token lifetimes, revocation, and machine identities, not just SSO.",
concepts:[
["AuthN vs AuthZ","Authentication proves identity; authorisation decides access. 401 = not authenticated, 403 = authenticated but forbidden."],
["SAML 2.0","XML-based federation for browser SSO. IdP issues a signed assertion to the SP. Common in enterprise SaaS."],
["OAuth 2.0","Delegated authorisation framework. Issues access tokens so a client can call an API on behalf of a user. It is not an authentication protocol."],
["OpenID Connect (OIDC)","Identity layer on top of OAuth 2.0. Adds the ID token (a JWT about the user) and the UserInfo endpoint. Use it for login."],
["Authorization Code + PKCE","Recommended flow for web, mobile and SPA apps. PKCE (code_verifier/code_challenge) stops code interception. Implicit flow is deprecated (OAuth 2.1)."],
["Client Credentials","Machine-to-machine flow; the service authenticates as itself. Prefer private_key_jwt or mTLS over shared secrets."],
["JWT","Signed JSON token: header, payload (claims), signature. Validate signature, alg allow-list, iss, aud, exp, nbf. Never accept alg=none."],
["Access vs refresh token","Access token is short-lived (5-60 min) and sent to APIs. Refresh token is longer-lived, stored securely, rotated on use, revocable."],
["MFA factors","Something you know, have, are. Phishing-resistant MFA = FIDO2/WebAuthn passkeys or smart cards. SMS and push are phishable (MFA fatigue)."],
["Passkeys","FIDO2 credentials bound to the origin, so they cannot be phished to a fake site. Synced or device-bound."],
["RBAC / ABAC / ReBAC","Role-based (roles), Attribute-based (policies over user/resource/context attributes), Relationship-based (Google Zanzibar-style graph: user is editor of folder)."],
["PAM","Privileged Access Management: vaulting, just-in-time elevation, session recording, break-glass accounts."],
["Joiner-Mover-Leaver (JML)","Identity lifecycle. Driven from HR system via SCIM provisioning. Movers are the most common source of privilege creep."],
["SCIM","Standard API for provisioning and deprovisioning users/groups into SaaS apps."],
["Workload identity","Machines get identity from the platform (IAM roles, IRSA/EKS Pod Identity, SPIFFE/SPIRE SVIDs) instead of static keys."],
["ITDR","Identity Threat Detection and Response: detecting token theft, impossible travel, MFA fatigue, abnormal privilege use."],
["Continuous access evaluation","Revoke or re-check sessions in near real time when risk changes (CAEP / Shared Signals Framework)."]
],
how:`<p><b>OIDC Authorization Code flow with PKCE (draw this from memory):</b></p>
<pre>1. App creates code_verifier (random) and code_challenge = SHA256(verifier)
2. Browser -> IdP /authorize?response_type=code&client_id&redirect_uri
             &scope=openid profile&state&nonce&code_challenge&method=S256
3. User authenticates at IdP (password + passkey/MFA)
4. IdP -> redirect_uri?code=XYZ&state=...   (app checks state = CSRF defence)
5. App backend -> IdP /token  code + code_verifier (+ client auth)
6. IdP returns: id_token (who), access_token (what), refresh_token
7. App validates id_token: signature, iss, aud, exp, nonce
8. App calls API with access_token; API validates signature, aud, scope, exp</pre>
<p><b>SAML vs OIDC vs OAuth, the one-liner:</b> SAML and OIDC are for <i>login</i> (authentication and federation); OAuth is for <i>delegated API access</i>. OIDC = OAuth + identity. New builds should prefer OIDC; SAML remains for enterprise SaaS.</p>
<p><b>Token handling rules:</b> keep access tokens short-lived; for browser apps use the <b>BFF (Backend-for-Frontend)</b> pattern so tokens stay server-side and the browser holds an HttpOnly, Secure, SameSite cookie; rotate refresh tokens and detect reuse; use sender-constrained tokens (DPoP or mTLS) for high-value APIs so stolen tokens are useless.</p>
<p><b>Authorisation architecture:</b> separate the Policy Decision Point (PDP) from the Policy Enforcement Point (PEP). Coarse-grained checks at the gateway (is the token valid, does it have the scope), fine-grained object-level checks in the service (does this user own order 123?). Centralise policy with OPA/Rego, Cedar (Amazon Verified Permissions) or a Zanzibar-style service like OpenFGA.</p>
<p><b>Privileged access:</b> no standing admin; request-approve-elevate for a time window; phishing-resistant MFA; session recording for production shells; break-glass accounts sealed, monitored, and tested quarterly.</p>`,
aws:[["Workforce SSO","IAM Identity Center + external IdP (Entra ID / Okta) via SAML and SCIM; permission sets"],["No long-lived keys","IAM roles, STS, IAM Roles Anywhere (X.509) for on-prem, EKS Pod Identity / IRSA for pods"],["Guardrails","Organizations SCPs (limit principals), RCPs (limit resources, e.g. deny access from outside org), permission boundaries"],["Least privilege analysis","IAM Access Analyzer (external, unused access, policy validation, custom policy checks)"],["Customer identity","Amazon Cognito (OIDC/OAuth, passkeys)"],["Fine-grained app authZ","Amazon Verified Permissions (Cedar)"],["Zero-trust app access","AWS Verified Access"]],
cases:`<p><b>Okta support system breach (2023):</b> attackers used a stolen credential to access the support case system and stole HAR files containing session tokens of customers' admins. <b>Lessons:</b> session tokens are credentials; bind sessions to device/IP context; sanitise diagnostic files; short session lifetimes for admin consoles.</p>
<p><b>MGM Resorts (2023):</b> social engineering of the IT help desk to reset an admin's MFA led to domain takeover and ransomware. <b>Lessons:</b> help desk identity verification is part of IAM; require strong verification (video + manager approval) for MFA resets of privileged users; phishing-resistant MFA; ITDR alerts on MFA changes for admins.</p>
<p><b>Microsoft Storm-0558 (2023):</b> a stolen consumer signing key was accepted to forge tokens for enterprise mailboxes due to a validation flaw. <b>Lesson:</b> strict issuer/audience validation and key isolation matter as much as MFA.</p>`,
mistakes:["Using OAuth access tokens as proof of login (use the OIDC ID token).","Storing tokens in localStorage (XSS steals them).","Long-lived access tokens with no revocation.","Wildcard redirect URIs.","Shared service accounts and static access keys in CI.","Treating MFA as done when it is SMS or push without number matching.","Ignoring movers: people keep old access when changing teams."],
hook:"SAML & OIDC log you in, OAuth lets apps act for you, PKCE protects the code, short tokens limit the damage.",
qs:[
{l:"basic",q:"Explain the difference between OAuth 2.0 and OpenID Connect.",a:"OAuth 2.0 is a delegated <b>authorisation</b> framework: it lets a client obtain an access token to call an API on a user's behalf with limited scope. It does not define who the user is. OIDC adds an <b>authentication</b> layer on top: an ID token (a signed JWT with the user's identity, issuer, audience, nonce), standard scopes like openid/profile/email, and a UserInfo endpoint. So: use OIDC to log users in, use OAuth access tokens to call APIs.",t:"The most common identity question."},
{l:"basic",q:"Why is PKCE needed, and does it replace a client secret?",a:"PKCE protects the authorization code from interception (e.g. by a malicious app registered on the same custom URL scheme on mobile, or leaked via logs). The client sends a hash of a random verifier at the start and the verifier itself when exchanging the code, so a stolen code alone is useless. OAuth 2.1 requires PKCE for all clients. It does not replace client authentication for confidential clients (server-side apps should still authenticate, ideally with private_key_jwt or mTLS), but it makes public clients (SPA, mobile) safe without a secret.",t:"Depth on modern OAuth."},
{l:"basic",q:"What must an API check when it receives a JWT?",a:"Verify the signature with a trusted key (fetched from the issuer's JWKS, cached, with key rotation support); enforce an algorithm allow-list (reject 'none' and algorithm confusion like HS256 with the public key); check iss (expected issuer), aud (this API), exp and nbf (with small clock skew), and required scopes/claims; then do object-level authorisation in business logic. For high-value APIs, check sender constraint (DPoP/mTLS binding) and consider token revocation or short lifetimes.",t:"Hands-on security engineering."},
{l:"advanced",q:"RBAC vs ABAC vs ReBAC. Which would you choose for a document collaboration SaaS?",a:"RBAC is simple but explodes into too many roles for per-document sharing. ABAC handles context (department, classification, device posture, time) but becomes hard to reason about and audit. For document collaboration, the natural model is <b>ReBAC</b>: 'user X is editor of folder Y, folder Y contains doc Z' gives inherited permissions naturally, which is what Google Zanzibar was built for (OpenFGA, SpiceDB). I would use ReBAC for resource sharing, RBAC for admin functions (billing admin, org admin) and ABAC conditions for context such as tenant ID must match and device must be managed for confidential docs. Key design points: a central authorisation service, consistency tokens to avoid the 'new enemy' problem, caching with short TTL, and audit logs of every decision.",t:"Real design trade-offs."},
{l:"advanced",q:"How do you handle service-to-service authentication in a microservices platform?",a:"Every workload gets a platform-issued, short-lived identity: in AWS, IAM roles via EKS Pod Identity or IRSA; across platforms, SPIFFE IDs issued by SPIRE as X.509 SVIDs. Transport uses mTLS (often via a service mesh like Istio or Linkerd) so both sides are authenticated and traffic is encrypted. Authorisation policies are expressed on identities, e.g. only 'orders' may call 'payments' POST /charge. For end-user context, propagate a token (token exchange, RFC 8693) with reduced scope rather than forwarding the user's original token everywhere. No static API keys; if unavoidable, they live in Secrets Manager with rotation.",t:"Machine identity at scale."},
{l:"advanced",q:"How do you revoke access quickly when tokens are stateless JWTs?",a:"Options, usually combined: (1) short access token lifetimes (5-15 min) so the window is small; (2) revoke refresh tokens at the IdP and rotate them with reuse detection; (3) a denylist of token IDs (jti) or a 'sessions invalid before' timestamp per user checked at the gateway; (4) Continuous Access Evaluation / Shared Signals (CAEP) so relying parties get pushed revocation events; (5) for critical actions, use introspection (opaque tokens) instead of self-contained JWTs. The trade-off is latency and availability of the IdP versus revocation speed.",t:"Understanding stateless token trade-offs."},
{l:"scenario",q:"An attacker is repeatedly pushing MFA prompts to employees (MFA fatigue). What do you do now and long term?",a:"<b>Now:</b> identify targeted accounts from IdP logs, reset their passwords, revoke sessions, enable number matching and additional context (location, app) for push, rate-limit push attempts, alert the SOC to watch for successful logins from new devices/locations, and warn users. <b>Long term:</b> move to phishing-resistant MFA (FIDO2 passkeys or security keys), starting with admins and high-risk groups; conditional access requiring managed devices; ITDR detections for unusual MFA volume; hardened help-desk verification because attackers pivot there next.",t:"Incident thinking plus strategic fix."},
{l:"scenario",q:"Your CI/CD pipeline uses long-lived AWS access keys stored as pipeline secrets. How do you fix it?",a:"Replace them with OIDC federation: the CI provider (GitHub Actions, GitLab) issues a signed OIDC token per job; AWS IAM trusts that provider and the role's trust policy restricts the 'sub' claim to specific repo, branch or environment (e.g. repo:org/app:ref:refs/heads/main). The job gets short-lived STS credentials. Then: separate roles per environment and per pipeline stage, production deploy role only assumable from protected branches with approvals, deny key creation via SCP, delete old keys, and alert on any IAM user access key usage.",t:"Practical, very common real-world fix."},
{l:"design",q:"Design access management for 20,000 employees across AWS, 300 SaaS apps and on-prem.",a:"<b>Source of truth:</b> HR system drives joiner/mover/leaver into the IdP (Entra ID or Okta). <b>Authentication:</b> SSO everywhere via SAML/OIDC; phishing-resistant MFA (passkeys) with device trust via MDM; conditional access by risk. <b>Provisioning:</b> SCIM to SaaS apps; group-based access tied to roles; birthright access by department. <b>AWS:</b> IAM Identity Center federated to the IdP, permission sets per job function, no IAM users; admin via just-in-time elevation (e.g. temporary group membership with approval). <b>Privileged:</b> PAM for on-prem servers and databases, session recording, vaulted break-glass. <b>Governance:</b> quarterly access reviews for sensitive apps (risk-based, not everything), automatic removal on termination within hours, SoD rules. <b>Detection:</b> ITDR on IdP logs, alerts on admin role grants and MFA changes. <b>Metrics:</b> % apps behind SSO, % users on phishing-resistant MFA, orphaned accounts, time to deprovision.",t:"Enterprise-scale IAM architecture."}
],
quiz:[
{q:"Which token should a client use to learn who logged in?",o:["Access token","Refresh token","ID token","SAML artifact"],c:2,e:"The OIDC ID token contains identity claims for the client."},
{q:"Which MFA method is phishing-resistant?",o:["SMS OTP","TOTP app","Push with number matching","FIDO2 passkey"],c:3,e:"FIDO2/WebAuthn binds the credential to the origin so fake sites cannot use it."},
{q:"OAuth 2.1 removes which flow?",o:["Authorization code","Client credentials","Implicit","Device code"],c:2,e:"The implicit flow (and password grant) are removed; use auth code + PKCE."},
{q:"An AWS control that limits what principals in member accounts can do regardless of their IAM policies:",o:["Permission boundary","SCP","Session policy","Resource policy"],c:1,e:"Service Control Policies set maximum permissions across accounts in an Organization."}
]
