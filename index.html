TOPICS.push({
id:"data", n:11, title:"Data Security & Privacy", domain:"Data", week:5,
fw:"India DPDP Act 2023 + DPDP Rules 2025 · GDPR · ISO/IEC 27701 · NIST Privacy Framework · PCI DSS 4.0.1",
simple:"Data security protects the information itself wherever it goes: know what data you have, where it lives, who can touch it, and make sure it is encrypted, minimised and deleted when no longer needed. Privacy adds the rights of the person the data is about: they should know what you collect, agree to it, and be able to see, correct or erase it.",
analogy:"A hospital records room: you label files by sensitivity, lock the cabinets, log who reads which file, only keep files as long as the law requires, shred them afterwards, and let patients request a copy of their own record.",
why:"Data is usually the crown jewel. Interviews probe classification, DLP, tokenisation vs encryption, data residency, and privacy law. For India-based roles, the DPDP Act and Rules are likely to come up; for global roles, GDPR.",
concepts:[
["Data classification","Levels such as Public, Internal, Confidential, Restricted. Drives controls automatically (tagging → policy)."],
["Data discovery","Finding sensitive data at scale (Macie for S3, DSPM tools across clouds and SaaS)."],
["DSPM","Data Security Posture Management: discover, classify, and assess exposure of data across cloud stores."],
["DLP","Data Loss Prevention: detect and block sensitive data leaving via email, web, endpoint, SaaS, and now GenAI prompts."],
["Tokenisation","Replace sensitive values with tokens; the mapping lives in a secure vault. Great for PCI scope reduction."],
["Masking / pseudonymisation / anonymisation","Masking hides for display; pseudonymised data can be re-identified with extra info (still personal data); anonymised cannot (out of scope of privacy law if truly anonymous)."],
["Data minimisation & retention","Collect only what you need, keep it only as long as needed, delete provably."],
["Encryption at rest / in transit / in use","Storage encryption, TLS, and confidential computing (Nitro Enclaves, SGX/SEV) for data in use."],
["Privacy by design","Build privacy into the design by default (Ann Cavoukian's 7 principles)."],
["DPIA","Data Protection Impact Assessment for high-risk processing."],
["DPDP Act 2023 (India)","Data Fiduciary, Data Principal, Consent Managers, Significant Data Fiduciaries, Data Protection Board. Penalties up to ₹250 crore per breach."],
["DPDP Rules 2025","Notified 14 Nov 2025 with phased rollout: Board provisions immediately, Consent Manager registration after 12 months, most fiduciary obligations (notice, consent, security safeguards, breach notification, rights) after 18 months (around May 2027)."],
["GDPR","Lawful bases, data subject rights, 72-hour breach notification to the authority, DPO, cross-border transfer mechanisms (SCCs), fines up to 4% of global turnover."],
["Data residency / sovereignty","Laws or contracts requiring data to stay in a country, or be protected from foreign access."]
],
how:`<p><b>A data protection program in 6 steps:</b></p>
<ol><li><b>Discover:</b> inventory data stores, run DSPM/Macie, map data flows (records of processing).</li>
<li><b>Classify:</b> tag stores and objects with classification; automate where possible.</li>
<li><b>Protect by class:</b> Restricted = application-level encryption or tokenisation, dedicated KMS keys, strict access, no copies to non-prod.</li>
<li><b>Control flows:</b> DLP on egress channels, data perimeter, masked data in lower environments (synthetic data for tests).</li>
<li><b>Monitor:</b> access logs, anomalous bulk reads, CloudTrail data events, UEBA.</li>
<li><b>Lifecycle:</b> retention policies, deletion workflows, crypto-shredding, data subject request automation.</li></ol>
<p><b>DPDP obligations an architect must design for:</b> clear notice and consent (itemised, withdrawable), purpose limitation, reasonable security safeguards (encryption, access control, logging with logs retained at least one year, backups), breach intimation to the Board and affected people (intimation without delay, detailed report within 72 hours), erasure when the purpose ends, verifiable parental consent for children under 18, grievance redressal, and for Significant Data Fiduciaries: DPO in India, annual DPIA and audit.</p>
<p><b>Tokenisation vs encryption:</b> encryption is reversible with the key and the ciphertext is still regulated data; tokenisation removes the data from the system entirely, so systems holding only tokens can fall out of PCI scope. Format-preserving tokens let legacy systems keep working.</p>`,
aws:[["Discovery","Amazon Macie (S3), AWS Glue sensitive data detection"],["Encryption","KMS, S3/EBS/RDS default encryption, DynamoDB client-side encryption (Database Encryption SDK)"],["Data in use","Nitro Enclaves, Clean Rooms for collaborative analysis"],["Access control","Lake Formation fine-grained (row/column), S3 Access Grants, RCPs"],["Retention","S3 Lifecycle, Object Lock, AWS Backup policies"],["Residency","Region deny SCPs, AWS Digital Sovereignty controls, AWS European Sovereign Cloud"]],
cases:`<p><b>Equifax (2017):</b> an unpatched Apache Struts flaw led to the theft of data on about 147 million people; data was not segmented and an expired certificate blinded the inspection device for months. <b>Lessons:</b> patching, segmentation, certificate inventory, data minimisation.</p>
<p><b>Star Health (India, 2024):</b> customer medical and policy data was reportedly leaked and sold via Telegram bots, allegedly through insider/partner access. Lessons: least privilege for partners, monitoring bulk access, DLP on APIs.</p>`,
mistakes:["Classifying data but not linking classes to enforced controls.","Production data copied into dev/test.","Encryption with keys everyone can use (checkbox encryption).","No deletion; retaining data 'just in case'.","DLP only on email while data leaves through SaaS and GenAI tools.","Forgetting backups and logs contain personal data too."],
hook:"Find it, label it, lock it, watch it, delete it.",
qs:[
{l:"basic",q:"Difference between tokenisation, encryption, and masking?",a:"<b>Encryption</b> transforms data using an algorithm and key; reversible by anyone with the key; the ciphertext is still sensitive in regulatory terms. <b>Tokenisation</b> replaces data with a random surrogate; the original lives only in a secured vault; systems holding tokens handle no sensitive data (reduces PCI scope). <b>Masking</b> hides part of the data for display or non-production (XXXX-XXXX-1234); static masking for test data, dynamic masking at query time.",t:"Precise distinctions."},
{l:"basic",q:"What are the key obligations of India's DPDP Act for a company?",a:"As a Data Fiduciary: process personal data only for a lawful purpose with valid consent (or 'legitimate uses'); give a clear itemised notice; let people withdraw consent as easily as they gave it; implement reasonable security safeguards; notify the Data Protection Board and affected individuals of breaches; erase data when the purpose is served; provide grievance redressal and rights to access, correction and erasure; verifiable parental consent for children; contractually bind processors. Significant Data Fiduciaries must appoint a DPO based in India, run DPIAs and independent audits. Penalties go up to ₹250 crore. The Rules were notified on 14 November 2025 with most obligations applying after 18 months.",t:"Local regulatory currency."},
{l:"advanced",q:"How would you implement 'right to erasure' across microservices, backups and a data lake?",a:"(1) Data map: know every system storing personal data keyed by a subject ID. (2) An erasure orchestration service publishes a deletion event; each owning service implements a handler and confirms, with a tracked SLA. (3) Data lake: use table formats supporting deletes (Iceberg/Delta) or store identifiers in a separate lookup table and delete the mapping. (4) Backups: usually not rewritten; document that restored data will be re-purged by replaying the deletion log, and keep backup retention short. (5) Crypto-shredding: per-user keys for highly sensitive data so deleting the key erases all copies including backups. (6) Evidence: audit trail of completion without keeping the personal data itself.",t:"Real engineering of privacy rights."},
{l:"scenario",q:"Engineers want a copy of production data in the staging environment to debug an issue. What do you allow?",a:"Default answer is no raw production personal data in lower environments. Options: synthetic data generation; masked/tokenised copies produced by an approved pipeline; for a real production bug, debug in production with break-glass, time-limited, logged access to a minimal subset, or use a secure analysis enclave in the production account. If an exception is truly needed, it is approved by the data owner, time-bound, the environment gets production-grade controls, and the data is deleted after. This balances developer velocity with privacy law obligations.",t:"Pragmatic governance."},
{l:"design",q:"Design a data protection architecture for a health-tech platform storing patient records in AWS.",a:"<b>Classification:</b> PHI marked Restricted. <b>Storage:</b> dedicated accounts for PHI; RDS/Aurora and S3 with KMS CMKs per data domain, application-level field encryption for highly sensitive fields (diagnosis, national ID) using envelope encryption with encryption context bound to patient ID. <b>Access:</b> services access via IAM roles; clinicians via app with ABAC (treating relationship, location), break-glass emergency access with justification and review. <b>Perimeter:</b> VPC endpoints, RCPs denying external principals, no internet egress. <b>Analytics:</b> pseudonymised data lake with Lake Formation column/row permissions; re-identification keys held separately. <b>Monitoring:</b> CloudTrail data events, Macie, alerts on bulk reads and after-hours access. <b>Lifecycle:</b> retention per regulation, deletion workflows, backups in vault-locked separate account. <b>Compliance:</b> DPDP/HIPAA mapping, DPIA, audit logs kept per requirement.",t:"Sensitive-data architecture."}
],
quiz:[
{q:"Pseudonymised data under GDPR/DPDP is:",o:["Out of scope","Still personal data","Anonymous","Public"],c:1,e:"It can be re-identified with additional information, so it remains personal data."},
{q:"DPDP Rules 2025 were notified on:",o:["11 Aug 2023","14 Nov 2025","1 Jan 2025","25 May 2018"],c:1,e:"14 November 2025, with phased commencement over 12-18 months."},
{q:"Which technique most reduces PCI DSS scope?",o:["Disk encryption","Tokenisation of PAN at entry","WAF","Longer passwords"],c:1,e:"Systems storing only tokens are typically out of the cardholder data environment."},
{q:"Crypto-shredding is useful for:",o:["Speeding up queries","Erasing data including in backups by deleting keys","Compressing data","DDoS"],c:1,e:"Delete per-subject keys to render all copies unreadable."}

TOPICS.push({
id:"secops", n:12, title:"Security Operations & Detection", domain:"Detect & Respond", week:5,
fw:"NIST CSF DETECT · MITRE ATT&CK · Sigma rules · OCSF · Pyramid of Pain",
simple:"Security operations watches everything that happens (logs, endpoints, cloud events), spots attacks, and hands them to responders. The architect's job is to make sure the right data is collected, stored affordably, turned into good detections, and that every alert leads to action.",
analogy:"A city's CCTV network is useless if cameras point at walls, recordings are deleted after an hour, and nobody watches the screens. SecOps architecture decides where cameras go, how long recordings are kept, and who responds.",
why:"Architects are asked to design logging pipelines, SIEM strategy, detection-as-code, and to reduce alert fatigue. Expect cost versus coverage trade-offs (SIEM ingestion is expensive) and cloud-native detection questions.",
concepts:[
["SIEM","Security Information and Event Management: collects, normalises, correlates, alerts on logs (Splunk, Sentinel, Chronicle/Google SecOps, Elastic)."],
["SOAR","Security Orchestration, Automation and Response: playbooks that enrich alerts and take actions (isolate host, disable user)."],
["EDR / XDR","Endpoint Detection and Response on hosts; XDR correlates across endpoint, identity, email, cloud and network."],
["UEBA","User and Entity Behaviour Analytics: baselines normal behaviour, flags anomalies."],
["Security data lake","Cheap storage for all telemetry (S3 + OCSF, Security Lake) with a SIEM for hot data and correlation. Decouples storage from analytics."],
["OCSF","Open Cybersecurity Schema Framework: common schema for security events, used by Amazon Security Lake."],
["Detection engineering","Treating detections as code: version control, testing, peer review, deployment pipelines, metrics."],
["Sigma","Vendor-neutral detection rule format that converts to SIEM queries."],
["Pyramid of Pain","Hashes (trivial for attackers to change) → IPs → domains → artifacts → tools → TTPs (hardest to change). Detect behaviours, not just IOCs."],
["Threat hunting","Hypothesis-driven, proactive search for attackers that evaded detection."],
["Threat intelligence","Strategic, operational, tactical intel; STIX/TAXII; used to prioritise detections and vulnerabilities."],
["Alert fatigue","Too many low-fidelity alerts; analysts miss real ones. Measure precision and tune."],
["MTTD / MTTR","Mean time to detect / respond (or recover). Core SOC metrics."],
["Deception","Honeytokens (fake AWS keys, canary documents) that give near-zero false-positive alerts."]
],
how:`<p><b>Logging architecture (modern):</b></p>
<pre>Sources: CloudTrail, VPC Flow, DNS, EKS audit, WAF, IdP (Okta/Entra),
         EDR, email, SaaS audit logs, application security logs
  -> Collection (native integrations, Kinesis/Firehose, agents)
  -> Security data lake (S3/OCSF via Security Lake) : all data, 1-2+ years, cheap
  -> SIEM (hot tier) : high-value sources, 90 days, correlation + alerting
  -> SOAR : enrichment, ticketing, automated containment
  -> Case management + metrics</pre>
<p><b>What to log first (priority for detection value):</b> identity provider logs, cloud control plane (CloudTrail), EDR, email security, DNS, VPN/ZTNA, privileged access, critical application audit logs. Then network flows and others.</p>
<p><b>Detection lifecycle:</b> threat intel or ATT&CK gap → hypothesis → write rule as code (Sigma/SQL) → test with simulated attack → peer review → deploy → measure true/false positives → tune or retire. Each detection has an owner, severity, and a runbook.</p>
<p><b>High-value cloud detections:</b> root account usage; CloudTrail/GuardDuty disabled; IAM user or access key created; new trust relationship to unknown account; KMS key scheduled for deletion; S3 bucket policy made public; unusual AssumeRole chains; console login without MFA; spikes in GetObject from one principal; honeytoken key used.</p>`,
aws:[["Threat detection","GuardDuty, including Extended Threat Detection for multi-stage attack sequences"],["Data lake","Amazon Security Lake (OCSF), Athena, OpenSearch"],["Findings hub","Security Hub (unified findings and correlation)"],["Investigation","Detective, CloudTrail Lake"],["Automation","EventBridge + Lambda / Step Functions for response"]],
cases:`<p><b>Target (2013) again:</b> the FireEye system generated alerts on the malware; they were not acted upon. <b>Lesson:</b> detection without triage process and ownership fails.</p>
<p><b>Uber (2022):</b> an attacker used MFA fatigue plus social engineering, then found hard-coded PAM credentials in a network share, and announced themselves on Slack. <b>Lessons:</b> detection of unusual admin access and credential access from shares; phishing-resistant MFA.</p>`,
mistakes:["Collecting everything into an expensive SIEM without use cases.","Detections without runbooks or owners.","Only IOC-based detections.","No testing of detections.","Measuring SOC by number of alerts closed."],
hook:"Collect the right logs, keep them cheap, detect behaviours, test every rule, automate the boring part.",
qs:[
{l:"basic",q:"SIEM vs SOAR vs XDR?",a:"<b>SIEM</b> centralises logs, normalises and correlates them, and raises alerts; it is the analysis platform. <b>SOAR</b> automates response workflows: enrichment, ticketing, containment actions through integrations. <b>XDR</b> is typically a vendor platform correlating its own endpoint, identity, email and cloud telemetry with built-in detections and response. Many organisations now combine a security data lake with a SIEM for detection and SOAR-like automation, and use XDR for endpoint-centric response.",t:"Clear taxonomy."},
{l:"advanced",q:"SIEM costs are exploding. How do you redesign the logging strategy?",a:"(1) Tier data: high-value, detection-relevant sources go to the SIEM hot tier; everything else to a cheap security data lake (S3 with OCSF via Security Lake), queryable with Athena for investigations and hunting. (2) Filter and summarise at ingest (drop noisy, low-value events; aggregate flow logs). (3) Map each ingested source to detections and investigations; drop sources with no use case. (4) Shorter hot retention (e.g. 90 days), longer cold retention for compliance. (5) Consider federated search across the lake. (6) Measure cost per detection and per source. The goal is keeping all data available while paying SIEM prices only for data that drives alerts.",t:"Cost-aware architecture."},
{l:"advanced",q:"How do you build a detection engineering function?",a:"Detections as code in Git (Sigma or native queries) with metadata (ATT&CK mapping, severity, owner, runbook, test case); CI pipeline that lints, unit-tests against sample logs, and deploys to the SIEM; attack simulation (Atomic Red Team, Stratus Red Team) to validate end-to-end; prioritisation from threat intel and ATT&CK gap analysis; metrics per rule (true positive rate, time to triage, volume) and regular tuning or retirement; close partnership with IR for feedback. Target outcomes: higher fidelity alerts, measured coverage of prioritised techniques, lower MTTD.",t:"Engineering rigour in SecOps."},
{l:"scenario",q:"Your SOC gets 5,000 alerts per day and misses real incidents. What do you do?",a:"Measure first: which rules create volume, which ever became true positives. Then: retire or tune the top noisy rules (usually 20 rules create 80% of volume); convert low-fidelity alerts into risk-based scoring that raises one alert per entity when combined signals cross a threshold; automate enrichment and auto-close benign patterns with SOAR; route cloud misconfiguration findings to owning teams instead of the SOC; add high-fidelity sources like honeytokens; set a target (e.g. under 50 actionable alerts per analyst shift, precision above 50%). Report weekly progress.",t:"Operational leadership."},
{l:"design",q:"Design threat detection for a multi-cloud (AWS primary, some Azure) company with Okta and M365.",a:"Sources: AWS CloudTrail org trail, GuardDuty and Security Hub findings, Azure Activity/Entra logs, Okta System Log, M365 audit and Defender, EDR on endpoints and servers, DNS logs. Pipeline: normalise to OCSF in a security data lake; SIEM for correlation; identity is the connecting key so build an identity graph linking Okta users to AWS roles and Azure principals. Detections focus on identity attacks (MFA fatigue, session hijack, impossible travel), cloud control plane abuse, data exfiltration, and endpoint TTPs. Automation: disable user in Okta, revoke AWS sessions, isolate host via EDR. Coverage measured against ATT&CK Cloud and Enterprise matrices with purple-team validation.",t:"Cross-platform design."}
],
quiz:[
{q:"At the top of the Pyramid of Pain (hardest for attackers to change) are:",o:["Hash values","IP addresses","TTPs","Domain names"],c:2,e:"Detecting behaviours (TTPs) costs attackers the most."},
{q:"OCSF is:",o:["A SIEM product","An open schema for security events","A compliance framework","A threat actor"],c:1,e:"Open Cybersecurity Schema Framework, used by Security Lake."},
{q:"A honeytoken AWS key being used is an example of:",o:["High-fidelity deception detection","Vulnerability scanning","DLP","Patching"],c:0,e:"Nobody legitimate should use it, so any use is a strong signal."},
{q:"Best first step when drowning in alerts:",o:["Hire more analysts","Measure which rules generate volume and their true-positive rates","Turn off the SIEM","Buy XDR"],c:1,e:"Data-driven tuning of the noisiest rules gives the fastest improvement."}

TOPICS.push({
id:"ir", n:13, title:"Incident Response & Ransomware", domain:"Detect & Respond", week:5,
fw:"NIST SP 800-61 Rev 3 (2025, aligned to CSF 2.0) · SANS PICERL · CERT-In Directions 2022 · SEC cyber disclosure rules",
simple:"Incident response is the plan for when (not if) something goes wrong: detect it, stop it spreading, remove the attacker, get the business running again, and learn from it. Good IR is mostly preparation: people who know their roles, practised playbooks, logs that exist, and backups that restore.",
analogy:"A fire drill. Nobody learns where the exits are during a real fire. Teams that practise evacuate calmly; teams that don't, panic. Tabletop exercises are fire drills for cyber incidents.",
why:"Senior interviews always include 'walk me through how you handled an incident' and a live scenario, often ransomware. They test calm structure, prioritisation (evidence vs containment), communications, legal and regulatory awareness.",
concepts:[
["NIST lifecycle","Preparation → Detection & Analysis → Containment, Eradication & Recovery → Post-incident activity. Rev 3 (April 2025) maps IR to CSF 2.0 functions."],
["SANS PICERL","Preparation, Identification, Containment, Eradication, Recovery, Lessons learned."],
["Severity levels","Defined by business impact (data, customers, availability, regulatory), not technical interest."],
["Roles","Incident Commander, technical lead, communications lead, scribe, legal, executive sponsor."],
["Containment strategies","Short-term (isolate, block, disable account) vs long-term (rebuild, segment). Balance evidence preservation vs stopping damage."],
["Forensics basics","Order of volatility (memory first, then disk, then logs), chain of custody, hashing evidence, working on copies."],
["Ransomware (double/triple extortion)","Encryption plus data theft plus threats to customers or DDoS."],
["Immutable backups","Backups that cannot be deleted or changed by an attacker with admin rights (Object Lock, vault lock, offline)."],
["CERT-In (India)","Report specified incidents within 6 hours; maintain logs for 180 days within India (2022 directions)."],
["SEC (US)","Public companies disclose material cyber incidents on Form 8-K within 4 business days of determining materiality."],
["GDPR / DPDP","GDPR: notify authority within 72 hours. DPDP Rules: intimate the Board without delay and a detailed report within 72 hours."],
["Tabletop exercise","Discussion-based simulation to test the plan, roles and decisions with executives and technical teams."]
],
how:`<p><b>First hour of a serious incident:</b></p>
<ol><li>Declare the incident, assign Incident Commander, open a war room and a timeline document.</li>
<li>Scope: what systems, which identities, what data, is it still active?</li>
<li>Preserve evidence for key systems (snapshots, memory, logs) before destructive actions where possible.</li>
<li>Contain the spread: disable compromised accounts, revoke sessions and tokens, isolate hosts, block C2.</li>
<li>Engage legal early (privilege, regulatory clocks) and communications.</li>
<li>Decide regulatory notification clocks (CERT-In 6 hours, GDPR 72 hours, DPDP, SEC materiality).</li></ol>
<p><b>Ransomware playbook highlights:</b> isolate affected segments (not a full shutdown unless needed); protect the backups and the identity plane first (domain controllers, IdP, backup consoles); reset privileged credentials (krbtgt twice for AD); determine data exfiltration scope; restore from known-clean, immutable backups into a clean environment; rebuild rather than clean; ransom payment decision involves executives, legal, insurers and sanction checks (OFAC); engage law enforcement.</p>
<p><b>Cloud IR specifics (AWS):</b> pre-provisioned forensic account and IR roles; revoke role sessions; isolate EC2 with forensic security group; snapshot EBS and share to forensic account; preserve CloudTrail and Flow Logs; check for persistence (new IAM users, keys, roles, Lambda functions, EventBridge rules, federation changes).</p>`,
aws:[["Preparation","Forensic account, IR IAM roles, AWS Security Incident Response service, runbooks"],["Evidence","EBS snapshots, CloudTrail Lake, VPC Flow Logs, S3 access logs"],["Containment","Revoke role sessions, SCP quarantine for account, security group isolation"],["Recovery","AWS Backup with Vault Lock (compliance mode), logically air-gapped vault, cross-account and cross-region copies"]],
cases:`<p><b>Maersk / NotPetya (2017):</b> destructive malware wiped around 49,000 laptops and all domain controllers except one in Ghana, which survived due to a power outage and was flown to London to rebuild. <b>Lessons:</b> offline recovery of identity systems, segmentation, and tested rebuild processes.</p>
<p><b>Colonial Pipeline (2021):</b> ransomware through a legacy VPN account without MFA; the company shut down pipeline operations as a precaution. Lesson: MFA on all remote access, and knowing IT/OT dependencies before an incident.</p>
<p><b>Change Healthcare (2024):</b> stolen credentials on a Citrix portal without MFA led to ransomware disrupting US healthcare payments for weeks. Lesson: MFA everywhere and resilience of critical business services.</p>`,
mistakes:["No out-of-band communication channel (attacker reads Slack/email).","Wiping systems before capturing evidence.","Restoring backups infected with the same malware.","Forgetting regulatory clocks.","Blame-focused post-mortems.","IR plan never exercised."],
hook:"Prepare, declare, preserve, contain, eradicate, recover, learn; and watch the regulatory clock.",
qs:[
{l:"basic",q:"Walk me through the incident response lifecycle.",a:"Using NIST SP 800-61: <b>Preparation</b> (plans, roles, tools, logging, training, exercises); <b>Detection and Analysis</b> (triage alerts, determine scope, severity and impact); <b>Containment, Eradication and Recovery</b> (limit spread, preserve evidence, remove attacker access and malware, restore services safely and monitor for recurrence); <b>Post-incident activity</b> (blameless review, root cause, improvement actions, metrics). Rev 3 in 2025 aligned this with CSF 2.0 so IR is part of overall risk management, not a separate silo.",t:"Structure."},
{l:"advanced",q:"How do you balance evidence preservation against containment?",a:"It depends on the severity of ongoing harm. If data is actively being exfiltrated or ransomware is spreading, containment wins: isolate network access (which usually preserves memory and disk) rather than power off. Prefer containment that keeps evidence: network isolation over shutdown, snapshot before rebuild, revoke credentials rather than delete accounts. Have forensic collection automated (EBS snapshots, memory capture tooling) so it takes minutes. The Incident Commander makes the call and records it in the timeline.",t:"Judgement under pressure."},
{l:"scenario",q:"It is 3 am. Ransomware is encrypting file servers across three offices. Go.",a:"(1) Declare a critical incident, wake the IC, IR team, IT ops, legal, comms; move to an out-of-band channel. (2) Contain: isolate affected network segments and VPN; disable compromised and privileged accounts; block known C2 via firewall/EDR; protect backup systems and domain controllers by isolating them. (3) Scope: identify patient zero and the ransomware family from EDR; check for data exfiltration (large outbound transfers); determine if the identity plane (AD/IdP) is compromised. (4) Preserve evidence: snapshots and memory from key hosts, ransom notes. (5) Regulatory clocks: CERT-In within 6 hours, DPDP/GDPR, insurers, law enforcement. (6) Recover: prioritise business-critical services; rebuild clean identity infrastructure if compromised; restore from immutable backups after scanning; reset credentials including krbtgt twice. (7) Communicate regularly to execs, employees and customers. (8) Lessons learned and fixes (MFA, EDR coverage, segmentation).",t:"The classic senior scenario."},
{l:"scenario",q:"Tell me about a significant incident you handled. (How to structure your answer)",a:"Use STAR with an IR spine: <b>Situation:</b> what was detected, when, business context and scale. <b>Task:</b> your role (IC, technical lead, architect). <b>Action:</b> how you scoped it, key decisions and trade-offs (e.g. isolated rather than shut down; decided to rotate all secrets), how you coordinated legal and comms, what you automated. <b>Result:</b> time to contain, impact limited to X, no regulatory penalty, and <b>the systemic improvements</b> you drove afterwards (e.g. moved to phishing-resistant MFA, cut MTTD from days to hours). Principal-level signal is the systemic follow-through.",t:"Behavioural IR storytelling."},
{l:"design",q:"Design ransomware resilience for a mid-size company on AWS and Microsoft 365.",a:"<b>Prevent:</b> phishing-resistant MFA, EDR everywhere, patch edge devices fast, remove local admin, email security, attack surface management. <b>Limit:</b> tiered admin model, PAM, segmentation, no domain admin sessions on workstations, SCPs preventing deletion of backups and logs. <b>Detect:</b> EDR behavioural detections, canary files, alerts on mass encryption and shadow copy deletion, backup deletion attempts. <b>Recover:</b> 3-2-1-1-0 backups (3 copies, 2 media, 1 offsite, 1 immutable/offline, 0 errors on restore tests); AWS Backup Vault Lock in compliance mode in a separate account; M365 backup; clean-room recovery environment; tested restore of identity systems. <b>Prepare:</b> runbooks, ransom payment decision framework, retainer with IR firm, tabletop twice a year with executives.",t:"Resilience architecture."}
],
quiz:[
{q:"CERT-In requires reporting of specified cyber incidents within:",o:["72 hours","24 hours","6 hours","4 business days"],c:2,e:"The 2022 CERT-In directions require reporting within 6 hours."},
{q:"Order of volatility says to collect first:",o:["Disk images","Memory","Archived logs","Backups"],c:1,e:"Memory is lost on reboot, so capture it first."},
{q:"The '1' for immutability in 3-2-1-1-0 backups means:",o:["One cloud","One immutable or offline copy","One restore per year","One admin"],c:1,e:"One copy that attackers with admin access cannot alter or delete."},
{q:"SEC rules require disclosure of material incidents within:",o:["72 hours","4 business days after determining materiality","30 days","6 hours"],c:1,e:"Form 8-K Item 1.05 within four business days of the materiality determination."}
]

TOPICS.push({
id:"vuln", n:14, title:"Vulnerability & Exposure Management", domain:"Detect & Respond", week:6,
fw:"CVSS v4.0 · EPSS · CISA KEV · SSVC · Gartner CTEM · PTES / OWASP WSTG",
simple:"Every system has vulnerabilities; you can never fix them all. Vulnerability management finds them, decides which actually matter for <i>your</i> business, and gets them fixed in time. Modern programs care about <b>exposure</b>: is it reachable, is it being exploited in the wild, what would it lead to?",
analogy:"A hospital emergency room uses triage: not first come first served, but by how likely the patient is to die and how fast. CVSS is the textbook severity; EPSS, KEV and reachability are the triage nurse.",
why:"Interviewers look for risk-based prioritisation, not 'patch all criticals in 7 days'. They also ask about pen testing vs red teaming, and about measuring the program.",
concepts:[
["CVE / CWE","CVE identifies a specific vulnerability; CWE is the weakness type (e.g. CWE-79 XSS)."],
["CVSS","Common Vulnerability Scoring System, 0-10 severity. v4.0 (Nov 2023) adds Base, Threat, Environmental and Supplemental metric groups. Severity is not risk."],
["EPSS","Exploit Prediction Scoring System: probability (0-1) a CVE will be exploited in the next 30 days."],
["CISA KEV","Known Exploited Vulnerabilities catalog; confirmed in-the-wild exploitation. Top priority."],
["SSVC","Stakeholder-Specific Vulnerability Categorisation: decision tree (Track, Track*, Attend, Act)."],
["CTEM","Continuous Threat Exposure Management: Scoping, Discovery, Prioritisation, Validation, Mobilisation."],
["Attack surface management","Continuously discovering internet-facing assets (including unknown/shadow IT)."],
["Attack path analysis","Combining vulnerabilities, identities, and network reachability to find chains to crown jewels (graph-based)."],
["Pen test","Time-boxed, scoped test to find as many vulnerabilities as possible in a target."],
["Red team","Goal-based adversary emulation testing detection and response, often stealthy, across people, process and technology."],
["Purple team","Red and blue working together to improve detections technique by technique."],
["Bug bounty / VDP","Paid external researchers (bounty) or a policy for accepting reports (Vulnerability Disclosure Program)."],
["Virtual patching","WAF/IPS rule blocking exploitation until the code is fixed."]
],
how:`<p><b>Risk-based prioritisation formula (explain this):</b></p>
<pre>Priority = f( Exploitability : KEV? EPSS high? public exploit?
             Exposure       : internet-facing? reachable code path? auth required?
             Impact         : asset criticality, data sensitivity, blast radius
             Compensating   : WAF, isolation, feature disabled )
Example SLAs:  KEV + internet-facing ........ 48-72 hours
               Critical, reachable ........... 7-14 days
               High ........................... 30 days
               Everything else ................ next regular patch cycle / backlog</pre>
<p><b>Program components:</b> complete asset inventory (you cannot patch what you do not know), scanners for each layer (hosts, containers, cloud config, code, dependencies, external attack surface), deduplication and ownership routing (tags → team), SLAs with exception process, automation for patching (immutable infrastructure: rebuild images instead of patching servers), and validation via pen test, red team and breach simulation.</p>
<p><b>Metrics that matter:</b> % KEV vulns fixed within SLA, mean time to remediate by severity, exposure window for internet-facing criticals, coverage of scanning, age of oldest criticals, recurring vulnerability classes.</p>`,
aws:[["Scanning","Amazon Inspector (EC2, ECR, Lambda, code), Security Hub CSPM for configuration"],["Patching","SSM Patch Manager, EC2 Image Builder, immutable AMI pipelines"],["Exposure","IAM Access Analyzer external access, Inspector network reachability, GuardDuty"]],
cases:`<p><b>Equifax (2017):</b> an Apache Struts CVE was patched upstream in March; the breach began in May because the vulnerable system was not identified. <b>Lesson:</b> asset inventory and ownership are the foundation.</p>
<p><b>Citrix Bleed (2023):</b> session token leakage in NetScaler; patching was not enough because stolen sessions stayed valid; teams also had to kill active sessions. Lesson: remediation includes cleaning up exploitation consequences.</p>`,
mistakes:["Prioritising only by CVSS.","Measuring the number of vulns found instead of risk reduced.","No owners for findings.","Patching servers in place instead of rebuilding images.","Pen testing once a year and calling it assurance.","Endless exceptions with no expiry."],
hook:"Is it exploited (KEV/EPSS)? Is it exposed? Is it important? Then fix fast, rebuild don't patch, prove it with testing.",
qs:[
{l:"basic",q:"Why is CVSS alone not enough for prioritisation?",a:"CVSS base scores describe technical severity in a generic context. They ignore whether the vulnerability is actually being exploited, whether it is reachable in our environment, and how important the asset is. Roughly half of all CVEs score High or Critical, while only a small percentage are ever exploited. Combining CVSS with EPSS (likelihood), CISA KEV (known exploitation), exposure (internet-facing, reachable code path) and asset criticality focuses effort on real risk.",t:"Risk-based thinking."},
{l:"basic",q:"Pen test vs red team vs purple team?",a:"<b>Pen test:</b> scoped, time-boxed, aims to find as many vulnerabilities as possible in a specific target; defenders often know. <b>Red team:</b> objective-based adversary emulation (e.g. access the payments database) across people, process and technology, stealthy, tests detection and response. <b>Purple team:</b> red and blue collaborate openly, running techniques one by one and improving detections in real time. Use pen tests for assurance on new systems, red teams for mature orgs to test the whole defence, purple teams to rapidly improve detection coverage.",t:"Assurance vocabulary."},
{l:"advanced",q:"How would you design a vulnerability management program for 10,000 cloud workloads?",a:"Asset inventory from cloud APIs with ownership tags enforced at account vending; agentless and agent-based scanning (Inspector) for EC2, containers and Lambda; SCA in CI so vulnerable dependencies are caught before deploy; findings deduplicated and enriched with EPSS, KEV, internet exposure and data sensitivity in a central platform; auto-routing to owning teams' backlogs with SLAs; fix by rebuilding golden images and redeploying rather than patching in place; exception workflow with expiry and compensating controls; dashboards per team; validation via attack path analysis and periodic pen tests. The key is ownership plus automation.",t:"Scale."},
{l:"scenario",q:"A team asks for a 6-month exception for a critical vulnerability on an internet-facing legacy app. Your response?",a:"Understand why: vendor end-of-life, fragile code, or resource constraint. Assess actual exposure (is the vulnerable component reachable? KEV-listed?). If exploitation is likely, I would not accept 6 months without strong compensating controls: WAF virtual patch, restrict access (ZTNA or IP allow-list instead of public), extra monitoring, isolate it from sensitive systems. Approve a shorter exception (e.g. 30-60 days) tied to a remediation plan with milestones, with the business owner formally accepting the residual risk, and escalate if the risk is above appetite. Also use it as evidence for funding legacy modernisation.",t:"Risk negotiation."},
{l:"design",q:"How do you measure whether the vulnerability program is working?",a:"Outcome metrics rather than activity: (1) % of KEV and exploitable criticals remediated within SLA; (2) exposure window: mean days internet-facing criticals remain open; (3) mean time to remediate by severity and trend; (4) scanning coverage of assets; (5) number of overdue exceptions; (6) repeat findings by class (shows whether root causes are fixed); (7) validation results: pen tests and red teams finding fewer high-impact paths. Report these to leadership with team-level breakdowns.",t:"Metrics maturity."}
],
quiz:[
{q:"EPSS estimates:",o:["Severity of impact","Probability of exploitation in the next 30 days","Patch cost","Asset value"],c:1,e:"EPSS is a probability of exploitation activity."},
{q:"The highest-priority signal among these:",o:["CVSS 7.5, not reachable","Listed in CISA KEV and internet-facing","CVSS 9.0 on an isolated test box","Informational finding"],c:1,e:"Known exploitation plus exposure dominates."},
{q:"A goal-based, stealthy adversary emulation is a:",o:["Pen test","Vulnerability scan","Red team","Code review"],c:2,e:"Red teams test detection and response against objectives."},
{q:"CVSS v4.0 includes which metric groups?",o:["Base only","Base, Threat, Environmental, Supplemental","Impact and Likelihood","Temporal only"],c:1,e:"v4.0 renamed Temporal to Threat and added Supplemental."}
]
});

TOPICS.push({
id:"grc", n:15, title:"Governance, Risk & Compliance", domain:"Governance", week:6,
fw:"ISO 31000 · NIST SP 800-30 / 800-37 (RMF) · FAIR · SOC 2 · PCI DSS 4.0.1 · HIPAA · RBI / SEBI CSCRF (India)",
simple:"GRC connects security to the business. <b>Governance</b> decides who is accountable and what the rules are. <b>Risk management</b> finds and ranks what could hurt the business and decides what to do about it. <b>Compliance</b> proves to regulators, auditors and customers that you meet required standards.",
analogy:"Running a car fleet: governance sets driving rules and who manages the fleet; risk management decides where to spend on brakes vs insurance; compliance is the roadworthiness certificate. A certificate does not stop accidents on its own.",
why:"At Principal level you must talk risk in money and business language, justify investments, and design controls that satisfy audits without slowing engineering. Expect questions on quantifying risk, risk appetite, and communicating with the board.",
concepts:[
["Risk treatment options","Mitigate (reduce), Transfer (insurance, contracts), Avoid (stop the activity), Accept (documented, by owner)."],
["Risk appetite / tolerance","How much risk the organisation is willing to take in pursuit of goals; tolerance is the acceptable variation."],
["Qualitative vs quantitative risk","High/Medium/Low heatmaps vs money-based estimates (FAIR, Monte Carlo)."],
["FAIR","Factor Analysis of Information Risk: Risk = Loss Event Frequency x Loss Magnitude, expressed as ranges in currency."],
["ALE","Annualised Loss Expectancy = Single Loss Expectancy x Annual Rate of Occurrence (classic CISSP formula)."],
["Risk register","List of risks with owner, rating, treatment, due date, status."],
["Policy / standard / procedure / guideline","Policy = intent (mandatory), Standard = specific requirements, Procedure = step-by-step, Guideline = recommended."],
["SOC 2","AICPA attestation on Trust Services Criteria (Security mandatory; Availability, Confidentiality, Processing Integrity, Privacy optional). Type I = design at a point in time; Type II = operating effectiveness over 3-12 months."],
["PCI DSS 4.0.1","12 requirements for cardholder data; future-dated requirements became mandatory on 31 March 2025 (e.g. MFA for all CDE access, targeted risk analyses, authenticated scanning, payment page script integrity)."],
["Third-party risk (TPRM)","Assess vendors by criticality: questionnaires, SOC 2 reports, contractual terms, continuous monitoring."],
["Security metrics","KRIs (risk indicators) and KPIs (performance), e.g. % phishing-resistant MFA, MTTR of KEV vulns."],
["India sector rules","RBI Master Direction on IT governance for banks/NBFCs, SEBI Cybersecurity and Cyber Resilience Framework (CSCRF), IRDAI guidelines, CERT-In directions."],
["Continuous control monitoring","Automated evidence collection and testing of controls instead of annual screenshots."]
],
how:`<p><b>Talking to the board:</b> lead with business outcomes and risk in their language. Instead of '42 critical vulnerabilities', say 'there is roughly a 20% chance per year of a ransomware event that would halt order processing for 5-10 days, with an estimated loss of ₹40-120 crore. A ₹6 crore investment in immutable backups and EDR reduces that to about 5%.'</p>
<p><b>FAIR in 4 steps:</b> (1) define a scenario (asset, threat, effect); (2) estimate Loss Event Frequency (threat event frequency x vulnerability) as ranges; (3) estimate Loss Magnitude (primary: response, replacement, productivity; secondary: fines, reputation, customer churn); (4) run Monte Carlo simulation to get a loss distribution; compare with and without controls to show return on investment.</p>
<p><b>Designing controls that pass audits without friction:</b> controls as code (SCPs, Config rules), automated evidence (Audit Manager, API exports), a unified control framework, clear control ownership, and 'compliance by default' in platform templates.</p>`,
aws:[["Evidence","AWS Audit Manager, AWS Artifact (AWS's own compliance reports)"],["Controls","Config conformance packs, Security Hub CSPM standards, Control Tower controls"],["Governance","Organizations tag policies, AWS Budgets"]],
cases:`<p><b>SolarWinds SEC case (2023-2025):</b> the SEC sued SolarWinds and its CISO over allegedly misleading security disclosures; most claims were dismissed in 2024 and the case was later dropped in 2025, but it made executives and CISOs very careful about the accuracy of public statements and internal risk reporting.</p>
<p><b>Uber CSO conviction (2022):</b> the former CSO was convicted for concealing a 2016 breach from the FTC. Lesson: governance includes honest escalation and disclosure.</p>`,
mistakes:["Heatmaps with no money or likelihood definitions.","Security owning all risks.","Compliance checkbox mentality.","Policies nobody reads or that cannot be followed.","Vendor questionnaires without follow-up.","Metrics that measure activity, not outcomes."],
hook:"Governance = who decides, Risk = what matters in money, Compliance = prove it continuously.",
qs:[
{l:"basic",q:"What are the four risk treatment options? Give examples.",a:"<b>Mitigate:</b> reduce likelihood or impact with controls (MFA to reduce account takeover). <b>Transfer:</b> shift financial impact (cyber insurance, contractual liability with a vendor); note you cannot transfer reputational or regulatory accountability. <b>Avoid:</b> stop the risky activity (do not store card numbers; use a payment provider). <b>Accept:</b> consciously live with it, documented and signed by the business owner, with a review date.",t:"Basics of risk language."},
{l:"basic",q:"SOC 2 Type I vs Type II?",a:"Type I reports whether controls are suitably designed at a single point in time. Type II reports whether they operated effectively over a period, usually 6-12 months (minimum 3), including sample testing by the auditor. Customers generally want Type II. Also check scope, the trust services criteria covered, exceptions noted, and complementary user entity controls (what the customer must do).",t:"Vendor assurance knowledge."},
{l:"advanced",q:"How do you quantify cyber risk for a CFO?",a:"Use FAIR-style analysis for the top 5-10 scenarios (ransomware halting operations, customer data breach, payment fraud, cloud outage). For each: estimate frequency ranges using industry data (e.g. breach reports, insurance data) and our control strength, and loss magnitude ranges (downtime cost per hour from finance, regulatory fines like DPDP up to ₹250 crore, notification, legal, churn). Run a Monte Carlo simulation to present annualised loss as a range and a loss exceedance curve. Then show how a proposed investment shifts the curve, giving a return on security investment. Be honest about uncertainty; ranges are more credible than false precision.",t:"Business communication."},
{l:"scenario",q:"The business wants to launch in a new country in 3 months; legal says local data residency applies. What is your role?",a:"Clarify requirements with legal: which data, storage only or also processing and access, can support staff abroad access it, are there localisation of logs or backups. Architect options: dedicated AWS region deployment with SCP region controls, data partitioning by customer country, keys managed in-region (KMS in that region, or external key store if sovereignty demands), restricted cross-border replication and support access via just-in-time with logging. Estimate cost and time; highlight trade-offs (latency, duplicate infrastructure). Document the decision in an ADR and feed controls into compliance evidence.",t:"Translating regulation to architecture."},
{l:"design",q:"Design a third-party risk management program for 800 vendors.",a:"Tier vendors by data access and business criticality (tier 1: access to sensitive data or critical operations). Tier 1: deep assessment (SOC 2 Type II / ISO certificate review, questionnaire, architecture review, pen test summary), contractual security clauses (breach notice within 24-72 hours, right to audit, data deletion), annual reassessment and continuous monitoring (security ratings, breach news). Tier 2: lighter questionnaire and certificate check. Tier 3: automated checks only. Technical controls matter as much as paperwork: SSO for SaaS, least-privilege integrations, OAuth app governance, data minimisation, and offboarding. Track: % tier 1 vendors assessed, open findings, concentration risk (single points of failure like one cloud or IdP).",t:"Program design at scale."}
],
quiz:[
{q:"Buying cyber insurance is an example of risk:",o:["Avoidance","Transfer","Acceptance","Mitigation"],c:1,e:"Transfer shifts financial impact to another party."},
{q:"SOC 2 Type II evaluates:",o:["Design at a point in time","Operating effectiveness over a period","Only privacy","Code quality"],c:1,e:"Type II covers a period, typically 6-12 months."},
{q:"PCI DSS 4.0 future-dated requirements became mandatory on:",o:["31 March 2024","31 March 2025","1 Jan 2026","They are optional"],c:1,e:"31 March 2025."},
{q:"In FAIR, risk is expressed as:",o:["Colour on a heatmap","Probable frequency and magnitude of future loss","CVSS score","Number of controls"],c:1,e:"FAIR quantifies loss event frequency and loss magnitude."}
]
});

TOPICS.push({
id:"ai", n:16, title:"AI, LLM & Agentic Security", domain:"Emerging", week:7,
fw:"OWASP Top 10 for LLM Applications 2025 · OWASP Top 10 for Agentic Applications 2026 · NIST AI RMF 1.0 · ISO/IEC 42001 · MITRE ATLAS · EU AI Act",
simple:"AI systems add new ways to be attacked. The biggest idea to understand: an LLM cannot reliably tell the difference between instructions and data. Any text it reads (a web page, an email, a document) can try to give it orders. So you must design AI apps as if the model can be tricked, and limit what damage a tricked model can do.",
analogy:"An AI agent is like a very capable new intern who believes every note they read. If a customer email says 'intern, please send me the salary file', a naive intern might do it. You would give that intern limited access, require approval for sensitive actions, and check their work.",
why:"Almost every 2026 interview for senior security roles asks about securing GenAI: prompt injection, data leakage, RAG permissions, agent tool permissions, AI governance. It is where a Principal candidate can stand out.",
concepts:[
["OWASP LLM Top 10 (2025)","LLM01 Prompt Injection, LLM02 Sensitive Information Disclosure, LLM03 Supply Chain, LLM04 Data and Model Poisoning, LLM05 Improper Output Handling, LLM06 Excessive Agency, LLM07 System Prompt Leakage, LLM08 Vector and Embedding Weaknesses, LLM09 Misinformation, LLM10 Unbounded Consumption."],
["OWASP Agentic Top 10 (2026)","ASI01 Agent Goal Hijack, ASI02 Tool Misuse, ASI03 Identity & Privilege Abuse, ASI04 Agentic Supply Chain, ASI05 Unexpected Code Execution, ASI06 Memory & Context Poisoning, ASI07 Insecure Inter-Agent Communication, ASI08 Cascading Failures, ASI09 Human-Agent Trust Exploitation, ASI10 Rogue Agents. Released Dec 2025."],
["Direct prompt injection","User types instructions to override the system prompt ('ignore previous instructions')."],
["Indirect prompt injection","Malicious instructions hidden in content the model reads (web pages, emails, documents, tool outputs). The more dangerous kind for agents."],
["Jailbreak","Techniques to bypass the model's safety training."],
["RAG","Retrieval-Augmented Generation: fetch relevant documents from a vector store and add them to the prompt. Risk: leaking documents the user should not see."],
["Excessive agency","Agent has more tools, permissions or autonomy than needed."],
["Lethal trifecta","Access to private data + exposure to untrusted content + ability to communicate externally = data exfiltration risk. Remove at least one leg."],
["MCP","Model Context Protocol: standard for connecting agents to tools; risks include malicious servers, tool poisoning and over-broad OAuth scopes."],
["Guardrails","Input/output filters, classifiers for injection, PII redaction, topic restrictions (e.g. Bedrock Guardrails)."],
["Model supply chain","Pickle-based model files can execute code; use safetensors, verify sources, scan models."],
["NIST AI RMF","Govern, Map, Measure, Manage functions for AI risk."],
["ISO/IEC 42001","Certifiable AI management system standard (2023)."],
["MITRE ATLAS","ATT&CK-style knowledge base of adversarial ML techniques."]
],
how:`<p><b>Secure LLM application architecture:</b></p>
<pre>User (SSO) -> App/orchestrator
  - input checks: auth, rate/cost limits, injection classifier, PII redaction
  - retrieval: vector store query FILTERED by the user's permissions (ACL-aware)
  - prompt assembly: system instructions separated from untrusted content
  - model call via private endpoint (no training on our data, logged)
  - output handling: treat as untrusted -> encode, validate, no direct exec/SQL
  - tools/agents: user's own scoped, short-lived token; allow-listed actions;
    human approval for writes, payments, external sends
  - audit log: prompt, retrieved doc IDs, tool calls, outputs (with PII controls)
  - monitoring: abuse, cost anomalies, jailbreak attempts, evals in CI</pre>
<p><b>Key design principles:</b> (1) least privilege for agents: tools act with the calling user's permissions, never a super-user service account; (2) break the lethal trifecta: e.g. an agent that reads untrusted email should not also be able to send data externally without approval; (3) human-in-the-loop for irreversible or high-impact actions; (4) sandbox code execution (isolated containers/microVMs, no network or credentials); (5) treat model output like user input; (6) evaluate continuously with red-team prompts and regression tests.</p>
<p><b>AI governance program:</b> AI use policy, inventory of AI systems and shadow AI (SaaS tools), risk tiering (EU AI Act categories where relevant), vendor review (data retention, training use, region), DLP for prompts to public AI tools, and an approved enterprise AI platform so people do not use unsanctioned tools.</p>`,
aws:[["Model access","Amazon Bedrock (private VPC endpoints, no training on customer data), SageMaker"],["Guardrails","Bedrock Guardrails (content filters, denied topics, PII redaction, prompt attack filter, contextual grounding)"],["Agents","Bedrock AgentCore (identity, gateway, sandboxed code interpreter, observability)"],["Data","Bedrock Knowledge Bases with metadata filtering; Lake Formation, OpenSearch security"],["Governance","IAM condition keys for model access, CloudTrail logging, model invocation logging"]],
cases:`<p><b>EchoLeak (2025):</b> a zero-click indirect prompt injection in Microsoft 365 Copilot where a crafted email could make the assistant exfiltrate data from the user's context via a link/image URL. <b>Lessons:</b> untrusted content in context + private data + an external channel = exfiltration; restrict outbound URLs and rendering.</p>
<p><b>Samsung (2023):</b> engineers pasted confidential source code into a public chatbot. Lesson: provide approved enterprise AI tools with data protections, plus DLP and policy.</p>
<p><b>Chevrolet dealer chatbot (2023):</b> users manipulated a sales chatbot into 'agreeing' to sell a car for $1. Lesson: never let model output create commitments without business logic validation.</p>`,
mistakes:["Believing a system prompt saying 'never reveal secrets' is a security control.","RAG indexes that ignore document permissions.","Agents with admin tokens.","Executing model output as code or SQL directly.","No cost limits (denial of wallet).","Banning AI entirely, which drives shadow AI."],
hook:"The model can always be tricked, so limit what a tricked model can reach, do, and send.",
qs:[
{l:"basic",q:"What is prompt injection and why is it hard to fix?",a:"Prompt injection is when input text causes the model to follow attacker instructions instead of the developer's. Direct injection comes from the user; indirect injection comes from content the model processes such as web pages, documents or emails. It is hard because LLMs process instructions and data in the same channel of natural language; there is no reliable 'parameterised query' equivalent. Filters and classifiers reduce it but cannot eliminate it, so the architectural answer is to limit impact: least-privilege tools, human approval for sensitive actions, isolating untrusted content, and blocking exfiltration channels.",t:"Understanding the core AI security problem."},
{l:"advanced",q:"How do you secure a RAG system so users only see documents they are allowed to?",a:"Enforce authorisation at retrieval time, not in the prompt. Store document ACL metadata (owner, groups, tenant, classification) with each chunk; at query time, filter the vector search by the authenticated user's entitlements (from the IdP / source system). Keep ACLs in sync with the source (event-driven updates, periodic reconciliation, fail closed if stale). Separate indexes per tenant for strong isolation. Do not index highly restricted data unless required. Log which documents were retrieved for each answer. Test with users of different permissions. Never rely on instructing the model to 'only answer from allowed documents'.",t:"A very common design question."},
{l:"advanced",q:"How would you secure an AI agent that can take actions (send emails, update tickets, run code)?",a:"(1) Identity: the agent acts on behalf of a user with delegated, scoped, short-lived OAuth tokens (token exchange), plus its own agent identity for audit. (2) Least agency: only the tools needed, allow-listed parameters, read-only by default. (3) Human-in-the-loop for irreversible, financial, or external-communication actions, showing exactly what will happen. (4) Break the lethal trifecta: if the agent reads untrusted content, restrict external send capabilities. (5) Sandboxed code execution with no network and no credentials. (6) Rate and budget limits per session. (7) Full audit trail of reasoning inputs, tool calls and results. (8) Vet MCP servers and tools as third-party code; pin versions. (9) Continuous red-teaming against the OWASP Agentic Top 10.",t:"Agentic security, the hottest 2026 topic."},
{l:"scenario",q:"Leadership wants to block ChatGPT and all AI tools. What do you advise?",a:"Blocking usually drives shadow AI on personal devices where we have no visibility. I would recommend: provide an approved enterprise AI platform (enterprise agreements with no training on our data, SSO, retention controls, audit logs); a clear AI acceptable-use policy with data classification guidance (e.g. no Restricted data in external tools); DLP and CASB controls on unapproved AI domains with coaching messages rather than silent blocks; an intake process to review new AI tools quickly; and training. Measure adoption of the approved tool and reduction in unsanctioned use.",t:"Enablement mindset."},
{l:"design",q:"Design a secure customer-support AI assistant for a bank.",a:"<b>Scope:</b> answers FAQs and account questions; cannot move money. <b>Identity:</b> customer authenticated in the app; assistant receives a scoped token for read-only account APIs for that customer only. <b>Data:</b> RAG over approved public knowledge base; account data fetched via APIs, not stored in the index. <b>Controls:</b> Bedrock Guardrails (prompt attack filter, PII redaction in logs, denied topics like investment advice), output validation (no promises about rates or refunds), grounding checks against sources. <b>Actions:</b> anything like blocking a card or disputing a transaction goes through a deterministic workflow with explicit customer confirmation and step-up auth. <b>Abuse:</b> rate limits, cost caps, monitoring for jailbreak patterns. <b>Governance:</b> model risk management review (RBI expectations), bias and accuracy evaluations, human handover, retention and consent aligned with DPDP. <b>Audit:</b> conversation logs with masked PII kept per retention rules.",t:"Applied, regulated AI design."}
],

TOPICS.push({
id:"resilience", n:17, title:"Resilience, BCP & DR", domain:"Resilience", week:6,
fw:"ISO 22301 · NIST SP 800-34 · AWS Well-Architected Reliability Pillar · EU DORA · RBI operational resilience guidance",
simple:"Resilience means the business keeps working, or recovers quickly, when things break: a cloud region outage, a ransomware attack, a bad deployment, or a vendor failure. Security architects care because availability is one third of CIA, and because ransomware turned disaster recovery into a security problem.",
analogy:"A hospital has backup generators, a second water supply, and practises what happens if the main building must be evacuated. It does not just hope the power never fails.",
why:"Interviews test RTO/RPO understanding, DR strategies and their cost, backup security, and increasingly operational resilience regulations (DORA in the EU, RBI guidance in India). The July 2024 CrowdStrike outage made 'resilience of security tools themselves' a hot topic.",
concepts:[
["BIA","Business Impact Analysis: identifies critical business services, impact over time, dependencies, and sets RTO/RPO."],
["RTO","Recovery Time Objective: maximum acceptable downtime."],
["RPO","Recovery Point Objective: maximum acceptable data loss measured in time."],
["MTD / MTPD","Maximum Tolerable (Period of) Disruption before damage is unrecoverable."],
["DR strategies (AWS)","Backup & restore (hours, cheapest) → Pilot light (tens of minutes) → Warm standby (minutes) → Multi-site active/active (near zero, most expensive)."],
["High availability vs DR","HA handles component failures within a region (multi-AZ); DR handles larger disasters (region loss, ransomware, corruption)."],
["Immutable backups","Write-once backups not deletable by admins (S3 Object Lock compliance mode, AWS Backup Vault Lock)."],
["Chaos engineering","Deliberately injecting failures (AWS Fault Injection Service) to prove resilience."],
["Impact tolerance","Operational resilience term: maximum tolerable disruption to an important business service."],
["DORA","EU Digital Operational Resilience Act for financial entities, applies from Jan 2025: ICT risk management, incident reporting, resilience testing (TLPT), third-party risk."],
["Concentration risk","Dependency on a single provider (cloud, IdP, CDN, EDR) that can fail everyone at once."]
],
how:`<p><b>DR strategy vs cost:</b></p>
<table><tr><th>Strategy</th><th>RTO</th><th>RPO</th><th>Cost</th></tr>
<tr><td>Backup & restore</td><td>Hours to a day</td><td>Hours</td><td>$</td></tr>
<tr><td>Pilot light</td><td>10s of minutes</td><td>Minutes</td><td>$$</td></tr>
<tr><td>Warm standby</td><td>Minutes</td><td>Seconds to minutes</td><td>$$$</td></tr>
<tr><td>Multi-site active/active</td><td>Near zero</td><td>Near zero</td><td>$$$$</td></tr></table>
<p><b>Security-specific resilience:</b> replication is not backup (ransomware and corruption replicate too); keep backups in a separate account with separate credentials and Vault Lock; test restores regularly into an isolated environment; protect the recovery path (identity provider, KMS keys, DNS, CI/CD) because you need them to rebuild; have break-glass access if the IdP is down; plan for your security tools failing (staged rollout of EDR/agent updates, bypass procedures).</p>`,
aws:[["Backup","AWS Backup (cross-account, cross-region, Vault Lock, logically air-gapped vaults)"],["DR","AWS Elastic Disaster Recovery, Aurora Global Database, DynamoDB global tables, S3 CRR"],["Testing","AWS Fault Injection Service, Resilience Hub"],["Routing","Route 53 health checks, Application Recovery Controller"]],
cases:`<p><b>CrowdStrike (July 2024):</b> a faulty content update to the Falcon sensor crashed about 8.5 million Windows machines, grounding flights and disrupting hospitals. <b>Lessons:</b> security tools are part of your availability risk; demand staged rollouts from vendors, have manual recovery runbooks (BitLocker keys accessible!), and consider concentration risk.</p>
<p><b>OVHcloud Strasbourg fire (2021):</b> customers whose backups were in the same data centre lost data permanently. Lesson: geographic separation of backups.</p>`,
mistakes:["Treating replication as backup.","Never testing restores.","Backups in the same account and credentials as production.","DR plan that depends on the failed component (IdP, KMS in the lost region).","RTO/RPO set by IT without business input."],
hook:"BIA sets RTO/RPO, money sets the strategy, immutability protects backups, only tested restores count.",
qs:[
{l:"basic",q:"Explain RTO and RPO with an example.",a:"RTO is how long we can be down; RPO is how much data (in time) we can lose. For a payments service, the business might say we can be down at most 15 minutes (RTO) and lose no more than 1 minute of transactions (RPO), which requires warm standby and near-synchronous replication. For an internal wiki, RTO 24 hours and RPO 24 hours is fine, so nightly backups suffice. The business sets these through a BIA; architecture and cost follow.",t:"Basics."},
{l:"advanced",q:"How does ransomware change your DR design?",a:"Traditional DR assumes infrastructure failure, so fast replication is good. With ransomware, replication copies the encrypted or corrupted data, and attackers target backups first. So: immutable backups (vault lock/object lock), a separate backup account with separate identities, point-in-time recovery going back weeks (attackers dwell), malware scanning of backups before restore, a clean-room recovery environment, recovery of identity and key management systems as priority, and regular restore tests measuring actual RTO. Also an RPO that accounts for the need to go back before the compromise.",t:"Security and resilience overlap."},
{l:"design",q:"Design a DR plan for a critical trading platform in AWS (RTO 5 min, RPO near zero).",a:"Active/active or hot warm standby across two regions: stateless services deployed in both via the same pipeline; data on Aurora Global Database (typically under 1 second replication, managed failover) or DynamoDB global tables with conflict strategy; Route 53 Application Recovery Controller for controlled failover with readiness checks; dependencies (KMS multi-region keys, Secrets Manager replication, IdP availability) also multi-region; regular game days with Fault Injection Service; plus separate immutable backups in another account for corruption and ransomware scenarios, because replication does not protect against those. Document runbooks, test quarterly, and measure actual failover time.",t:"High-availability design."}
],
quiz:[
{q:"RPO measures:",o:["Maximum downtime","Maximum acceptable data loss in time","Cost of recovery","Mean time between failures"],c:1,e:"RPO = how far back in time you can afford to lose data."},
{q:"Cheapest AWS DR strategy:",o:["Pilot light","Warm standby","Backup and restore","Multi-site"],c:2,e:"Lowest cost, longest RTO."},
{q:"Why is replication not a backup?",o:["It is too slow","Corruption and ransomware encryption replicate too","It costs more","It is not encrypted"],c:1,e:"You need point-in-time, immutable copies."}
]
});

TOPICS.push({
id:"sysdesign", n:18, title:"Security System Design Interviews", domain:"Architect Craft", week:7,
fw:"Your answer framework · See the System Design tab for 6 fully worked cases",
simple:"The design round is where Staff/Principal offers are won or lost. You get an open problem ('design secure auth for a fintech app') and 45-60 minutes. They are not looking for one right answer; they are watching how you <b>clarify</b>, <b>structure</b>, <b>prioritise</b>, and <b>explain trade-offs</b>, and whether you think about operations, not just boxes.",
analogy:"An architect designing a house asks who will live there, the budget, and the climate before drawing. A candidate who starts drawing firewalls in minute one is the builder who pours concrete before asking where the doors go.",
why:"This is the highest-weight round for the level you target. A structured, calm approach beats encyclopaedic knowledge.",
concepts:[
["Step 1: Clarify (5 min)","Users, scale, data sensitivity, regulations, existing stack, what is in/out of scope, success criteria."],
["Step 2: Assets & threats (5-8 min)","Crown jewels, threat actors, top 5 threats (quick STRIDE on the main flows)."],
["Step 3: High-level architecture (10 min)","Draw the main components and trust boundaries. Name them simply."],
["Step 4: Controls by layer (10-15 min)","Identity, network, application, data, secrets, supply chain. Tie each to a threat."],
["Step 5: Detection & response (5 min)","Logs, key detections, automation, incident playbook."],
["Step 6: Trade-offs & evolution (5 min)","Cost, latency, usability, build vs buy, phase 1 vs later, what you would measure."],
["Think out loud","Say why you choose something, not just what."],
["Ask for feedback","'Would you like me to go deeper on key management or on tenant isolation?' lets the interviewer steer."],
["Numbers","Use rough numbers: 10M users, 5k RPS, token TTL 10 min, RPO 1 min. It shows realism."]
],
how:`<p><b>The framework on one line:</b> <b>C-A-T-C-D-T</b> → Clarify, Assets/threats, Topology, Controls, Detect/respond, Trade-offs.</p>
<p><b>Good clarifying questions to have ready:</b></p>
<ul><li>Who are the users (consumers, employees, partners) and how many?</li>
<li>What data is involved and how sensitive? Any regulation (PCI, DPDP, HIPAA)?</li>
<li>Cloud/on-prem? Existing IdP? Build vs buy constraints?</li>
<li>Availability requirements (RTO/RPO)? Latency budget?</li>
<li>What is the biggest business worry: fraud, breach, downtime, compliance?</li>
<li>Timeline and team size: what is phase 1?</li></ul>
<p><b>Layers checklist so you never forget a layer:</b> Identity (users, services, admins) · Edge (WAF, DDoS, bots) · Network (segmentation, egress) · Compute (hardening, patching) · Application (authZ, input) · Data (classification, encryption, keys) · Secrets · Supply chain · Logging & detection · Resilience · Governance.</p>
<p><b>Signals interviewers look for at Principal level:</b> prioritisation (what first), operational realism (who runs this, cost), paved roads for many teams, measurable outcomes, and willingness to say 'it depends, here is how I would decide'.</p>`,
aws:[["Handy building blocks","CloudFront+WAF, API Gateway, Cognito/Identity Center, Verified Permissions, KMS, Secrets Manager, PrivateLink, GuardDuty, Security Lake"]],
cases:`<p>See the <b>System Design</b> tab for six worked answers: secure fintech authentication, multi-tenant SaaS isolation, zero trust for 50,000 employees, a secure payments platform, secure data lake/analytics, and an enterprise GenAI platform.</p>`,
mistakes:["Jumping to tools before clarifying.","Listing every control you know without linking to threats.","Ignoring operations, cost and people.","Not drawing trust boundaries.","Running out of time before detection and trade-offs.","Monologue with no check-ins."],
hook:"C-A-T-C-D-T: Clarify, Assets/threats, Topology, Controls, Detect, Trade-offs.",
qs:[
{l:"design",q:"Design authentication and session management for a mobile banking app.",a:"<b>Clarify:</b> 10M retail users, iOS/Android, RBI rules, fraud is top worry. <b>Threats:</b> credential stuffing, SIM swap/OTP interception, device malware, session hijacking, account takeover through support. <b>Design:</b> OIDC auth code + PKCE via our IdP (in-app browser tab), device binding at enrolment (key pair in Secure Enclave/StrongBox; server stores the public key; each login signs a challenge), biometrics unlock the device key locally, passkeys as primary login, OTP only as fallback with SIM-swap checks. Tokens: 5-10 min access tokens, rotating refresh tokens bound to the device key (DPoP-style), BFF where applicable. Step-up auth for payee addition and large transfers (re-authentication, cooling-off period for new payees). Risk engine using device, geo, velocity signals. App hardening: root/jailbreak detection, certificate pinning with backup pins, RASP. <b>Detect:</b> ATO analytics, alerts on new device + payee + transfer pattern. <b>Trade-offs:</b> friction vs fraud, handle lost devices with a secure re-enrolment flow involving video KYC.",t:"End-to-end auth design."},
{l:"design",q:"How do you handle it when you don't know the answer to something in a design interview?",a:"Say so plainly and reason from principles: 'I haven't used that specific service, but the requirement is X; I would evaluate it against these criteria: isolation boundary, key management, logging, operational burden.' Interviewers value honest reasoning over bluffing. You can also ask whether they want you to go deeper there or move on.",t:"Composure and honesty."}
],

{q:"What should you do in the first 5 minutes of a design interview?",o:["Draw the WAF","Clarify requirements, users, data and constraints","List all AWS services","Talk about your CV"],c:1,e:"Clarifying frames every later decision."},
{q:"A principal-level signal in design rounds is:",o:["Naming the most tools","Prioritisation and trade-offs with operational realism","Speaking without pause","Refusing to estimate"],c:1,e:"Judgement matters more than breadth of tool names."}
]
