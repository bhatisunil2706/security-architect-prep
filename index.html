DEEP.push({tid:"secops", title:"Logging strategy: what to collect, why, and for how long", body:`
<h3>Start from questions, not sources</h3>
<p>Every log you pay for should answer an investigation or detection question: "Who accessed this data?", "How did the attacker get in?", "What did this role do in the last 30 days?"</p>
<table>
<tr><th>Priority</th><th>Source</th><th>Answers</th><th>Typical retention</th></tr>
<tr><td>1</td><td>Identity provider (Okta/Entra) sign-in and admin logs</td><td>Account takeover, MFA changes, session anomalies</td><td>1 year+</td></tr>
<tr><td>1</td><td>AWS CloudTrail (management, org-wide)</td><td>Every API call: IAM changes, logging tampering, resource creation</td><td>1 year hot/warm, 7 years cold if regulated</td></tr>
<tr><td>1</td><td>EDR telemetry</td><td>Malware, lateral movement, persistence on hosts</td><td>30-90 days in EDR, alerts longer</td></tr>
<tr><td>2</td><td>CloudTrail data events (sensitive S3, Lambda, DynamoDB)</td><td>Who read which object; data exfiltration</td><td>1 year for sensitive data</td></tr>
<tr><td>2</td><td>DNS query logs (Route 53 Resolver)</td><td>C2, DGA domains, tunnelling</td><td>90 days-1 year</td></tr>
<tr><td>2</td><td>VPC Flow Logs</td><td>Network connections, exfiltration volume, scanning</td><td>90 days hot, longer cold</td></tr>
<tr><td>2</td><td>Email security, web proxy/SWG</td><td>Phishing, malicious downloads</td><td>90 days-1 year</td></tr>
<tr><td>2</td><td>Application security events</td><td>Login failures, authZ denials, admin actions, payment changes</td><td>1 year</td></tr>
<tr><td>3</td><td>WAF/ALB/CloudFront logs</td><td>Web attacks, bots</td><td>90 days</td></tr>
<tr><td>3</td><td>EKS audit logs, database audit logs</td><td>Cluster abuse, privileged DB queries</td><td>1 year</td></tr>
<tr><td>3</td><td>SaaS audit logs (GitHub, Slack, Google Workspace, M365)</td><td>Source code theft, data sharing</td><td>1 year</td></tr></table>
<p>Regulatory anchors: CERT-In requires logs for 180 days maintained in India; PCI DSS requires 12 months with 3 months immediately available; DPDP Rules require logs for at least one year for security safeguards.</p>
<h3>Integrity and access</h3>
<ul><li>Logs go to a separate security account with Object Lock; CloudTrail log file validation (digest files) proves tampering did not happen.</li>
<li>Only the security team can read raw logs; developers get filtered views without secrets/PII.</li>
<li>Applications must not log secrets, tokens, full card numbers or passwords (log scrubbing + tests).</li></ul>
<h3>What a good security application log event contains</h3>
<pre>{ "ts":"2026-09-30T10:15:22Z", "event":"authz.denied", "actor":"user:9f2c",
  "tenant":"acme", "action":"order.read", "resource":"order:88213",
  "reason":"not_owner", "src_ip":"203.0.113.9", "ua":"…", "request_id":"b1e…",
  "session_id_hash":"…" }</pre>`,
answer:"I start from the questions logs must answer and prioritise identity provider logs, org-wide CloudTrail and EDR, then CloudTrail data events for sensitive data, DNS, flow logs, email/proxy and application security events, then WAF, Kubernetes and SaaS audit logs. Retention follows detection value and regulation (CERT-In 180 days in India, PCI 12 months, DPDP one year). Logs land in a separate locked account with integrity validation, access limited to security, and apps never log secrets."});

DEEP.push({tid:"secops", title:"Detection engineering with concrete examples", body:`
<h3>A detection as code (Sigma-style)</h3>
<pre>title: AWS IAM user access key created outside platform pipeline
id: 4f2a...
status: stable
logsource: { product: aws, service: cloudtrail }
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  filter_platform:
    userIdentity.arn|contains: 'role/PlatformIamAutomation'
  condition: selection and not filter_platform
level: high
tags: [attack.persistence, attack.t1098.001]
falsepositives: [ emergency break-glass with ticket ]
runbook: https://wiki/secops/runbooks/aws-access-key-created</pre>
<h3>More examples to talk through</h3>
<table><tr><th>Detection</th><th>Logic</th><th>ATT&CK</th></tr>
<tr><td>Impossible travel / new ASN for admin</td><td>Two successful IdP logins from locations too far apart for the time gap, or admin login from never-seen ASN</td><td>T1078</td></tr>
<tr><td>MFA fatigue</td><td>More than N MFA push denials for one user within 10 min, followed by an approval</td><td>T1621</td></tr>
<tr><td>Mass S3 download</td><td>GetObject count or bytes per principal &gt; baseline × 10 within 1h on restricted buckets</td><td>T1530</td></tr>
<tr><td>Logging tampering</td><td>StopLogging, DeleteTrail, PutEventSelectors reducing coverage</td><td>T1562.008</td></tr>
<tr><td>New external trust</td><td>UpdateAssumeRolePolicy or CreateRole with principal account not in org</td><td>T1098</td></tr>
<tr><td>Honeytoken use</td><td>Any API call with canary access key ID</td><td>(deception)</td></tr>
<tr><td>Container shell</td><td>Runtime: shell process spawned in production container</td><td>T1059</td></tr></table>
<h3>Quality metrics per detection</h3>
<p>Alert volume per week, true-positive rate, mean time to triage, last tested date (automated attack simulation), owner. Retire rules that never fire true or cannot be tuned.</p>`,
answer:"Detections are code: rule logic, ATT&CK tags, false positives, severity, owner, runbook and a test, stored in Git and deployed via CI. Examples I would build: IAM access key created outside automation, MFA fatigue, impossible travel for admins, mass S3 reads versus baseline, CloudTrail tampering, new external role trust, honeytoken use, shells in production containers. Each rule is measured on volume, true-positive rate and last successful test."});

DEEP.push({tid:"ir", title:"AWS incident response runbooks for the five most common scenarios", body:`
<h3>Scenario A: Access key leaked on GitHub</h3>
<ol><li>Identify the key owner (IAM user) and scope: <code>aws iam get-access-key-last-used</code>, CloudTrail by accessKeyId for the leak window.</li>
<li>Deactivate (not delete yet) the key; attach deny-all policy to the user; revoke console sessions.</li>
<li>Check what the attacker did: new users/keys/roles, EC2 in all regions (crypto miners), Lambda, S3 access, SES sending, changes to trust policies.</li>
<li>Remove persistence; terminate rogue resources after snapshotting evidence.</li>
<li>Rotate anything the key could read (secrets). Purge the key from Git history, though assume it is compromised forever.</li>
<li>Root cause: why was there an IAM user key at all? Move to OIDC/roles; enforce secret scanning push protection.</li></ol>
<h3>Scenario B: EC2 instance compromised (crypto mining or GuardDuty C2 finding)</h3>
<ol><li>Snapshot EBS volumes, capture memory if tooling exists, record metadata (tags, role, SGs).</li>
<li>Isolate: replace SGs with a forensic SG (no inbound/outbound except forensics), remove from ASG/target group, disable termination.</li>
<li>Revoke the instance role's active sessions (the instance profile credentials may have been stolen).</li>
<li>Investigate in the forensic account (mount snapshot copies), find initial access (unpatched service, exposed SSH, SSRF).</li>
<li>Rebuild from a clean AMI; fix the entry point; hunt for the same pattern in other instances.</li></ol>
<h3>Scenario C: S3 bucket found public with customer data</h3>
<ol><li>Block public access immediately.</li>
<li>Determine exposure window (CloudTrail PutBucketPolicy/PutBucketAcl history, Config timeline).</li>
<li>Determine whether data was accessed: S3 server access logs or CloudTrail data events (if not enabled, you may not know: a lesson in itself). Check public mentions and search engines.</li>
<li>Legal/privacy assessment: DPDP/GDPR notification decisions, CERT-In reporting.</li>
<li>Prevent recurrence: account-level Block Public Access, SCP, RCP, Macie.</li></ol>
<h3>Scenario D: Root user login or suspicious IAM admin activity</h3>
<ol><li>Verify with the known owners immediately (out-of-band).</li>
<li>If unexpected: reset root password and MFA via the org's centralised root management, review all IAM changes in the last 24-72h, revoke sessions of any new or modified admin principals.</li>
<li>Look for persistence: new identity providers, new roles trusting external accounts, Lambda backdoors, EventBridge rules, changes to SCPs.</li></ol>
<h3>Scenario E: Data being encrypted or deleted in the cloud (cloud ransomware)</h3>
<ol><li>Identify principal and stop it: revoke sessions, apply deny-all, if needed apply a quarantine SCP to the affected account.</li>
<li>Check KMS: keys scheduled for deletion (cancel), objects re-encrypted with foreign keys.</li>
<li>Recover from versioning/Object Lock/AWS Backup copies in the separate account.</li>
<li>Determine exfiltration (data events, flow logs) since extortion usually includes theft.</li></ol>
<h3>General AWS IR preparation</h3>
<ul><li>Pre-built IR role in every account (assumable only from security account, MFA).</li><li>Forensics account and automation to snapshot/copy evidence.</li><li>Quarantine SCP ready (deny all except security roles).</li><li>Contact info: AWS Support (Enterprise/Security Incident Response), legal, PR, CERT-In.</li></ul>`,
answer:"For a leaked key: deactivate, deny-all, scope via CloudTrail by key ID across all regions, remove persistence and rogue resources, rotate reachable secrets, then remove IAM user keys entirely. For a compromised instance: snapshot and capture, isolate with a forensic SG, revoke role sessions, investigate in a forensic account, rebuild clean. For a public bucket: block, find exposure window and access evidence, involve legal for notification, add org guardrails. Preparation: IR roles in every account, a forensics account, a quarantine SCP and practised runbooks."});

DEEP.push({tid:"vuln", title:"Prioritising 10,000 vulnerabilities: a worked method", body:`
<h3>Step 1: Get the data into one place and deduplicate</h3>
<p>Scanner outputs (Inspector, container scanners, SCA, pen tests) → one platform. 10,000 findings are often 800 unique CVEs across 300 base images. Fix the base image once, and hundreds of findings vanish.</p>
<h3>Step 2: Enrich every finding</h3>
<table><tr><th>Signal</th><th>Source</th></tr>
<tr><td>Known exploited?</td><td>CISA KEV</td></tr>
<tr><td>Likely to be exploited?</td><td>EPSS probability</td></tr>
<tr><td>Internet exposed?</td><td>Inspector network reachability, security groups, load balancer mapping</td></tr>
<tr><td>Actually loaded / reachable code?</td><td>Runtime package usage, SCA reachability analysis</td></tr>
<tr><td>Asset criticality / data</td><td>Tags (tier-1, data-class=restricted)</td></tr>
<tr><td>Compensating controls</td><td>WAF rule, no egress, isolated subnet</td></tr></table>
<h3>Step 3: Buckets (SSVC-like decision)</h3>
<pre>ACT NOW (hours-days):  KEV or public exploit AND reachable/internet-facing
                       → maybe 20-50 findings
ATTEND (≤14-30 days):  high EPSS or critical AND on tier-1 or sensitive data
TRACK (normal cycle):  everything else, fixed by routine base image refresh
ACCEPT/FALSE POSITIVE: not reachable, component not loaded, VEX says not affected</pre>
<h3>Step 4: Fix at the source</h3>
<ul><li>Rebuild golden AMIs/base images weekly; redeploy automatically.</li>
<li>Auto-PRs for dependency bumps (Dependabot/Renovate) with good tests so merging is safe.</li>
<li>Remove unused packages (distroless) so there is less to patch.</li></ul>
<h3>Step 5: Ownership and reporting</h3>
<p>Route findings to owning teams by tag; SLA by bucket; weekly dashboard of ACT NOW items; exceptions with expiry and compensating control.</p>`,
answer:"Centralise and deduplicate (thousands of findings usually collapse to a few hundred CVEs in shared base images), enrich each with KEV, EPSS, internet exposure, code reachability, asset criticality and compensating controls, then bucket: act now for exploited and reachable, attend for high-likelihood on critical assets, track the rest through routine image refreshes, and close unreachable ones with VEX. Fix at the source with rebuilt base images and automated dependency PRs, route to owners with SLAs, and report on the act-now list."});

DEEP.push({tid:"grc", title:"Security metrics and the executive dashboard", body:`
<h3>Vanity vs meaningful metrics</h3>
<table><tr><th>Vanity</th><th>Meaningful</th></tr>
<tr><td>Number of attacks blocked by firewall</td><td>Mean time to remediate KEV vulnerabilities on internet-facing assets</td></tr>
<tr><td>Number of vulnerabilities found</td><td>% critical assets within patch SLA; exposure window trend</td></tr>
<tr><td>Phishing emails blocked</td><td>% workforce on phishing-resistant MFA; phishing report rate vs click rate</td></tr>
<tr><td>Number of policies written</td><td>% production accounts compliant with baseline guardrails</td></tr>
<tr><td>Alerts processed</td><td>MTTD / MTTR for confirmed incidents; % high-fidelity alerts</td></tr></table>
<h3>A one-page monthly dashboard</h3>
<ol>
<li><b>Top risks</b> (5 scenarios) with trend arrows and status of treatments.</li>
<li><b>Identity:</b> phishing-resistant MFA coverage, standing admin accounts, IAM user keys.</li>
<li><b>Exposure:</b> KEV/internet-facing criticals open beyond SLA, attack surface changes.</li>
<li><b>Detection & response:</b> incidents by severity, MTTD/MTTR, detection coverage of prioritised techniques.</li>
<li><b>Resilience:</b> last successful restore test for tier-1 systems, backup immutability coverage.</li>
<li><b>Third parties:</b> critical vendors assessed, open high findings.</li>
<li><b>Programme:</b> roadmap milestones, budget, asks/decisions needed.</li></ol>
<p>Each metric has a target, a trend, an owner, and a sentence of "so what".</p>`,
answer:"I avoid activity counts and report outcome metrics tied to top risks: phishing-resistant MFA coverage, standing admin accounts, KEV and internet-facing criticals beyond SLA, MTTD/MTTR for real incidents, detection coverage of prioritised techniques, restore-test success and backup immutability, critical vendor status, plus roadmap progress and decisions needed. Each has a target, trend, owner and a one-line 'so what'."});

DEEP.push({tid:"ai", title:"Securing RAG and AI agents in depth", body:`
<h3>1. Why AI security is different</h3>
<p>In classic apps, code and data are separate (parameterised queries). In LLM apps, <b>instructions and data share the same channel: text</b>. Any document, web page, email, tool output or even image the model reads can carry instructions. So you cannot rely on the model to protect itself; you design the system so a manipulated model cannot cause serious harm.</p>

<h3>2. RAG pipeline threats and controls</h3>
<pre>Sources (Confluence, SharePoint, tickets)
   │ ingestion: chunk, embed, store with ACL metadata  ◀─ poisoning, ACL loss
   ▼
Vector store  ◀─ unauthorised access, embedding inversion, cross-tenant leakage
   │ retrieval filtered by user's entitlements
   ▼
Prompt assembly: system prompt + user question + retrieved chunks ◀─ indirect injection
   ▼
LLM ──▶ Output handling ◀─ XSS/markdown image exfil, hallucinated facts, leaked data
   ▼
User</pre>
<table><tr><th>Threat</th><th>Control</th></tr>
<tr><td>User sees documents they cannot access in the source</td><td>Store ACLs with chunks; filter at query time with the user's identity; sync permissions on change; separate indexes per tenant</td></tr>
<tr><td>Poisoned documents inject instructions</td><td>Only index trusted sources; mark retrieved text as data; injection classifiers; restrict what the app can do with output</td></tr>
<tr><td>Markdown/image exfiltration (model outputs an image URL containing secrets)</td><td>Disable remote image rendering or allow-list domains; strip links; CSP on the chat UI</td></tr>
<tr><td>Sensitive data sent to model provider</td><td>Enterprise terms (no training, retention limits), regional endpoints, PII redaction where possible, classification-based rules</td></tr>
<tr><td>Hallucinations presented as facts</td><td>Grounding with citations, contextual grounding checks, "I don't know" behaviour, human review for high-stakes outputs</td></tr></table>

<h3>3. Agents: the risk multiplies with tools</h3>
<p>A chatbot can only say wrong things; an agent can <b>do</b> wrong things: send emails, change records, run code, spend money.</p>
<table><tr><th>Principle</th><th>Implementation</th></tr>
<tr><td>Least agency</td><td>Only the tools needed; read-only by default; narrow parameters (e.g. can create tickets only in project X)</td></tr>
<tr><td>Act as the user, not as a super-user</td><td>OAuth token exchange to get a downscoped token for the user; the agent cannot exceed the user's rights</td></tr>
<tr><td>Human in the loop</td><td>Explicit confirmation showing exact action for writes, external sends, payments, deletions</td></tr>
<tr><td>Break the lethal trifecta</td><td>If the agent reads untrusted content and has private data, remove or gate its ability to communicate externally</td></tr>
<tr><td>Sandbox execution</td><td>Code runs in isolated microVM/container with no credentials, no network (or allow-list), time and resource limits</td></tr>
<tr><td>Tool supply chain</td><td>Approved MCP server registry, pinned versions, review tool descriptions (tool poisoning), least OAuth scopes per server</td></tr>
<tr><td>Memory hygiene</td><td>Validate and scope what is stored in long-term memory; per-user memory; expiry</td></tr>
<tr><td>Observability</td><td>Trace every step: prompt, retrieved sources, tool calls with parameters, approvals, outputs</td></tr>
<tr><td>Limits</td><td>Max steps, max spend, rate limits, kill switch</td></tr></table>

<h3>4. Testing</h3>
<p>Red-team prompts (direct and indirect injection, jailbreaks), evals in CI for regressions, test cases mapped to OWASP LLM and Agentic Top 10, and periodic external AI red teaming for high-risk systems.</p>`,
answer:"LLMs mix instructions and data, so I assume the model can be manipulated and limit impact. For RAG: permission-filtered retrieval using the user's identity with ACLs stored per chunk, trusted sources only, retrieved text treated as data, output sanitised to block markdown or link exfiltration, enterprise model terms and grounding with citations. For agents: least agency, the agent acts with the user's downscoped token, human approval for consequential actions, break the lethal trifecta, sandboxed code execution, vetted pinned MCP tools, scoped memory, full tracing and hard limits, plus continuous red-team evals."});

DEEP.push({tid:"resilience", title:"Protecting backups and recovery from attackers", body:`
<h3>Why attackers go for backups</h3>
<p>Ransomware crews spend days finding and deleting backups before encrypting, because without backups victims pay. Cloud attackers delete snapshots, disable versioning and schedule KMS key deletion.</p>
<h3>Design on AWS</h3>
<ul>
<li><b>Separate backup account</b> (and ideally separate org-level credentials path); production admins have no rights there.</li>
<li><b>AWS Backup Vault Lock in compliance mode</b>: nobody, including root, can delete recovery points before retention ends.</li>
<li><b>Logically air-gapped vaults</b> for isolated copies that can be shared into a clean recovery account.</li>
<li><b>Cross-region copies</b> for regional disasters.</li>
<li><b>Keys:</b> backups encrypted with keys in the backup account; SCP blocking key deletion; watch for key policy changes.</li>
<li><b>Backup policies at org level</b> so every tagged resource is covered automatically.</li>
<li><b>Restore testing</b>: AWS Backup restore testing on a schedule, measuring actual restore time against RTO.</li>
<li><b>Clean room</b>: a pre-built isolated account to restore into and scan before reconnecting to production.</li>
</ul>
<h3>Identity and dependencies</h3>
<p>Can you restore if the IdP is down or compromised? Keep break-glass access, offline documentation, and know the order: identity → keys → network → data → apps.</p>`,
answer:"Attackers target backups first, so backups live in a separate account production admins cannot touch, protected by Vault Lock in compliance mode, with logically air-gapped and cross-region copies, keys that cannot be deleted outside break-glass, org-wide backup policies, scheduled restore tests against RTO, and a clean-room account for restoring and scanning. The recovery plan also covers identity, keys and network in the right order."});

DEEP.push({tid:"leadership", title:"Running a security architecture review process that doesn't block teams", body:`
<h3>Goals</h3>
<p>Find high-impact design flaws early, spread good patterns, and keep teams shipping. A review board that meets fortnightly and blocks releases fails the last goal.</p>
<h3>Design</h3>
<ol>
<li><b>Risk-tiered intake:</b> a short form in the design doc template. Triggers for a full review: new external exposure, new sensitive data type, auth/crypto changes, new third party with data access, multi-tenant boundary changes, AI features with tools. Everything else self-certifies against a checklist.</li>
<li><b>Paved roads first:</b> if a team uses approved patterns (standard auth, standard landing zone module, standard pipeline), most review questions are already answered.</li>
<li><b>SLA:</b> first response in 2 business days, review complete within a week; async by default, meetings only when needed.</li>
<li><b>Outputs:</b> threat model summary, required actions (before launch) vs recommended (backlog), accepted risks with owner. Tracked as tickets.</li>
<li><b>ADR library:</b> decisions are searchable so the same question is not asked twice.</li>
<li><b>Escalation path:</b> disagreements go to a small forum (principal security architect + engineering director) within days, not weeks.</li>
<li><b>Feedback loop:</b> recurring issues become new paved roads or guardrails; measure time-to-review, findings per review, % using paved roads, and developer satisfaction.</li>
</ol>`,
answer:"I make it risk-tiered: a short intake in every design doc, full reviews only for triggers like new external exposure, sensitive data, auth or crypto changes, third parties or tenant boundaries. Paved roads answer most questions up front. Reviews are async with a published SLA, output required versus recommended actions and accepted risks as tickets, decisions go into a searchable ADR library, disagreements have a fast escalation path, and recurring findings become new paved roads. I measure review lead time and developer satisfaction."});

DEEP.push({tid:"leadership", title:"Security champions, M&A due diligence and insider threat: three programmes", body:`
<h3>Security champions (limited headcount)</h3>
<ul><li>One champion per team, volunteered, with manager agreement for ~10% time.</li>
<li>Onboarding: threat modelling basics, OWASP, how to use security tools, when to escalate.</li>
<li>Monthly community call, dedicated channel, recognition (performance review input, badges, conference tickets).</li>
<li>Responsibilities: first-line design questions, triage scanner findings, run lightweight threat models, champion paved roads.</li>
<li>Measure: active champions, % teams covered, findings fixed by teams without security involvement.</li></ul>
<h3>M&A security due diligence in three weeks</h3>
<ul><li><b>Week 1:</b> questionnaire and document review (policies, pen tests, SOC 2, incident history, breach disclosures), architecture overview, data inventory.</li>
<li><b>Week 2:</b> interviews with their security/engineering leads; external attack surface scan; dark web/credential leak check; code repo sampling with permission.</li>
<li><b>Week 3:</b> risk summary: deal-breakers (undisclosed breach, regulatory violations), price-affecting issues (major remediation cost), and integration plan items (no network connection until identity and EDR baseline met).</li>
<li>Output is business language: risk, estimated remediation cost, conditions for closing.</li></ul>
<h3>Insider threat without destroying trust</h3>
<ul><li>Transparent policy agreed with HR and legal; focus on protecting data, not watching people.</li>
<li>Controls first: least privilege, JIT access, DLP on crown jewels, separation of duties, offboarding speed.</li>
<li>Detection on high-risk signals (bulk downloads before resignation, access outside role), privacy-preserving with pseudonymised analytics and a small, audited investigation team.</li>
<li>Clear case-handling process with HR/legal; no ad-hoc snooping.</li></ul>`,
answer:"Champions: one per team with ~10% time, training, community and recognition, measured by coverage and team-fixed findings. M&A diligence: document review, interviews, external scanning and leak checks, then a business-language report of deal-breakers, cost-affecting issues and integration conditions. Insider threat: transparent policy with HR and legal, preventive least privilege and DLP first, detection on high-risk signals with privacy protections and a tightly governed investigation process."});

DEEP.push({tid:"sysdesign", title:"Hybrid cloud migration: keeping data secure and compliant", body:`
<h3>Before migration</h3>
<ul><li>Classify data and applications; decide what can move (residency, RBI/SEBI rules, contractual limits).</li>
<li>Landing zone ready first (identity, logging, guardrails, network): never migrate into an ungoverned account.</li>
<li>Threat model the hybrid connectivity: on-prem is now connected to cloud and vice versa.</li></ul>
<h3>During migration</h3>
<ul><li>Transfer over encrypted channels (Direct Connect with MACsec/IPsec, DataSync/DMS over TLS); integrity verification with checksums.</li>
<li>Service accounts for migration tools are temporary and least-privileged; removed after.</li>
<li>Do not copy production data to test environments unmasked.</li>
<li>Maintain logging and monitoring on both sides throughout; parallel run.</li></ul>
<h3>After migration</h3>
<ul><li>Decommission on-prem copies securely; update data inventory and records of processing.</li>
<li>Re-evaluate controls: cloud-native replacements (KMS, WAF, GuardDuty) instead of lift-and-shift appliances where possible.</li>
<li>Compliance evidence updated (auditors need new control descriptions).</li></ul>`,
answer:"Before: classify data and apps against residency and sector rules, build the landing zone first, threat model the hybrid link. During: encrypted transfer with integrity checks, temporary least-privilege migration identities, no unmasked prod data in test, continuous monitoring on both sides. After: securely decommission old copies, move to cloud-native controls, and update inventory and compliance evidence."});

REAL.push({cat:"AWS & Cloud", tid:"iam", q:"RBAC vs ABAC: which would you use in AWS and why? Give an example.",
why:"Tests whether you know how access control actually works in AWS (tags, session tags, permission sets), not just definitions, and whether you can pick a model per layer.",
short:"RBAC for workforce access via Identity Center permission sets per job function, with accounts as the main isolation; ABAC with IdP-sourced session tags for shared resources and context (MFA, VPC). Protect tags with SCPs and tag policies. Combine both.",
a:`<p><b>Define both crisply.</b> RBAC grants permissions through roles tied to job functions. ABAC grants through rules that compare attributes of the user, the resource and the request context.</p>
<p><b>How each looks in AWS.</b></p>
<ul><li>RBAC: IAM roles and Identity Center permission sets (Developer, ReadOnly, SecurityAudit) assigned to IdP groups per account.</li>
<li>ABAC: IAM policies using <code>aws:PrincipalTag</code> vs <code>aws:ResourceTag</code>. Example: developers can start/stop only EC2 instances where <code>ResourceTag/team == PrincipalTag/team</code>. The <code>team</code> attribute flows from Okta/Entra through Identity Center "attributes for access control" as a session tag.</li></ul>
<p><b>Trade-offs.</b> RBAC is simple and easy to audit but causes role explosion (teams × environments × access levels). ABAC scales (a new team needs tags, not new policies) and supports context, but security depends on tag integrity and "who can access X?" becomes harder to answer.</p>
<p><b>My recommendation.</b></p>
<ul><li>Use <b>accounts</b> as the primary boundary (one account per workload per environment), so RBAC permission sets stay few.</li>
<li>Use <b>ABAC</b> where many teams share an account or resource: shared data lake (Lake Formation tag-based access), shared S3 buckets by prefix, shared EKS clusters.</li>
<li>Add context conditions (MFA, source VPC) to sensitive actions.</li>
<li>Protect attributes: SCP denying modification of governance tags except by the platform role, tag policies for allowed values, deny <code>sts:TagSession</code> except from the IdP path.</li></ul>
<p><b>Example to close:</b> "At my last company we had 60 teams in shared analytics accounts. Instead of 180 roles, one ABAC policy keyed on the team tag from Okta reduced policy count by ~90% and onboarding a new team became a directory change."</p>`,
fu:[["How do you audit who can access what with ABAC?","Combine IAM Access Analyzer, the tag inventory (Resource Groups Tagging API, Config) and the IdP group/attribute data; for data lakes Lake Formation shows tag-based grants. Periodically generate an access matrix report and review exceptions."],
["What if someone tags a resource with another team's tag?","That is the core ABAC risk. Deny CreateTags/DeleteTags on governance keys except for the platform role, require the tag on creation to equal the principal's tag (aws:RequestTag = aws:PrincipalTag), and alert on tag changes."],
["Where does ReBAC fit?","Application-level sharing (documents, projects, org hierarchies) inside our product, using OpenFGA/SpiceDB or Cedar with Verified Permissions, not AWS IAM."]],
flags:["Only reciting definitions","Saying ABAC is always better","Forgetting tag integrity","Not mentioning accounts as a boundary"]});

REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"How would you build the security infrastructure for a company moving to AWS?",
why:"The most common open-ended architect question. Tests prioritisation, breadth, AWS depth and operating model thinking.",
short:"Start with business risk, then a multi-account landing zone; Identity Center + IdP with MFA and no IAM users; SCP/RCP guardrails; org-wide CloudTrail to a locked log account plus GuardDuty/Security Hub/Inspector/Macie; hub-and-spoke network with controlled egress; KMS, backups and secrets; secure pipelines; IR runbooks; run it as a platform product with metrics.",
a:`<p><b>1. Clarify first (say this out loud):</b> size, regulations, data types, current state, timeline, team.</p>
<p><b>2. Foundation:</b> AWS Organizations with OUs for Security (log-archive, security-tooling), Infrastructure (network, shared services), Workloads (prod / non-prod, one account per app per environment), Sandbox, Suspended. Account vending automated (Control Tower / AFT / Landing Zone Accelerator) with a baseline.</p>
<p><b>3. Identity:</b> IAM Identity Center + corporate IdP (SAML + SCIM), phishing-resistant MFA, permission sets per job function, JIT for admin, no IAM users (SCP), OIDC for CI/CD, workload roles everywhere, break-glass tested.</p>
<p><b>4. Guardrails:</b> SCPs (region lock, protect CloudTrail/GuardDuty/Config, deny root, require IMDSv2, deny leaving org), RCPs (org-only access to S3/KMS/Secrets/STS), Block Public Access, EBS default encryption, IaC scanning in pipelines, Config rules for drift.</p>
<p><b>5. Visibility:</b> org CloudTrail → log-archive with Object Lock; GuardDuty (all protection plans), Security Hub CSPM, Inspector, Macie, Access Analyzer with delegated admin; Security Lake → SIEM; findings routed to owners with SLAs.</p>
<p><b>6. Network:</b> IPAM, TGW hub-and-spoke with segmented route tables, centralised egress through Network Firewall and DNS Firewall, VPC endpoints, ingress only via CloudFront/ALB + WAF + Shield, SSM instead of SSH.</p>
<p><b>7. Data:</b> classification tags, KMS CMKs per domain, Secrets Manager with rotation, AWS Backup to a separate account with Vault Lock.</p>
<p><b>8. Delivery:</b> golden pipeline templates with scanning, SBOM and signing; golden AMIs/images; Terraform modules as paved roads.</p>
<p><b>9. Response:</b> runbooks, forensic account, quarantine SCP, tabletop exercises.</p>
<p><b>10. Operating model:</b> platform team, champions, design reviews for high-risk changes, metrics (baseline compliance, IAM keys, MTTR of high findings).</p>
<p><b>Prioritise explicitly:</b> "If I had one month: SSO+MFA and kill keys, org CloudTrail to a locked account, GuardDuty everywhere, Block Public Access and core SCPs, separate prod accounts."</p>`,
fu:[["Control Tower or custom?","Control Tower (with AFT) for speed and AWS-maintained controls when the org fits its model; Landing Zone Accelerator or custom Terraform when you need heavy customisation or regulated baselines. Either way, everything as code."],
["How would you handle existing single-account workloads?","Don't big-bang. Build the new landing zone, invite the legacy account into a 'legacy' OU with detective controls and GuardDuty immediately, then migrate workloads account by account, prioritising the riskiest."],
["What would you measure after 6 months?","% accounts on baseline, IAM users with keys (→0), critical findings past SLA, % pipelines using OIDC, GuardDuty high finding MTTR, coverage of CloudTrail data events on restricted data."]],
flags:["Jumping to tools without clarifying","No prioritisation","Forgetting operations/ownership","Everything in one account"]});

REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"A developer accidentally pushed AWS access keys to a public GitHub repo. What do you do?",
why:"Extremely common real incident; tests speed, order of actions and root-cause thinking.",
short:"Deactivate the key and deny-all the user immediately, search CloudTrail by access key ID across all regions for attacker activity, remove persistence and rogue resources (miners, users, roles), rotate anything the key could read, then eliminate IAM user keys (OIDC/roles) and enable push protection.",
a:`<p><b>Minute 0-15: contain.</b></p>
<ul><li>Deactivate the access key (keep it for investigation, delete later). Attach an explicit deny-all inline policy to the user and revoke console sessions.</li>
<li>If AWS already attached <code>AWSCompromisedKeyQuarantine</code> (AWS scans GitHub and notifies), still continue: quarantine does not undo what happened.</li></ul>
<p><b>Minute 15-120: scope.</b></p>
<ul><li>CloudTrail Lake / Athena query on <code>userIdentity.accessKeyId</code> from the commit time, <b>all regions</b>.</li>
<li>Look for: <code>GetCallerIdentity</code> (attacker testing), <code>CreateUser/CreateAccessKey/CreateLoginProfile</code> (persistence), <code>RunInstances</code> in unusual regions (mining), <code>CreateRole/UpdateAssumeRolePolicy</code>, S3 <code>ListBuckets/GetObject</code>, <code>ssm:GetParameter</code>, <code>secretsmanager:GetSecretValue</code>, SES sending.</li>
<li>Check GuardDuty findings and billing anomalies.</li></ul>
<p><b>Eradicate:</b> delete attacker-created identities and resources (after snapshots/evidence), rotate secrets the key could access, check for backdoors (Lambda, EventBridge, new IdPs).</p>
<p><b>Recover and notify:</b> if data was accessed, involve legal/privacy (DPDP, customers, CERT-In within 6 hours for reportable incidents).</p>
<p><b>Root cause and prevention (the Principal part):</b></p>
<ul><li>Why did a long-lived key exist? Replace with SSO for humans and OIDC/roles for automation; SCP denying CreateAccessKey.</li>
<li>Secret scanning with push protection org-wide, pre-commit hooks.</li>
<li>Honeytokens in repos to detect scraping; budget and region SCPs to limit blast radius.</li>
<li>Blameless post-incident review.</li></ul>
<p>Note: rewriting Git history does not help; bots scrape public repos within minutes, so always treat the key as compromised.</p>`,
fu:[["Why deactivate instead of delete?","Deactivation stops use but keeps the key record for investigation and correlation; delete after scoping."],
["What if the key belonged to a role instead?","Role credentials are temporary; revoke active sessions for the role (deny for tokens issued before now) and find how they leaked."],
["How fast do attackers use leaked keys?","Often within minutes; that is why automation (quarantine, alerts) and no-long-lived-keys matter more than human speed."]],
flags:["Only deleting the key","Forgetting other regions","Not checking persistence","No root-cause fix"]});

REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"GuardDuty reports crypto mining on an EC2 instance. Walk me through your response.",
why:"Tests hands-on AWS IR, evidence handling and root cause.",
short:"Snapshot and preserve evidence, isolate with a forensic security group, revoke the instance role sessions, investigate in a forensic account to find the entry point, rebuild from a clean image, fix the root cause, and hunt for the same issue elsewhere.",
a:`<ol>
<li><b>Triage:</b> finding type (CryptoCurrency:EC2/BitcoinTool), instance, account, owner tag, internet exposure, role attached, is it part of an ASG?</li>
<li><b>Preserve:</b> enable termination protection; snapshot EBS volumes; capture memory if tooling available (e.g. via SSM); record metadata.</li>
<li><b>Isolate:</b> replace security groups with an isolation SG (no inbound/outbound, or only to forensic tooling); detach from ASG/target group so autoscaling doesn't replace it; note that existing tracked connections may persist, so also use NACL if needed.</li>
<li><b>Credentials:</b> revoke the instance role's active sessions; check CloudTrail for use of that role from outside the instance (InstanceCredentialExfiltration).</li>
<li><b>Investigate:</b> copy snapshots to the forensic account; analyse for initial access: exposed SSH with weak creds, unpatched web app (RCE), leaked keys, malicious container image. Check lateral movement.</li>
<li><b>Eradicate/recover:</b> terminate after evidence, redeploy from a clean golden AMI, patch the vulnerability, rotate secrets the instance had access to.</li>
<li><b>Hunt:</b> same AMI or same vulnerability elsewhere? Other GuardDuty findings? Mining often means an automated campaign.</li>
<li><b>Improve:</b> IMDSv2, no public SSH (SSM only), Inspector scanning, egress controls blocking mining pools, auto-isolation automation for this finding type.</li></ol>`,
fu:[["Would you automate isolation?","For high-confidence finding types like crypto mining on non-critical tiers, yes, via EventBridge + Step Functions; for tier-1 production, notify and require human approval."],
["Why not just terminate it?","You lose evidence of how they got in, so the same attack succeeds again."]],
flags:["Terminating immediately","Ignoring the instance role credentials","No root cause"]});

REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"How do you secure an S3 bucket containing sensitive customer data?",
why:"Probably the single most asked AWS security question. Tests layered thinking.",
short:"Account-level Block Public Access and org RCPs; ACLs disabled; bucket policy enforcing TLS, VPC endpoint access and SSE-KMS; a dedicated CMK whose key policy is a second authorisation layer; least-privilege roles or access points; versioning/Object Lock; CloudTrail data events, GuardDuty S3 Protection and Macie for detection.",
a:`<ol>
<li><b>Prevent exposure at the org level:</b> account Block Public Access + SCP denying changes; RCP denying non-org principals.</li>
<li><b>Ownership:</b> BucketOwnerEnforced (ACLs off).</li>
<li><b>Bucket policy:</b> deny if <code>aws:SecureTransport=false</code>; deny unless via our VPC endpoint (<code>aws:SourceVpce</code>) with break-glass exception; deny PutObject without our KMS key.</li>
<li><b>Encryption:</b> SSE-KMS with a customer managed key; key policy grants Decrypt only to reader roles, so S3 permissions alone are not enough (two independent checks). Bucket Keys to control cost.</li>
<li><b>Identity:</b> least-privilege roles scoped to prefixes; S3 Access Points or Access Grants for many consumers; no <code>s3:*</code>.</li>
<li><b>Integrity/availability:</b> versioning, Object Lock where deletion must be prevented, replication to another account/region.</li>
<li><b>Lifecycle:</b> retention and deletion rules per data policy.</li>
<li><b>Detect:</b> CloudTrail data events, GuardDuty S3 Protection, Macie, Access Analyzer for external access, Config rules, alert on PutBucketPolicy.</li>
<li><b>Process:</b> buckets only created via the hardened Terraform module; access reviews.</li></ol>`,
fu:[["SSE-S3 vs SSE-KMS vs client-side?","SSE-S3: encryption with AWS keys, no separate access control. SSE-KMS: adds key policy control and CloudTrail audit of decrypts. Client-side: data encrypted before AWS sees it, strongest for highly sensitive fields but you manage complexity."],
["How to share this bucket with a partner safely?","Prefer pushing data to them or a dedicated share bucket/prefix with an access point, cross-account role with ExternalId, KMS grant scoped to that prefix, and data minimised; monitor all access."]],
flags:["Only saying 'make it private and encrypt it'","Ignoring KMS key policy","No detection"]});

REAL.push({cat:"AWS & Cloud", tid:"cloud", q:"How would you prevent data exfiltration from your AWS environment?",
why:"Tests data perimeter knowledge, a Principal-level AWS topic.",
short:"Data perimeter: RCPs so only org identities access our data, SCPs and endpoint policies so our identities only reach org resources, network conditions so credentials only work from our networks; no direct egress (Network Firewall allow-lists, DNS Firewall); detection via GuardDuty, data events and Macie.",
a:`<p><b>Exfiltration paths:</b> (1) copy data to an attacker AWS account (S3 CopyObject to their bucket, share snapshots/AMIs), (2) send over the internet from a compromised workload, (3) use stolen credentials from outside, (4) insiders downloading.</p>
<p><b>Controls per path:</b></p>
<ul><li>(1) SCP with <code>aws:ResourceOrgID</code> so principals can only write to org buckets; VPC endpoint policies with the same; SCP/declarative policies blocking public or cross-org snapshot/AMI sharing.</li>
<li>(2) No direct internet from workloads; egress via Network Firewall domain allow-lists or proxy; DNS Firewall against tunnelling.</li>
<li>(3) RCPs requiring org principals; network perimeter conditions (<code>aws:SourceVpc</code>, <code>aws:SourceIp</code>) on sensitive data; short-lived credentials.</li>
<li>(4) Least privilege, JIT access, DLP on endpoints/SaaS, monitoring bulk reads.</li></ul>
<p><b>Detection:</b> GuardDuty (Exfiltration and anomalous behaviour findings, S3 Protection), CloudTrail data events with volume baselines, VPC Flow Logs for large outbound transfers, Macie for sensitive data locations.</p>`,
fu:[["What about exfiltration via DNS?","Route 53 Resolver DNS Firewall with domain allow-lists or blocking of newly observed/high-entropy domains, plus GuardDuty DNS findings."]],
flags:["Only mentioning DLP tools","Not knowing aws:ResourceOrgID / PrincipalOrgID"]});

REAL.push({cat:"AWS & Cloud", tid:"iam", q:"Explain how AWS evaluates a request when an SCP, identity policy, resource policy and permission boundary all apply.",
why:"Tests precise IAM knowledge; many candidates get it wrong.",
short:"Default deny; any explicit deny wins; SCPs (and RCPs) must allow; then an identity or resource policy must allow; permission boundaries and session policies must also allow. Guardrails only cap, never grant. Cross-account needs both sides.",
a:`<ol><li>Start with implicit deny.</li>
<li>Evaluate all policies; an explicit Deny anywhere ends it.</li>
<li>Organizations: SCPs at each level from root to the account must allow the action for the principal; RCPs must allow it for the resource.</li>
<li>Resource-based policy: can grant (in same account it can allow even without identity policy for many services).</li>
<li>Identity-based policy must allow (when resource policy didn't already).</li>
<li>Permission boundary must allow (it caps identity policy grants).</li>
<li>Session policy (if assumed with one) must allow.</li></ol>
<p><b>Cross-account:</b> the identity side (in the caller's account) and the resource policy (in the owner's account) must both allow, plus KMS key policy if encrypted.</p>
<p><b>Example:</b> Developer role has AdministratorAccess, a permission boundary allowing only S3 and CloudWatch, and the account SCP denies non-Mumbai regions. Can they create an S3 bucket in us-east-1? No: SCP denies. Can they create an IAM role in ap-south-1? No: boundary doesn't allow IAM.</p>`,
fu:[["Does an SCP affect the management account?","No. That is why no workloads should run there."],
["Do SCPs affect service-linked roles?","No, service-linked roles are not restricted by SCPs."]],
flags:["Thinking SCPs grant permissions","Forgetting explicit deny precedence"]});

REAL.push({cat:"AWS & Cloud", tid:"iam", q:"How would you design IAM for 500 AWS accounts and 3,000 engineers?",
why:"Scale thinking: permission sets, automation, JIT, governance.",
short:"Identity Center federated to the IdP with SCIM; a small catalogue of permission sets by job function assigned to groups per OU/account via code; ABAC for shared accounts; JIT for elevated access; no IAM users; SCP/boundary guardrails; Access Analyzer for unused access; periodic reviews driven by IdP groups.",
a:`<ul>
<li><b>Source of truth:</b> HR → IdP → groups (team, role). SCIM pushes into Identity Center.</li>
<li><b>Permission set catalogue (~10-15):</b> ReadOnly, Developer, Operator, DataAnalyst, SecurityAudit, SecurityResponder, NetworkAdmin, PlatformAdmin, BillingViewer, BreakGlass. Each with a permission boundary style cap and session durations (1h for admin).</li>
<li><b>Assignments as code:</b> Terraform maps group → permission set → accounts (by OU/tag), reviewed via PR. Account vending adds default assignments for the owning team.</li>
<li><b>Elevation:</b> Developer standing in non-prod; prod write via JIT with approval (TEAM or PAM tool).</li>
<li><b>Workloads:</b> roles per service, created from modules with boundaries; CI via OIDC.</li>
<li><b>Guardrails:</b> SCPs (no IAM users, protect security roles, region), boundaries for any role-creation capability.</li>
<li><b>Hygiene:</b> Access Analyzer unused access findings, last-accessed data, quarterly reviews of privileged assignments only (risk-based), auto-removal on leave.</li>
<li><b>Detection:</b> alerts on assignments outside Terraform, admin session anomalies.</li></ul>`,
fu:[["How do you stop permission sets bloating?","Owners per permission set, change via PR with security review, policy-as-code checks (no iam:* or wildcards), and Access Analyzer unused-action reports to trim."]],
flags:["IAM users per engineer","Manual console assignments"]});

REAL.push({cat:"AWS & Cloud", tid:"iam", q:"A third-party vendor needs access to our AWS account. How do you set it up?",
why:"Tests confused deputy knowledge and vendor risk.",
short:"Cross-account role in a limited account with a trust policy for the vendor's account and a unique ExternalId, least-privilege (ideally read-only) permissions, monitoring, vendor risk review and a documented offboarding.",
a:`<ul><li>Vendor risk assessment first (SOC 2 Type II, data handling, breach history).</li>
<li>Cross-account IAM role; trust policy restricted to the vendor's AWS account and <code>sts:ExternalId</code> (unique, vendor-generated per customer) to prevent the confused deputy problem.</li>
<li>Permissions: least privilege, scoped resources, preferably read-only (e.g. SecurityAudit for a CSPM), permission boundary; if data access is needed, specific buckets/prefixes only.</li>
<li>Place the role only in accounts where needed; data perimeter exceptions via tags.</li>
<li>Monitoring: CloudTrail alerts on the role's unusual actions or source IPs outside vendor ranges; Access Analyzer shows external trust.</li>
<li>Contract: breach notification, deletion of data, right to audit.</li>
<li>Lifecycle: owner, review date, offboarding removes the role.</li></ul>`,
fu:[["Explain the confused deputy problem.","A vendor that assumes roles into many customers could be tricked by a malicious customer into using your role ARN. ExternalId unique per customer ensures the vendor only assumes your role on your behalf."]],
flags:["Creating an IAM user with keys for the vendor","No ExternalId"]});

REAL.push({cat:"Identity", tid:"iam", q:"Explain OAuth flows. Which would you use for a mobile app, an SPA, and service-to-service?",
why:"Classic identity question for architects.",
short:"Mobile: authorization code + PKCE via the system browser, no client secret. SPA: authorization code + PKCE, ideally through a BFF so tokens stay server-side. Service-to-service: client credentials with private_key_jwt or mTLS, or platform workload identity. Implicit and password grants are obsolete.",
a:`<ul>
<li><b>Mobile:</b> auth code + PKCE using the system browser (ASWebAuthenticationSession / Custom Tabs, AppAuth library). Public client, so no embedded secret. Refresh tokens stored in Keychain/Keystore, bound to device where possible. Claimed HTTPS redirect URIs (universal/app links) rather than custom schemes.</li>
<li><b>SPA:</b> auth code + PKCE. Better: a Backend-for-Frontend that does the OAuth dance, holds tokens server-side and gives the browser an HttpOnly SameSite cookie. Avoid localStorage tokens.</li>
<li><b>Service-to-service:</b> client credentials, authenticating with private_key_jwt or mTLS rather than shared secrets; or skip OAuth and use workload identity (IAM SigV4, SPIFFE mTLS). When acting for a user, token exchange to a downscoped token.</li>
<li><b>Devices without browsers:</b> device authorization grant.</li></ul>
<p>Mention PKCE's purpose (stops code interception), state (CSRF), nonce (ID token replay), and short-lived access tokens with rotated refresh tokens.</p>`,
fu:[["Why is implicit flow deprecated?","It returned tokens in the URL fragment, exposing them to history, referrers and scripts, with no way to bind them. Auth code + PKCE is safer and now works for SPAs."],
["OAuth vs OIDC?","OAuth is authorisation (access tokens for APIs); OIDC adds authentication with the ID token."]],
flags:["Using implicit flow","Client secret in mobile app"]});

REAL.push({cat:"Identity", tid:"iam", q:"JWT vs server-side sessions: which do you prefer and where should an SPA store tokens?",
why:"Tests practical web security trade-offs.",
short:"For browser apps I prefer server-side sessions (or a BFF) with HttpOnly, Secure, SameSite cookies because they are revocable and invisible to JavaScript. JWTs suit API-to-API access tokens with short lifetimes. Never store tokens in localStorage.",
a:`<table><tr><th></th><th>Server-side session</th><th>JWT (self-contained)</th></tr>
<tr><td>Revocation</td><td>Instant (delete session)</td><td>Hard until expiry; needs denylist or short TTL</td></tr>
<tr><td>Scale</td><td>Needs shared session store</td><td>Stateless validation</td></tr>
<tr><td>Theft risk in browser</td><td>Cookie HttpOnly → XSS cannot read</td><td>If in JS storage, XSS steals it</td></tr>
<tr><td>Best fit</td><td>User sessions in browsers</td><td>Short-lived API access tokens between services</td></tr></table>
<p>Recommendation: BFF with HttpOnly SameSite=Lax/Strict session cookie + CSRF protection for state changes; the BFF uses short-lived JWT access tokens to call APIs. For high-value APIs, sender-constrained tokens (DPoP/mTLS).</p>`,
fu:[["Does HttpOnly stop XSS?","No, it stops script from reading the cookie; XSS can still make requests as the user while the page is open. You still need output encoding and CSP."]],
flags:["'JWT is more secure'","localStorage tokens"]});

REAL.push({cat:"Identity", tid:"iam", q:"How would you implement SSO for 200 SaaS applications and secure joiner-mover-leaver?",
why:"Enterprise identity architecture.",
short:"One IdP; HR as source of truth; SAML/OIDC SSO for every app with SCIM provisioning; group-based access by role; phishing-resistant MFA and device posture; automatic deprovisioning within hours; risk-based access reviews; discover shadow SaaS via CASB and require SSO in procurement.",
a:`<ul><li><b>Inventory</b> apps (CASB, expense data, SSO logs) and tier them by data sensitivity.</li>
<li><b>IdP</b> (Okta/Entra) as the only login; SSO via SAML/OIDC; disable local passwords where possible ("SSO tax": budget for enterprise tiers).</li>
<li><b>Provisioning:</b> HR system → IdP → SCIM to apps. Birthright groups by department; request-based groups for extra access with approval.</li>
<li><b>Movers:</b> role change triggers removal of old group access (most common privilege creep source).</li>
<li><b>Leavers:</b> termination disables IdP account and revokes sessions within minutes/hours; SCIM deprovisions; apps without SCIM on a tracked manual checklist.</li>
<li><b>Authentication:</b> passkeys/FIDO2, device trust, conditional access.</li>
<li><b>Governance:</b> quarterly reviews for tier-1 apps, orphaned account detection, OAuth app consent governance.</li>
<li><b>Metrics:</b> % apps on SSO, % with SCIM, time to deprovision, orphaned accounts.</li></ul>`,
fu:[["What about apps that don't support SSO?","Password vault with shared credential controls, or place behind an identity-aware proxy; pressure vendor; track as risk."]],
flags:["Forgetting movers and OAuth app sprawl"]});

REAL.push({cat:"Identity", tid:"iam", q:"How do you protect against account takeover in a consumer app with millions of users?",
why:"Fraud + identity design, common for fintech/e-commerce roles.",
short:"Layered: breached-password checks and passkeys, bot and credential-stuffing defence at the edge, risk-based authentication with device fingerprinting, step-up for sensitive actions, secure recovery flows, session management, and ATO detection with user notifications.",
a:`<ul><li><b>Credentials:</b> passkeys as primary; if passwords, check against breached lists, rate-limit, no composition nonsense.</li>
<li><b>Edge:</b> WAF Bot Control / Fraud Control ATP, rate limits per IP/ASN/username, challenges for suspicious traffic.</li>
<li><b>Risk engine:</b> device fingerprint, geo-velocity, IP reputation → allow, step-up, or block.</li>
<li><b>MFA:</b> passkeys or app-based; SMS only as fallback with SIM-swap checks.</li>
<li><b>Sensitive actions:</b> re-authentication for changing email/phone/password, adding payees; cooling-off period and notification on old channel.</li>
<li><b>Recovery:</b> account recovery is the weakest link; strong verification, delays, notifications.</li>
<li><b>Sessions:</b> bind to device, show active sessions, allow remote logout, revoke on password change.</li>
<li><b>Detection:</b> ATO patterns (new device + profile change + payout), customer notifications, fast support escalation.</li></ul>`,
fu:[["How do you measure success?","ATO rate per million logins, credential-stuffing block rate, false positive challenges (friction), fraud losses."]],
flags:["Just 'add MFA'","Ignoring recovery flows"]});

REAL.push({cat:"Crypto & Data", tid:"crypto", q:"How would you design encryption and key management for a multi-account AWS environment?",
why:"Tests KMS depth and key hierarchy design.",
short:"Encrypt everything by default; customer managed KMS keys per data domain and environment created by IaC; key policies separating admins and users with ViaService and encryption context conditions; cross-account via key policy plus IAM; rotation on; deletion protected by SCP and alerting; per-tenant keys where crypto-shredding is needed; CloudHSM/XKS only for regulatory needs.",
a:`<ul><li><b>Defaults:</b> EBS/S3/RDS encryption on (SCP/Config enforced).</li>
<li><b>Key granularity:</b> per data domain × environment (payments-prod-db, payments-prod-s3). Not one global key (blast radius, no separation) and not millions of CMKs (cost, limits); use data keys/envelope encryption for per-object uniqueness.</li>
<li><b>Ownership:</b> keys live in the workload account (so the workload team's account owns data), created via IaC; security holds audit rights and can disable via SCP-protected role if needed. Alternative: central key account for shared/regulated data.</li>
<li><b>Key policies:</b> admins manage, services use; <code>kms:ViaService</code>; encryption context required; for the most sensitive keys remove broad root delegation.</li>
<li><b>Cross-account:</b> both key policy and IAM; multi-region keys only where DR requires.</li>
<li><b>Protection:</b> SCP deny ScheduleKeyDeletion/DisableKey/PutKeyPolicy except key-admin role; EventBridge alert on these calls; RCP allow only org principals.</li>
<li><b>Rotation:</b> automatic yearly (or per policy); on-demand for incidents.</li>
<li><b>Special cases:</b> per-tenant keys for BYOK customers; CloudHSM for dedicated HSM requirements; XKS for sovereignty.</li>
<li><b>Monitoring:</b> CloudTrail Decrypt volume anomalies per principal.</li></ul>`,
fu:[["What is encryption context used for?","Binding ciphertext to metadata (tenant, record) so it can't be decrypted in the wrong context, and enabling per-tenant audit and policy conditions."]],
flags:["One key for everything","Not knowing key policies are mandatory"]});

REAL.push({cat:"Crypto & Data", tid:"crypto", q:"How does TLS work, and what would you check when reviewing a service's TLS setup?",
why:"Foundational crypto question with a practical twist.",
short:"TLS 1.3: ECDHE key share for forward secrecy, server proves identity with a certificate chain and signature, then AEAD encryption. Review: TLS 1.2+ only with strong suites, valid automated certs with CAA and CT monitoring, HSTS, no disabled verification in clients, internal re-encryption/mTLS where needed, private key protection.",
a:`<p><b>Handshake:</b> ClientHello with key share and SNI; ServerHello with key share; both derive keys (ECDHE, now often hybrid with ML-KEM); server sends certificate + CertificateVerify signature + Finished (encrypted); client validates chain, hostname, validity, revocation; application data under AES-GCM/ChaCha20.</p>
<p><b>Review checklist:</b></p>
<ul><li>Protocols: TLS 1.2 minimum, 1.3 preferred; no SSLv3/TLS1.0/1.1; strong cipher suites (ALB/CloudFront security policy).</li>
<li>Certificates: from ACM/ACME, auto-renewed, expiry monitoring, CAA records, CT monitoring for mis-issuance.</li>
<li>HSTS with includeSubDomains (and preload for main domains).</li>
<li>Clients: certificate verification never disabled; pinning only where operationally safe (mobile with backup pins).</li>
<li>Internal: TLS termination point; re-encryption to targets or mTLS for sensitive paths.</li>
<li>Keys: private keys in ACM/HSM, not on disks; no shared wildcard keys across many servers.</li>
<li>PQC readiness: hybrid key exchange where supported.</li></ul>`,
fu:[["What is forward secrecy?","Ephemeral key exchange so a later compromise of the server's private key can't decrypt recorded sessions."]],
flags:["Saying the server's RSA key encrypts the data"]});

REAL.push({cat:"Crypto & Data", tid:"data", q:"How would you secure a data lake with sensitive customer data used by hundreds of analysts?",
why:"Data architecture plus access control at scale.",
short:"Raw and curated zones in separate accounts with separate keys; pseudonymise at ingestion; Lake Formation tag-based access mapped to IdP groups; controlled re-identification; export controls and managed notebooks without open egress; monitoring of query volume; retention and deletion built in.",
a:`<ul><li><b>Zones:</b> raw (restricted, service-only) → curated (pseudonymised) → consumption (aggregated). Separate accounts and KMS keys.</li>
<li><b>Ingestion:</b> Macie/Glue detection, tokenise or hash identifiers with a keyed HMAC so joins still work.</li>
<li><b>Access:</b> Lake Formation LF-tags (data-domain, sensitivity) with grants to IdP groups; column and row filters; no direct S3 access for analysts.</li>
<li><b>Re-identification:</b> separate service with approval, justification, logging.</li>
<li><b>Environment:</b> SageMaker/EMR Studio notebooks in VPC with no internet egress; downloads restricted; results size limits.</li>
<li><b>Monitoring:</b> CloudTrail/Lake Formation audit, anomalous query volume, new external destinations.</li>
<li><b>Privacy:</b> retention, deletion support (Iceberg deletes), DPIA.</li></ul>`,
fu:[["Why keyed HMAC rather than plain hash?","Plain hashes of phone numbers or IDs can be reversed by brute force; a secret key prevents dictionary attacks."]],
flags:["Giving analysts raw PII by default"]});

REAL.push({cat:"Crypto & Data", tid:"crypto", q:"How do hundreds of microservices get secrets safely? Would you build or buy a secrets platform?",
why:"From the real Security Architect scenario list; tests scale and build-vs-buy judgement.",
short:"Eliminate secrets where possible (IAM auth, OIDC, workload identity); centralise the rest in a managed store accessed via workload identity with path-based least privilege; rotate automatically and prefer dynamic credentials; detect leaks. Buy or use managed; building is high risk and not differentiating.",
a:`<p>See the lesson "Secrets management at scale". Key talking points: identity-based access (Pod Identity/IRSA → Secrets Manager), naming conventions and ABAC, delivery via SDK caching or CSI driver, rotation Lambdas and managed RDS rotation, Vault dynamic database credentials, secret scanning with push protection, honey secrets, and a rotation playbook. Build vs buy criteria: platform integrations, dynamic secrets, HA/DR, audit, multi-cloud, cost, team capacity. Building means owning a crown-jewel system forever.</p>`,
fu:[["How do you bootstrap the first secret (secret zero)?","Avoid it by using platform identity (IAM role, Kubernetes service account token federated to AWS) so no initial secret is distributed."]],
flags:["Kubernetes secrets or env vars as the whole answer"]});

/* Real-world interview questions: Architecture, Network, AppSec, Kubernetes, Supply chain */
REAL.push({cat:"Architecture design", tid:"sysdesign", q:"Design a secure 3-tier web application on AWS.",
why:"A warm-up design question in many loops; tests whether you cover every layer quickly.",
short:"CloudFront + WAF + Shield in front, ALB in public subnets accepting only CloudFront, app tier in private subnets (ECS/EKS/EC2) with roles, database in isolated subnets with KMS encryption, secrets in Secrets Manager, egress via NAT + Network Firewall, OIDC login via Cognito or IdP, logging to a security account, GuardDuty and backups, all deployed by IaC.",
a:`<pre>Users → Route 53 → CloudFront (+ WAF managed rules, Bot Control, rate limits; Shield)
     → ALB (public subnets; SG allows only CloudFront prefix list; TLS via ACM)
     → App tier: ECS Fargate / EKS in private subnets (SG from ALB only; task roles)
     → Aurora in isolated subnets (SG from app only; KMS CMK; IAM DB auth or
       Secrets Manager rotated creds; automated backups + AWS Backup to another account)
Egress: NAT → Network Firewall allow-list | AWS APIs via VPC endpoints
Auth: Cognito / corporate IdP, OIDC + PKCE, BFF sessions
Logging: CloudFront/ALB/WAF logs, CloudTrail, VPC Flow → log archive → SIEM
Detection: GuardDuty, Inspector (images), Security Hub
Delivery: Terraform + pipeline with scanning, signed images, no manual console changes</pre>
<p>Then walk threats: web attacks (WAF + secure code), credential attacks (MFA, bot control), data theft (encryption, least privilege, isolated DB), DDoS (CloudFront/Shield), compromised container (least-privilege task role, no egress), insider (JIT, logging). Mention multi-AZ for availability and a DR strategy aligned to RTO/RPO.</p>`,
fu:[["How do you make sure only CloudFront reaches the ALB?","SG allowing the CloudFront managed prefix list, plus a secret custom header checked by an ALB listener rule (rotated), or use CloudFront VPC origins so the ALB can stay in private subnets."]],
flags:["Database in public subnet","No mention of identity or logging"]});

REAL.push({cat:"Architecture design", tid:"sysdesign", q:"How do you design tenant isolation for a multi-tenant SaaS so a bug in one tenant's context cannot expose another's data?",
why:"From real architect loops; tests defence in depth beyond 'add tenant_id'.",
short:"Tenant context only from the verified token; enforce isolation in multiple independent layers: service authZ, tenant-scoped data access layer, database row-level security, IAM dynamic scoping with session tags for S3/DynamoDB, per-tenant keys; silo tier for premium tenants; automated cross-tenant tests and monitoring.",
a:`<p>Walk the layers (the key is that <b>one bug should not be enough</b>):</p>
<ol><li><b>Identity:</b> tenant ID comes from the signed token (tenant-specific IdP federation), never from headers or body.</li>
<li><b>Service:</b> middleware sets tenant context; authorisation checks resource.tenant == context.tenant.</li>
<li><b>Data access layer:</b> repositories require tenant context; queries without it fail.</li>
<li><b>Database:</b> PostgreSQL RLS using a session variable; separate schemas/databases for bridge/silo tiers.</li>
<li><b>AWS IAM:</b> services assume a role with session tag tenant_id; policies restrict S3 prefix <code>tenants/\${aws:PrincipalTag/tenant}/*</code> and DynamoDB <code>dynamodb:LeadingKeys</code>. Even a code bug cannot read another prefix.</li>
<li><b>Encryption:</b> per-tenant data keys / CMKs with encryption context = tenant ID.</li>
<li><b>Caches and queues:</b> keys prefixed by tenant; per-tenant queues for large tenants.</li>
<li><b>Noisy neighbour:</b> quotas and rate limits per tenant.</li>
<li><b>Testing:</b> automated tests that use tenant A tokens against tenant B resources; fuzzing; pen tests focusing on cross-tenant access.</li>
<li><b>Detection:</b> instrument data layer to alert if a response contains data from more than one tenant; logs tagged with tenant.</li></ol>
<p>Offer pool/bridge/silo tiers so large regulated customers get dedicated accounts.</p>`,
fu:[["How do support staff access tenant data?","JIT, tenant-approved where contracts require, time-bound, logged and visible to the tenant."]],
flags:["Relying only on WHERE tenant_id = ?"]});

REAL.push({cat:"Architecture design", tid:"sysdesign", q:"Design a secure file upload service.",
why:"Compact design question covering many classic web and cloud risks.",
short:"Authenticate, issue narrow pre-signed S3 POST policies (size, type, key prefix, expiry) to a quarantine bucket, scan and re-process files in an isolated function (malware scan, content-type sniffing, image re-encoding, metadata stripping), move clean files to a private bucket served via CloudFront from a separate domain, with per-user quotas and full logging.",
a:`<ol><li>User authenticated; server decides key name (random UUID under user/tenant prefix).</li>
<li>Server issues a pre-signed POST with conditions: max content-length, allowed content-type, exact key, short expiry.</li>
<li>Upload lands in a <b>quarantine bucket</b> (private, Block Public Access, SSE-KMS).</li>
<li>S3 event → isolated Lambda/ECS task (no internet egress, minimal role): verify magic bytes vs extension, malware scan (GuardDuty Malware Protection for S3), re-encode images, strip EXIF, reject archives/polyglots or unpack safely (zip bombs, path traversal), convert documents to safe formats if needed.</li>
<li>Clean → move to clean bucket; bad → quarantine + alert.</li>
<li>Serve via CloudFront with Origin Access Control from a <b>separate cookieless domain</b>, <code>Content-Disposition: attachment</code> for non-images, <code>X-Content-Type-Options: nosniff</code>, CSP; signed URLs if private.</li>
<li>Quotas per user, rate limits, lifecycle deletion.</li>
<li>Logs: who uploaded what; alerts on malware detections.</li></ol>
<p>Threats covered: stored XSS via SVG/HTML, malware distribution, RCE in parsers (ImageTragick), DoS via huge files, IDOR on other users' files, public exposure.</p>`,
fu:[["Why a separate domain?","If an uploaded file executes script, it runs on an origin without your session cookies, limiting XSS impact."]],
flags:["Trusting the file extension","Serving uploads from the main domain"]});

REAL.push({cat:"Architecture design", tid:"sysdesign", q:"How would you secure a monolith-to-microservices migration over 18 months?",
why:"From real architect scenario lists; tests evolution thinking.",
short:"Use the migration to raise the bar: paved-road service template (auth, logging, secrets, mTLS), central identity and authorisation, API gateway, strangler pattern with the gateway enforcing auth, service inventory, threat modelling of new boundaries, preserve monolith controls until each capability moves, and track posture metrics throughout.",
a:`<ul><li><b>Paved road:</b> a service template with authN middleware, authorisation library, structured security logging, secrets via workload identity, health checks, SBOM/signing pipeline. New services start secure.</li>
<li><b>Edge:</b> strangler-fig routing at the API gateway so external auth stays consistent while routes move.</li>
<li><b>Service-to-service trust:</b> mTLS (mesh) + authorisation policies; propagate user context via token exchange, not by trusting internal headers.</li>
<li><b>Data:</b> each service owns its data; avoid shared databases with broad credentials; classify data moved.</li>
<li><b>New attack surface:</b> more network paths, more secrets, more pipelines: default-deny network policies, inventory of services and APIs, ownership tags.</li>
<li><b>Don't lose controls:</b> the monolith's implicit checks (e.g. authorisation in a shared layer) must be explicitly re-implemented in each service; threat model each extraction.</li>
<li><b>Observability:</b> distributed tracing with request IDs; centralized logs; detect anomalous service calls.</li>
<li><b>Measure:</b> % services on template, % with mTLS, authZ test coverage, findings per service.</li></ul>`,
fu:[["Biggest risk you've seen in such migrations?","Authorisation logic that lived in the monolith being forgotten in new services, causing BOLA; and internal services trusting any caller on the network."]],
flags:["Trusting internal network calls"]});

REAL.push({cat:"Architecture design", tid:"network", q:"How would you implement zero trust in our organisation?",
why:"Very frequent; tests pragmatism beyond buzzwords.",
short:"Define it (no implicit trust from network; per-request decisions on identity, device, context), then run a phased programme: SSO + phishing-resistant MFA and device posture first, ZTNA for third parties and admins, then VPN retirement, microsegmentation and mTLS, then continuous risk-based access, measured against the CISA maturity model.",
a:`<p>Start with the business drivers (remote work, third parties, cloud, ransomware risk) and current state. Then phases:</p>
<ol><li><b>Identity:</b> single IdP, SSO everywhere, passkeys (admins first), conditional access, ITDR.</li>
<li><b>Devices:</b> MDM/EDR coverage, posture signals feed access.</li>
<li><b>Access:</b> ZTNA per app starting with contractors and admin tools; AWS Verified Access for internal web apps; identity-aware SSH/RDP.</li>
<li><b>Workloads:</b> microsegmentation (security groups referencing groups, K8s NetworkPolicies), mTLS mesh, workload identity.</li>
<li><b>Data:</b> classification-driven DLP and data perimeter.</li>
<li><b>Continuous:</b> risk signals from SIEM/UEBA → session re-evaluation (CAEP).</li></ol>
<p>Governance: roadmap with milestones, legacy app exceptions, user experience metrics (don't over-prompt). Maturity reported per CISA ZTMM pillar.</p>`,
fu:[["What do you do with legacy apps that can't do modern auth?","Put them behind an identity-aware proxy/ZTNA connector, isolate network-wise, plan replacement."]],
flags:["'Buy product X'","No sequencing"]});

REAL.push({cat:"Network", tid:"network", q:"We have a flat internal network. How would you segment it without breaking the business?",
why:"Common in companies with legacy data centres; tests change management.",
short:"Discover flows first (flow logs, NDR), define zones by function and sensitivity, protect crown jewels and admin paths first, deploy rules in monitor mode, then enforce incrementally with rollback, and move toward identity-based microsegmentation.",
a:`<ol><li><b>Discover:</b> map applications and their flows (NetFlow/VPC Flow Logs, NDR, microsegmentation tool in visibility mode, CMDB).</li>
<li><b>Define zones:</b> users, servers by tier, management, PCI/regulated, OT, third parties, backups.</li>
<li><b>Prioritise:</b> first isolate the management plane (domain controllers, hypervisors, backup servers) and crown jewels; block user-to-user lateral protocols (SMB, RDP between workstations).</li>
<li><b>Monitor-mode rules:</b> log would-be denies for a few weeks, fix legit flows.</li>
<li><b>Enforce</b> zone by zone with change windows and rollback plans; communicate with app owners.</li>
<li><b>Evolve</b> to identity-based microsegmentation (agent-based) and ZTNA for users.</li>
<li><b>Validate:</b> segmentation tests (pen test), detection of lateral movement attempts.</li></ol>`,
fu:[["Which segment first and why?","Management/identity/backup systems: ransomware operators need them to spread and to prevent recovery."]],
flags:["Big-bang firewall rules"]});

REAL.push({cat:"Network", tid:"network", q:"Where would you place WAF, NGFW and IPS in a cloud architecture, and what does each actually stop?",
why:"Tests clarity on overlapping controls.",
short:"WAF at the HTTP edge (CloudFront/ALB/API Gateway) for injection, bots and rate abuse; NGFW/IPS (Network Firewall or appliances via GWLB) for egress filtering and east-west inspection; security groups for per-workload allow-lists. None fix authorisation bugs.",
a:`<p>Placement: <b>edge</b> CloudFront + WAF + Shield → <b>ingress</b> ALB (WAF too for regional) → workloads with SGs → <b>egress/east-west</b> through inspection VPC with Network Firewall or third-party NGFW behind Gateway Load Balancer.</p>
<p>What each stops: WAF: HTTP-layer patterns, bots, rate abuse, geo. NGFW/IPS: known exploit signatures, disallowed protocols/domains, C2 callbacks, some lateral movement. SGs: unwanted ports/sources. Limitations: encrypted traffic needs TLS inspection (privacy/performance trade-off); logic flaws and BOLA need secure code; zero-days need detection and patching.</p>`,
fu:[["Should you do TLS inspection?","For egress web traffic from servers, often yes (or domain/SNI allow-listing as a lighter option). For user traffic, consider privacy, pinned apps and legal constraints; exempt sensitive categories like banking/health."]],
flags:["Thinking WAF solves AppSec"]});

REAL.push({cat:"AppSec & API", tid:"appsec", q:"How do you secure APIs deployed in the cloud?",
why:"Asked in almost every cloud security loop.",
short:"Inventory and specs; strong auth (OAuth/JWT, mTLS for partners, IAM for internal); gateway validation, quotas and schema checks; object, function and property-level authorisation in services; WAF and bot protection; secrets and transport security; logging, anomaly detection and testing against the OWASP API Top 10.",
a:`<ul><li><b>Know your APIs:</b> inventory (including shadow/zombie), OpenAPI specs, owners, versions.</li>
<li><b>Authenticate:</b> OAuth 2.0 tokens validated at gateway (iss, aud, exp, scopes), mTLS for B2B, IAM SigV4 for internal AWS-to-AWS.</li>
<li><b>Authorise in the service:</b> BOLA, BFLA and property-level checks; central policy engine.</li>
<li><b>Validate:</b> schema validation, size limits, content types; reject unknown fields.</li>
<li><b>Protect resources:</b> rate limits and quotas per client, pagination limits, timeouts (API4).</li>
<li><b>Protect business flows:</b> bot detection for signup, OTP, checkout (API6).</li>
<li><b>Edge:</b> CloudFront + WAF; private APIs via VPC endpoints for internal consumers.</li>
<li><b>Data:</b> minimal responses; no secrets in URLs; TLS everywhere.</li>
<li><b>Outbound:</b> validate responses from third-party APIs and webhooks (API10); SSRF controls (API7).</li>
<li><b>Operate:</b> logging with request IDs, anomaly detection per client, API security testing in CI, pen tests.</li></ul>`,
fu:[["API keys vs OAuth?","API keys identify an application, are long-lived and usually unscoped; OAuth tokens are short-lived, scoped and can represent a user. Use keys for identification/quotas only."]],
flags:["Only mentioning API Gateway","No object-level authorisation"]});

REAL.push({cat:"AppSec & API", tid:"appsec", q:"What is SSRF and why is it especially dangerous in the cloud?",
why:"Direct link to the Capital One breach; common question.",
short:"SSRF makes the server send requests to attacker-chosen URLs, reaching internal services and the cloud metadata endpoint to steal role credentials. Defend with URL allow-lists and IP validation after DNS resolution, no redirects, isolated fetchers without credentials, egress control and IMDSv2 with hop limit 1.",
a:`<p>Features that fetch URLs (webhooks, link previews, PDF generators, image import) can be abused to hit <code>http://169.254.169.254/latest/meta-data/iam/security-credentials/</code>, internal admin panels, or other VPC services. In the cloud this becomes credential theft and full account access (Capital One 2019).</p>
<p>Defences: allow-list destinations; resolve DNS and block private, loopback, link-local and metadata ranges (including IPv6 and decimal/octal encodings), then connect to the validated IP (anti DNS rebinding); disable redirects or revalidate; run fetchers in an isolated subnet with no IAM permissions and egress only through a proxy; enforce IMDSv2 (PUT token requirement, hop limit 1); monitor for InstanceCredentialExfiltration findings.</p>`,
fu:[["Does IMDSv2 fully stop SSRF?","It stops most SSRF (which can only do GET without custom headers) from reading credentials, but a full-control SSRF that can send PUT with headers could still work; so keep other layers."]],
flags:["Only mentioning input validation"]});

REAL.push({cat:"AppSec & API", tid:"appsec", q:"How do you build an AppSec programme from zero for a 200-engineer company?",
why:"From real architect scenario lists.",
short:"Assess and fix the riskiest things first, put secret scanning and dependency scanning in place quickly, add threat modelling for high-risk features, build paved roads (auth, secure templates), launch security champions, add SAST tuned for low noise, bug bounty/pen testing, and measure recurring bug classes.",
a:`<ol><li><b>Month 1:</b> inventory apps and repos, talk to teams, review recent incidents/pen tests; enable secret scanning with push protection and Dependabot/SCA.</li>
<li><b>Months 2-3:</b> threat model the top 3 critical systems; fix the scary issues; security requirements checklist in design template.</li>
<li><b>Months 3-6:</b> paved roads: shared auth library/service, authorisation library, secure service template; SAST tuned to high-confidence rules; security champions (1 per team).</li>
<li><b>Months 6-12:</b> external pen test on critical apps; bug bounty/VDP; vulnerability SLAs and dashboards; training by stack.</li>
<li><b>Metrics:</b> MTTR by severity, recurring bug classes, % repos with scanning, % high-risk designs reviewed.</li></ol>
<p>Hiring: first AppSec engineer focused on developer tooling and paved roads.</p>`,
